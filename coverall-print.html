<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>CoverAll Assignment Print</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#071018;color:#f8fafc}
    body{background:linear-gradient(rgba(4,10,20,.58),rgba(4,10,20,.72)),url('./Background1_optimized.webp?v=release-2026.07.18.custodial-v3.11') center/cover fixed}
    .page{width:min(760px,100%);margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
    .header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .title{text-align:right}.title h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}.title p{margin:.35rem 0 0;color:#d7e0ec}
    .card{padding:20px;display:grid;gap:16px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#d7e0ec}
    .field input,.field select{min-height:48px;width:100%;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;background:#f8fafc;color:#111827;font:inherit}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1 1 210px}
    .note{margin:0;color:#d7e0ec;line-height:1.5}
    @media(max-width:650px){.header{align-items:flex-start}.title{text-align:left}.grid{grid-template-columns:1fr}}
  </style>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.18.custodial-v3.11">
  <script defer src="./memphis-ui.js?v=release-2026.07.18.custodial-v3.11"></script>
</head>
<body data-memphis-context="manager">
  <main class="page">
    <header class="header mz-page-header">
      <a class="mz-back-link" data-mz-back href="./start_page1.html">Back</a>
      <div class="title"><h1>CoverAll Assignments</h1><p>Open a printable assignment for one CoverAll helper.</p></div>
    </header>
    <section id="loading" class="mz-card card"><div class="mz-loading" role="status">Verifying Ops Manager access…</div></section>
    <section id="app" class="mz-card card" hidden>
      <p class="note">Choose the service date, helper slot, language, and link lifetime. Each new secure link replaces the previous link for that helper and date.</p>
      <div class="grid">
        <div class="field"><label for="date">Service date</label><input id="date" type="date"></div>
        <div class="field"><label for="slot">CoverAll helper</label><select id="slot"><option value="COVERALL_01">CoverAll 1</option><option value="COVERALL_02">CoverAll 2</option><option value="COVERALL_03">CoverAll 3</option><option value="COVERALL_04">CoverAll 4</option></select></div>
        <div class="field"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="es">Español</option></select></div>
        <div class="field"><label for="ttl">Link lifetime</label><select id="ttl"><option value="8">8 hours</option><option value="24" selected>24 hours</option><option value="72">3 days</option><option value="168">7 days</option></select></div>
      </div>
      <div class="actions">
        <button id="open" class="mz-button" type="button">Create and Open Secure Link</button>
        <button id="copy" class="mz-button mz-button--secondary" type="button">Create and Copy Secure Link</button>
        <button id="revoke" class="mz-button mz-button--secondary" type="button">Revoke Active Link</button>
      </div>
      <div id="status" class="mz-status" role="status" aria-live="polite">Ready.</div>
    </section>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.18.custodial-v3.11"></script>
  <script>
    (function(){
      'use strict';
      const API='https://memphis-zoo-mcp.onrender.com/schedule-api';
      const els={loading:document.getElementById('loading'),app:document.getElementById('app'),date:document.getElementById('date'),slot:document.getElementById('slot'),language:document.getElementById('language'),ttl:document.getElementById('ttl'),open:document.getElementById('open'),copy:document.getElementById('copy'),revoke:document.getElementById('revoke'),status:document.getElementById('status')};
      const params=new URLSearchParams(location.search);
      const chicagoDate=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
      els.date.value=params.get('service_date')||params.get('date')||chicagoDate;
      if(/^COVERALL_0[1-4]$/.test(String(params.get('slot')||'').toUpperCase()))els.slot.value=String(params.get('slot')).toUpperCase();
      if(['en','es'].includes(params.get('lang')))els.language.value=params.get('lang');
      async function api(path,body){const auth=await window.MemphisAuth.opsManagerAuthHeaders();const response=await fetch(`${API}${path}`,{method:'POST',headers:{'Content-Type':'application/json',...auth},body:JSON.stringify(body)});const payload=await response.json().catch(()=>({}));if(!response.ok||payload?.ok===false)throw new Error(payload?.error||`Request failed (${response.status})`);return payload.data;}
      function requestBody(){return{service_date:els.date.value,slot_code:els.slot.value,lang:els.language.value,ttl_hours:Number(els.ttl.value||24)}}
      async function createLink(){els.open.disabled=true;els.copy.disabled=true;els.status.textContent='Creating secure link…';try{const data=await api('/coverall/links',requestBody());els.status.textContent=`Secure link created. It expires ${new Date(data.expires_at).toLocaleString()}.`;return data.assignment_url;}finally{els.open.disabled=false;els.copy.disabled=false;}}
      els.open.addEventListener('click',async()=>{try{const url=await createLink();window.open(url,'_blank','noopener');}catch(error){els.status.textContent=String(error?.message||error)}});
      els.copy.addEventListener('click',async()=>{try{const url=await createLink();try{await navigator.clipboard.writeText(url);els.status.textContent='Secure assignment link copied.'}catch{window.prompt('Copy this secure CoverAll link:',url);}}catch(error){els.status.textContent=String(error?.message||error)}});
      els.revoke.addEventListener('click',async()=>{els.revoke.disabled=true;els.status.textContent='Revoking active link…';try{const data=await api('/coverall/links/revoke',requestBody());els.status.textContent=data.revoked_count?'Active link revoked.':'No active link remained for this helper and date.';}catch(error){els.status.textContent=String(error?.message||error)}finally{els.revoke.disabled=false;}});
      window.MemphisAuth.requireOpsManagerSession({interactive:false,redirect:true,throwOnFailure:true}).then(()=>{els.loading.hidden=true;els.app.hidden=false;els.status.textContent='Ready to create a secure assignment link.'}).catch((error)=>{els.loading.innerHTML='<div class="mz-error" role="alert">'+String(error?.message||'Ops Manager access is required.').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</div>'});
    }());
  </script>
</body>
</html>
