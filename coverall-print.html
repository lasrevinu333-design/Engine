<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoverAll Print</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}.bar{background:#111827;color:white;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h1{font-size:18px;margin:0;color:#d9f99d}input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1}button{background:#84c341;border:0;font-weight:800}.wrap{max-width:960px;margin:18px auto;padding:0 14px}.sheet{background:white;border:1px solid #ddd;border-radius:14px;margin:0 0 16px;padding:20px;page-break-after:always}.head{display:flex;justify-content:space-between;border-bottom:3px solid #111827;padding-bottom:10px;margin-bottom:14px}.employee{font-size:20px;font-weight:900}.block{border:1px solid #ddd;border-radius:12px;margin-top:12px;overflow:hidden}.block h3{margin:0;background:#f3f4f6;padding:8px 10px}.row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:9px 10px;border-top:1px solid #eee}.time{font-weight:900}.loc{font-weight:900}.phase{font-size:12px;color:#6b7280;font-weight:800}.empty{background:white;border:2px dashed #cbd5e1;border-radius:14px;padding:28px;text-align:center}.err{background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:12px}@media print{.bar{display:none}.wrap{margin:0;max-width:none;padding:0}.sheet{border:0;border-radius:0;margin:0;padding:12mm}.empty{display:none}}
</style>
</head>
<body>
<div class="bar"><h1>CoverAll Print</h1><input id="date" type="date"><button id="load">Load</button><button id="print">Print</button><span id="status">Ready</span></div>
<main id="app" class="wrap"></main>
<script>
const API='https://memphis-zoo-mcp.onrender.com/dashboard-api/coverall-printable';
const app=document.getElementById('app'),dateEl=document.getElementById('date'),statusEl=document.getElementById('status');
const p=new URLSearchParams(location.search),today=new Date();dateEl.value=p.get('date')||today.toISOString().slice(0,10);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nice(v){const d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function groups(rows){const m=new Map();for(const r of rows){const k=r.coverall_employee_code||r.coverall_employee_name||'CoverAll';if(!m.has(k))m.set(k,{code:r.coverall_employee_code,name:r.coverall_employee_name,rows:[]});m.get(k).rows.push(r)}return [...m.values()]}
function row(r,lang){const text=lang==='es'?r.spanish_instruction:r.english_instruction;return `<div class="row"><div class="time">${esc(r.assignment_start)}<br>${esc(r.assignment_end)}</div><div><div class="loc">${esc(r.location_group_name||r.location_group_code)}</div><div class="phase">${esc(r.work_phase)}</div><div>${esc(text)}</div></div></div>`}
function render(rows,date){const gs=groups(rows);if(!gs.length){app.innerHTML=`<div class="empty"><h2>No CoverAll assignments for ${esc(nice(date))}</h2><p>Assign an absence to CoverAll, then reload this page.</p></div>`;return}app.innerHTML=gs.map(g=>{g.rows.sort((a,b)=>String(a.assignment_start).localeCompare(String(b.assignment_start))||Number(a.print_order||0)-Number(b.print_order||0));return `<section class="sheet"><div class="head"><div><h2>CoverAll Schedule</h2><div>${esc(nice(date))}</div></div><div class="employee">${esc(g.name||'CoverAll')} ${esc(g.code||'')}</div></div><div class="block"><h3>English</h3>${g.rows.map(r=>row(r,'en')).join('')}</div><div class="block"><h3>Español</h3>${g.rows.map(r=>row(r,'es')).join('')}</div></section>`}).join('')}
async function load(){try{statusEl.textContent='Loading';const u=new URL(API);u.searchParams.set('date',dateEl.value);const res=await fetch(u,{cache:'no-store'});const json=await res.json();if(!res.ok||!json.ok)throw new Error(json.error||res.status);render(Array.isArray(json.data)?json.data:[],dateEl.value);statusEl.textContent='Loaded'}catch(e){app.innerHTML=`<div class="err">${esc(e.message||e)}</div>`;statusEl.textContent='Error'}}
document.getElementById('load').onclick=load;document.getElementById('print').onclick=()=>print();dateEl.onchange=load;load();
</script>
</body>
</html>
