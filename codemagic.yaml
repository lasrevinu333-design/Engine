      vars:
        MZ_APP_EDITION: custodial
        MZ_API_BASE: https://memphis-zoo-mcp.onrender.com
      android_signing:
        # External Codemagic configuration must provide this distinct Custodial key.
        - memphis_zoo_custodial_keystore
    scripts:
      - *install
      - name: Build custodial web app
