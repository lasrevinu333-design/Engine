      - *install
      - name: Build viewer web app
        script: npm run --silent build:viewer
      - *web_provenance
      - *add_android
      - name: Build APK and app bundle
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          checkout_root="$(cd "$CM_BUILD_DIR" && pwd -P)"
          umask 077
          gradle_temp_root="$(cd "${TMPDIR:-/tmp}" && pwd -P)"
          readonly gradle_temp_root
          gradle_temp_home="$(mktemp -d "$gradle_temp_root/memphis-zoo-gradle.XXXXXX")"
          readonly gradle_temp_home
          cleanup_gradle_user_home() {
            rm -rf -- "$gradle_temp_home"
          }
          trap cleanup_gradle_user_home EXIT
          gradle_user_home="$(cd "$gradle_temp_home" && pwd -P)"
          case "$gradle_user_home/" in
            "$checkout_root/"*)
              printf 'Refusing Gradle cache inside the source checkout: %s\n' "$gradle_user_home" >&2
              exit 1
              ;;
          esac
          chmod 700 "$gradle_user_home"
          test -d "$gradle_user_home"
          cd mobile/android
          rm -rf .gradle app/build build
          GRADLE_USER_HOME="$gradle_user_home" \
            ./gradlew --no-daemon --dependency-verification strict assembleRelease bundleRelease \
              --no-build-cache --rerun-tasks
          cmp \
            "../native-locks/android/$MZ_APP_EDITION/verification-metadata.xml" \
            gradle/verification-metadata.xml
      - *source_attestation
      - *native_provenance
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
      - mobile/android/app/build/outputs/**/*.aab
      - build/provenance/**
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  custodial-first-test:
    name: Memphis Zoo Custodial - Owner TEST APK (manual only)
    # No triggering or publishing block: explicit single build dispatch only.
    inputs:
      test_source_commit:
        description: Exact committed implementation source selected for this owner test
        type: string
        default: ''
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: '26.2'
      node: '22.23.4'
      java: 21
      vars:
        MZ_APP_EDITION: custodial
        MZ_RELEASE_VERSION: 1.0.0
        MZ_BUILD_NUMBER: '57'
        MZ_SHELL_START: '1'
        MZ_TEST_SOURCE_COMMIT: ${{ inputs.test_source_commit }}
      android_signing:
        - memphis_zoo_custodial_keystore
    scripts:
      - name: Verify exact manual TEST source and install locked dependencies
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$MZ_TEST_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$MZ_TEST_SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = v22.23.4
          test "$(npm --version)" = 11.17.0
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/refresh-frontend-release-manifest.mjs --check
      - *custodial_android_toolchain
      - name: Build and sign full-workflow TEST APK with retained fleet identity
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Codemagic job counters are not this explicitly allocated test version.
          unset PROJECT_BUILD_NUMBER BUILD_NUMBER
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          node mobile/scripts/build-custodial-first-test.mjs
    artifacts:
      - build/first-test/**
      - build/provenance/**
