<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Custodial Home</title>
  <style>
    :root{--text:#f8fafc;--shadow:0 14px 30px rgba(0,0,0,.36);--line:rgba(255,255,255,.2);--zoo-green:#84c341}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#111827;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{background-image:linear-gradient(rgba(4,10,20,.48),rgba(4,10,20,.58)),url('./dashboard-bg_optimized.webp?v=release-2026.07.19.custodial-v3.12');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
    .page{min-height:100vh;width:min(720px,100%);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px max(34px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .apps{width:min(560px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    .app{min-height:200px;padding:24px 14px 22px;border:2px solid var(--line);border-radius:30px;background:linear-gradient(180deg,rgba(10,18,26,.82),rgba(10,18,26,.58));box-shadow:var(--shadow);color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;-webkit-tap-highlight-color:transparent}
    .app:active{transform:scale(.98)}
    .app:focus-visible{outline:5px solid #fff;outline-offset:4px}
    .icon{width:112px;height:112px;border-radius:28px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 24px rgba(0,0,0,.3)}
    .icon img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.14);transform-origin:center}
    #feedback-link .icon{background:linear-gradient(180deg,rgba(59,130,246,.96),rgba(14,165,233,.92));border-color:rgba(219,234,254,.9);font-size:3.4rem}
    .label{font-size:1.35rem;font-weight:900;line-height:1;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.55)}
    .kiosk-locked{overflow:hidden}.kiosk-locked .page{visibility:hidden}.kiosk-unlocked .page{visibility:visible}
    .kioskLock{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:calc(max(18px,env(safe-area-inset-top)) + 16px) 20px calc(max(28px,env(safe-area-inset-bottom)) + 28px);background-image:linear-gradient(180deg,rgba(3,7,13,.48),rgba(3,7,13,.78)),url('./dashboard-bg_optimized.webp?v=release-2026.07.19.custodial-v3.12');background-size:cover;background-position:center;background-repeat:no-repeat;color:#f8fafc;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .28s ease,visibility .28s ease;cursor:grab}
    .kioskLock.unlocked{opacity:0;pointer-events:none;visibility:hidden}
    .kioskLock.dragging .swipePill{transform:translateY(calc(-1 * min(var(--unlock-drag,0px),96px)));background:rgba(132,195,65,.28);border-color:rgba(132,195,65,.72)}
    .kioskLockPanel{width:min(520px,92vw);min-height:min(640px,86vh);border-radius:34px;padding:34px 24px 30px;background:linear-gradient(180deg,rgba(5,12,20,.46),rgba(5,12,20,.22));border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 60px rgba(0,0,0,.38);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;text-align:center}
    .lockBrand{margin-top:auto;font-size:.82rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--zoo-green);text-shadow:0 2px 12px rgba(0,0,0,.32)}
    .lockClock{margin-top:12px;font-size:clamp(3rem,18vw,5.7rem);font-weight:900;line-height:.92;letter-spacing:-.08em;text-shadow:0 5px 24px rgba(0,0,0,.36)}
    .lockDate{margin-top:12px;font-size:clamp(1.05rem,4.4vw,1.42rem);font-weight:900;letter-spacing:.04em;text-shadow:0 3px 16px rgba(0,0,0,.34)}
    .lockAssigned{margin-top:14px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.22);font-size:.82rem;font-weight:800;color:rgba(248,250,252,.82)}
    .swipePill{margin-top:auto;min-width:min(320px,84vw);padding:15px 20px;border-radius:999px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 30px rgba(0,0,0,.26);font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.28)}
    .unlockBtn{margin-top:16px;min-width:min(220px,70vw);padding:16px 24px;border:none;border-radius:18px;background:linear-gradient(180deg,#9be11f,#7ec40f);color:#09111a;font-size:1.05rem;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.26)}
    @media(max-width:520px){.page{padding-inline:16px}.apps{gap:14px}.app{min-height:170px;padding:18px 10px;border-radius:24px;gap:13px}.icon{width:94px;height:94px;border-radius:24px}.label{font-size:1.08rem}}
  </style>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12" />
  <script defer src="./memphis-ui.js?v=release-2026.07.19.custodial-v3.12"></script>
</head>
<body class="kiosk-locked" data-memphis-context="employee">
  <div id="kiosk-lock-screen" class="kioskLock" aria-label="Kiosk lock screen" role="button" tabindex="0">
    <div class="kioskLockPanel">
      <div class="lockBrand">Custodial</div>
      <div id="lock-clock" class="lockClock">--:--</div>
      <div id="lock-date" class="lockDate">--</div>
      <div class="lockAssigned">Memphis Zoo</div>
      <div class="swipePill">↑ Swipe up to unlock</div>
      <button id="lock-unlock-btn" class="unlockBtn" type="button">Unlock</button>
    </div>
  </div>
  <main class="page" aria-label="Employee Home">
    <nav class="apps" aria-label="Employee choices">
      <a id="schedule-link" class="app" href="./employee-schedule.html"><span class="icon"><img alt="" src="./scheduler_icon_ui.webp?v=release-2026.07.19.custodial-v3.12" width="320" height="320" decoding="async" /></span><span class="label">Schedule</span></a>
      <a id="messages-link" class="app" href="./messages.html"><span class="icon"><img alt="" src="./memphis_avatar_ui.webp?v=release-2026.07.19.custodial-v3.12" width="320" height="320" decoding="async" /></span><span class="label">Messages</span></a>
      <a id="events-link" class="app" href="./events.html"><span class="icon"><img alt="" src="./Event_Icon_ui.webp?v=release-2026.07.19.custodial-v3.12" width="320" height="320" decoding="async" /></span><span class="label">Events</span></a>
      <a id="feedback-link" class="app" href="./system-feedback.html"><span class="icon" aria-hidden="true">💬</span><span class="label">Feedback</span></a>
    </nav>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-device-identity.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-scan-sync.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-device-reminders.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script>
    const CONFIG={DEVICE_STORAGE_KEY:'mz_scan_device_id'};
    const state={currentDeviceId:''};
    const els={kioskLock:document.getElementById('kiosk-lock-screen'),lockClock:document.getElementById('lock-clock'),lockDate:document.getElementById('lock-date'),lockUnlockBtn:document.getElementById('lock-unlock-btn'),scheduleLink:document.getElementById('schedule-link'),messagesLink:document.getElementById('messages-link'),eventsLink:document.getElementById('events-link'),feedbackLink:document.getElementById('feedback-link')};
    let touchStartY=0;let lockLastY=0;let pointerStartY=0;let pointerLastY=0;let lockPointerActive=false;
    init();
    async function requireNativeCustodialSecurity(){const security=window.MemphisCustodialSecurity;if(!security?.native)return true;try{await(window.MemphisMobile?.ready||security.ready);const status=security.getStatus?.();if(status?.state==='enrolled'&&status?.ready===true&&status?.available===true&&!status?.quarantined&&status?.deviceId)return true}catch{}const home=new URL('./index.html',window.location.href);home.searchParams.set('protected_recovery','1');window.location.replace(home.toString());return false}
    async function init(){if(!await requireNativeCustodialSecurity())return;state.currentDeviceId=resolveDeviceId();initKioskLockScreen();updateLinks();startClock()}
    function startClock(){const update=()=>{const now=new Date();if(els.lockClock)els.lockClock.textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(els.lockDate)els.lockDate.textContent=now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})};update();setInterval(update,1000)}
    function initKioskLockScreen(){if(!els.kioskLock)return;if(!shouldUseKioskLockScreen()){unlockKioskScreen();return}document.body.classList.add('kiosk-locked');els.kioskLock.classList.remove('unlocked');bindFullyKioskWakeEvents();els.kioskLock.addEventListener('touchstart',handleLockTouchStart,{passive:false});els.kioskLock.addEventListener('touchmove',handleLockTouchMove,{passive:false});els.kioskLock.addEventListener('touchend',handleLockTouchEnd);els.kioskLock.addEventListener('touchcancel',resetKioskLockDrag);els.kioskLock.addEventListener('pointerdown',handleLockPointerDown);els.kioskLock.addEventListener('pointermove',handleLockPointerMove);els.kioskLock.addEventListener('pointerup',handleLockPointerUp);els.kioskLock.addEventListener('pointercancel',resetKioskLockDrag);if(els.lockUnlockBtn)els.lockUnlockBtn.addEventListener('click',(event)=>{event.preventDefault();event.stopPropagation();unlockKioskScreen();});els.kioskLock.addEventListener('keydown',(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();unlockKioskScreen();}})}
    function shouldUseKioskLockScreen(){const url=new URL(window.location.href);const lockParam=String(url.searchParams.get('lock')||'').trim().toLowerCase();if(lockParam==='0'||lockParam==='false'||lockParam==='off')return false;if(String(url.searchParams.get('doc_employee')||'').trim())return false;if(lockParam==='1'||lockParam==='true'||lockParam==='on')return true;if(window.MemphisUI?.phoneUnlockedSinceWake?.())return false;const nativeCustodial=window.MemphisCustodialSecurity?.native===true||window.MemphisMobile?.edition==='custodial'||window.MemphisMobileBuildIdentity?.edition==='custodial';const protectedId=String(window.MemphisCustodialSecurity?.native===true?window.MemphisCustodialSecurity.getStatus?.().deviceId||'':'').trim();const explicit=String(url.searchParams.get('device')||url.searchParams.get('deviceId')||'').trim();const stored=String(localStorage.getItem(CONFIG.DEVICE_STORAGE_KEY)||'').trim();const normalized=normalizeDeviceIdForLock(nativeCustodial?protectedId:(protectedId||explicit||stored));return isFullyKioskRuntime()&&normalized!==''&&normalized!=='KIOSK_01'}
    function isFullyKioskRuntime(){try{if(window.fully)return true}catch{}return /FullyKiosk/i.test(String(navigator.userAgent||''))}
    function normalizeDeviceIdForLock(value){const raw=String(value||'').trim();if(!raw)return '';if(/^kiosk[-_]?\d+$/i.test(raw))return raw.toUpperCase().replace('-','_');return raw.toUpperCase()}
    function unlockKioskScreen(){window.MemphisUI?.markPhoneUnlocked?.();document.body.classList.add('kiosk-unlocked');document.body.classList.remove('kiosk-locked');if(els.kioskLock){els.kioskLock.classList.add('unlocked');resetKioskLockDrag()}}
    function relockKioskScreen(){if(!els.kioskLock||!shouldUseKioskLockScreen())return;document.body.classList.add('kiosk-locked');document.body.classList.remove('kiosk-unlocked');els.kioskLock.classList.remove('unlocked');resetKioskLockDrag()}
    function handleKioskScreenOffPrewarm(){window.MemphisUI?.markPhoneScreenOff?.();relockKioskScreen()}
    function handleKioskWakeRelock(event){const force=event?Boolean(event.persisted):true;if(window.MemphisUI?.handlePhoneWake?.({force}))return;relockKioskScreen()}
    function bindFullyKioskWakeEvents(){if(window.MemphisUI?.bindPhoneWakeEvents?.())return;try{if(window.fully&&typeof window.fully.bind==='function'){window.fully.bind('screenOff','handleKioskScreenOffPrewarm();');window.fully.bind('screenOn','handleKioskWakeRelock();')}}catch{}}
    function handleLockTouchStart(event){const touch=event.touches&&event.touches[0];if(!touch)return;touchStartY=touch.clientY;lockLastY=touchStartY;els.kioskLock.classList.add('dragging')}
    function handleLockTouchMove(event){const touch=event.touches&&event.touches[0];if(!touch)return;lockLastY=touch.clientY;setKioskLockDrag(Math.max(0,touchStartY-lockLastY));if(event.cancelable)event.preventDefault()}
    function getUnlockSwipeThreshold(){return Math.max(180,Math.round(window.innerHeight*.22))}
    function getUnlockDragCap(){return Math.max(220,Math.round(window.innerHeight*.30))}
    function handleLockTouchEnd(){if(touchStartY-lockLastY>=getUnlockSwipeThreshold()){unlockKioskScreen();return}resetKioskLockDrag()}
    function handleLockPointerDown(event){pointerStartY=event.clientY;pointerLastY=pointerStartY;lockPointerActive=true;els.kioskLock.classList.add('dragging')}
    function handleLockPointerMove(event){if(!lockPointerActive)return;pointerLastY=event.clientY;setKioskLockDrag(Math.max(0,pointerStartY-pointerLastY))}
    function handleLockPointerUp(){if(lockPointerActive&&pointerStartY-pointerLastY>=getUnlockSwipeThreshold()){unlockKioskScreen();return}resetKioskLockDrag()}
    function setKioskLockDrag(px){if(els.kioskLock)els.kioskLock.style.setProperty('--unlock-drag',Math.min(px,getUnlockDragCap())+'px')}
    function resetKioskLockDrag(){lockPointerActive=false;touchStartY=0;lockLastY=0;pointerStartY=0;pointerLastY=0;if(els.kioskLock){els.kioskLock.classList.remove('dragging');els.kioskLock.style.setProperty('--unlock-drag','0px')}}
    function normalizeDeviceIdentifier(value){const raw=String(value||'').trim();if(!raw)return '';if(/^kiosk[-_]?\d{1,2}$/i.test(raw)){const digits=(raw.match(/\d+/)||[''])[0].padStart(2,'0');return 'KIOSK_'+digits}return raw}
    function protectedNativeDeviceId(){return normalizeDeviceIdentifier(window.MemphisCustodialSecurity?.native===true?window.MemphisCustodialSecurity.getStatus?.().deviceId||'':'')}
    function persistDeviceId(deviceId){const normalized=normalizeDeviceIdentifier(deviceId);if(!normalized)return '';if(window.MemphisCustodialSecurity?.native===true)return normalized===protectedNativeDeviceId()?normalized:'';localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY,normalized);localStorage.setItem('mz_employee_hub_device_id',normalized);if(/^KIOSK_\d{2}$/i.test(normalized))localStorage.setItem('memphisAssignedDeviceId',normalized);return normalized}
    function resolveDeviceId(){const protectedId=protectedNativeDeviceId();if(protectedId)return protectedId;if(window.MemphisCustodialSecurity?.native===true)return '';const shared=window.MemphisDeviceIdentity?.resolve?.();if(shared?.deviceId)return persistDeviceId(shared.deviceId);const url=new URL(window.location.href);const explicit=String(url.searchParams.get('device')||url.searchParams.get('deviceId')||'').trim();if(explicit)return persistDeviceId(explicit);for(const key of[CONFIG.DEVICE_STORAGE_KEY,'mz_employee_hub_device_id','memphisAssignedDeviceId']){const stored=normalizeDeviceIdentifier(localStorage.getItem(key)||'');if(stored&&!/^(?:device|visitor)-[a-z0-9-]+$/i.test(stored))return persistDeviceId(stored)}return ''}
    function updateLinks(){const routes=[[els.scheduleLink,'./employee-schedule.html'],[els.messagesLink,'./messages.html'],[els.eventsLink,'./events.html'],[els.feedbackLink,'./system-feedback.html']];for(const[element,route]of routes){const target=new URL(route,window.location.href);target.searchParams.set('hub','employee');if(state.currentDeviceId)target.searchParams.set('device',state.currentDeviceId);element.href=target.toString()}}
  </script>
</body>
</html>
