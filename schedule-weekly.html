<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://*.onrender.com https://localhost http://localhost:* http://127.0.0.1:* capacitor://localhost; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">

<body data-memphis-context="manager">
<main class="page">
  <header class="topbar">
    <a class="btn mz-back-link" data-mz-back href="./start_page1.html" title="Back" aria-label="Back">Back<span data-lucide="arrow-left" aria-hidden="true"></span></a>
    <div class="title"><h1>Weekly Custodial Schedule</h1><p id="subtitle">Repeating weekly area ownership</p></div>
    <div class="toolbar">
      <button class="btn" id="refresh-btn" type="button"><span data-lucide="refresh-cw"></span>Refresh</button>
      <button class="btn" id="rebuild-projection-btn" type="button" hidden><span data-lucide="refresh-cw"></span>Rebuild Projection</button>
      <button class="btn blue" id="generate-btn" type="button"><span data-lucide="wand-sparkles"></span>Generate Draft</button>
      <button class="btn primary" id="publish-btn" type="button"><span data-lucide="upload"></span>Publish Week</button>
    </div>
  </header>
  <div class="status" id="status" role="status" aria-live="polite">Connecting to scheduler...</div>
  <section class="workspace">
    <aside class="sidebar">
      <div class="field"><label for="week-start">Week starting</label><input id="week-start" type="date"></div>
      <div class="field" id="day-changes-section"><label for="service-date">Day changes for</label><input id="service-date" type="date"></div>
      <div class="summary">
        <div class="metric"><strong id="working-count">0</strong><span>working slots</span></div>
        <div class="metric"><strong id="absent-count">0</strong><span>absent slots</span></div>
        <div class="metric"><strong id="open-count">0</strong><span>open items</span></div>
        <div class="metric"><strong id="revision-count">0</strong><span>revision</span></div>
      </div>
      <div class="sidebarSection"><div class="sectionLabel">Employee roster</div><div id="roster-list" class="list"></div></div>
      <div class="sidebarSection"><div class="sectionLabel">Baseline absences</div><div id="baseline-absences" class="list"></div></div>
      <div class="sidebarSection" id="absence-section"><div class="sectionLabel">Absence / PTO</div><div class="field"><label for="absence-type">Reason</label><select id="absence-type"><option value="daily_absence">Call-out / absence</option><option value="pto">PTO</option></select></div><div id="temporary-absences" class="list"></div></div>
      <div class="sidebarSection" id="coverage-section"><div class="sectionLabel">Contractor capacity</div><div id="contractor-slots" class="list"></div><button id="coverall-pdfs-btn" class="btn" type="button">Prepare English + Spanish PDFs</button><div id="coverall-pdfs" class="list" aria-live="polite"></div></div>
      <div class="sidebarActions actions"><button class="btn blue" id="apply-day-btn" type="button"><span data-lucide="calendar-check"></span>Apply Day Changes</button></div>
    </aside>
    <section class="main">
      <div class="mainHeader">
        <div><h2 id="week-title">Current week</h2><div class="weekMeta" id="week-meta">No schedule loaded</div></div>
        <div class="segmented" role="tablist" aria-label="Schedule view">
          <button type="button" class="active" data-view="week" role="tab">Week</button>
          <button type="button" data-view="changes" role="tab">Changes</button>
          <button type="button" data-view="readiness" role="tab">Readiness</button>
        </div>
      </div>
      <div id="week-panel" class="panel active"><div class="tableWrap"><table><thead id="week-head"></thead><tbody id="week-body"></tbody></table></div></div>
      <div id="changes-panel" class="panel"><div id="changes-list" class="list"></div></div>
      <div id="readiness-panel" class="panel"><div id="readiness-list" class="readiness"></div></div>
    </section>
  </section>
</main>
<dialog id="turnover-dialog" aria-labelledby="turnover-title">
  <form id="turnover-form" class="turnoverForm">
    <div class="dialogHeader"><div><h2 id="turnover-title">Employee change</h2><p id="turnover-current"></p></div><button class="iconBtn" id="turnover-close" type="button" title="Close" aria-label="Close"><span data-lucide="x"></span></button></div>
    <input id="turnover-slot" type="hidden">
    <input id="turnover-mode" type="hidden">
    <div class="field" id="replacement-name-field"><label for="replacement-name">New employee name</label><input id="replacement-name" type="text" minlength="2" maxlength="160" autocomplete="off"></div>
    <div class="field"><label id="turnover-effective-label" for="turnover-effective-date">Effective today</label><input id="turnover-effective-date" type="date" required readonly></div>
    <div class="field"><label for="turnover-reason">Reason</label><input id="turnover-reason" type="text" maxlength="500" required></div>
    <div class="dialogActions"><button class="btn" id="turnover-cancel" type="button">Cancel</button><button class="btn primary" id="turnover-submit" type="submit"><span data-lucide="check"></span><span id="turnover-submit-label">Apply</span></button></div>
  </form>
</dialog>
<dialog id="action-confirm-dialog" aria-labelledby="action-confirm-title" aria-describedby="action-confirm-message">

    <div class="dialogHeader"><div><h2 id="action-confirm-title">Confirm change</h2></div></div>
    <p id="action-confirm-message" class="confirmMessage"></p>
    <div class="dialogActions"><button class="btn" id="action-confirm-cancel" type="submit" value="cancel">Cancel</button><button class="btn primary" id="action-confirm-accept" type="submit" value="confirm">Continue</button></div>
  </form>
</dialog>

<script>
const CONFIG={BOOTSTRAP_URL:'https://memphis-zoo-mcp.onrender.com/scheduler-runtime-config',DEVICE_KEY:'mz_scan_device_id'};
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const els=Object.fromEntries(['refresh-btn','rebuild-projection-btn','generate-btn','publish-btn','apply-day-btn','week-start','service-date','absence-type','status','subtitle','working-count','absent-count','open-count','revision-count','roster-list','baseline-absences','temporary-absences','contractor-slots','coverall-pdfs-btn','coverall-pdfs','week-title','week-meta','week-head','week-body','changes-list','readiness-list','turnover-dialog','turnover-form','turnover-title','turnover-current','turnover-slot','turnover-mode','replacement-name-field','replacement-name','turnover-effective-date','turnover-reason','turnover-close','turnover-cancel','turnover-submit','turnover-submit-label','action-confirm-dialog','action-confirm-title','action-confirm-message','action-confirm-cancel','action-confirm-accept'].map((id)=>[id.replaceAll('-','_'),document.getElementById(id)]));
const state={baseUrl:'',snapshot:null,busy:false,printUrls:[],printSequence:0,staffingCommandState:null,staffingCoordinator:null};
init().catch((error)=>setStatus(`Scheduler unavailable: ${safe(error)}`,'error'));
async function init(){window.lucide?.createIcons?.();const managerSession=await window.MemphisAuth.requireOpsManagerSession({interactive:false,redirect:true,throwOnFailure:true});const params=new URLSearchParams(location.search);const requested=params.get('week_start')||params.get('date')||window.MemphisAuth.getCSTDateString();els.week_start.value=mondayOf(requested);els.service_date.value=requested;els.refresh_btn.addEventListener('click',loadSnapshot);els.rebuild_projection_btn.addEventListener('click',rebuildCurrentProjection);els.generate_btn.addEventListener('click',generateDraft);els.publish_btn.addEventListener('click',publishDraft);els.apply_day_btn.addEventListener('click',applyDayChanges);els.changes_list.addEventListener('click',reverseChange);els.roster_list.addEventListener('click',openTurnoverDialog);els.turnover_form.addEventListener('submit',submitTurnover);els.turnover_close.addEventListener('click',closeTurnoverDialog);els.turnover_cancel.addEventListener('click',closeTurnoverDialog);els.week_start.addEventListener('change',()=>{els.week_start.value=mondayOf(els.week_start.value);loadSnapshot();});els.service_date.addEventListener('change',()=>{clearCoverAllPdfs();render();captureScheduleInputBaseline();deferScheduleRefresh();});els.coverall_pdfs_btn.addEventListener('click',()=>busy(prepareCoverAllPdfs));window.addEventListener('pagehide',clearCoverAllPdfs);document.querySelectorAll('[data-view]').forEach((button)=>button.addEventListener('click',()=>selectView(button.dataset.view)));window.addEventListener('hashchange',applyHashRoute);state.baseUrl=await loadControlPlaneUrl();state.staffingCoordinator=window.MemphisStaffingCommand.createStaffingCommandCoordinator({api,managerId:managerSession.manager_id,onState:(record)=>{state.staffingCommandState=record;if(state.snapshot)setControls();}});await loadSnapshot();await recoverStaffingCommand();applyHashRoute();}
async function loadControlPlaneUrl(){const response=await fetch(CONFIG.BOOTSTRAP_URL,{cache:'no-store'});const payload=await response.json().catch(()=>null);const url=String(payload?.data?.public_url||'').replace(/\/+$/,'');if(!response.ok||!payload?.ok||!/^https:\/\//i.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url))throw new Error(payload?.error||'Weekly scheduler service is not configured.');installScheduleAutoRefresh();return url;}
function awaitScheduleReadStep(promise,signal){
 if(!signal)return promise;
 return new Promise((resolve,reject)=>{
  const abort=()=>{signal.removeEventListener('abort',abort);reject(new Error('Schedule refresh interrupted; retry remains pending.'));};
  signal.addEventListener('abort',abort,{once:true});
  Promise.resolve(promise).then(value=>{signal.removeEventListener('abort',abort);if(signal.aborted)abort();else resolve(value);},error=>{signal.removeEventListener('abort',abort);reject(error);});
  if(signal.aborted)abort();
 });
}
async function api(path,options={}){const method=String(options.method||'GET').toUpperCase(),write=!['GET','HEAD'].includes(method);if(write&&state.dayChangeRequest&&!(path==='/static-weekly/day-changes/batch'&&!state.dayChangeRequest.accepted&&options.body===state.dayChangeRequest.encoded))throw new Error('Resolve the pending day change before another schedule write.');if(write&&state.staffingCommandState){const pending=state.staffingCommandState.pendingWrite;if(!pending||pending.path!==path||pending.method!==method||pending.encoded!==String(options.body??''))throw new Error('Resolve the pending staffing command before another schedule write.');}const signal=options.signal;if(signal?.aborted)throw new Error('Schedule refresh interrupted.');const auth=await awaitScheduleReadStep(window.MemphisAuth.opsManagerAuthHeaders(),signal);if(signal?.aborted)throw new Error('Schedule refresh interrupted.');const response=await awaitScheduleReadStep(fetch(`${state.baseUrl}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...auth,...(options.headers||{})}}),signal);const payload=await awaitScheduleReadStep(response.json().catch(()=>null),signal);if(!response.ok||!payload?.ok)throw new Error(payload?.error||`Scheduler request failed (${response.status})`);return payload.data;}
function confirmAction(message,{title='Confirm change',confirmLabel='Continue'}={}){if(els.action_confirm_dialog.open)return Promise.resolve(false);els.action_confirm_title.textContent=title;els.action_confirm_message.textContent=message;els.action_confirm_accept.textContent=confirmLabel;els.action_confirm_dialog.returnValue='';return new Promise((resolve)=>{els.action_confirm_dialog.addEventListener('close',()=>resolve(els.action_confirm_dialog.returnValue==='confirm'),{once:true});els.action_confirm_dialog.showModal();els.action_confirm_accept.focus();});}
function manualContractorOperations(input){
 const row=input.closest('[data-contractor-row]'),slotId=input.dataset.contractorSlot;
 const shift={start:row.querySelector('[data-shift-start]').value,end:row.querySelector('[data-shift-end]').value};
 const lunch={start:row.querySelector('[data-lunch-start]').value,end:row.querySelector('[data-lunch-end]').value};
 const minutes=value=>/^([01]\d|2[0-3]):[0-5]\d$/.test(value)?Number(value.slice(0,2))*60+Number(value.slice(3)):value==='24:00'?1440:NaN;
 if(![shift.start,shift.end,lunch.start,lunch.end].every(t=>Number.isFinite(minutes(t)))||minutes(lunch.end)-minutes(lunch.start)!==60||minutes(shift.start)>minutes(lunch.start)||minutes(lunch.end)>minutes(shift.end))throw new Error('Enter the actual CoverAll shift and one-hour lunch within that shift. No lunch time is assumed.');
 return [{operation:'cover_all',slot_id:slotId,shift,reason:'Manager added CoverAll contractor capacity'},
  {operation:'exception',exception_type:'lunch',starts_at:lunch.start,ends_at:lunch.end,payload:{slotId},reason:'Manager recorded actual CoverAll lunch'}];
}
async function refreshSnapshot({automatic=false,signal}={}){
 const week=els.week_start.value,editEpoch=state.scheduleInputEpoch||0;
 const sequence=state.snapshotReadSequence=(state.snapshotReadSequence||0)+1;
 setStatus(`Loading week of ${week}...`);
 const snapshot=await api(`/static-weekly/manager-snapshot?week_start=${encodeURIComponent(week)}`,signal?{signal}:{});
 if(signal?.aborted||sequence!==state.snapshotReadSequence||els.week_start.value!==week){if(automatic)return false;throw new Error('The selected week changed before its schedule could be read. Retry the saved command read.');}
 if(automatic&&(editEpoch!==(state.scheduleInputEpoch||0)||scheduleRefreshBlocked(true))){setStatus('Schedule refresh pending; your current choices were kept.');return false;}
 if(!snapshot||snapshot.week_start!==week||!/^\d{4}-\d{2}-\d{2}$/.test(snapshot.week_end||'')
  ||!Number.isSafeInteger(snapshot.authority_revision)||snapshot.authority_revision<0)throw new Error('The scheduler returned an invalid weekly revision.');
 if(state.snapshot?.week_start===week&&snapshot.authority_revision<state.snapshot.authority_revision)throw new Error('The returned schedule is older than the displayed revision. Refresh remains pending.');
 clearCoverAllPdfs();state.snapshot=snapshot;state.scheduleInputDirty=false;
 if(els.service_date.value<snapshot.week_start||els.service_date.value>snapshot.week_end)els.service_date.value=snapshot.week_start;
 els.service_date.min=snapshot.week_start;els.service_date.max=snapshot.week_end;
 render();captureScheduleInputBaseline();setStatus(`Loaded ${snapshot.week_start} through ${snapshot.week_end}.`,'done');return true;
}
async function loadSnapshot(){return busy(refreshSnapshot);}
function scheduleDayInputSignature(){return JSON.stringify([els.absence_type.value,[...document.querySelectorAll('[data-callout-slot],[data-contractor-row] input')].map(input=>[input.dataset.calloutSlot||input.dataset.contractorSlot||'',input.value,Boolean(input.checked)])]);}
function captureScheduleInputBaseline(){state.scheduleInputBaseline=scheduleDayInputSignature();state.scheduleInputDirty=false;}
function deferScheduleRefresh(){
 if(state.scheduleRefreshDeferTimer!=null)return;
 // A dialog close resolves the user's confirmation in this task. The next
 // task may refresh only after that promise continuation has claimed busy.
 state.scheduleRefreshDeferTimer=window.setTimeout(()=>{state.scheduleRefreshDeferTimer=null;void flushScheduleRefresh();},0);
}
function scheduleRefreshBlocked(ownRead=false){return (!ownRead&&state.busy)||Boolean(state.dayChangeRequest||state.staffingCommandState||state.turnoverRequest||state.scheduleInputDirty)||els.action_confirm_dialog.open||els.turnover_dialog.open||document.hidden||navigator.onLine===false;}
async function requestScheduleRefresh(){state.scheduleRefreshQueued=true;return flushScheduleRefresh();}
async function flushScheduleRefresh(){
 if(!state.scheduleRefreshQueued||state.scheduleRefreshRunning||!state.baseUrl||scheduleRefreshBlocked())return;
 state.scheduleRefreshRunning=true;state.scheduleRefreshQueued=false;
 const controller=new AbortController();state.scheduleRefreshAbort=controller;
 const timeout=window.setTimeout(()=>controller.abort(),15000);
 try{const applied=await busy(()=>refreshSnapshot({automatic:true,signal:controller.signal}));if(applied!==true)state.scheduleRefreshQueued=true;}
 finally{window.clearTimeout(timeout);state.scheduleRefreshAbort=null;state.scheduleRefreshRunning=false;}
}
function installScheduleAutoRefresh(){
 if(state.scheduleRefreshInstalled)return;state.scheduleRefreshInstalled=true;captureScheduleInputBaseline();
 const request=()=>requestScheduleRefresh();
 const start=()=>{if(!state.scheduleRefreshTimer)state.scheduleRefreshTimer=window.setInterval(request,60000);};
 for(const name of ['online','memphis:schedule-refresh','memphis:native-notification-received'])window.addEventListener(name,request);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)return request();});
 const protect=event=>{if(event.target?.closest?.('[data-callout-slot],[data-contractor-row],#absence-type,#turnover-form')){state.scheduleInputEpoch=(state.scheduleInputEpoch||0)+1;state.scheduleInputDirty=scheduleDayInputSignature()!==state.scheduleInputBaseline;if(!state.scheduleInputDirty)deferScheduleRefresh();}};
 document.addEventListener('input',protect);document.addEventListener('change',protect);
 for(const dialog of [els.action_confirm_dialog,els.turnover_dialog])dialog.addEventListener('close',deferScheduleRefresh);
 window.addEventListener('pagehide',()=>{window.clearInterval(state.scheduleRefreshTimer);state.scheduleRefreshTimer=null;window.clearTimeout(state.scheduleRefreshDeferTimer);state.scheduleRefreshDeferTimer=null;state.scheduleRefreshAbort?.abort();state.snapshotReadSequence=(state.snapshotReadSequence||0)+1;});
 window.addEventListener('pageshow',()=>{start();return request();});start();
}
async function generateDraft(){if(blockCompetingDayChange())return;const snapshot=needSnapshot();const publication=snapshot.current_publication;const source=snapshot.sources?.[0];if(snapshot.drafts?.length)throw new Error('This week already has a draft. Publish it or choose another week.');const path=publication?'/static-weekly/drafts/replacement':'/static-weekly/drafts/initial';const body=publication?{source_publication_id:publication.publication_id}:{source_id:source?.source_id};if(!body.source_publication_id&&!body.source_id)throw new Error('No approved recurring schedule source is registered.');if(!await confirmAction(`Generate a balanced route-aware weekly draft beginning ${snapshot.week_start}?`,{title:'Generate weekly draft',confirmLabel:'Generate Draft'}))return;await busy(async()=>{setStatus('Generating verified weekly draft...');await api(path,{method:'POST',body:JSON.stringify({...body,effective_start:snapshot.week_start,expected_revision:snapshot.authority_revision,idempotency_key:commandId('draft')})});await refreshSnapshot();});}
async function publishDraft(){if(blockCompetingDayChange())return;const snapshot=needSnapshot();const draft=snapshot.drafts?.[0];if(!draft)throw new Error('Generate a draft before publishing.');if(!await confirmAction(`Publish the verified weekly draft beginning ${snapshot.week_start}? This becomes the repeating schedule until a later week is published.`,{title:'Publish weekly schedule',confirmLabel:'Publish Week'}))return;await busy(async()=>{setStatus('Publishing and compiling weekly schedule...');await api(`/static-weekly/drafts/${encodeURIComponent(draft.version_id)}/publish`,{method:'POST',body:JSON.stringify({expected_draft_revision:draft.revision,expected_revision:snapshot.authority_revision,idempotency_key:commandId('publish'),week_start:snapshot.week_start,publication_kind:snapshot.current_publication?'supersede':'publish'})});await refreshSnapshot();});}
function staffingDeliverySummary(delivery){const targets=Array.isArray(delivery?.targets)?delivery.targets:[];const count=(status)=>targets.filter(row=>row.status===status).length;return `${count('DEVICE_REPORTED_APPLIED')} phone${count('DEVICE_REPORTED_APPLIED')===1?'':'s'} applied • ${count('PENDING')} pending • ${count('NO_CURRENT_DEVICE')} without a current phone`;}
function staffingPreviewText(prepared){
 const semantic=prepared?.command?.semantic_body||{},start=semantic.startDate||'',end=semantic.endDate||start;
 const lines=[`Review the prepared schedule before publishing.`,`${semantic.commandKind==='cancel_absence'?'Return from absence':'Absence'}: ${start}${end!==start?` through ${end}`:''}`];
 for(const week of prepared?.preview?.weeks||[]){
  const assignments=(week.assignments||[]).filter(row=>String(row.service_date||'')>=start&&String(row.service_date||'')<=end);
  for(const row of assignments){const owner=row.status==='assigned'?(row.owner_name_snapshot||row.owner_slot_label_snapshot||row.owner_person_id||'Assigned'):'OPEN';const area=row.work_snapshot?.locationNameSnapshot||row.location_name_snapshot||row.work_id||'Area';const window=row.work_snapshot?.window||{};lines.push(`${row.service_date}: ${owner} — ${area}${window.start||window.end?` (${window.start||'?'}-${window.end||'?'})`:''}`);}
  for(const row of week.lunch_responsibilities||[]){if(String(row.service_date||'')<start||String(row.service_date||'')>end)continue;const segments=(row.segments||[]).map(segment=>`${segment.window?.start||'?'}-${segment.window?.end||'?'} ${(segment.includedLocations||[]).map(location=>location.locationNameSnapshot||location.locationCodeSnapshot||'area').join(', ')}`).join('; ');lines.push(`${row.service_date}: lunch coverage — ${row.coverer_name||row.coverer_person_id||'helper'} covers ${row.normal_owner_name||row.normal_owner_person_id||'employee'}${segments?` (${segments})`:''}`);}
 }
 if(lines.length===2)lines.push('No assigned work is present in the prepared affected window.');
 lines.push('Publish only if these areas, gaps, and lunch responsibilities are correct.');return lines.join('\n');
}
async function finishPreparedStaffing(prepared,label){
 if(prepared?.phase!=='PREPARED')return prepared;
 const accepted=await confirmAction(staffingPreviewText(prepared),{title:'Review prepared schedule',confirmLabel:'Publish Schedule'});
 if(!accepted){await state.staffingCoordinator.cancel();await refreshSnapshot();setStatus('Prepared staffing change cancelled; no schedule authority changed.','done');return null;}
 const result=await state.staffingCoordinator.confirm();await refreshSnapshot();setStatus(`Accepted ${label}. ${staffingDeliverySummary(result.delivery)}.`,'done');return result;
}
async function recoverStaffingCommand(){if(!state.staffingCoordinator?.hasPending())return;await busy(async()=>{setStatus('Recovering the exact staffing command…');const recovered=await state.staffingCoordinator.recover();if(recovered?.phase==='PREPARED')return finishPreparedStaffing(recovered,'recovered staffing change');if(recovered){await refreshSnapshot();setStatus(`Recovered accepted staffing change. ${staffingDeliverySummary(recovered.delivery)}.`,'done');}});}
async function applyDurableAbsence(snapshot,input,date,label){
 setStatus(`Preparing balanced ${label} coverage for ${date}…`);
 const prepared=await state.staffingCoordinator.prepare(input);return finishPreparedStaffing(prepared,`${label} coverage for ${date}`);
}
async function applyDayChanges(){
 if(state.busy)return;
 if(state.staffingCommandState)return recoverStaffingCommand();
 if(!state.dayChangeRequest){
  const snapshot=needSnapshot(),publication=snapshot.current_publication;
  if(!publication)throw new Error('Publish the weekly baseline before adding day changes.');
  const date=selectedServiceDate(),checked=[...document.querySelectorAll('[data-callout-slot]:checked:not(:disabled)')],contractors=[...document.querySelectorAll('[data-contractor-slot]:checked:not(:disabled)')];
  if(!checked.length&&!contractors.length)throw new Error('Select an absence, PTO entry, or contractor slot.');
  const absenceType=els.absence_type.value==='pto'?'pto':'daily_absence',absenceLabel=absenceType==='pto'?'PTO':'call-out';
  if(state.staffingCoordinator&&checked.length){
   if(checked.length!==1)throw new Error('Apply one employee absence at a time so each confirmed command has exact recovery and phone readback.');
   if(contractors.length)throw new Error('Apply the employee absence first, then add CoverAll from the accepted refreshed schedule.');
   const slotId=checked[0].dataset.calloutSlot,row=activeRoster(snapshot).find(item=>item.slot_id===slotId);
   if(!row?.person_id)throw new Error('The selected position has no current employee identity. Refresh the schedule.');
   const input={command_kind:'absence',employee_id:row.person_id,start_date:date,end_date:date,absence_kind:absenceType,expected_revision:snapshot.authority_revision};
   return busy(()=>applyDurableAbsence(snapshot,input,date,absenceLabel));
  }
  // Freeze semantic values BEFORE confirmation, not references to editable DOM.
  const operations=[...checked.map(input=>({operation:'exception',exception_type:absenceType,reason:absenceType==='pto'?'Manager recorded PTO':'Manager recorded daily call-out',payload:{slotId:input.dataset.calloutSlot}})),...contractors.flatMap(manualContractorOperations)];
  const body={service_date:date,base_version_id:publication.version_id,version_id:publication.version_id,publication_id:publication.publication_id,operations,expected_revision:snapshot.authority_revision,week_start:snapshot.week_start};
  if(!await confirmAction(`Apply ${checked.length} ${absenceLabel} entr${checked.length===1?'y':'ies'} and ${contractors.length} contractor slot${contractors.length===1?'':'s'} for ${date}?`,{title:'Apply day changes',confirmLabel:'Apply Changes'}))return;
  if(state.busy||state.dayChangeRequest)return;
  body.idempotency_key=commandId(`day-changes-${date}`);
  // Unknown responses must retry the original exact command. This is same-page
  // recovery only; durable reload recovery remains an explicit OC24-07 gate.
  clearCoverAllPdfs();
  state.dayChangeRequest={encoded:JSON.stringify(body),date,hasContractors:contractors.length>0,accepted:false};
 }
 await busy(async()=>{
  const request=state.dayChangeRequest;

 const query=new URLSearchParams({week_start:snapshot.week_start,service_date:date,expected_revision:String(snapshot.authority_revision),projection_id:projection.projection_id});
 const pair=await api('/static-weekly/coverall-print?'+query);
 if(sequence!==state.printSequence||date!==selectedServiceDate()||state.snapshot?.authority_revision!==snapshot.authority_revision||state.snapshot?.latest_projection?.projection_id!==projection.projection_id)throw new Error('The schedule changed while preparing PDFs. Prepare the current revision.');
 if(pair?.schema!=='custodial.coverall-pdf-pair.v1'||pair.document?.projectionId!==projection.projection_id||pair.document?.authorityRevision!==snapshot.authority_revision||pair.document?.serviceDate!==date||!Array.isArray(pair.files)||pair.files.length!==2||pair.files.map(f=>f.language).sort().join(',')!=='en,es')throw new Error('The bilingual PDF revision is incomplete or mismatched.');

function needSnapshot(){if(!state.snapshot)throw new Error('Load the weekly scheduler first.');return state.snapshot;}
function setStatus(text,type=''){els.status.textContent=text;els.status.className=`status ${type}`.trim();}
function labelType(value){return String(value||'change').replaceAll('_',' ').replace(/\b\w/g,(c)=>c.toUpperCase());}
function safe(error){return error?.message?String(error.message):String(error||'Unknown error');}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
</script>
