<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://*.onrender.com https://localhost http://localhost:* http://127.0.0.1:* capacitor://localhost; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Weekly Custodial Schedule</title>
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12">
  <link rel="stylesheet" href="./schedule-weekly.css?v=2026.08.12.1">
</head>
<body data-memphis-context="manager">
<main class="page">
  <header class="topbar">
    <a class="btn mz-back-link" data-mz-back href="./start_page1.html" title="Back" aria-label="Back">Back<span data-lucide="arrow-left" aria-hidden="true"></span></a>
    <div class="title"><h1>Weekly Custodial Schedule</h1><p id="subtitle">Repeating weekly area ownership</p></div>
    <div class="toolbar">
      <button class="btn" id="refresh-btn" type="button"><span data-lucide="refresh-cw"></span>Refresh</button>
      <button class="btn blue" id="generate-btn" type="button"><span data-lucide="wand-sparkles"></span>Generate Draft</button>
      <button class="btn primary" id="publish-btn" type="button"><span data-lucide="upload"></span>Publish Week</button>
    </div>
  </header>
  <div class="status" id="status" role="status" aria-live="polite">Connecting to scheduler...</div>
  <section class="workspace">
    <aside class="sidebar">
      <div class="field"><label for="week-start">Week starting</label><input id="week-start" type="date"></div>
      <div class="field"><label for="service-date">Day changes for</label><input id="service-date" type="date"></div>
      <div class="summary">
        <div class="metric"><strong id="working-count">0</strong><span>working slots</span></div>
        <div class="metric"><strong id="absent-count">0</strong><span>absent slots</span></div>
        <div class="metric"><strong id="open-count">0</strong><span>open items</span></div>
        <div class="metric"><strong id="revision-count">0</strong><span>revision</span></div>
      </div>
      <div class="sidebarSection"><div class="sectionLabel">Baseline absences</div><div id="baseline-absences" class="list"></div></div>
      <div class="sidebarSection"><div class="sectionLabel">Temporary call-outs</div><div id="temporary-absences" class="list"></div></div>
      <div class="sidebarSection"><div class="sectionLabel">Contractor capacity</div><div id="contractor-slots" class="list"></div></div>
      <div class="sidebarActions actions"><button class="btn blue" id="apply-day-btn" type="button"><span data-lucide="calendar-check"></span>Apply Day Changes</button></div>
    </aside>
    <section class="main">
      <div class="mainHeader">
        <div><h2 id="week-title">Current week</h2><div class="weekMeta" id="week-meta">No schedule loaded</div></div>
        <div class="segmented" role="tablist" aria-label="Schedule view">
          <button type="button" class="active" data-view="week" role="tab">Week</button>
          <button type="button" data-view="changes" role="tab">Changes</button>
          <button type="button" data-view="readiness" role="tab">Readiness</button>
        </div>
      </div>
      <div id="week-panel" class="panel active"><div class="tableWrap"><table><thead id="week-head"></thead><tbody id="week-body"></tbody></table></div></div>
      <div id="changes-panel" class="panel"><div id="changes-list" class="list"></div></div>
      <div id="readiness-panel" class="panel"><div id="readiness-list" class="readiness"></div></div>
    </section>
  </section>
</main>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script>
<script src="./memphis-ui.js?v=release-2026.07.19.custodial-v3.12"></script>
<script>
const CONFIG={BOOTSTRAP_URL:'https://memphis-zoo-mcp.onrender.com/scheduler-runtime-config',DEVICE_KEY:'mz_scan_device_id'};
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const els=Object.fromEntries(['refresh-btn','generate-btn','publish-btn','apply-day-btn','week-start','service-date','status','subtitle','working-count','absent-count','open-count','revision-count','baseline-absences','temporary-absences','contractor-slots','week-title','week-meta','week-head','week-body','changes-list','readiness-list'].map((id)=>[id.replaceAll('-','_'),document.getElementById(id)]));
const state={baseUrl:'',snapshot:null,busy:false};
init().catch((error)=>setStatus(`Scheduler unavailable: ${safe(error)}`,'error'));
async function init(){window.lucide?.createIcons?.();await window.MemphisAuth.requireOpsManagerSession({interactive:false,redirect:true,throwOnFailure:true});const params=new URLSearchParams(location.search);const requested=params.get('week_start')||params.get('date')||window.MemphisAuth.getCSTDateString();els.week_start.value=mondayOf(requested);els.service_date.value=requested;els.refresh_btn.addEventListener('click',loadSnapshot);els.generate_btn.addEventListener('click',generateDraft);els.publish_btn.addEventListener('click',publishDraft);els.apply_day_btn.addEventListener('click',applyDayChanges);els.changes_list.addEventListener('click',reverseChange);els.week_start.addEventListener('change',()=>{els.week_start.value=mondayOf(els.week_start.value);loadSnapshot();});els.service_date.addEventListener('change',()=>render());document.querySelectorAll('[data-view]').forEach((button)=>button.addEventListener('click',()=>selectView(button.dataset.view)));state.baseUrl=await loadControlPlaneUrl();await loadSnapshot();}
async function loadControlPlaneUrl(){const response=await fetch(CONFIG.BOOTSTRAP_URL,{cache:'no-store'});const payload=await response.json().catch(()=>null);const url=String(payload?.data?.public_url||'').replace(/\/+$/,'');if(!response.ok||!payload?.ok||!/^https:\/\//i.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url))throw new Error(payload?.error||'Weekly scheduler service is not configured.');return url;}
async function api(path,options={}){const auth=await window.MemphisAuth.opsManagerAuthHeaders();const response=await fetch(`${state.baseUrl}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...auth,...(options.headers||{})}});const payload=await response.json().catch(()=>null);if(!response.ok||!payload?.ok)throw new Error(payload?.error||`Scheduler request failed (${response.status})`);return payload.data;}
async function refreshSnapshot(){setStatus(`Loading week of ${els.week_start.value}...`);state.snapshot=await api(`/static-weekly/manager-snapshot?week_start=${encodeURIComponent(els.week_start.value)}`);if(els.service_date.value<state.snapshot.week_start||els.service_date.value>state.snapshot.week_end)els.service_date.value=state.snapshot.week_start;els.service_date.min=state.snapshot.week_start;els.service_date.max=state.snapshot.week_end;render();setStatus(`Loaded ${state.snapshot.week_start} through ${state.snapshot.week_end}.`,'done');}
async function loadSnapshot(){return busy(refreshSnapshot);}
async function generateDraft(){const snapshot=needSnapshot();const publication=snapshot.current_publication;const source=snapshot.sources?.[0];if(snapshot.drafts?.length)throw new Error('This week already has a draft. Publish it or choose another week.');const path=publication?'/static-weekly/drafts/replacement':'/static-weekly/drafts/initial';const body=publication?{source_publication_id:publication.publication_id}:{source_id:source?.source_id};if(!body.source_publication_id&&!body.source_id)throw new Error('No approved recurring schedule source is registered.');if(!confirm(`Generate a balanced route-aware weekly draft beginning ${snapshot.week_start}?`))return;await busy(async()=>{setStatus('Generating verified weekly draft...');await api(path,{method:'POST',body:JSON.stringify({...body,effective_start:snapshot.week_start,expected_revision:snapshot.authority_revision,idempotency_key:commandId('draft')})});await refreshSnapshot();});}
async function publishDraft(){const snapshot=needSnapshot();const draft=snapshot.drafts?.[0];if(!draft)throw new Error('Generate a draft before publishing.');if(!confirm(`Publish the verified weekly draft beginning ${snapshot.week_start}? This becomes the repeating schedule until a later week is published.`))return;await busy(async()=>{setStatus('Publishing and compiling weekly schedule...');const published=await api(`/static-weekly/drafts/${encodeURIComponent(draft.version_id)}/publish`,{method:'POST',body:JSON.stringify({expected_draft_revision:draft.revision,expected_revision:snapshot.authority_revision,idempotency_key:commandId('publish'),publication_kind:snapshot.current_publication?'supersede':'publish'})});await materializeProjection(published.data.publication_id,published.revision,snapshot.week_start);await refreshSnapshot();});}
async function applyDayChanges(){const snapshot=needSnapshot();const publication=snapshot.current_publication;if(!publication)throw new Error('Publish the weekly baseline before adding day changes.');const date=selectedServiceDate();const checked=[...document.querySelectorAll('[data-callout-slot]:checked:not(:disabled)')];const contractors=[...document.querySelectorAll('[data-contractor-slot]:checked:not(:disabled)')];if(!checked.length&&!contractors.length)throw new Error('Select a temporary call-out or contractor slot.');if(!confirm(`Apply ${checked.length} call-out${checked.length===1?'':'s'} and ${contractors.length} contractor slot${contractors.length===1?'':'s'} for ${date}?`))return;await busy(async()=>{let revision=snapshot.authority_revision;for(const input of checked){const data=await api('/static-weekly/exceptions',{method:'POST',body:JSON.stringify({exception_type:'daily_absence',service_date:date,base_version_id:publication.version_id,publication_id:publication.publication_id,reason:'Manager recorded daily call-out',payload:{slotId:input.dataset.calloutSlot},expected_revision:revision,idempotency_key:commandId(`absence-${input.dataset.calloutSlot}`)})});revision=data.revision;}for(const input of contractors){const row=input.closest('[data-contractor-row]');const data=await api('/static-weekly/contractor-capacity',{method:'POST',body:JSON.stringify({service_date:date,base_version_id:publication.version_id,publication_id:publication.publication_id,slot_id:input.dataset.contractorSlot,shift:{start:row.querySelector('[data-shift-start]').value,end:row.querySelector('[data-shift-end]').value},reason:'Manager added CoverAll contractor capacity',expected_revision:revision,idempotency_key:commandId(`contractor-${input.dataset.contractorSlot}`)})});revision=data.revision;}await materializeProjection(publication.publication_id,revision,snapshot.week_start);await refreshSnapshot();});}
async function materializeProjection(publicationId,revision,weekStart){return api('/static-weekly/projections',{method:'POST',body:JSON.stringify({publication_id:publicationId,service_date:weekStart,expected_revision:revision,idempotency_key:commandId('projection')})});}
async function reverseChange(event){const button=event.target.closest('[data-reverse-exception]');if(!button)return;const snapshot=needSnapshot();const publication=snapshot.current_publication;const row=snapshot.exceptions.find((item)=>item.id===button.dataset.reverseException);if(!publication||!row)return;if(!confirm(`Remove this ${labelType(row.type).toLowerCase()} from ${row.serviceDate}?`))return;await busy(async()=>{setStatus('Removing dated change and rebuilding the week...');const reversed=await api('/static-weekly/exceptions',{method:'POST',body:JSON.stringify({exception_type:'reverse',service_date:row.serviceDate,base_version_id:publication.version_id,publication_id:publication.publication_id,reason:'Manager removed dated schedule change',payload:{reversesExceptionId:row.id},reverses_exception_id:row.id,expected_revision:snapshot.authority_revision,idempotency_key:commandId(`reverse-${row.id}`)})});await materializeProjection(publication.publication_id,reversed.revision,snapshot.week_start);await refreshSnapshot();});}
function render(){const s=needSnapshot();const rows=activeRoster(s);const absent=s.availability.filter((row)=>row.availability_state==='departed_named_absent');const assignments=displayAssignments(s);const open=assignments.filter((row)=>String(row.status).toLowerCase()!=='assigned');els.working_count.textContent=String(new Set(s.availability.filter((row)=>row.availability_state==='working').map((row)=>row.slot_id)).size);els.absent_count.textContent=String(new Set(absent.map((row)=>row.slot_id)).size);els.open_count.textContent=String(open.length);els.revision_count.textContent=String(s.authority_revision||0);els.week_title.textContent=`${formatDate(s.week_start)} - ${formatDate(s.week_end)}`;const stage=s.drafts?.length?'Draft ready':s.current_publication?'Published baseline':'No baseline';els.week_meta.textContent=`${stage} • ${assignments.length} work items • revision ${s.authority_revision}`;els.subtitle.textContent=s.current_publication?'Repeats until a later schedule is published':'Approved source required before first publication';renderAbsences(s,rows);renderContractors(s,rows);renderWeek(s,rows,assignments);renderChanges(s);renderReadiness(s,assignments);els.generate_btn.disabled=state.busy||Boolean(s.drafts?.length);els.publish_btn.disabled=state.busy||!s.drafts?.length;els.apply_day_btn.disabled=state.busy||!s.current_publication;window.lucide?.createIcons?.();}
function renderAbsences(s,rows){const bySlot=new Map(rows.map((row)=>[row.slot_id,row]));const baseline=[...new Set(s.availability.filter((row)=>row.availability_state==='departed_named_absent').map((row)=>row.slot_id))];els.baseline_absences.innerHTML=baseline.length?baseline.map((id)=>`<div class="checkRow absentFixed"><span data-lucide="user-x"></span><div><strong>${escapeHtml(bySlot.get(id)?.person_name||bySlot.get(id)?.slot_label||'Departed slot')}</strong><small>Absent until replacement</small></div></div>`).join(''):'<div class="empty">No baseline absent slots.</div>';const date=selectedServiceDate();const active=activeExceptionSlots(s,date,'daily_absence');const working=rows.filter((row)=>!row.contractor_capacity&&s.availability.some((item)=>item.slot_id===row.slot_id&&item.availability_state==='working'));els.temporary_absences.innerHTML=working.map((row)=>`<label class="checkRow"><input type="checkbox" data-callout-slot="${escapeHtml(row.slot_id)}" ${active.has(row.slot_id)?'checked disabled':''}><span><strong>${escapeHtml(row.person_name||row.slot_label)}</strong><small>${active.has(row.slot_id)?'Call-out already applied':'Working in baseline'}</small></span></label>`).join('')||'<div class="empty">No working employees.</div>';}
function renderContractors(s,rows){const date=selectedServiceDate();const active=activeExceptionSlots(s,date,'cover_all');const contractors=rows.filter((row)=>row.contractor_capacity);els.contractor_slots.innerHTML=contractors.length?contractors.map((row)=>`<div class="checkRow" data-contractor-row><input type="checkbox" data-contractor-slot="${escapeHtml(row.slot_id)}" ${active.has(row.slot_id)?'checked disabled':''}><div><strong>${escapeHtml(row.person_name||row.slot_label)}</strong><small>${active.has(row.slot_id)?'Contractor capacity already applied':'Dedicated CoverAll capacity'}</small><div class="inline" style="margin-top:7px"><label class="sr">Start</label><input data-shift-start type="time" value="07:00" ${active.has(row.slot_id)?'disabled':''}><label class="sr">End</label><input data-shift-end type="time" value="16:00" ${active.has(row.slot_id)?'disabled':''}></div></div></div>`).join(''):'<div class="empty">No approved contractor slots in this source.</div>';}
function renderWeek(s,rows,assignments){const dates=weekDates(s.week_start);els.week_head.innerHTML=`<tr><th>Employee</th>${dates.map((date,index)=>`<th>${DAY_NAMES[(index+1)%7]}<br>${escapeHtml(date.slice(5))}</th>`).join('')}</tr>`;const byOwner=new Map();for(const assignment of assignments){const key=`${assignment.owner_slot_id||'OPEN'}|${assignment.day_of_week}`;if(!byOwner.has(key))byOwner.set(key,[]);byOwner.get(key).push(assignment);}const displayRows=[...rows.filter((row)=>!row.contractor_capacity),{slot_id:'OPEN',slot_label:'Open work',person_name:'Open work'}];els.week_body.innerHTML=displayRows.map((row)=>{const cells=dates.map((date,index)=>{const day=(index+1)%7;const available=s.availability.find((item)=>item.slot_id===row.slot_id&&item.day_of_week===day);const items=byOwner.get(`${row.slot_id}|${day}`)||[];if(row.slot_id!=='OPEN'&&available?.availability_state!=='working')return `<td><div class="dayOff">${available?.availability_state==='departed_named_absent'?'Absent until replaced':'Not scheduled'}</div></td>`;if(!items.length)return '<td><div class="dayOff">No assigned areas</div></td>';return `<td>${items.map(renderAssignment).join('')}</td>`;}).join('');const load=assignments.filter((item)=>item.owner_slot_id===row.slot_id).reduce((sum,item)=>sum+Number(item.workload_points||item.work_snapshot?.serviceEffortMinutes||0),0);const max=Math.max(1,...rows.map((r)=>assignments.filter((item)=>item.owner_slot_id===r.slot_id).reduce((sum,item)=>sum+Number(item.workload_points||item.work_snapshot?.serviceEffortMinutes||0),0)));return `<tr><td><div class="employeeHead">${escapeHtml(row.person_name||row.slot_label)}<small>${row.slot_id==='OPEN'?'Requires manager review':`${Math.round(load)} load units`}</small></div><div class="loadBar ${load/max>.85?'loadHigh':''}"><span style="width:${Math.min(100,Math.round(load/max*100))}%"></span></div></td>${cells}</tr>`;}).join('');}
function renderAssignment(item){const name=item.location_name||item.work_snapshot?.locationNameSnapshot||item.workSnapshot?.locationNameSnapshot||item.work_id||item.workId;const status=String(item.status||'').toLowerCase();const restroom=/restroom|bathroom|toilet/i.test(`${name} ${item.location_code||''}`);return `<div class="assignment ${status!=='assigned'?'open':restroom?'restroom':''}"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(item.coverage_start||item.work_snapshot?.window?.start||item.workSnapshot?.window?.start||'')} - ${escapeHtml(item.coverage_end||item.work_snapshot?.window?.end||item.workSnapshot?.window?.end||'')} • ${status||'assigned'}</small></div>`;}
function renderChanges(s){const exceptions=Array.isArray(s.exceptions)?s.exceptions:[];els.changes_list.innerHTML=exceptions.length?exceptions.map((row)=>`<div class="listRow"><div><strong>${escapeHtml(labelType(row.type))}</strong><small>${escapeHtml(row.serviceDate)} • ${escapeHtml(row.reason||'Accepted manager change')}</small></div><button class="iconBtn small" type="button" data-reverse-exception="${escapeHtml(row.id)}" title="Remove change" aria-label="Remove ${escapeHtml(labelType(row.type))}"><span data-lucide="undo-2"></span></button></div>`).join(''):'<div class="empty">No dated changes are active for this week.</div>';}
function renderReadiness(s,assignments){const checks=[['Scheduler service',Boolean(state.baseUrl)],['Named manager session',true],['Registered source',Boolean(s.sources?.length)],['Published baseline',Boolean(s.current_publication)],['Draft waiting',Boolean(s.drafts?.length)],['Compiled projection',Boolean(s.latest_projection)],['Open required work',assignments.some((row)=>String(row.status).toLowerCase()!=='assigned')?false:true]];els.readiness_list.innerHTML=checks.map(([label,ok])=>`<div><strong>${escapeHtml(label)}</strong><span class="pill ${ok?'ok':'warn'}">${ok?'Ready':'Attention'}</span></div>`).join('');}
function displayAssignments(s){const projected=s.latest_projection?.assignments;return Array.isArray(projected)&&projected.length?projected.map((row)=>({...row,owner_name:activeRoster(s).find((item)=>item.slot_id===(row.owner_slot_id||row.slotId))?.person_name,owner_slot_id:row.owner_slot_id||row.slotId,location_name:row.work_snapshot?.locationNameSnapshot||row.workSnapshot?.locationNameSnapshot,coverage_start:row.work_snapshot?.window?.start||row.workSnapshot?.window?.start,coverage_end:row.work_snapshot?.window?.end||row.workSnapshot?.window?.end,workload_points:row.work_snapshot?.serviceEffortMinutes||row.workSnapshot?.serviceEffortMinutes})):Array.isArray(s.assignments)?s.assignments:[];}
function activeRoster(s){return (Array.isArray(s.roster)?s.roster:[]).map((slot)=>{const current=(slot.incumbencies||[]).find((item)=>item.effective_start<=s.week_end&&(!item.effective_end||item.effective_end>s.week_start))||{};return {...slot,person_name:current.person_name,person_id:current.person_id};});}
function activeExceptionSlots(s,date,type){return new Set((s.exceptions||[]).filter((row)=>row.serviceDate===date&&row.type===type).map((row)=>row.payload?.slotId||row.payload?.availability?.slotId).filter(Boolean));}
function selectedServiceDate(){return els.service_date.value||state.snapshot.week_start;}
function weekDates(start){const date=new Date(`${start}T12:00:00Z`);return Array.from({length:7},(_,index)=>new Date(date.getTime()+index*86400000).toISOString().slice(0,10));}
function mondayOf(value){const date=new Date(`${value}T12:00:00Z`);if(Number.isNaN(date.getTime()))return mondayOf(new Date().toISOString().slice(0,10));const day=date.getUTCDay();date.setUTCDate(date.getUTCDate()-((day+6)%7));return date.toISOString().slice(0,10);}
function formatDate(value){return new Date(`${value}T12:00:00Z`).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});}
function commandId(label){return `${label}-${Date.now()}-${crypto.randomUUID()}`;}
function selectView(view){document.querySelectorAll('[data-view]').forEach((button)=>button.classList.toggle('active',button.dataset.view===view));document.querySelectorAll('.panel').forEach((panel)=>panel.classList.toggle('active',panel.id===`${view}-panel`));}
async function busy(work){if(state.busy)return;state.busy=true;setControls();try{return await work();}catch(error){setStatus(safe(error),'error');return null;}finally{state.busy=false;setControls();}}
function setControls(){els.refresh_btn.disabled=state.busy;els.generate_btn.disabled=state.busy||Boolean(state.snapshot?.drafts?.length);els.publish_btn.disabled=state.busy||!state.snapshot?.drafts?.length;els.apply_day_btn.disabled=state.busy||!state.snapshot?.current_publication;}
function needSnapshot(){if(!state.snapshot)throw new Error('Load the weekly scheduler first.');return state.snapshot;}
function setStatus(text,type=''){els.status.textContent=text;els.status.className=`status ${type}`.trim();}
function labelType(value){return String(value||'change').replaceAll('_',' ').replace(/\b\w/g,(c)=>c.toUpperCase());}
function safe(error){return error?.message?String(error.message):String(error||'Unknown error');}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
</script>
</body>
</html>
