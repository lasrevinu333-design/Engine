<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Opening approved custodial schedule</title><link rel="stylesheet" href="./manager-ux.css"></head><body data-memphis-context="manager"><main><h1>Custodial schedule</h1><p>Schedules, approved PTO, absences, and confirmed CoverAll hours are managed in the current weekly schedule.</p><a href="./schedule-weekly.html?hub=manager">Open the weekly schedule</a><p>This older entry no longer generates or changes schedules.</p></main><script>(()=>{const current=new URL(window.location.href),target=new URL('./schedule-weekly.html',current);
const civil=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value+'T12:00:00Z'))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;
const date=current.searchParams.get('service_date')||current.searchParams.get('date');
if(civil(date))target.searchParams.set('date',date);
else if(civil(current.searchParams.get('week_start')))target.searchParams.set('week_start',current.searchParams.get('week_start'));
const device=current.searchParams.get('device');if(device&&/^[A-Za-z0-9_.:-]{1,160}$/.test(device))target.searchParams.set('device',device);
target.searchParams.set('hub','manager');

window.location.replace(target.toString());})();</script></body></html>
