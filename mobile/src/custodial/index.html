<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102018">
  <title>Memphis Zoo Custodial</title>
  <style>
    :root{color-scheme:dark;--text:#fff;--panel:rgba(5,15,20,.88);--line:rgba(255,255,255,.42);--green:#b7e66a;--danger:#fecaca}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{width:100%;min-height:100%;margin:0;font-family:Arial,sans-serif;color:var(--text);background:#111827;-webkit-text-size-adjust:100%}
    body{background-image:linear-gradient(rgba(2,8,14,.34),rgba(2,8,14,.48)),url('./dashboard-bg_optimized.webp');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button,a{touch-action:manipulation}
    .homeScreen{min-height:100vh;padding:max(28px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:20px}
    .homeHeader{width:100%;text-align:center;text-shadow:0 3px 15px rgba(0,0,0,.9)}
    .homeHeader h1{margin:0;font-size:clamp(1.72rem,7vw,2.25rem);line-height:1.05;font-weight:900}
    #employee-name{margin-top:10px;font-size:clamp(1.28rem,5.8vw,1.75rem);font-weight:900;color:#f7ffd9;line-height:1.14;overflow-wrap:anywhere}
    .homeMenu{width:min(340px,90vw);margin:auto 0;display:grid;gap:17px}
    .activeCleaning{width:min(390px,92vw);margin:4px 0 0;padding:16px 18px;border:2px solid rgba(183,230,106,.84);border-radius:18px;background:rgba(5,29,20,.94);box-shadow:0 8px 22px rgba(0,0,0,.38);text-align:center}
    .activeCleaning p{margin:0;font-size:1.08rem;font-weight:900;line-height:1.35;color:#f7ffd9}
    .homeButton{min-height:76px;border:2px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;padding:14px 18px;background:linear-gradient(180deg,rgba(6,20,26,.9),rgba(3,12,18,.84));color:#fff;text-decoration:none;font-size:1.38rem;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.42);text-shadow:0 2px 8px rgba(0,0,0,.7)}
    .homeButton:active{transform:translateY(2px);background:linear-gradient(180deg,rgba(117,165,44,.96),rgba(74,119,22,.95))}
    .homeButton:focus-visible,.action:focus-visible{outline:4px solid #f7ffd9;outline-offset:3px}
    .stateScreen{min-height:100vh;padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));display:grid;place-items:center}
    .stateCard{width:min(520px,100%);padding:24px 20px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:var(--panel);box-shadow:0 18px 44px rgba(0,0,0,.45)}
    .stateCard h1{margin:0 0 12px;font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.05}.stateCard p{margin:0 0 18px;font-size:1.08rem;line-height:1.4;color:#edf5ff}
    .field{display:grid;gap:8px;margin:14px 0}.field label{font-weight:900}.field select,.field input{width:100%;min-height:58px;border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:12px 14px;background:#fff;color:#111827;font-size:1.08rem}
    .action{width:100%;min-height:58px;margin-top:12px;border:0;border-radius:17px;padding:12px 16px;background:linear-gradient(180deg,#c7ef81,#9bd449);color:#102106;font-size:1.12rem;font-weight:900}.action.secondary{background:#f8fafc;color:#111827}.action.danger{background:#fecaca;color:#450a0a}
    .status{min-height:1.4em;margin-top:14px;text-align:center;font-size:1rem;font-weight:800;line-height:1.35}.status.error{color:var(--danger)}.status.ok{color:#d9f99d}.status.info{color:#dbeafe}
    @media(max-height:690px){.homeScreen{padding-top:max(18px,env(safe-area-inset-top));gap:12px}.homeButton{min-height:64px;font-size:1.22rem}.homeMenu{gap:12px;margin:8px 0}}
    @media(min-width:700px){.homeMenu{width:390px}.homeButton{min-height:86px}}
  </style>
  <script>document.documentElement.classList.add('mz-native-app',/Android/i.test(navigator.userAgent)?'mz-native-android':'mz-native-ios');</script>
</head>
<body data-memphis-context="employee">
  <main id="home" class="homeScreen" hidden>
    <header class="homeHeader">
      <h1>Memphis Zoo Custodial</h1>
      <div id="employee-name">Employee</div>
    </header>
    <section id="active-cleaning" class="activeCleaning" aria-live="polite" hidden>
      <p id="active-cleaning-text"></p>
    </section>
    <nav class="homeMenu" aria-label="Employee menu">
      <a class="homeButton" href="./employee-schedule.html?hub=employee">Schedule</a>
      <a class="homeButton" href="./messages.html?hub=employee">Messages</a>
      <a class="homeButton" href="./employee-events.html?hub=employee">Events</a>
      <a class="homeButton" href="./employee-feedback.html?hub=employee">Feedback</a>
    </nav>
  </main>

  <main id="boot" class="stateScreen" aria-live="polite">
    <section class="stateCard">
      <h1 id="boot-title">Please wait</h1>
      <p id="boot-status">Opening your work phone…</p>
      <button id="boot-retry" class="action secondary" type="button" hidden>Try Again</button>
    </section>
  </main>

  <main id="enrollment" class="stateScreen" hidden>
    <section class="stateCard">
      <h1 id="enrollment-title">Set up this phone</h1>
      <p id="enrollment-lead">A manager must set up this phone before it can be used.</p>
      <form id="enroll-form">
        <div class="field"><label for="device-id">Phone number</label><select id="device-id" required><option value="">Choose phone</option></select></div>
        <div class="field"><label for="code">Manager code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="1234 5678" required></div>
        <button id="enroll-submit" class="action" type="submit">Set Up Phone</button>
        <button id="cancel-pending-enrollment" class="action danger" type="button" hidden>Cancel Saved Setup</button>
        <div id="enroll-status" class="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="./memphis-custodial-bridge.js"></script>
  <script src="./memphis-scan-sync.js"></script>
  <script src="./memphis-device-reminders.js"></script>
  <script src="./memphis-ui.js"></script>
  <script src="./mobile-custodial.js"></script>
</body>
</html>
