<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06232a">
  <title>Custodial Phone Setup</title>
  <link rel="stylesheet" href="./mobile.css">
  <link rel="stylesheet" href="./field-guide.css">
  <style>
    :root{--green:#9be11f;--panel:#0e2931;--bg:#04181e}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#f8fafc;background:var(--bg)}
    body{background:radial-gradient(circle at 85% -8%,rgba(82,211,223,.24),transparent 36rem),linear-gradient(180deg,#0a3037,#04181e 58%,#020b0f)}
    .setupShell{width:min(560px,100%);min-height:100vh;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:grid;align-content:center;gap:18px}
    .setupHeader{text-align:center;text-shadow:0 3px 16px rgba(0,0,0,.6)}
    .setupHeader h1{margin:0;font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.05}
    .setupHeader p{margin:10px 0 0;color:rgba(248,250,252,.78);line-height:1.35}
    .setupCard{padding:22px;border-radius:24px;background:rgba(8,31,38,.94);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 46px rgba(0,0,0,.38)}
    .eyebrow{color:var(--green);font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h2{margin:8px 0 10px;font-size:1.45rem}
    .sectionLead{margin:0 0 18px;color:rgba(248,250,252,.78);line-height:1.4}
    .field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:900}.select,.input{width:100%;min-height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#071c23;color:#fff;padding:12px 14px;font-size:1.05rem}
    .actions{display:grid;gap:12px;margin-top:18px}.btn{min-height:56px;border:0;border-radius:16px;padding:12px 18px;font-size:1rem;font-weight:900;background:#dbe7ea;color:#07141a}.btn.primary{background:linear-gradient(180deg,#a8eb35,#7cc51c);color:#07140b}.btn.danger{background:#55242b;color:#fff}.btn[hidden]{display:none}.btn:disabled{opacity:.55}
    .status{margin-top:14px;min-height:1.4em;line-height:1.35}.status.error{color:#fecaca}.status.ok{color:#d9f99d}.status.info{color:#bae6fd}
    [hidden]{display:none!important}
  </style>
  <script>document.documentElement.classList.add('mz-native-app','mz-native-android');</script>
</head>
<body>
  <main class="setupShell">
    <header class="setupHeader">
      <h1>Custodial Phone Setup</h1>
      <p>This protected screen is for manager-assisted enrollment and recovery only.</p>
    </header>

    <section id="boot" class="setupCard" aria-live="polite">
      <div class="eyebrow">Starting</div>
      <h2>Checking this phone</h2>
      <p id="boot-status" class="sectionLead">Checking protected enrollment.</p>
      <button id="boot-retry" class="btn" type="button" hidden>Try Again</button>
    </section>

    <section id="enrollment" class="setupCard" hidden>
      <div id="enrollment-eyebrow" class="eyebrow">One-time setup</div>
      <h2 id="enrollment-title">Enroll employee phone</h2>
      <p id="enrollment-lead" class="sectionLead">A Custodial Manager selects the assigned phone and enters its current single-use code.</p>
      <form id="enroll-form">
        <div class="field">
          <label for="device-id">Assigned phone</label>
          <select id="device-id" class="select" required><option value="">Choose employee phone</option></select>
        </div>
        <div class="field">
          <label for="code">Manager code</label>
          <input id="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="1234 5678" required>
        </div>
        <div class="actions">
          <button id="enroll-submit" class="btn primary" type="submit">Enroll Phone</button>
          <button id="cancel-pending-enrollment" class="btn danger" type="button" hidden>Cancel Saved Setup</button>
        </div>
        <div id="enroll-status" class="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="./memphis-custodial-bridge.js"></script>
  <script src="./mobile-custodial.js"></script>
</body>
</html>
