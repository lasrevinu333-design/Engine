plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.memphiszoo.custodial'
    compileSdk 36
    defaultConfig {
        applicationId 'org.memphiszoo.custodial'
        buildConfigField 'String', 'ASSIGNMENT_SIGNING_KEY_ID', '"2dcd43c5b116190e6cfd92b73c34150e9670a04356cc7b84f74a5d48956cd446"'
        buildConfigField 'String', 'ASSIGNMENT_SIGNING_PUBLIC_KEY_X509_B64', '"MCowBQYDK2VwAyEApTSWOCLVWIt09r+UiccSeijW+8ccQeZ7pk4TUbbgb+Q="'
