def requiredEnvironment = [
    'MZ_RELEASE_VERSION',
    'CM_KEYSTORE_PATH',
    'CM_KEYSTORE_PASSWORD',
    'CM_KEY_ALIAS',
    'CM_KEY_PASSWORD'
]

requiredEnvironment.each { name ->
    if (!System.getenv(name)?.trim()) {
        throw new GradleException("Missing required environment variable: ${name}")
    }
}

def buildNumberText = System.getenv('PROJECT_BUILD_NUMBER') ?:
    System.getenv('BUILD_NUMBER') ?:
    System.getenv('MZ_BUILD_NUMBER')
if (!(buildNumberText ==~ /[1-9][0-9]*/)) {
    throw new GradleException(
        'PROJECT_BUILD_NUMBER, BUILD_NUMBER, or MZ_BUILD_NUMBER must provide a positive integer'
    )
}

def buildNumber = buildNumberText.toLong()
if (buildNumber > 2100000000L) {
    throw new GradleException('Native build number exceeds the Android versionCode limit')
}

def releaseVersion = System.getenv('MZ_RELEASE_VERSION')
if (!(releaseVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('MZ_RELEASE_VERSION must contain three numeric components')
}

android {
    defaultConfig {
        versionCode buildNumber.intValue()
        versionName releaseVersion
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('CM_KEYSTORE_PATH'))
            storePassword System.getenv('CM_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CM_KEY_ALIAS')
            keyPassword System.getenv('CM_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
