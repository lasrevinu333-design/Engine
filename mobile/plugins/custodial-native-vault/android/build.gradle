buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
}

apply plugin: 'com.android.library'

// Explicit disposable self-instrumenting release environment only. Default
// debug qualification and shipping library variants keep their normal setup.
def releaseInstrumentation = providers.gradleProperty('custodialProtectedRecoveryReleaseInstrumentation').getOrElse('false')
if (!(releaseInstrumentation in ['false', 'true'])) {
    throw new GradleException('custodialProtectedRecoveryReleaseInstrumentation must be true or false')
}

// Default-off install environment for this library's disposable release test
// APK only. No app/global compiler setting or authority interval is changed.
def installCompiler = providers.gradleProperty('custodialProtectedRecoveryInstallCompiler').getOrElse('default')
if (!(installCompiler in ['default', 'speed'])) {
    throw new GradleException('custodialProtectedRecoveryInstallCompiler must be default or speed')
}
if (installCompiler == 'speed' && releaseInstrumentation != 'true') {
    throw new GradleException('Disposable release instrumentation is required for the explicit install compiler')
}

android {
    namespace = "org.memphiszoo.custodial.vault"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    if (releaseInstrumentation == 'true') {
        testBuildType = 'release'
        buildFeatures.buildConfig = true
        sourceSets.androidTest.manifest.srcFile 'src/androidTestReleaseEnvironment/AndroidManifest.xml'
    }
    if (installCompiler == 'speed') {
        if (namespace != 'org.memphiszoo.custodial.vault') {
            throw new GradleException('Explicit install compiler requires the fixed disposable library namespace')
        }
        // Public AGP FULL_APK installation options. Actual managed installer
        // forwarding and ART filter readback remain required qualification.
        installation.installOptions.addAll(['--dexopt-compiler-filter', 'speed'])
    }
    testOptions {
        unitTests.returnDefaultValues = true
        managedDevices {
            devices {
                pixel2Api35(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 35
                    systemImageSource = "aosp"
                    setTestedAbi("x86_64")
                    if (getTestedAbi() != "x86_64") {
                        throw new GradleException("Managed-device DSL testedAbi did not bind to x86_64")
                    }
                }
            }
        }
    }
}

if (releaseInstrumentation == 'true') {
    androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant ->
        // Public AGP API. A library's test APK targets itself, so its own
        // debuggable flag controls ART; changing only the library is not enough.
        variant.androidTest.debuggable = false
        variant.androidTest.enableCodeCoverage = false
    }
    androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
        def test = variant.androidTest
        if (test == null || test.debuggable || test.signingConfig == null) {
            throw new GradleException('Nondebuggable self-instrumenting release variant unavailable')
        }
        // Normal disposable test signing only; never the production signer.
        test.signingConfig.setConfig(android.signingConfigs.getByName('debug'))
        test.buildConfigFields.put('CUSTODIAL_RELEASE_INSTRUMENTATION',
            new com.android.build.api.variant.BuildConfigField('boolean', 'true',
                'Fixed nondebuggable disposable self-instrumentation profile only'))
        if (installCompiler == 'speed') {
            test.buildConfigFields.put('CUSTODIAL_RELEASE_ART_SPEED',
                new com.android.build.api.variant.BuildConfigField('boolean', 'true',
                    'Read-only exact disposable package ART install verification before originals'))
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-firebase-messaging')
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Directly used by the shipping original-browser Source; Capacitor's
    // implementation dependency is not exported on this module's compile API.
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// Opt-in to the ONE protected-entry instrumentation selector. Reuse the
// normal Custodial web build's exact private bootstrap and declaration, not a
// synthetic script or a second browser harness. Keep the existing smoke page
// and Capacitor config by default. The optional full-app profile mounts the
// SAME existing normal distribution, never generated app/auth/manager values.
def protectedRecoveryRuntime = providers.gradleProperty('custodialProtectedRecoveryRuntime').getOrElse('false')
if (!(protectedRecoveryRuntime in ['false', 'true'])) {
    throw new GradleException('custodialProtectedRecoveryRuntime must be true or false')
}
def fullAppRuntime = providers.gradleProperty('custodialProtectedRecoveryFullAppRuntime').getOrElse('false')
if (!(fullAppRuntime in ['false', 'true'])) {
    throw new GradleException('custodialProtectedRecoveryFullAppRuntime must be true or false')
}
if (fullAppRuntime == 'true' && protectedRecoveryRuntime != 'true') {
    throw new GradleException('Full-app instrumentation requires custodialProtectedRecoveryRuntime=true')
}
if (releaseInstrumentation == 'true' && (protectedRecoveryRuntime != 'true' || fullAppRuntime != 'true')) {
    throw new GradleException('Release instrumentation requires the exact normal protected full-app assets')
}
// Default-off NORMAL vendor profile. Preparation is an explicit preceding
// normal Node source-stager invocation; Gradle never invents/stubs vendor R.
def notificationRuntime = providers.gradleProperty('custodialRecurringNotificationRuntime').getOrElse('false')
if (!(notificationRuntime in ['false', 'true'])) {
    throw new GradleException('custodialRecurringNotificationRuntime must be true or false')
}
if (notificationRuntime == 'true') {
    if (protectedRecoveryRuntime != 'true' || fullAppRuntime != 'true' || releaseInstrumentation != 'true') {
        throw new GradleException('Normal vendor qualification requires the existing disposable full-app release profile')
    }
    // This disposable SAME-vendor APK must have a real normal launch Intent:
    // the normal restore receiver uses PackageManager, not a fixture fallback.
    // Original debug/release test manifests stay selected when this is off.
    android.sourceSets.androidTest.manifest.srcFile 'src/androidTestNotificationRuntime/AndroidManifest.xml'
    def vendor = project(':capacitor-local-notifications')
    def staged = new File(projectDir, '../../../android/.custodial-local-notifications-java')
    def binding = new File(projectDir, 'src/vendor/local-notifications-8.2.1/SOURCE_BINDING.json')
    def verifyNormalVendor = tasks.register('verifyCustodialNotificationRuntimeVendorSources') {
        inputs.file(binding)
        inputs.dir(staged)
        doLast {
            if (!binding.isFile() || !staged.isDirectory() || java.nio.file.Files.isSymbolicLink(staged.toPath())) {
                throw new GradleException('Run the exact normal notification runtime source preparation before Gradle')
            }
            def spec = new groovy.json.JsonSlurper().parse(binding)
            if (spec.version != '8.2.1' || spec.native_receipt_authority != false || spec.java_files.size() != 12) {
                throw new GradleException('Exact normal notification Source binding required')
            }
            def expected = spec.java_files.keySet().sort()
            def actual = staged.listFiles().collect { it.name }.sort()
            if (actual != expected) throw new GradleException('Complete normal notification Source census differs')
            expected.each { name ->
                def file = new File(staged, name)
                if (!file.isFile() || java.nio.file.Files.isSymbolicLink(file.toPath())
                    || java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() != spec.java_files[name].patched_sha256) {
                    throw new GradleException('Normal notification Source bytes differ: ' + name)
                }
            }
        }
    }
    vendor.plugins.withId('com.android.library') {
        // Replace the complete original12 source root, never overlay/shadow it.
        vendor.android.sourceSets.main.java.setSrcDirs([staged])
        // Standalone ROOT is the actual vault library. Its main dependencies
        // contain no vendor; only this test APK depends on the vendor module.
        vendor.dependencies.add('implementation', project(':'))
        vendor.tasks.matching { it.name == 'compileReleaseJavaWithJavac' }.configureEach {
            dependsOn verifyNormalVendor
        }
    }
    dependencies { androidTestImplementation project(':capacitor-local-notifications') }
    androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
        if (variant.androidTest == null) throw new GradleException('Normal notification test APK unavailable')
        variant.androidTest.buildConfigFields.put('CUSTODIAL_NOTIFICATION_RUNTIME',
            new com.android.build.api.variant.BuildConfigField('boolean', 'true',
                'Exact disposable normal vendor module qualification only'))
    }
}
if (fullAppRuntime == 'true') {
    // Genuine installed classes in the test APK only; never shipping library
    // dependencies, fake JS implementations or replacement vault instances.
    dependencies {
        androidTestImplementation project(':capacitor-app')
        androidTestImplementation project(':capacitor-network')
    }
}
if (protectedRecoveryRuntime == 'true') {
    def distribution = new File(projectDir, '../../../mobile-dist')
    def generatedAssets = layout.buildDirectory.dir('generated/protectedRecoveryRuntime/assets')
    def testConfig = new File(projectDir, 'src/androidTest/assets/capacitor.config.json')
    def smokeDocument = new File(projectDir, 'src/androidTest/assets/public/index.html')
    def prepareAssets = tasks.register('prepareProtectedRecoveryRuntimeAssets') {
        inputs.property('custodialProtectedRecoveryFullAppRuntime', fullAppRuntime)
        if (fullAppRuntime == 'true') {
            inputs.files(project.fileTree(distribution))
            inputs.file(testConfig)
            inputs.file(smokeDocument)
        } else {
            inputs.files(new File(distribution, 'build.json'), new File(distribution, 'memphis-custodial-original-browser.js'))
        }
        outputs.dir generatedAssets
        doLast {
            def declaration = new File(distribution, 'build.json')
            def bootstrap = new File(distribution, 'memphis-custodial-original-browser.js')
            if (!declaration.isFile() || !bootstrap.isFile()) {
                throw new GradleException('Build the frozen Custodial web distribution before protected-entry instrumentation')
            }
            def build = new groovy.json.JsonSlurper().parse(declaration)
            def source = build.native_original_browser_bootstrap
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bootstrap.bytes).encodeHex().toString()
            if (build.edition != 'custodial' || !(build.source_commit ==~ /[0-9a-f]{40}/)
                || source?.schema != 'custodial.native-original-browser-bootstrap-asset.v1'
                || source?.asset != bootstrap.name || source?.sha256 != digest) {
                throw new GradleException('Protected-entry instrumentation requires the unchanged declared Custodial bootstrap bytes')
            }
            if (fullAppRuntime == 'true') {
                // Use the normal build's existing complete asset ledger, not
                // a second bundler or an arbitrary caller-selected directory.
                def manifestFile = new File(distribution, 'runtime-asset-manifest.json')
                if (!manifestFile.isFile() || !testConfig.isFile()) {
                    throw new GradleException('Full-app instrumentation requires the normal runtime ledger and original test config')
                }
                def manifestBytes = manifestFile.bytes
                def manifest = new groovy.json.JsonSlurper().parse(manifestBytes)
                def hashes = manifest.asset_hashes_sha256
                def identityFields = ['edition', 'release_id', 'source_commit', 'source_tree',
                    'source_commit_exact', 'build_id', 'custodial_native_vault_source_sha256']
                if (manifest.schema_version != 1 || !(hashes instanceof Map)
                    || manifest.asset_count != hashes.size() || hashes.isEmpty()
                    || build.source_commit_exact != true
                    || identityFields.any { build[it] == null || manifest[it] != build[it] }) {
                    throw new GradleException('Full-app runtime ledger must describe the SAME exact Custodial build')
                }
                def paths = hashes.keySet().toList()
                if (paths.any { !(it instanceof String) || !(it ==~ /[A-Za-z0-9_.\/-]+/)
                    || it.split('/', -1).any { part -> part.isEmpty() || part.startsWith('.') }
                    || it == 'capacitor.config.json' || it == 'runtime-asset-manifest.json' }
                    || !paths.containsAll(['app-shell.html', 'index.html', declaration.name, bootstrap.name,
                        'shell-vite-manifest.json', 'shell-edition-module-graph.json'])
                    || hashes.values().any { !(it instanceof String) || !(it ==~ /[0-9a-f]{64}/) }) {
                    throw new GradleException('Full-app runtime ledger has unavailable or unsupported asset paths/hashes')
                }
                def expectedPaths = (paths + ['runtime-asset-manifest.json']).toSet()
                def observedPaths = project.fileTree(distribution).files.collect {
                    distribution.toPath().toAbsolutePath().normalize().relativize(it.toPath().toAbsolutePath().normalize()).toString().replace('\\', '/')
                }.toSet()
                if (observedPaths != expectedPaths) {
                    throw new GradleException('Full-app distribution contains missing or unlisted files; never copy configuration/secrets')
                }
                def requireAssetBytes = { File root ->
                    paths.each { path ->
                        def asset = new File(root, path)
                        if (!asset.isFile() || asset.canonicalFile.toPath() != asset.toPath().toAbsolutePath().normalize()
                            || java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString() != hashes[path]) {
                            throw new GradleException('Full-app asset differs from the normal runtime ledger')
                        }
                    }
                    if (!java.util.Arrays.equals(new File(root, 'runtime-asset-manifest.json').bytes, manifestBytes)) {
                        throw new GradleException('Full-app runtime ledger changed during asset preparation')
                    }
                }
                def config = new groovy.json.JsonSlurper().parse(testConfig)
                if (!(config instanceof Map) || config.keySet() != ['appId', 'appName', 'webDir', 'server'].toSet()
                    || config.appId != 'org.memphiszoo.custodial.vault.runtime.test'
                    || config.appName != 'Custodial Vault Runtime Test' || config.webDir != 'public'
                    || !(config.server instanceof Map) || config.server.keySet() != ['androidScheme', 'hostname'].toSet()
                    || config.server.androidScheme != 'https' || config.server.hostname != 'localhost') {
                    throw new GradleException('Full-app instrumentation requires the unchanged isolated test identity/config')
                }
                requireAssetBytes(distribution)
                if (!smokeDocument.isFile() || smokeDocument.canonicalFile.toPath() != smokeDocument.toPath().toAbsolutePath().normalize()
                    || hashes.containsKey('bridge-smoke.html')) {
                    throw new GradleException('Full-app instrumentation requires the separate original smoke document without shadowing a shipping asset')
                }
                def smokeBytes = smokeDocument.bytes
                project.sync {
                    from(distribution) {
                        include expectedPaths
                        into 'public'
                    }
                    // Fixture-only alias: retain the REAL app index/start path
                    // and the unchanged shipping ledger. Never ship this page.
                    from(smokeDocument) {
                        rename { 'bridge-smoke.html' }
                        into 'public'
                    }
                    into generatedAssets
                }
                requireAssetBytes(new File(generatedAssets.get().asFile, 'public'))
                if (!java.util.Arrays.equals(new File(generatedAssets.get().asFile, 'public/bridge-smoke.html').bytes, smokeBytes)) {
                    throw new GradleException('Original smoke document changed during isolated runtime asset preparation')
                }
                config.server.appStartPath = '/app-shell.html'
                new File(generatedAssets.get().asFile, 'capacitor.config.json').setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n', 'UTF-8')
                // Standard Capacitor CLI pkg/classpath entries for these TWO
                // installed plugins. BridgeActivity's normal PluginManager
                // loads them before Bridge creation; the injected test vault
                // instance and all of its rejecting controls stay unchanged.
                def plugins = [
                    [pkg: '@capacitor/app', classpath: 'com.capacitorjs.plugins.app.AppPlugin'],
                    [pkg: '@capacitor/network', classpath: 'com.capacitorjs.plugins.network.NetworkPlugin']
                ]
                if (notificationRuntime == 'true') {
                    plugins.add([pkg: '@capacitor/local-notifications', classpath: 'com.capacitorjs.plugins.localnotifications.LocalNotificationsPlugin'])
                }
                new File(generatedAssets.get().asFile, 'capacitor.plugins.json').setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(plugins)) + '\n', 'UTF-8')
            } else {
                project.sync {
                    from(distribution) {
                        include 'build.json', 'memphis-custodial-original-browser.js'
                        into 'public'
                    }
                    into generatedAssets
                }
            }
        }
    }
    if (fullAppRuntime == 'true') {
        // Replace, do not overlay, the smoke public/index.html and config.
        android.sourceSets.androidTest.assets.setSrcDirs([generatedAssets])
    } else {
        android.sourceSets.androidTest.assets.srcDir generatedAssets
    }
    def protectedAssetMergeTask = releaseInstrumentation == 'true'
        ? 'mergeReleaseAndroidTestAssets' : 'mergeDebugAndroidTestAssets'
    tasks.matching { it.name == protectedAssetMergeTask }.configureEach {
        dependsOn prepareAssets
    }
    if (releaseInstrumentation == 'true') {
        gradle.projectsEvaluated {
            if (!tasks.names.contains(protectedAssetMergeTask)) {
                throw new GradleException('Release instrumentation asset task unavailable')
            }
        }
    }
}

// AGP 8.13.0 drops ManagedVirtualDevice.testedAbi while creating its setup task.
// Bind only the exact managed-device task input and fail closed if AGP changes shape.
tasks.matching { candidate -> candidate.name == 'pixel2Api35Setup' }.configureEach { setupTask ->
    def expectedTaskClass =
        'com.android.build.gradle.internal.tasks.ManagedDeviceInstrumentationTestSetupTask'
    if (!(setupTask.class.name in [expectedTaskClass, expectedTaskClass + '_Decorated'])) {
        throw new GradleException("Unexpected managed-device setup task class: ${setupTask.class.name}")
    }
    def testedAbiInput = setupTask.getTestedAbi()
    if (!(testedAbiInput instanceof org.gradle.api.provider.Property)) {
        throw new GradleException('Managed-device setup testedAbi is not a Gradle Property')
    }
    def priorTestedAbi = testedAbiInput.getOrNull()
    if (priorTestedAbi != null && priorTestedAbi != 'x86_64') {
        throw new GradleException("Managed-device setup testedAbi conflicts with x86_64: ${priorTestedAbi}")
    }
    testedAbiInput.set('x86_64')
    if (testedAbiInput.getOrNull() != 'x86_64') {
        throw new GradleException('Managed-device setup testedAbi did not bind to x86_64')
    }
    testedAbiInput.disallowChanges()
}


// These are local JVM tests, including the saved-original host fixtures.
// AGP 8.13 attaches Android's reduced java.base image to every JavaCompile;
// that incorrectly removes JDK-only test APIs such as java.lang.management
// and Files.readString. Select the actual JDK21 platform ONLY for these two
// UnitTest compilers. Shipping/instrumentation tasks retain the Android image,
// all source files remain selected, and dependency verification is unchanged.
gradle.projectsEvaluated {
    ['debug', 'release'].each { variant ->
        def capitalized = variant.capitalize()
        def unitCompiler = tasks.named('compile' + capitalized + 'UnitTestJavaWithJavac',
            org.gradle.api.tasks.compile.JavaCompile).get()
        if (unitCompiler.javaCompiler.get().metadata.languageVersion.asInt() != 21) {
            throw new GradleException('Custodial local JVM tests require the existing JDK21 toolchain')
        }
        if (unitCompiler.options.bootstrapClasspath != null
            && !unitCompiler.options.bootstrapClasspath.isEmpty()) {
            throw new GradleException('Unexpected UnitTest bootstrap classpath; do not replace a different platform')
        }
        def androidImageInputs = unitCompiler.options.compilerArgumentProviders.findAll {
            it.class.name == 'com.android.build.gradle.tasks.JdkImageInput'
        }
        if (androidImageInputs.size() != 1) {
            throw new GradleException('Expected exactly one AGP 8.13 UnitTest Android-image input')
        }
        unitCompiler.options.compilerArgumentProviders.removeAll(androidImageInputs)
        // The pinned host JSON implementation must precede android.jar's
        // smaller org.json API on this test-only compile classpath.
        def originalClasspath = unitCompiler.classpath
        def hostJson = configurations.named(variant + 'UnitTestCompileClasspath').map { configuration ->
            configuration.incoming.artifactView {
                componentFilter { component ->
                    component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                        && component.group == 'org.json' && component.module == 'json'
                        && component.version == '20250517'
                }
            }.files
        }
        unitCompiler.classpath = files(hostJson, originalClasspath)
    }
}

gradle.projectsEvaluated {
    def setupTaskNames = project.tasks.names.findAll { name -> name == 'pixel2Api35Setup' }
    if (setupTaskNames.size() != 1) {
        throw new GradleException(
            "Expected exactly one pixel2Api35Setup task, found ${setupTaskNames.size()}"
        )
    }
    def setupTask = project.tasks.named('pixel2Api35Setup').get()
    if (setupTask.getTestedAbi().getOrNull() != 'x86_64') {
        throw new GradleException('Managed-device setup task did not retain testedAbi x86_64')
    }
}
