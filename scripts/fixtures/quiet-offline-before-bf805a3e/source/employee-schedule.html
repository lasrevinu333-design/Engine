      try{selected=presentationFences.get(data);if(!selected||selected.principal!==identity(owned)||selected.date!==zooNow().date)throw cacheError();
        window.MemphisRecurringScheduleTarget.assertAvailability(localStorage,selected.principal,selected.date,selected.fence);
      }catch{if(!owned())return;clearPresentation();state('Schedule changed during readback. Updating…',true);return;}
      if(!owned())return;
      if(['RECURRING_SCHEDULE','RECURRING_TERMINAL'].includes(data?.schedule_delivery_mode)){
        const blocked=data.schedule_delivery_mode==='RECURRING_TERMINAL';
        // Typed view has no stale field. Only transport/cache state supplied by
        // this consumer determines its offline or unconfirmed presentation.
        data={service_date:data.service_date,employee_name:blocked?'Employee':data.employee_name,projection_status:data.projection_status,
          raw_items:data.raw_items,full_day:true,shift:data.shift,stale:false,schedule_status:data.shift===null&&data.raw_items.length===0?'off':'on'};
      }
      lastView={data,offline,cacheWarning};
      if(data?.projection_status==='blocked_recurring_authority'){
        clearTimeout(boundary);els.employee.textContent=String(data.employee_name||'Employee');els.date.textContent=date(data.service_date);
        els.content.hidden=true;els.areas.innerHTML='';els.lunch.hidden=true;els.lunchAreas.innerHTML='';
        els.notice.textContent='Your schedule needs a manager’s updated plan. Your saved cleaning work is preserved.';els.notice.hidden=false;
        state(offline?'No connection — the saved schedule is still blocked.':cacheWarning?'The blocked schedule could not be saved. Phone confirmation is still pending.':'Phone confirmation is pending.',offline||cacheWarning);
        try{commitDisplayedBinding(selected,source,{receipt:false,owns:owned});}catch{if(!owned())return;clearPresentation();state('Schedule changed during display. Updating…',true);}return;
      }
      const items=currentItems(data),regular=items.filter(item=>!isLunch(item)),lunch=items.filter(isLunch),sameDay=data?.service_date===zooNow().date;
      const rows=list=>list.map(item=>`<li class="area"><div class="areaName">${esc(name(item))}</div>${details(item)?`<div class="areaDetail">${esc(details(item))}</div>`:''}</li>`).join('');
      els.employee.textContent=String(data?.employee_name||data?.employee?.display_name||'Employee');els.date.textContent=date(data?.service_date);
      els.notice.textContent=!offline&&sameDay?String(data?.notice||''):'';els.notice.hidden=!els.notice.textContent;els.content.hidden=false;
      els.areas.innerHTML=regular.length?rows(regular):`<li class="area"><div class="areaName">${!sameDay?'Today’s schedule is unavailable.':offline&&!items.length?'No current areas can be confirmed from the saved schedule.':data?.schedule_status==='off'?'You are not scheduled today.':'No regular areas are active right now.'}</div></li>`;
      els.lunch.hidden=!lunch.length;els.lunchAreas.innerHTML=rows(lunch);
      state(offline?'No connection — showing only known active windows from your last update.':cacheWarning?'Schedule updated, but this phone could not save an offline copy.':data?.stale===true?'Showing the latest saved schedule.':'',offline);scheduleBoundary(data);
      try{const committed=commitDisplayedBinding(selected,source,{owns:owned});return committed===DISPLAY_SUPERSEDED?null:committed;
      }catch{if(!owned())return;clearPresentation();state('Schedule changed during display. Updating…',true);return;}
    }
    function scheduleBoundary(data){clearTimeout(boundary);const clock=zooNow(),times=data?.service_date===clock.date?publishedItems(data).flatMap(item=>[timeSeconds(item.coverage_start),timeSeconds(item.coverage_end)]).filter(value=>value!==null&&value>clock.seconds):[];times.push(86400);const delay=Math.max(1,(Math.min(...times)-clock.seconds)*1000-Date.now()%1000);
      const token=setTimeout(()=>{
        if(paused||boundary!==token)return;
        const generation=securityGeneration,version=loadVersion,owns=()=>!paused&&generation===securityGeneration&&version===loadVersion;
        try{const row=snapshot(owns);if(!owns())return;
          if(row?.data)render(row.data,{offline:true,cacheWarning:row.cache_unconfirmed===true,owns});else clearPresentation();
        }catch{if(!owns())return;clearPresentation();state('Saved schedule could not be verified.',true);}
        if(owns())void load('boundary');
      },delay);boundary=token;
    }
    function readStep(promise,signal){return new Promise((resolve,reject)=>{
      const abort=()=>{signal.removeEventListener('abort',abort);reject(new Error('Schedule read interrupted.'));};
      signal.addEventListener('abort',abort,{once:true});
      Promise.resolve(promise).then(value=>{signal.removeEventListener('abort',abort);if(signal.aborted)abort();else resolve(value);},error=>{signal.removeEventListener('abort',abort);reject(error);});

    });}
    async function load(reason='refresh'){
      if(paused)return;
      if(loading){queued=true;++loadVersion;activeRequest?.abort();return;}loading=true;const version=++loadVersion;if(reason==='launch')state('Loading…');
      const controller=new AbortController();activeRequest=controller;const timeout=setTimeout(()=>controller.abort(),15000);
      // Immutable caller authority is created before the first bridge callback.
      // Inner helpers may never adopt a later global version after reentry.

      const owns=()=>ownsLifecycle()&&!controller.signal.aborted;
      let readPrincipal='',observedAvailability=null,receivedAuthority=false;
      try{
        await readStep(window.MemphisMobile?.ready,controller.signal);requireCaller(owns);const id=deviceId(owns);requireCaller(owns);if(!id)throw new Error('identity');
        const isNative=native(owns);requireCaller(owns);
        if(isNative){const mobile=window.MemphisMobile,request=mobile.requestJson;requireCaller(owns);await readStep(request.call(mobile,`/device-auth/status?device_id=${encodeURIComponent(id)}`,{signal:controller.signal}),controller.signal);}
        requireCaller(owns);const principal=identity(owns);if(!principal||!current(principal,version))throw new Error('identity');requireCaller(owns);
        readPrincipal=principal;observedAvailability=await beginRead(principal,version,owns);requireCaller(owns);
        const response=await readStep(fetch(`${API}/my-day-summary?device_id=${encodeURIComponent(id)}`,{cache:'no-store',signal:controller.signal}),controller.signal);
        // An HTTP response, including503 or malformed JSON, must not restore
        // old availability when its separate unavailable write failed.
        receivedAuthority=true;
        const payload=await readStep(response.json().catch(()=>null),controller.signal);
        if(!current(principal,version))return;
        if(!response.ok||!payload?.ok)throw new Error('network');
        if(!matches(payload.data,owns))throw new Error('identity');
        requireCaller(owns);
        if(payload.data.service_date!==zooNow().date)throw new Error('schedule_target_date');
        if(window.MemphisRecurringScheduleTarget.deliveryMode(payload.data)==='UNAVAILABLE'){
          clearPresentation();state('Schedule is unavailable. A current plan must be confirmed.',true);
          const persist=()=>{requireCaller(owns);if(!current(principal,version))throw cacheError();requireCaller(owns);window.MemphisRecurringScheduleTarget.writeAvailability(localStorage,principal,payload.data.service_date,'UNAVAILABLE',observedAvailability);};
          try{await atomic(principal,persist,owns);}catch(error){requireCaller(owns);if(error?.code!=='schedule_request_invalidated')latchUnavailable(principal,observedAvailability);throw error;}requireCaller(owns);unavailableDays.delete(principal);return;
        }
        const prepared=await prepareRecurring(payload.data,owns);
        if(!current(principal,version)||!owns())return;
        // Render the hashed view itself, never an unbound duplicated area list.
        const displayData=prepared?{...payload.data,...(prepared.blocked?{projection_status:'blocked_recurring_authority',raw_items:[],current_items:[],full_day:true,shift:null}:prepared.view)}:payload.data;
        let cacheWarning=false;try{await save(displayData,principal,prepared,version,observedAvailability,owns);}catch(error){if(error?.code?.startsWith('schedule_'))throw error;cacheWarning=true;}
        if(!owns()||!current(principal,version)||!matches(displayData,owns)||!owns())return;
        const winner=snapshot(owns),rendered=winner?.data??displayData;requireCaller(owns);
        unavailableDays.delete(principal);
        cacheWarning=cacheWarning||winner?.cache_unconfirmed===true;
        const applied=render(rendered,{cacheWarning,owns});
        // Typed recurring ACK is deliberately not sent yet: exact native and
        // browser notification cancellation/rerouting must join application.
        // Rendering/cache alone cannot report the complete phone as updated.

      }catch(error){
        const ownsRecovery=ownsLifecycle;
        if(!ownsRecovery())return;
        if(!receivedAuthority&&readPrincipal)await cancelRead(readPrincipal,observedAvailability,ownsRecovery).catch(()=>{});
        if(!ownsRecovery())return;
        let cached=null;try{cached=snapshot(ownsRecovery);}catch{ /* Unknown disk state is not empty authority. */ }
        if(!ownsRecovery())return;
        const usable=available(ownsRecovery)&&ownsRecovery()&&!authorityUnavailable(ownsRecovery);if(!ownsRecovery())return;
        if(usable&&cached?.data)render(cached.data,{offline:true,cacheWarning:cached.cache_unconfirmed===true,owns:ownsRecovery});
        else{clearPresentation();state(error?.message==='identity'?'This phone needs a manager.':'Schedule could not update.',true);}
      }finally{clearTimeout(timeout);if(activeRequest===controller)activeRequest=null;loading=false;if(queued){queued=false;void load('queued');}}
    }
    els.retry.addEventListener('click',()=>void load('retry'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)void load('foreground');});window.addEventListener('online',()=>void load('online'));window.addEventListener('memphis:native-notification-received',()=>void load('notification'));window.addEventListener('memphis:schedule-refresh',()=>void load('change'));
    window.addEventListener('memphis:custodial-security-state',(event)=>{
      const generation=++securityGeneration;securityBlocked=true;clearPresentation();const version=++loadVersion;
      const owns=()=>!paused&&generation===securityGeneration&&version===loadVersion;
      queued=false;activeRequest?.abort();if(!owns())return;
      let captured;try{if(healthyStatus(event.detail)&&owns())captured=captureSecurity({recover:true,owns});}catch{if(owns())quarantine();}
      if(!owns())return;
      if(!captured){state('Phone identity must be verified.',true);return;}
      securityBlocked=false;shownPrincipal=captured.principal;state('Loading…');void load('security');
    });
    window.addEventListener('storage',event=>{
      if(event.key!==null&&!(typeof event.key==='string'&&event.key.startsWith(PREFIX)))return;
      if(event.key!==null&&shownPrincipal&&event.key!==key(shownPrincipal)&&event.key!==window.MemphisRecurringScheduleTarget.availabilityKey(shownPrincipal))return;
      const generation=++securityGeneration,version=loadVersion,owns=()=>!paused&&generation===securityGeneration&&version===loadVersion;
      const principal=identity(owns);if(!owns())return;
      if(!principal){clearPresentation();state('Phone identity must be verified.',true);return;}
      if(event.key!==null&&event.key!==key(principal)&&event.key!==window.MemphisRecurringScheduleTarget.availabilityKey(principal))return;
      try{const row=snapshot(owns);if(!owns())return;if(row?.data)render(row.data,{offline:true,cacheWarning:row.cache_unconfirmed===true,owns});else clearPresentation();}catch{if(!owns())return;clearPresentation();state('Saved schedule could not be verified.',true);}
      if(owns()&&!securityBlocked)void load('storage');
    });

      clearInterval(timer);timer=0;clearTimeout(boundary);boundary=0;clearPresentation();retiring?.abort();});
    window.addEventListener('pageshow',()=>{if(!paused)return;paused=false;timer=setInterval(()=>void load('poll'),REFRESH_MS);void load('return');});
    timer=setInterval(()=>void load('poll'),REFRESH_MS);void load('launch');
  })();
