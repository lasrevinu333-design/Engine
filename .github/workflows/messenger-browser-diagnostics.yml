name: ChatScope Browser Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatscope-browser-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run production ChatScope acceptance with complete diagnostics
        id: messenger
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run --silent test:messaging:browser 2>&1 | tee /tmp/chatscope-browser-diagnostics.log
      - name: Upload ChatScope diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatscope-browser-diagnostics
          path: |
            /tmp/chatscope-browser-diagnostics.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce Messenger result
        if: always()
        shell: bash
        run: test "${{ steps.messenger.outcome }}" = "success"
