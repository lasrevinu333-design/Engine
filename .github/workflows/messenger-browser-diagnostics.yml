name: ChatScope Browser Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatscope-browser-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run production ChatScope acceptance with complete diagnostics
        id: messenger
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run --silent test:messaging:browser 2>&1 | tee /tmp/chatscope-browser-diagnostics.log
      - name: Upload ChatScope diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatscope-browser-diagnostics
          path: |
            /tmp/chatscope-browser-diagnostics.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce Messenger result
        if: always()
        shell: bash
        run: test "${{ steps.messenger.outcome }}" = "success"
