name: Mobile Editions Build

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'messages-chatscope.html'
      - '.github/workflows/mobile-editions-build.yml'
      - 'codemagic.yaml'
  workflow_dispatch:

jobs:
  web-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build manager edition and ChatScope
        id: manager_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:manager 2>&1 | tee /tmp/memphis-mobile-manager-build.log
      - name: Upload manager build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memphis-zoo-ops-build-log
          path: /tmp/memphis-mobile-manager-build.log
          if-no-files-found: error
      - name: Enforce manager build
        if: always()
        shell: bash
        run: test "${{ steps.manager_build.outcome }}" = "success"
      - uses: actions/upload-artifact@v4
        with:
          name: memphis-zoo-ops-web
          path: mobile/mobile-dist
      - run: npm run build:viewer
      - uses: actions/upload-artifact@v4
        with:
          name: memphis-zoo-viewer-web
          path: mobile/mobile-dist
