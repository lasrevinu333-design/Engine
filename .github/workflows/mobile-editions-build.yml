name: Mobile Editions Build

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'messages.html'
      - 'messages-chatscope.html'
      - 'messenger-runtime-patch.js'
      - 'chatscope-messenger.css'
      - 'chatscope-mobile-overrides.css'
      - '.github/workflows/mobile-editions-build.yml'
      - 'codemagic.yaml'
  workflow_dispatch:

jobs:
  web-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: manager
            artifact: memphis-zoo-ops-web
          - edition: custodial
            artifact: memphis-zoo-custodial-web
          - edition: viewer
            artifact: memphis-zoo-viewer-web
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build ${{ matrix.edition }} edition
        run: npm run build:${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mobile/mobile-dist
          if-no-files-found: error
          retention-days: 90
