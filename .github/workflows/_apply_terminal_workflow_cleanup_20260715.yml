name: Apply terminal workflow cleanup

on:
  push:
    branches:
      - fix/terminal-workflow-cleanup-20260715
    paths:
      - .github/workflows/_apply_terminal_workflow_cleanup_20260715.yml

permissions:
  contents: write

concurrency:
  group: terminal-workflow-cleanup-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply explicit source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_release = 'release-2026.07.14.scheduler-alerts-gps.3'
          new_release = 'release-2026.07.15.scheduler-alerts-gps.4'
          release_files = [
              'admin.html', 'dashboard.html', 'employee-hub.html', 'employee-schedule.html',
              'events-admin.html', 'events.html', 'gemini-admin.html', 'guest-issues.html',
              'guest-qr.html', 'guest-report.html', 'index.html', 'memphis-device-reminders.js',
              'memphis-scan-sync.js', 'messages.html', 'schedule-employee-day.html',
              'schedule-simple.html', 'schedule.html', 'scripts/device-reminder-contract-tests.mjs',
              'start_page1.html', 'system-feedback.html', 'thread.html',
          ]
          for relative in release_files:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              if old_release not in text:
                  raise SystemExit(f'Missing expected release marker in {relative}')
              path.write_text(text.replace(old_release, new_release), encoding='utf-8')

          sync_path = root / 'memphis-scan-sync.js'
          sync = sync_path.read_text(encoding='utf-8')
          sync_needle = """    if ((item.type === 'complete_session' || item.type === 'commit_workflow') && result?.status === 'closed') {
              const clientId = safeText(payload.p_client_session_id || payload.p_session_uuid);
              const local = readSession(clientId) || latestSessionFor({ locationCode: payload.p_location_code, deviceId: payload.p_device_id });
              if (local?.session_uuid) removeSession(local.session_uuid);
              removeSession(clientId);
              removeSession(result.session_uuid);
            }

            return result;
          """
          sync_replacement = """    if ((item.type === 'complete_session' || item.type === 'commit_workflow') && result?.status === 'closed') {
              const clientId = safeText(payload.p_client_session_id || payload.p_session_uuid);
              const local = readSession(clientId) || latestSessionFor({ locationCode: payload.p_location_code, deviceId: payload.p_device_id });
              if (local?.session_uuid) removeSession(local.session_uuid);
              removeSession(clientId);
              removeSession(result.session_uuid);
            }

            if (result?.discard_local_workflow === true || result?.terminal === true || safeText(result?.status).toLowerCase() === 'cancelled') {
              const local = latestSessionFor({
                locationCode: payload.p_location_code,
                deviceId: payload.p_device_id || payload.p_device_identifier,
              });
              const identifiers = new Set([
                payload.p_client_session_id,
                payload.p_session_uuid,
                result.client_session_id,
                result.session_uuid,
                local?.client_session_id,
                local?.session_uuid,
              ].map(safeText).filter(Boolean));
              for (const identifier of identifiers) removeSession(identifier);
            }

            return result;
          """
          if sync_needle not in sync:
              raise SystemExit('Shared synchronization cleanup insertion point was not found')
          sync_path.write_text(sync.replace(sync_needle, sync_replacement, 1), encoding='utf-8')

          scan_path = root / 'index.html'
          scan = scan_path.read_text(encoding='utf-8')
          bootstrap_needle = '    async function bootstrap(){renderLoadingCard("Loading Device","Checking kiosk identity and scan state...");'
          bootstrap_helper = '''    async function reconcileOpenLocalSessions(deviceId){const sessions=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{const row=JSON.parse(localStorage.getItem(key));if(row&&row.device_id===deviceId&&(row.status==="active"||row.status==="pending_submit"))sessions.push(row)}catch{}}}catch{}for(const row of sessions){const locationCode=String(row.location_code||row.location_name||"").trim();if(!locationCode)continue;try{const serverState=await rpcOne("tool_get_location_scan_state",{p_location_code:locationCode,p_device_id:deviceId});const serverStatus=String(serverState&&serverState.latest_session_status||"").toLowerCase();if(serverStatus!=="active"&&serverStatus!=="pending_submit"){if(row.session_uuid)await removeLocalSession(row.session_uuid);if(row.client_session_id&&row.client_session_id!==row.session_uuid)await removeLocalSession(row.client_session_id)}}catch{}}}\n''' + bootstrap_needle
          if bootstrap_needle not in scan:
              raise SystemExit('Scan bootstrap insertion point was not found')
          scan = scan.replace(bootstrap_needle, bootstrap_helper, 1)

          local_check = 'const stateKind=resolveLocationKind(state.form_type,state.location_type);const openLocalForDevice=findAnyOpenLocalSessionForDevice(deviceId);'
          local_replacement = 'const stateKind=resolveLocationKind(state.form_type,state.location_type);await reconcileOpenLocalSessions(deviceId);const openLocalForDevice=findAnyOpenLocalSessionForDevice(deviceId);'
          if local_check not in scan:
              raise SystemExit('Local-session reconciliation call point was not found')
          scan = scan.replace(local_check, local_replacement, 1)

          direct_complete = 'try{const result=await rpcOne("tool_commit_cleaning_workflow",payload);if(result&&result.status==="closed"){'
          direct_complete_replacement = 'try{const result=await rpcOne("tool_commit_cleaning_workflow",payload);if(result&&(result.discard_local_workflow===true||result.terminal===true||result.status==="cancelled")){await removeLocalSession(sessionUuid);if(clientSessionId!==sessionUuid)await removeLocalSession(clientSessionId);if(result.session_uuid&&result.session_uuid!==sessionUuid)await removeLocalSession(result.session_uuid);return{...result,server_acknowledged:true,sync_status:"cancelled"}}if(result&&result.status==="closed"){'
          if direct_complete not in scan:
              raise SystemExit('Direct completion reconciliation point was not found')
          scan = scan.replace(direct_complete, direct_complete_replacement, 1)

          queued_complete = 'if(item.type==="commit_workflow"&&result&&result.status==="closed"){const clientId=item.payload&&item.payload.p_client_session_id;const current=getLocalSessionById(clientId)||await getLatestLocalSessionForLocation(item.payload&&item.payload.p_location_code,item.payload&&item.payload.p_device_id);if(current&&current.session_uuid)await removeLocalSession(current.session_uuid);if(clientId)await removeLocalSession(clientId);if(result.session_uuid)await removeLocalSession(result.session_uuid)}return result}'
          queued_replacement = 'if(item.type==="commit_workflow"&&result&&result.status==="closed"){const clientId=item.payload&&item.payload.p_client_session_id;const current=getLocalSessionById(clientId)||await getLatestLocalSessionForLocation(item.payload&&item.payload.p_location_code,item.payload&&item.payload.p_device_id);if(current&&current.session_uuid)await removeLocalSession(current.session_uuid);if(clientId)await removeLocalSession(clientId);if(result.session_uuid)await removeLocalSession(result.session_uuid)}if(result&&(result.discard_local_workflow===true||result.terminal===true||result.status==="cancelled")){const clientId=item.payload&&(item.payload.p_client_session_id||item.payload.p_session_uuid);const current=getLocalSessionById(clientId)||await getLatestLocalSessionForLocation(item.payload&&item.payload.p_location_code,item.payload&&(item.payload.p_device_id||item.payload.p_device_identifier));if(current&&current.session_uuid)await removeLocalSession(current.session_uuid);if(current&&current.client_session_id)await removeLocalSession(current.client_session_id);if(clientId)await removeLocalSession(clientId);if(result.client_session_id)await removeLocalSession(result.client_session_id);if(result.session_uuid)await removeLocalSession(result.session_uuid)}return result}'
          if queued_complete not in scan:
              raise SystemExit('Queued completion reconciliation point was not found')
          scan = scan.replace(queued_complete, queued_replacement, 1)

          completion_ui = 'if(completed&&completed.status==="closed"&&completed.server_acknowledged!==false){await recordScanEventMaybeQueued(context.locationCode||"",context.deviceId||"","scan_resume_pending","ok","Completion confirmed by server",completed||{});currentSessionUuid="";updateDebugPanel();window.location.replace(buildEmployeeHubUrl(context.deviceId||currentDeviceId||""));return}currentSessionUuid=context.sessionUuid||currentSessionUuid;'
          completion_ui_replacement = 'if(completed&&completed.status==="closed"&&completed.server_acknowledged!==false){await recordScanEventMaybeQueued(context.locationCode||"",context.deviceId||"","scan_resume_pending","ok","Completion confirmed by server",completed||{});currentSessionUuid="";updateDebugPanel();window.location.replace(buildEmployeeHubUrl(context.deviceId||currentDeviceId||""));return}if(completed&&(completed.discard_local_workflow===true||completed.terminal===true||completed.status==="cancelled")){currentSessionUuid="";updateDebugPanel();renderMessageCard("title-amber","Session Cancelled",locationName||context.locationCode||"","This older phone-saved workflow was cancelled by the server and has been removed from this device. No cleaning completion was claimed. Returning to Employee Hub...");setTimeout(()=>window.location.replace(buildEmployeeHubUrl(context.deviceId||currentDeviceId||"")),3500);return}currentSessionUuid=context.sessionUuid||currentSessionUuid;'
          if completion_ui not in scan:
              raise SystemExit('Completion UI reconciliation point was not found')
          scan_path.write_text(scan.replace(completion_ui, completion_ui_replacement, 1), encoding='utf-8')

          test_path = root / 'scripts/scheduler-alerts-gps-foundation-tests.mjs'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(r'/release-2026\.07\.14\.scheduler-alerts-gps\.3/', r'/release-2026\.07\.15\.scheduler-alerts-gps\.4/')
          test_needle = """assert.doesNotMatch(sharedSync, /retry_count\s*>?=\s*3/);

          assert.match(read('schedule.html'), /REQUIRED_CONTRACT:"schedule\.v2"/);
          """
          test_replacement = """assert.doesNotMatch(sharedSync, /retry_count\s*>?=\s*3/);
          assert.match(sharedSync, /discard_local_workflow/, 'Shared sync worker must remove terminal cancelled workflows from device storage');
          assert.match(sharedSync, /safeText\(result\?\.status\)\.toLowerCase\(\) === 'cancelled'/);
          assert.match(scan, /reconcileOpenLocalSessions/, 'Scan page must reconcile phone-saved sessions with server authority before blocking a new scan');
          assert.match(scan, /session_cancelled_without_authoritative_completion|discard_local_workflow/);
          assert.match(scan, /Session Cancelled/);

          assert.match(read('schedule.html'), /REQUIRED_CONTRACT:"schedule\.v2"/);
          """
          if test_needle not in test:
              raise SystemExit('Foundation test insertion point was not found')
          test_path.write_text(test.replace(test_needle, test_replacement, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Run complete frontend gate
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.mjs; do
            node "$test_file"
          done
          for file in ./*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          failures=[]
          for html_path in sorted(Path('.').glob('*.html')):
              text=html_path.read_text(encoding='utf-8',errors='replace')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,flags=re.I)
              for index,script in enumerate(scripts,start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as handle:
                      handle.write(script)
                      temp_path=handle.name
                  result=subprocess.run(['node','--check',temp_path],capture_output=True,text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html_path}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('INLINE_HTML_SYNTAX_PASS')
          PY

      - name: Publish only tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_apply_terminal_workflow_cleanup_20260715.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile terminal cancelled workflows on kiosk devices'
          git push origin "HEAD:${GITHUB_REF_NAME}"
