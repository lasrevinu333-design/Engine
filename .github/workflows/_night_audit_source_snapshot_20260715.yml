name: Night integration audit frontend source snapshot

on:
  push:
    branches:
      - internal/night-audit-source-20260715-v2

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export current frontend source
        run: |
          git archive --format=tar.gz --output=/tmp/frontend-night-audit-current.tar.gz HEAD
          sha256sum /tmp/frontend-night-audit-current.tar.gz > /tmp/frontend-night-audit-current.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-night-audit-current
          path: |
            /tmp/frontend-night-audit-current.tar.gz
            /tmp/frontend-night-audit-current.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
