name: Device credentials frontend source snapshot

on:
  push:
    branches:
      - foundation/device-credentials-20260715

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build source archive
        run: |
          git archive --format=tar.gz --output=/tmp/engine-device-credentials-source.tar.gz HEAD \
            ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' ':!*.gif' ':!*.mp4' ':!*.pdf' ':!*.zip'
          sha256sum /tmp/engine-device-credentials-source.tar.gz > /tmp/engine-device-credentials-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: engine-device-credentials-source
          path: |
            /tmp/engine-device-credentials-source.tar.gz
            /tmp/engine-device-credentials-source.tar.gz.sha256
          retention-days: 1
