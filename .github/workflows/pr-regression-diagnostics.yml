name: Frontend Regression Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run every frontend contract with complete diagnostics
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/frontend-regression-diagnostics.log
          failures=0
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ===" | tee -a /tmp/frontend-regression-diagnostics.log
            node "$test_file" 2>&1 | tee -a /tmp/frontend-regression-diagnostics.log
            status=${PIPESTATUS[0]}
            echo "exit=$status" | tee -a /tmp/frontend-regression-diagnostics.log
            echo | tee -a /tmp/frontend-regression-diagnostics.log
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "TOTAL_FAILURES=$failures" | tee -a /tmp/frontend-regression-diagnostics.log
          test "$failures" -eq 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-regression-diagnostics
          path: /tmp/frontend-regression-diagnostics.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce regression result
        if: always()
        shell: bash
        run: test "${{ steps.regression.outcome }}" = "success"
