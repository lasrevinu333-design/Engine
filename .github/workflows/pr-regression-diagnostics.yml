name: Frontend Regression Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium
      - name: Run every frontend contract with complete diagnostics
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/frontend-regression-diagnostics.log
          failures=0
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ===" | tee -a /tmp/frontend-regression-diagnostics.log
            node "$test_file" 2>&1 | tee -a /tmp/frontend-regression-diagnostics.log
            status=${PIPESTATUS[0]}
            echo "exit=$status" | tee -a /tmp/frontend-regression-diagnostics.log
            echo | tee -a /tmp/frontend-regression-diagnostics.log
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "TOTAL_FAILURES=$failures" | tee -a /tmp/frontend-regression-diagnostics.log
          test "$failures" -eq 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-regression-diagnostics
          path: /tmp/frontend-regression-diagnostics.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce regression result
        if: always()
        shell: bash
        run: test "${{ steps.regression.outcome }}" = "success"
