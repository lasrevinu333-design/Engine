name: Frontend Regression Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild-source:
    name: Source and dependency checks without app compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify source contracts without building an app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-toolchain-contract-tests.mjs
          node scripts/batch-0a-baseline-contract-tests.mjs
          node mobile/scripts/custodial-generated-app-test-contracts.mjs
          node scripts/refresh-frontend-release-manifest.mjs --check

  diagnostics:
    needs: prebuild-source
    environment: custodial-prebuild-final-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium
      - name: Install locked backend contract context dependencies
        run: npm ci --prefix test-fixtures/ci/current-backend --ignore-scripts --no-audit --no-fund
      - name: Build Batch 0B browser fixtures
        run: npm run --silent build:batch-0b:browser-fixtures
      - name: Run declared frontend contract invocations
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-evidence
          node scripts/frontend-contract-inventory.mjs --plan > quality-evidence/source-contracts.json
          node scripts/frontend-contract-inventory.mjs --diagnostics 2>&1 | tee /tmp/frontend-regression-diagnostics.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-regression-diagnostics
          path: /tmp/frontend-regression-diagnostics.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce regression result
        if: always()
        shell: bash
        run: test "${{ steps.regression.outcome }}" = "success"
