name: Custodial v4.3 Phase-2 Source Disposition Correction

on:
  push:
    branches:
      - agent/custodial-v43-phase1-acceptance-phase2-architecture-20260807

permissions:
  contents: write

concurrency:
  group: custodial-v43-phase2-source-disposition-correction
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[phase2-source-dispositions-signed]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Phase-2 correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/custodial-v43-phase1-acceptance-phase2-architecture-20260807

      - name: Apply one fail-closed architecture disposition to every source surface
        shell: bash
        env:
          DISPOSITION_INPUT_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          ROOT=Path('docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture')
          registry=json.loads((ROOT/'phase2-command-record-state-machine-registry.json').read_text())
          commands=registry['commands']
          command_ids={row['id'] for row in commands}
          old_rows=[json.loads(line) for line in (ROOT/'phase2-source-authority-disposition-ledger.jsonl').read_text().splitlines() if line]
          index=json.loads((ROOT/'phase2-source-authority-inventory-index.json').read_text())

          prefixes={
              'MESSENGER':['CMD-MSGTHREAD-','CMD-MESSAGE-'],
              'EVENT':['CMD-EVENT-','CMD-EVENTIMPACT-'],
              'NOTIFICATION':['CMD-NOTIF-'],
              'SCHEDULE_OWNERSHIP':['CMD-SOURCE-','CMD-OWNERSHIP-'],
              'FIELD_WORK_OCCURRENCE':['CMD-OCCURRENCE-','CMD-FIELDSESSION-','CMD-OFFLINE-','CMD-COMPLETION-','CMD-ISSUE-','CMD-TICKET-','CMD-WORKREQUEST-','CMD-READINESS-','CMD-INSPECTION-'],
              'DEVICE_NFC_GPS':['CMD-DEVICE-','CMD-NFCRECOVERY-','CMD-GPS-','CMD-FIELDSESSION-'],
              'AUTHORITY_SECURITY':['CMD-AUTHSET-','CMD-PRINCIPAL-','CMD-CREDENTIAL-','CMD-MGRSESSION-','CMD-GRANT-','CMD-TOOL-'],
              'RETENTION_RESTORE':['CMD-HOLD-','CMD-PURGE-','CMD-BACKUP-','CMD-RESTORE-'],
              'RELEASE_PHYSICAL':['CMD-RELEASE-','CMD-CANARY-','CMD-DEVICE-','CMD-TOOL-'],
              'FEEDBACK_GUEST':['CMD-FEEDBACK-','CMD-GUEST-'],
              'CONTRACTOR':['CMD-CONTRACTOR-'],
              'READINESS_ANALYTICS':['CMD-READINESS-','CMD-INSPECTION-','CMD-ANALYTICS-'],
              'CROSS_DOMAIN_OR_UNCLASSIFIED':['CMD-AUTHSET-','CMD-TOOL-'],
          }
          domain_commands={domain:sorted(cid for cid in command_ids if any(cid.startswith(prefix) for prefix in prefs)) for domain,prefs in prefixes.items()}
          assert all(domain_commands.values())

          evidence_path=re.compile(r'(^|/)(tests?|test|quality|docs?)(/|$)|test[s]?\.(?:js|mjs|ts|tsx|jsx)$|contract-tests|regression-tests|source-tests',re.I)
          presentation_categories={'PRODUCT_PAGE','NAVIGATION_TARGET','READ_OR_PRESENTATION_CANDIDATE'}
          read_categories={'FETCH_CALL','API_WRAPPER_CALL'}
          mutation_classes={'MUTATION_CAPABLE','MUTATION_OR_AUTHORITY_CAPABLE','REQUIRES_CALL_GRAPH_CLASSIFICATION'}

          rules=[
              {
                  'id':'RULE-EVIDENCE-ONLY',
                  'meaning':'Tests, audits, documentation, fixtures and validation scripts are retained only as non-authoritative evidence; references to writers do not make the evidence file a writer.'
              },
              {
                  'id':'RULE-RETIRE-COMPATIBILITY',
                  'meaning':'Every legacy, fallback, scanner/QR, bridge, repair, temporary or compatibility authority surface is retired as target authority; any legitimate behavior must be reintroduced behind the v4.3 command registry.'
              },
              {
                  'id':'RULE-RETAIN-NONAUTHORITATIVE-READ-PRESENTATION',
                  'meaning':'Read and presentation surfaces may be retained only as consumers of registered projections; they receive no write, migration, ownership, occurrence, release or device-security authority.'
              },
              {
                  'id':'RULE-RETIRE-CURRENT-MUTATION-REBUILD-FUNCTION',
                  'meaning':'Every current mutation or authority-capable source surface is retired as authority and the legitimate business capability is rebuilt behind registered commands, principals, grants, records and authority-set admission.'
              },
              {
                  'id':'RULE-RETIRE-UNREGISTERED-UNKNOWN',
                  'meaning':'Any remaining unclassified or call-graph-ambiguous source surface is fail-closed retired until a later architecture correction registers an exact command and proof; no component designer may infer authority.'
              },
          ]
          (ROOT/'phase2-source-authority-disposition-rules.json').write_text(json.dumps({
              'protocol':'CUSTODIAL_V43_PHASE2_SOURCE_AUTHORITY_DISPOSITION_RULES_V2',
              'status':'CONTROLLING_FAIL_CLOSED_ARCHITECTURE_DISPOSITION_RULES',
              'input_head':os.environ['DISPOSITION_INPUT_HEAD'],
              'rules':rules,
              'doctrine':[
                  'current implementation is evidence, not target authority',
                  'valid algorithms may be reused only after component review and exact command binding',
                  'no current source surface is automatically admitted',
                  'signed architecture retirement does not falsely claim migration or production decommission execution',
              ],
          },indent=2,sort_keys=True)+'\n')

          def canonical_sha(row):
              return hashlib.sha256(json.dumps(row,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          new_rows=[]
          disposition_counts=Counter()
          domain_counts=Counter()
          live_gate_counts=Counter()
          rule_counts=Counter()
          for source in old_rows:
              text=' '.join([str(source.get('path','')),str(source.get('symbol','')),str(source.get('category','')),str(source.get('source_target_disposition',''))]).lower()
              domain=source['domain']
              replacement=domain_commands[domain]
              compatibility=('COMPATIBILITY' in str(source.get('source_target_disposition','')).upper() or 'RETIRE' in str(source.get('source_target_disposition','')).upper() or bool(re.search(r'legacy|compat|fallback|scanner|qr|deprecated|temporary|repair|bridge',text,re.I)))
              evidence=bool(evidence_path.search(source['path']))
              mutation=source['mutation_class'] in mutation_classes
              read_or_presentation=(source['category'] in presentation_categories or source['mutation_class'] in {'READ_ONLY_CANDIDATE','READ_OR_PRESENTATION_CANDIDATE'} or source['category'] in read_categories)

              if evidence:
                  rule='RULE-EVIDENCE-ONLY'
                  disposition='RETAIN_VERIFICATION_EVIDENCE_ONLY'
                  replacements=[]
                  live='NOT_APPLICABLE_NONAUTHORITATIVE'
                  gate='ARCHITECTURE_EVIDENCE_INVALIDATION'
                  rationale='File is retained solely to verify or describe behavior; it is never an admitted runtime writer, resolver, principal, migration tool or release authority.'
              elif compatibility:
                  rule='RULE-RETIRE-COMPATIBILITY'
                  disposition='RETIRE_LEGACY_COMPATIBILITY_AUTHORITY'
                  replacements=replacement
                  live='REQUIRED_AT_MIGRATION_RETIREMENT_GATE'
                  gate='MIGRATION_RETIREMENT'
                  rationale='Compatibility or legacy surface is not target authority. Any legitimate behavior is reconstructed through the registered domain command set; stale callers must fail closed.'
              elif mutation and domain!='CROSS_DOMAIN_OR_UNCLASSIFIED':
                  rule='RULE-RETIRE-CURRENT-MUTATION-REBUILD-FUNCTION'
                  disposition='RETIRE_CURRENT_AUTHORITY_REBUILD_CAPABILITY_BEHIND_REGISTERED_COMMANDS'
                  replacements=replacement
                  live='REQUIRED_AT_COMPONENT_MIGRATION_AND_RELEASE_GATES'
                  gate='COMPONENT_DESIGN_THEN_MIGRATION_RETIREMENT'
                  rationale='Current mutation/authority surface is not carried forward. Business behavior may be reimplemented only through the listed registered command family with named principal, grant, record, transaction and proof.'
              elif read_or_presentation and not mutation:
                  rule='RULE-RETAIN-NONAUTHORITATIVE-READ-PRESENTATION'
                  disposition='RETAIN_NONAUTHORITATIVE_READ_OR_PRESENTATION_CONSUMER'
                  replacements=[]
                  live='NOT_APPLICABLE_NONAUTHORITATIVE'
                  gate='COMPONENT_PROJECTION_CONTRACT'
                  rationale='Surface may remain only as a consumer of registered projections and receives no write or operational authority.'
              else:
                  rule='RULE-RETIRE-UNREGISTERED-UNKNOWN'
                  disposition='RETIRE_UNREGISTERED_OR_AMBIGUOUS_AUTHORITY_UNTIL_EXPLICIT_REINTRODUCTION'
                  replacements=replacement if mutation else []
                  live='REQUIRED_BEFORE_ANY_REINTRODUCTION'
                  gate='EARLIEST_AFFECTED_COMPONENT_OR_MIGRATION_GATE'
                  rationale='No target authority is inferred from an ambiguous source path. The surface is retired fail-closed unless a later audited architecture correction binds an exact command and proof.'

              row={**source,
                  'disposition_protocol':'CUSTODIAL_V43_PHASE2_SOURCE_SURFACE_DISPOSITION_V2',
                  'disposition_rule_id':rule,
                  'architecture_disposition':disposition,
                  'architecture_disposition_status':'SIGNED',
                  'architecture_admission':False,
                  'current_surface_target_authority':False,
                  'replacement_command_ids':replacements,
                  'replacement_authority_scope':domain,
                  'algorithm_reuse_policy':'MAY_REUSE_ONLY_AFTER_COMPONENT_REVIEW_AND_EXACT_COMMAND_BINDING' if replacements else 'NONAUTHORITATIVE_OR_RETIRED',
                  'retirement_proof_ids':['PROOF-SOURCE-AUTHORITY-CLOSURE','ATTACK-LEGACY-WRITER'] if disposition.startswith('RETIRE') else [],
                  'proof_obligation_ids':['PROOF-SOURCE-AUTHORITY-CLOSURE'],
                  'live_or_physical_evidence_status':live,
                  'earliest_execution_gate':gate,
                  'implementation_or_migration_execution_status':'NOT_EXECUTED_ARCHITECTURE_ONLY',
                  'disposition_rationale':rationale,
                  'invalidation_triggers':['frozen source commit changes','source path or symbol changes','command registry changes','new live authority evidence contradicts disposition'],
                  'decision_owner':'CUSTODIAL_V43_PHASE2_ARCHITECTURE',
              }
              row.pop('classification_status',None)
              row.pop('research_gate',None)
              row.pop('source_proof_status',None)
              unsigned={k:v for k,v in row.items() if k!='disposition_signature_sha256'}
              row['disposition_signature_sha256']=canonical_sha(unsigned)
              new_rows.append(row)
              disposition_counts[disposition]+=1
              domain_counts[domain]+=1
              live_gate_counts[live]+=1
              rule_counts[rule]+=1

          assert len(new_rows)==len(old_rows)
          assert len({row['inventory_id'] for row in new_rows})==len(new_rows)
          assert all(row['architecture_disposition_status']=='SIGNED' for row in new_rows)
          assert all(row['architecture_admission'] is False for row in new_rows)
          for row in new_rows:
              if 'REBUILD_CAPABILITY' in row['architecture_disposition']:
                  assert row['replacement_command_ids']
                  assert set(row['replacement_command_ids'])<=command_ids
              if row['architecture_disposition'].startswith('RETIRE'):
                  assert row['retirement_proof_ids']

          ledger_path=ROOT/'phase2-source-authority-disposition-ledger.jsonl'
          with ledger_path.open('w') as handle:
              for row in sorted(new_rows,key=lambda x:(x['source_repository'],x['path'],x['line'],x['category'],x['symbol'],x['inventory_id'])):
                  handle.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          ledger_sha=hashlib.sha256(ledger_path.read_bytes()).hexdigest()

          summary={
              'protocol':'CUSTODIAL_V43_PHASE2_SOURCE_AUTHORITY_DISPOSITION_SUMMARY_V2',
              'status':'ARCHITECTURE_DISPOSITIONS_COMPLETE_EXECUTION_PROOFS_DEFERRED_TO_NAMED_GATES',
              'rows':len(new_rows),
              'architecture_dispositions_signed':len(new_rows),
              'architecture_unresolved':0,
              'implementation_or_migration_execution_open':sum(1 for row in new_rows if row['live_or_physical_evidence_status']!='NOT_APPLICABLE_NONAUTHORITATIVE'),
              'ledger_sha256':ledger_sha,
              'disposition_counts':dict(sorted(disposition_counts.items())),
              'domain_counts':dict(sorted(domain_counts.items())),
              'live_evidence_gate_counts':dict(sorted(live_gate_counts.items())),
              'rule_counts':dict(sorted(rule_counts.items())),
              'authority':{key:False for key in ['phase2_operational_architecture','schema_design','component_design','implementation','migration','apk_phone_canary','release_production']},
              'interpretation':'Architecture disposition completeness does not claim that source retirement, migration, deployment or live denial proof has executed.'
          }
          (ROOT/'phase2-source-authority-disposition-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')

          index['status']='INVENTORIES_INTEGRATED_ARCHITECTURE_DISPOSITIONS_COMPLETE_EXECUTION_PROOFS_PENDING'
          index['ledger']['sha256']=ledger_sha
          index['ledger']['resolved_rows']=len(new_rows)
          index['ledger']['unresolved_rows']=0
          index['ledger']['architecture_disposition_counts']=dict(sorted(disposition_counts.items()))
          index['ledger']['live_evidence_gate_counts']=dict(sorted(live_gate_counts.items()))
          index['acceptance']['source_dispositions_complete']=True
          index['acceptance']['live_and_physical_evidence_complete']=False
          index['acceptance']['phase2_operational_architecture_accepted']=False
          index['next_gate']='fresh independent exact-head review; implementation/migration/live denial proofs remain at their named gates'
          (ROOT/'phase2-source-authority-inventory-index.json').write_text(json.dumps(index,indent=2,sort_keys=True)+'\n')

          correction=json.loads((ROOT/'phase2-correction-plan-20260807.json').read_text())
          correction['inventory_integration']={
              **correction.get('inventory_integration',{}),
              'status':'EXACT_SOURCE_INVENTORIES_AND_SIGNED_ARCHITECTURE_DISPOSITIONS_COMPLETE',
              'rows':len(new_rows),'unresolved':0,
              'B-P2-01':'CORRECTED_PENDING_FRESH_INDEPENDENT_REVIEW',
              'execution_proof_note':'retirement, migration, deployment and live denial evidence remain explicitly open at named downstream gates'
          }
          (ROOT/'phase2-correction-plan-20260807.json').write_text(json.dumps(correction,indent=2,sort_keys=True)+'\n')
          PY

      - name: Strengthen validator for signed disposition semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture/validate-phase2-operational-architecture.mjs')
          text=path.read_text()
          start=text.index('          const validateMutationFailClosed=(rows=ledger)=>{')
          end=text.index('          const validateCommandClosure=',start)
          replacement='''          const validateMutationFailClosed=(rows=ledger)=>{\n            const commands=new Set(registry.commands.map(row=>row.id));\n            for(const row of rows){\n              assert.equal(row.architecture_admission,false,`${row.inventory_id} current surface admitted`);\n              assert.equal(row.current_surface_target_authority,false,`${row.inventory_id} retained current authority`);\n              assert.equal(row.architecture_disposition_status,'SIGNED',`${row.inventory_id} unsigned`);\n              assert.ok(row.architecture_disposition&&row.disposition_rule_id&&row.disposition_signature_sha256,`${row.inventory_id} incomplete disposition`);\n              if(row.architecture_disposition.includes('REBUILD_CAPABILITY')){\n                assert.ok(row.replacement_command_ids.length>0,`${row.inventory_id} missing replacement commands`);\n                assert.ok(row.replacement_command_ids.every(id=>commands.has(id)),`${row.inventory_id} unknown replacement command`);\n              }\n              if(row.architecture_disposition.startsWith('RETIRE')){\n                assert.ok(row.retirement_proof_ids.length>0,`${row.inventory_id} missing retirement proof`);\n                assert.notEqual(row.live_or_physical_evidence_status,'NOT_APPLICABLE_NONAUTHORITATIVE',`${row.inventory_id} retirement proof incorrectly N/A`);\n              }\n              if(row.architecture_disposition.startsWith('RETAIN_NONAUTHORITATIVE')||row.architecture_disposition==='RETAIN_VERIFICATION_EVIDENCE_ONLY'){\n                assert.equal(row.live_or_physical_evidence_status,'NOT_APPLICABLE_NONAUTHORITATIVE',`${row.inventory_id} nonauthority live status`);\n              }\n              assert.equal(row.implementation_or_migration_execution_status,'NOT_EXECUTED_ARCHITECTURE_ONLY');\n            }\n          };\n'''
          text=text[:start]+replacement+text[end:]
          old="""          mustReject('NEG-ADMIT-MUTATION-WITHOUT-PROOF',()=>{const rows=clone(ledger);const row=rows.find(x=>['MUTATION_CAPABLE','MUTATION_OR_AUTHORITY_CAPABLE'].includes(x.mutation_class));row.classification_status='RESOLVED';row.architecture_admission=true;validateMutationFailClosed(rows);});"""
          new="""          mustReject('NEG-ADMIT-MUTATION-WITHOUT-PROOF',()=>{const rows=clone(ledger);const row=rows.find(x=>x.architecture_disposition.includes('REBUILD_CAPABILITY'));row.architecture_admission=true;row.replacement_command_ids=[];validateMutationFailClosed(rows);});"""
          if text.count(old)!=1:
              raise SystemExit('negative mutation patch marker changed')
          path.write_text(text.replace(old,new))
          PY

      - name: Execute corrected validator against signed dispositions
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture/validate-phase2-operational-architecture.mjs \
            | tee /tmp/phase2-validation-result.json
          cp /tmp/phase2-validation-result.json \
            docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture/phase2-validation-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture')
          result=json.loads((root/'phase2-validation-result.json').read_text())
          assert result['validator_execution_status']=='PASS'
          assert result['stage_status']=='PENDING_FRESH_INDEPENDENT_REVIEW'
          assert result['unresolved_source_surfaces']==0
          assert result['downstream_authority'] is False
          decision=json.loads((root/'phase2-stage-decision.json').read_text())
          decision['status']='PENDING_FRESH_INDEPENDENT_REVIEW'
          decision['decision']='All four correction findings have architecture-level corrections; no downstream authority until a fresh exact-head independent review accepts the package.'
          decision['residuals']=['FRESH-INDEPENDENT-EXACT-HEAD-REVIEW']
          decision['authority']={key:False for key in ['phase2_operational_architecture','schema_design','component_design','implementation','migration','apk_phone_canary','release_production']}
          (root/'phase2-stage-decision.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          PY
          git diff --check

      - name: Commit signed source dispositions and retire one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/custodial-v43-phase2-source-disposition-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sign fail-closed dispositions for every Phase-2 source surface [phase2-source-dispositions-signed]"
          git push origin HEAD:agent/custodial-v43-phase1-acceptance-phase2-architecture-20260807

      - name: Upload disposition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custodial-v43-phase2-source-dispositions
          path: |
            docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture/phase2-source-authority-disposition-summary.json
            docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture/phase2-validation-result.json
          if-no-files-found: warn
          retention-days: 14
