name: Bootstrap validated device credential frontend

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
      - name: Reconstruct, verify, and apply exact patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/device-credentials.patch.gz.b64
          blobs=(
            ff44c3b6e38e87845659fd3aa8533fc0c0543de0
            f2bb4b689cad04825a9eb9ec338cd9798c06d1bb
            104944ed8bba8c2e7f9872082fa2068ce7f408e4
            37d274717c54d963dc86f5535c7df1fe2df65f5d
            38fa6f96b9728a74be7ab8e5e5e3978d6ec495c8
            82d1ae47ce14456f90f9863d4bb8e5e8fba329ce
            a346be463e05b5a19fcf7162d331ec2bb68b5b8d
            df137fe2f76a0abd0cf122fa57e5be0bd54e9bdb
            f9d7f286d9524e314111a520691ce176f36dd5c5
            8e5f9fbfe9b27ca90dc4ec75dc240a3cf053ca15
            bb858389d8efa66853966b3554c67f75f61fedab
            791ef010f0079382714d338910888fb620c1c5ed
            ef668bbe0d38df9897530c9e9ff0cb2434603831
            a48a24d906ed4f943a867038532e584bbfcf14f4
          )
          for sha in "${blobs[@]}"; do
            gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/device-credentials.patch.gz.b64
          done
          test "$(wc -c < /tmp/device-credentials.patch.gz.b64)" = '26652'
          test "$(sha256sum /tmp/device-credentials.patch.gz.b64 | awk '{print $1}')" = 'fad2d6091eb6b3c8697cf60cbb1f53ba73b281bd57924e7c363efff1cf5312f4'
          base64 -d /tmp/device-credentials.patch.gz.b64 | gzip -dc > /tmp/device-credentials.patch
          test "$(sha256sum /tmp/device-credentials.patch | awk '{print $1}')" = '389dafd6ee3a539c4c6d84f97e2efc2512317b86cd7d1ae8b9ae564a444573ea'
          cd work
          git apply --check /tmp/device-credentials.patch
          git apply /tmp/device-credentials.patch
          git diff --check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete frontend foundation
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node --check memphis-device-identity.js
          while IFS= read -r test_file; do node "$test_file"; done < <(find scripts -maxdepth 1 -type f -name '*.mjs' -print | sort)
          grep -q 'device-security.html' start_page1.html
          grep -q 'X-Device-Credential' memphis-device-identity.js
          grep -q 'credentials.*include' memphis-device-identity.js
          ! grep -R -nE 'localStorage.*credential|credential.*localStorage' -- *.html *.js scripts
      - name: Publish clean implementation branch
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B foundation/device-credentials-clean-20260715
          rm -f .github/workflows/device-credential-foundation.yml
          git add -- device-security.html employee-hub.html employee-schedule.html events.html index.html memphis-device-identity.js messages.html scripts/device-credential-foundation-tests.mjs start_page1.html thread.html
          git commit -m 'security: add staged employee-device credential enrollment'
          git push origin HEAD:refs/heads/foundation/device-credentials-clean-20260715 --force
          echo "clean_commit=$(git rev-parse HEAD)"
