name: Engine Current Source Snapshot

on:
  push:
    branches:
      - internal/engine-source-snapshot-20260715-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export current source
        run: |
          git archive --format=tar.gz --output=/tmp/engine-current-20260715.tar.gz HEAD
          sha256sum /tmp/engine-current-20260715.tar.gz > /tmp/engine-current-20260715.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: engine-current-source-20260715
          path: |
            /tmp/engine-current-20260715.tar.gz
            /tmp/engine-current-20260715.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
