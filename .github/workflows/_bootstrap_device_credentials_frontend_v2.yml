name: Bootstrap validated device credential frontend v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap
          fetch-depth: 1
      - name: Checkout canonical frontend main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
      - name: Verify and apply exact binary patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum bootstrap/.foundation/device_credentials/device-credentials.patch.gz | awk '{print $1}')" = 'a878984bf49d5b3074b356d67c677494b92404237d1848ad8ea073eecc3ad453'
          gzip -dc bootstrap/.foundation/device_credentials/device-credentials.patch.gz > /tmp/device-credentials.patch
          test "$(sha256sum /tmp/device-credentials.patch | awk '{print $1}')" = '389dafd6ee3a539c4c6d84f97e2efc2512317b86cd7d1ae8b9ae564a444573ea'
          cd work
          git apply --check /tmp/device-credentials.patch
          git apply /tmp/device-credentials.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete frontend foundation
        id: validate
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          : > /tmp/frontend-device-credential-validation.log
          while IFS= read -r file; do
            echo "SYNTAX $file" | tee -a /tmp/frontend-device-credential-validation.log
            node --check "$file" >>/tmp/frontend-device-credential-validation.log 2>&1
          done < <(find . -maxdepth 2 -type f -name '*.js' -print | sort)
          failed=()
          set +e
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ===" | tee -a /tmp/frontend-device-credential-validation.log
            node "$test_file" >>/tmp/frontend-device-credential-validation.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then failed+=("$test_file:$rc"); fi
          done
          set -e
          grep -q 'memphis_device_credentials_v1' memphis-device-identity.js
          grep -q 'DEVICE_CREDENTIAL_ENDPOINT' memphis-device-identity.js
          grep -q 'device-security.html' start_page1.html
          grep -q 'release-2026.07.15.device-credentials.1' memphis-device-identity.js
          ! grep -R -nE 'localStorage.*device.*credential|device.*credential.*localStorage' -- *.js *.html scripts
          cat /tmp/frontend-device-credential-validation.log
          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'FAILED_TESTS=%s\n' "${failed[*]}"
            exit 1
          fi
          echo FRONTEND_DEVICE_CREDENTIAL_FOUNDATION_PASS
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-device-credential-validation-v2
          path: /tmp/frontend-device-credential-validation.log
          retention-days: 2
          if-no-files-found: warn
      - name: Publish clean implementation branch
        shell: bash
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B foundation/device-credentials-clean-20260715
          git add -- \
            .github/workflows/device-credential-foundation.yml \
            device-security.html \
            employee-hub.html \
            employee-schedule.html \
            events.html \
            index.html \
            memphis-device-identity.js \
            messages.html \
            scripts/device-credential-foundation-tests.mjs \
            start_page1.html \
            thread.html
          git diff --cached --check
          git commit -m 'security: add staged employee-device credential frontend'
          git push origin HEAD:refs/heads/foundation/device-credentials-clean-20260715 --force
          echo "clean_commit=$(git rev-parse HEAD)"
