name: Release Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Run all source contracts with names
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/release-contracts.log
          overall=0
          for test_file in scripts/*.mjs; do
            echo "===== $test_file =====" | tee -a /tmp/release-contracts.log
            node "$test_file" 2>&1 | tee -a /tmp/release-contracts.log
            status=${PIPESTATUS[0]}
            echo "===== exit $status: $test_file =====" | tee -a /tmp/release-contracts.log
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Package auditable source
        if: always()
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude=playwright-report -czf /tmp/engine-pr-source.tar.gz .
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-release-diagnostic
          path: |
            /tmp/release-contracts.log
            /tmp/engine-pr-source.tar.gz
          if-no-files-found: error
      - name: Enforce contracts
        if: always()
        run: test "${{ steps.contracts.outcome }}" = success
