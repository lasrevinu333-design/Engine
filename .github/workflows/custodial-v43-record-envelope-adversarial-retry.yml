name: Custodial v4.3 Record Envelope Adversarial Retry

# Deliberate second push: GitHub evaluates this workflow after it exists in the parent commit.
on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - ".github/workflows/custodial-v43-record-envelope-adversarial-retry.yml"

permissions:
  contents: write

concurrency:
  group: custodial-v43-record-envelope-adversarial-retry
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    if: github.ref_name == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch with bounded write credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify exact source and bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.1'
          test "$GITHUB_REF_NAME" = 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse refs/remotes/origin/agent/custodial-v43-remote-foundation-phase1-correction-20260806)" = '8e53038f9e5d5146b1dd8260614de30cb9be4553'
          git merge-base --is-ancestor 8e53038f9e5d5146b1dd8260614de30cb9be4553 HEAD
          test -f .stage1-repair/apply-adversarial-correction.py
          test -f docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-adversarial-v2.mjs
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/custodial-v43-record-envelope-canonicalization.yml|.github/workflows/custodial-v43-record-envelope-adversarial-retry.yml|.stage1-repair/*|docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/*) ;;
              *) echo "Out-of-scope changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD)

      - name: Apply the independently audited correction helper
        shell: bash
        run: |
          set -euo pipefail
          python .stage1-repair/apply-adversarial-correction.py

      - name: Verify inherited and corrected foundations before commit
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-custodial-v43-replan.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check
          unset GITHUB_ACTIONS
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-adversarial-v2.mjs --check

      - name: Remove the consumed helper and commit exact package correction
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .stage1-repair
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              .stage1-repair/*|docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/*) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git add docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close record-envelope post-apply adversarial findings'
          git push origin HEAD:agent/custodial-v43-phase1-record-envelope-canonicalization-20260806

      - name: Prove committed package reproducibility and clean tree
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-adversarial-v2.mjs --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
