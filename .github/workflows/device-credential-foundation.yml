name: Device Credential Frontend Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - foundation/device-credentials-clean-20260715
      - codex/custodial-foundation-repair-20260717

permissions:
  contents: read

concurrency:
  group: device-credential-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild-source:
    name: Source and dependency checks without app compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.4'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify source contracts without building an app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-toolchain-contract-tests.mjs
          node scripts/batch-0a-baseline-contract-tests.mjs
          node mobile/scripts/custodial-generated-app-test-contracts.mjs
          node scripts/refresh-frontend-release-manifest.mjs --check

  validate:
    needs: prebuild-source
    environment: custodial-prebuild-final-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.4'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Install locked backend contract context dependencies
        run: npm ci --prefix test-fixtures/ci/current-backend --ignore-scripts --no-audit --no-fund
      - name: Build Batch 0B browser fixtures
        run: npm run --silent build:batch-0b:browser-fixtures
      - name: Run declared frontend contract invocations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-evidence
          node scripts/frontend-contract-inventory.mjs --plan > quality-evidence/source-contracts.json
          node scripts/frontend-contract-inventory.mjs --run
      - name: Manager enrollment browser regression
        run: npm run --silent test:auth:browser
      - name: Credential-storage and replay invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "credentials:'include'" memphis-device-identity.js
          grep -q 'enrollment.required&&!enrollment.retry' memphis-device-identity.js
          grep -q 'isManagerAuthRequest' memphis-device-identity.js
          grep -q 'did not retain its protected cookie' memphis-device-identity.js
          ! grep -Eq 'localStorage\.(setItem|removeItem)\([^\n]*(device.*credential|credential.*device)' memphis-device-identity.js
          grep -q 'device-security-link' start_page1.html
          test -f device-security.html
