name: Custodial v4.3 Phase-1 Architecture Foundation

on:
  push:
    branches:
      - agent/custodial-v43-remote-foundation-phase1-correction-20260806
    paths:
      - "docs/audits/custodial-unified-v4-3-architecture/**"
      - ".github/workflows/custodial-v43-architecture-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custodial-v43-phase1-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-foundation:
    if: github.ref_name == 'agent/custodial-v43-remote-foundation-phase1-correction-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify runtime and fail-closed foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check
