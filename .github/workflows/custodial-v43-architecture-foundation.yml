name: Custodial v4.3 Phase-1 Semantic Authority

on:
  push:
    branches:
      - agent/custodial-v43-remote-foundation-phase1-correction-20260806
    paths:
      - "docs/audits/custodial-unified-v4-3-architecture/**"
      - ".github/workflows/custodial-v43-architecture-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custodial-v43-phase1-semantic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-foundation:
    if: github.ref_name == 'agent/custodial-v43-remote-foundation-phase1-correction-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch history read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify inherited v4.3.2 governance
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.17.0"
          node tools/validate-custodial-v43-replan.mjs --check

      - name: Verify generated architecture projections
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check

      - name: Verify Phase-1 semantic authority
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check
