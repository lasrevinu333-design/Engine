name: Custodial v4.3 Record Envelope Canonicalization

on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - "docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/**"
      - ".github/workflows/custodial-v43-record-envelope-canonicalization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custodial-v43-record-envelope-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-record-envelope:
    if: github.ref_name == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch history read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify exact source and changed-path scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          git merge-base --is-ancestor 8e53038f9e5d5146b1dd8260614de30cb9be4553 HEAD
          git diff --check 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD

      - name: Verify inherited v4.3.2 governance
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-custodial-v43-replan.mjs --check

      - name: Verify existing Phase-1 semantic foundation
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check

      - name: Verify record envelope and canonical-json contract
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check

      - name: Prove validators are read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
