name: Custodial v4.3 Record Envelope Canonicalization

on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
      - agent/custodial-v43-current-trace-reverse-registry-20260808
    paths:
      - "docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/**"
      - ".github/workflows/custodial-v43-record-envelope-canonicalization.yml"
  pull_request:
    branches:
      - agent/custodial-v43-remote-foundation-phase1-correction-20260806
    types: [opened, synchronize, reopened]
    paths:
      - "docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/**"
      - ".github/workflows/custodial-v43-record-envelope-canonicalization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custodial-v43-record-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-record-envelope:
    if: >-
      (github.event_name == 'push' &&
        (github.ref_name == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806' ||
         github.ref_name == 'agent/custodial-v43-current-trace-reverse-registry-20260808')) ||
      github.head_ref == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out exact proposed head read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify exact source, parent foundation, and changed-path scope
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
          test "$EXPECTED_HEAD" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor 922a1c470019b4a2576fcbf03d3005de5a241f18 HEAD
          case "$EXPECTED_BRANCH" in
            agent/custodial-v43-phase1-record-envelope-canonicalization-20260806)
              scope_base='8e53038f9e5d5146b1dd8260614de30cb9be4553'
              correction_ref='refs/remotes/origin/agent/custodial-v43-remote-foundation-phase1-correction-20260806'
              test "$(git rev-parse "$correction_ref")" = "$scope_base"
              ;;
            agent/custodial-v43-current-trace-reverse-registry-20260808)
              scope_base='4dfef6dbbeb5a1bf169f0ed62d5ad3a9c832db71'
              ;;
            *)
              echo "Unexpected branch: $EXPECTED_BRANCH" >&2
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$scope_base" HEAD
          git diff --check "$scope_base..HEAD"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/custodial-v43-record-envelope-canonicalization.yml|docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/*) ;;
              *) echo "Out-of-scope changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$scope_base..HEAD")

      - name: Verify inherited v4.3.2 governance
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-custodial-v43-replan.mjs --check

      - name: Verify existing Phase-1 semantic foundation
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check
          unset GITHUB_ACTIONS
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check

      - name: Verify record envelope and canonical-json contracts
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-adversarial-v2.mjs --check

      - name: Prove validators are read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
