name: Custodial v4.3 Record Envelope Profile Repair

on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - ".github/workflows/custodial-v43-record-envelope-canonicalization.yml"

permissions:
  contents: write

concurrency:
  group: custodial-v43-record-envelope-profile-repair
  cancel-in-progress: false

jobs:
  repair-and-validate-record-envelope:
    if: github.ref_name == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch history with bounded write credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify exact source, parent foundation, and changed-path scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$GITHUB_REF_NAME" = 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          correction_ref='refs/remotes/origin/agent/custodial-v43-remote-foundation-phase1-correction-20260806'
          test "$(git rev-parse "$correction_ref")" = '8e53038f9e5d5146b1dd8260614de30cb9be4553'
          git merge-base --is-ancestor 922a1c470019b4a2576fcbf03d3005de5a241f18 HEAD
          git merge-base --is-ancestor 8e53038f9e5d5146b1dd8260614de30cb9be4553 HEAD
          git diff --check 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/custodial-v43-record-envelope-canonicalization.yml|docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/*) ;;
              *) echo "Out-of-scope changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD)

      - name: Align proof profile with the exact parent record registry and rebind manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization')
          contract_path = root / 'record-envelope-contract.json'
          strengthening_path = root / 'record-type-strengthening-map.json'
          manifest_path = root / 'package-manifest.json'

          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['source_authority']['base_schema_blob'] = 'b05c346c53c1a684e0f7147860cef75a56d99e3d'
          contract_profiles = contract['per_record_strengthening']['profiles']
          renamed_contract = 0
          for profile in contract_profiles:
              if profile['record_type'] == 'proof_obligation':
                  profile['record_type'] = 'proof_catalog'
                  renamed_contract += 1
          assert renamed_contract in (0, 1)
          assert sum(profile['record_type'] == 'proof_catalog' for profile in contract_profiles) == 1

          strengthening = json.loads(strengthening_path.read_text(encoding='utf-8'))
          strengthening_profiles = strengthening['profiles']
          renamed_projection = 0
          for profile in strengthening_profiles:
              if profile['record_type'] == 'proof_obligation':
                  profile['record_type'] = 'proof_catalog'
                  renamed_projection += 1
          assert renamed_projection in (0, 1)
          assert sum(profile['record_type'] == 'proof_catalog' for profile in strengthening_profiles) == 1

          payloads = {
              'record-envelope-contract.json': (json.dumps(contract, indent=2, ensure_ascii=False) + '\n').encode('utf-8'),
              'record-type-strengthening-map.json': (json.dumps(strengthening, indent=2, ensure_ascii=False) + '\n').encode('utf-8'),
          }
          contract_path.write_bytes(payloads['record-envelope-contract.json'])
          strengthening_path.write_bytes(payloads['record-type-strengthening-map.json'])

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          members = {item['path']: item for item in manifest['members']}
          for path, data in payloads.items():
              members[path]['sha256'] = hashlib.sha256(data).hexdigest()
              members[path]['bytes'] = len(data)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git diff --check
          if ! git diff --quiet; then
            git add docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/record-envelope-contract.json
            git add docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/record-type-strengthening-map.json
            git add docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/package-manifest.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Align record strengthening with parent proof catalog'
            git push origin HEAD:agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
          fi

      - name: Verify inherited v4.3.2 governance
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-custodial-v43-replan.mjs --check

      - name: Verify existing Phase-1 semantic foundation
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check
          unset GITHUB_ACTIONS
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check

      - name: Verify record envelope and canonical-json contract
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check

      - name: Prove bounded repair left a clean tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
