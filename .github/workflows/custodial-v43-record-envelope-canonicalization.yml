name: Custodial v4.3 Record Envelope Canonicalization Diagnostic

on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - ".github/workflows/custodial-v43-record-envelope-canonicalization.yml"

permissions:
  contents: read

concurrency:
  group: custodial-v43-record-envelope-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-record-envelope:
    if: github.ref_name == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch history read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: ''

      - name: Verify exact source, parent foundation, and changed-path scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$GITHUB_REF_NAME" = 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          correction_ref='refs/remotes/origin/agent/custodial-v43-remote-foundation-phase1-correction-20260806'
          test "$(git rev-parse "$correction_ref")" = '8e53038f9e5d5146b1dd8260614de30cb9be4553'
          git merge-base --is-ancestor 922a1c470019b4a2576fcbf03d3005de5a241f18 HEAD
          git merge-base --is-ancestor 8e53038f9e5d5146b1dd8260614de30cb9be4553 HEAD
          git diff --check 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/custodial-v43-record-envelope-canonicalization.yml|docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/*) ;;
              *) echo "Out-of-scope changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 8e53038f9e5d5146b1dd8260614de30cb9be4553..HEAD)

      - name: Verify inherited v4.3.2 governance
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-custodial-v43-replan.mjs --check

      - name: Verify existing Phase-1 semantic foundation
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/generate-architecture-projections.mjs --check
          unset GITHUB_ACTIONS
          node docs/audits/custodial-unified-v4-3-architecture/validate-architecture-foundation.mjs --check

      - name: Diagnose exact record-profile coverage mismatch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = 'docs/audits/custodial-unified-v4-3-architecture';
          const base = JSON.parse(readFileSync(`${root}/phase1-foundation-registry.json`, 'utf8'));
          const contract = JSON.parse(readFileSync(`${root}/record-envelope-canonicalization/record-envelope-contract.json`, 'utf8'));
          const baseRecordIds = [...new Set(base.records.map((item) => item.id))].sort();
          const profileIds = contract.per_record_strengthening.profiles.map((item) => item.record_type).sort();
          const baseSet = new Set(baseRecordIds);
          const profileSet = new Set(profileIds);
          console.log(JSON.stringify({
            baseRecordIds,
            profileIds,
            missingProfiles: baseRecordIds.filter((id) => !profileSet.has(id)),
            extraProfiles: profileIds.filter((id) => !baseSet.has(id)),
          }, null, 2));
          NODE

      - name: Verify record envelope and canonical-json contract
        shell: bash
        run: |
          set -euo pipefail
          node docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization/validate-record-envelope-canonicalization.mjs --check

      - name: Prove validators are read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
