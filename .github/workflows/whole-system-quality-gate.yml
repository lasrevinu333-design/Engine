name: Whole-System Quality Program

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-system-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact-plan:
    name: Change impact and test-plan integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build change file set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p quality-evidence
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" ]]; then
            git diff --name-only "$PR_BASE_SHA"...HEAD > quality-evidence/changed-files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > quality-evidence/changed-files.txt
          else
            git ls-files > quality-evidence/changed-files.txt
          fi
          printf 'Changed files: %s\n' "$(wc -l < quality-evidence/changed-files.txt)"
          cat quality-evidence/changed-files.txt
      - name: Validate whole-system plan
        run: npm run --silent test:whole-system:plan | tee quality-evidence/test-plan-contract.json
      - name: Calculate downstream blast radius
        run: >-
          node tools/plan-change-impact.mjs
          --files quality-evidence/changed-files.txt
          --out quality-evidence/change-impact.json
          --markdown quality-evidence/change-impact.md
      - name: Upload change-impact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whole-system-change-impact
          path: quality-evidence
          retention-days: 30

  full-system:
    name: Nightly and deployed-branch full-system gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify committed ChatScope bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent build:chatscope
          git diff --exit-code -- chatscope-messenger.js chatscope-messenger.css
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run every source and contract test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-evidence/contracts
          status=0
          for test_file in scripts/*.mjs; do
            name="$(basename "$test_file" .mjs)"
            if node "$test_file" >"quality-evidence/contracts/$name.log" 2>&1; then
              printf 'PASS %s\n' "$test_file"
            else
              printf 'FAIL %s\n' "$test_file"
              status=1
            fi
          done
          exit "$status"
      - name: Build Batch 0B browser fixtures
        run: npm run --silent build:batch-0b:browser-fixtures
      - name: Run complete browser matrix
        run: npx --no-install playwright test --reporter=line,html
      - name: Run mobile contracts
        run: npm run --silent test:mobile
      - name: Build all mobile editions and verify provenance
        shell: bash
        env:
          MZ_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p quality-evidence/mobile
          for edition in manager custodial viewer; do
            npm run --silent "build:$edition"
            EDITION="$edition" node <<'NODE'
          const { createHash } = require('node:crypto');
          const { lstatSync, readFileSync, readdirSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const root = 'mobile/mobile-dist';
          const manifest = JSON.parse(readFileSync(join(root, 'runtime-asset-manifest.json')));
          const build = JSON.parse(readFileSync(join(root, 'build.json')));
          const files = [];
          const walk = (directory) => {
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              const stat = lstatSync(path);
              if (stat.isSymbolicLink()) throw new Error(`Unexpected symlink: ${path}`);
              if (stat.isDirectory()) walk(path);
              else if (stat.isFile()) files.push(relative(root, path).replaceAll('\\', '/'));
            }
          };
          walk(root);
          const assets = files.filter((file) => file !== 'runtime-asset-manifest.json');
          if (manifest.edition !== process.env.EDITION || build.edition !== process.env.EDITION) throw new Error('Edition provenance mismatch');
          if (manifest.source_commit !== process.env.MZ_SOURCE_COMMIT || build.source_commit !== process.env.MZ_SOURCE_COMMIT) throw new Error('Source commit provenance mismatch');
          if (manifest.asset_count !== assets.length) throw new Error('Runtime asset count mismatch');
          if (JSON.stringify(Object.keys(manifest.asset_hashes_sha256).sort()) !== JSON.stringify(assets.sort())) throw new Error('Runtime asset inventory mismatch');
          for (const file of assets) {
            const actual = createHash('sha256').update(readFileSync(join(root, file))).digest('hex');
            if (manifest.asset_hashes_sha256[file] !== actual) throw new Error(`Runtime asset hash mismatch: ${file}`);
          }
          NODE
            cp mobile/mobile-dist/build.json "quality-evidence/mobile/$edition-build.json"
            cp mobile/mobile-dist/runtime-asset-manifest.json "quality-evidence/mobile/$edition-runtime-assets.json"
            (
              cd mobile/mobile-dist
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "quality-evidence/mobile/$edition-files.sha256"
          done
      - name: Upload complete whole-system evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whole-system-quality-evidence
          path: |
            quality-evidence
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
