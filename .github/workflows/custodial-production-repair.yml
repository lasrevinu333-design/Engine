name: Custodial Frontend Production Repair Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/custodial-foundation-repair-20260717

permissions:
  contents: read

concurrency:
  group: custodial-frontend-production-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild-source:
    name: Source and dependency checks without app compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.4'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify source contracts without building an app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-toolchain-contract-tests.mjs
          node scripts/batch-0a-baseline-contract-tests.mjs
          node mobile/scripts/custodial-generated-app-test-contracts.mjs
          node scripts/refresh-frontend-release-manifest.mjs --check

  frontend:
    needs: prebuild-source
    environment: custodial-prebuild-final-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.4'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Install locked backend contract context dependencies
        run: npm ci --prefix test-fixtures/ci/current-backend --ignore-scripts --no-audit --no-fund
      - name: Build Batch 0B browser fixtures
        run: npm run --silent build:batch-0b:browser-fixtures
      - name: Run declared frontend contract invocations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-evidence
          node scripts/frontend-contract-inventory.mjs --plan > quality-evidence/source-contracts.json
          node scripts/frontend-contract-inventory.mjs --run
      - name: Manager authentication browser acceptance
        run: npm run --silent test:auth:browser
      - name: Gemini Console browser acceptance
        run: npm run --silent test:gemini:browser
      - name: Messenger browser acceptance
        run: npm run --silent test:messaging:browser
      - name: Scan queue browser acceptance
        run: npm run --silent test:scan:browser
      - name: Events browser acceptance
        run: npm run --silent test:events:browser
      - name: Operational insights browser acceptance
        run: npm run --silent test:insights:browser
      - name: Attendance freshness browser acceptance
        run: npm run --silent test:attendance:browser
      - name: UI unity browser acceptance
        run: npm run --silent test:unity:browser
      - name: Audit 5 feedback and guest approval browser acceptance
        run: npm run --silent test:audit5:browser
      - name: Audit 6 CoverAll security contracts
        run: npm run --silent test:audit6:contracts
      - name: Accessibility regression acceptance
        run: npm run --silent test:accessibility:baseline
      - name: Release manifest exposed
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend-release-manifest.json
          node -e "const m=require('./frontend-release-manifest.json'); if(!/^release-[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[a-z0-9.-]+$/.test(m.release_id)||!/^[a-f0-9]{64}$/.test(m.schema_fingerprint)||Object.keys(m.asset_hashes_sha256||{}).length<1) process.exit(1)"
