name: Custodial Frontend Production Repair Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/custodial-foundation-repair-20260717

permissions:
  contents: read

concurrency:
  group: custodial-frontend-production-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Frontend browser/source contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done
      - name: Release manifest exposed
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend-release-manifest.json
          grep -q 'release-2026.07.17.custodial-repair.1' frontend-release-manifest.json
