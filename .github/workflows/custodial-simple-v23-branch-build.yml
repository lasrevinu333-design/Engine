name: Custodial Simple v23 Branch Build

on:
  push:
    branches:
      - agent/custodial-moto-g-simple-v23-20260802
    paths:
      - requests/custodial-simple-v23.trigger

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custodial-moto-g-simple-v23-20260802
          fetch-depth: 0
      - name: Apply reminder redesign
        run: |
          set -Eeuo pipefail
          python3 scripts/patch-custodial-simple-v23-reminders.py
      - name: Run focused contracts
        run: |
          set -Eeuo pipefail
          node scripts/custodial-simple-v23-contract-tests.mjs
          node scripts/device-reminder-contract-tests.mjs
          node scripts/employee-schedule-section-tests.mjs
          npm --prefix mobile test -- --run
      - name: Commit patched runtime
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee-hub.html memphis-device-reminders.js mobile/src/shell/roles/custodial/routes.ts scripts
          git commit -m "Build simple Moto G employee runtime v23"
          git push origin HEAD:agent/custodial-moto-g-simple-v23-20260802
