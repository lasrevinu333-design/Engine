name: Named Leadership Browser Live Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: named-leadership-browser-live-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Verify published named leadership release
        shell: bash
        run: |
          set -euo pipefail
          root='https://lasrevinu333-design.github.io/Engine'
          expected="$(node -p "require('./frontend-release-manifest.json').release_id")"
          json_digest() {
            node -e "const fs=require('node:fs'),crypto=require('node:crypto');try{const value=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex'))}catch{}"
          }
          expected_manifest_digest="$(json_digest < frontend-release-manifest.json)"
          for attempt in $(seq 1 60); do
            auth="$(curl -fsSL --max-time 40 "$root/memphis-auth.js?attempt=$attempt" || true)"
            hub="$(curl -fsSL --max-time 40 "$root/start_page1.html?attempt=$attempt" || true)"
            hub_client="$(curl -fsSL --max-time 40 "$root/ops-hub.js?attempt=$attempt" || true)"
            insights="$(curl -fsSL --max-time 40 "$root/operational-insights.html?attempt=$attempt" || true)"
            entry="$(curl -fsSL --max-time 40 "$root/ops-manager-hub.html?attempt=$attempt" || true)"
            access="$(curl -fsSL --max-time 40 "$root/manager-access.html?attempt=$attempt" || true)"
            viewer="$(curl -fsSL --max-time 40 "$root/ops-viewer.html?attempt=$attempt" || true)"
            messenger="$(curl -fsSL --max-time 40 "$root/messages.html?attempt=$attempt" || true)"
            messenger_bundle="$(curl -fsSL --max-time 40 "$root/chatscope-messenger.js?attempt=$attempt" || true)"
            legacy_messenger="$(curl -fsSL --max-time 40 "$root/messages-chatscope.html?attempt=$attempt" || true)"
            phone_assignments="$(curl -fsSL --max-time 40 "$root/phone-assignments.html?attempt=$attempt" || true)"
            shared_css="$(curl -fsSL --max-time 40 "$root/memphis-ui.css?attempt=$attempt" || true)"
            manifest="$(curl -fsSL --max-time 40 "$root/frontend-release-manifest.json?attempt=$attempt" || true)"
            deployment="$(curl -fsSL --max-time 40 "$root/frontend-deployment-manifest.json?attempt=$attempt" || true)"
            published_manifest_digest="$(json_digest <<<"$manifest")"
            deployment_commit="$(node -e "try{const m=JSON.parse(require('node:fs').readFileSync(0,'utf8'));process.stdout.write(m.frontend_commit_sha||'')}catch{}" <<<"$deployment")"
            printf 'attempt=%s auth=%s hub=%s hubjs=%s insights=%s entry=%s access=%s viewer=%s messenger=%s legacy=%s phones=%s manifest=%s\n' \
              "$attempt" "${#auth}" "${#hub}" "${#hub_client}" "${#insights}" "${#entry}" "${#access}" "${#viewer}" "${#messenger}" "${#legacy_messenger}" "${#phone_assignments}" "${#manifest}"
            if grep -Fq '/auth-api/ops/manager-codes/consume' <<<"$entry" \
              && grep -Fq 'Named manager enrollment required' <<<"$hub_client" \
              && grep -Fq 'Insights &amp; Inspections' <<<"$hub" \
              && grep -Fq 'operational-insights.js' <<<"$insights" \
              && grep -Fq 'Generate Personal Code' <<<"$access" \
              && grep -Fq 'Memphis Zoo Operations Viewer' <<<"$viewer" \
              && grep -Fq 'id="chatscope-root"' <<<"$messenger" \
              && grep -Fq 'chatscope-messenger.js' <<<"$messenger" \
              && ! grep -Fq 'messenger-runtime-patch.js' <<<"$messenger" \
              && grep -Fq 'employeeDeviceAuthority' <<<"$messenger_bundle" \
              && grep -Fq 'ops_manager_shared_chat_v1' <<<"$messenger_bundle" \
              && grep -Fq "new URL('./messages.html'" <<<"$legacy_messenger" \
              && grep -Fq 'Phone Assignments' <<<"$phone_assignments" \
              && grep -Fq 'tr:has(.status-not_cleaned)' <<<"$shared_css" \
              && grep -Fq 'ops-manager-auth.v5.named-leadership' <<<"$manifest" \
              && grep -Fq 'operational-analytics.v1' <<<"$manifest" \
              && grep -Fq "$expected" <<<"$manifest" \
              && test "$published_manifest_digest" = "$expected_manifest_digest" \
              && [[ "$deployment_commit" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            sleep 10
          done

          grep -Fq '/auth-api/ops/manager-codes/consume' <<<"$entry"
          grep -Fq 'Personal enrollment code' <<<"$entry"
          grep -Fq 'Enroll This Browser' <<<"$entry"
          grep -Fq "accessLevel:'full_access'" <<<"$hub_client"
          grep -Fq 'Named manager enrollment required' <<<"$hub_client"
          grep -Fq 'Insights &amp; Inspections' <<<"$hub"
          grep -Fq 'operational-insights.js' <<<"$insights"
          ! grep -Fq 'messages-chatscope.html' <<<"$hub"
          grep -Fq 'OPERATIONS LEADERSHIP ACCESS' <<<"$access"
          grep -Fq 'Generate Personal Code' <<<"$access"
          grep -Fq 'Trusted Devices' <<<"$access"
          ! grep -Eq 'shared 48-hour|shared enrollment|Generate New 48-Hour Passcode|ops/shared-enrollment|ops/pairing/consume|ops/pairing-links' <<<"$auth$hub$hub_client$entry$access"
          grep -Fq 'Memphis Zoo Operations Viewer' <<<"$viewer"
          grep -Fq 'id="chatscope-root"' <<<"$messenger"
          grep -Fq 'chatscope-messenger.js' <<<"$messenger"
          ! grep -Fq 'messenger-runtime-patch.js' <<<"$messenger"
          grep -Fq 'employeeDeviceAuthority' <<<"$messenger_bundle"
          grep -Fq 'ops_manager_shared_chat_v1' <<<"$messenger_bundle"
          ! grep -Eq 'messages-app\.js|messenger-app\.css' <<<"$messenger"
          grep -Fq "new URL('./messages.html'" <<<"$legacy_messenger"
          grep -Fq 'Phone Assignments' <<<"$phone_assignments"
          grep -Fq 'tr:has(.status-not_cleaned)' <<<"$shared_css"
          grep -Fq 'ops-manager-auth.v5.named-leadership' <<<"$manifest"
          grep -Fq 'operational-analytics.v1' <<<"$manifest"
          grep -Fq "$expected" <<<"$manifest"
          test "$published_manifest_digest" = "$expected_manifest_digest"
          [[ "$deployment_commit" =~ ^[0-9a-f]{40}$ ]]
          while IFS=$'\t' read -r asset expected_hash; do
            actual_hash="$(curl -fsSL --max-time 60 "$root/$asset?release=$deployment_commit" | sha256sum | cut -d' ' -f1)"
            test "$actual_hash" = "$expected_hash"
          done < <(node -e "const m=require('./frontend-release-manifest.json'); for(const [f,h] of Object.entries(m.asset_hashes_sha256)) console.log(f+'\t'+h)")
          echo NAMED_LEADERSHIP_BROWSER_LIVE_ASSET_PASS
