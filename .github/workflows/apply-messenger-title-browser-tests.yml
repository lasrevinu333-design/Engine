name: Apply Messenger Title Browser Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/update-messenger-title-browser-tests.mjs'
      - '.github/workflows/apply-messenger-title-browser-tests.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply browser acceptance updates
        run: node .batch/update-messenger-title-browser-tests.mjs
      - name: Verify Messenger browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/messenger-leadership-title-contract-tests.mjs
          npx playwright test tests/ops-manager-shared-messenger.spec.js --reporter=line
          node scripts/refresh-frontend-release-manifest.mjs
          git diff --check
      - name: Commit updated acceptance
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thread.html tests/ops-manager-shared-messenger.spec.js scripts/messenger-leadership-title-contract-tests.mjs frontend-release-manifest.json
          git commit -m 'test: align Messenger browser acceptance with named leadership'
          git push origin HEAD:"$HEAD_BRANCH"
