name: Custodial v4.3 Record Envelope Package Bootstrap Recovery

on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - ".stage1-bootstrap/**"
      - ".github/workflows/custodial-v43-record-envelope-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: custodial-v43-record-envelope-bootstrap-recovery
  cancel-in-progress: false

jobs:
  install-exact-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact documentation package without mutating workflow paths
        shell: bash
        run: |
          set -euo pipefail
          target_branch='agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'

          if ! compgen -G '.stage1-bootstrap/chunk-*.b64' > /dev/null; then
            echo 'Bootstrap chunks already consumed; no recovery action is required.'
            exit 0
          fi

          cat .stage1-bootstrap/chunk-*.b64 > /tmp/stage1-package.tar.gz.b64
          echo '04f2cef17bb3bebaf41759c3eef6de6cd9f075bc9e8b211f51641305e5ca5f20  /tmp/stage1-package.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/stage1-package.tar.gz.b64 > /tmp/stage1-package.tar.gz
          echo 'deb12708a76d9892310ffa22a20ba7921978f0e93317b35c28dcdd836b66d903  /tmp/stage1-package.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stage1-package.tar.gz -C .

          package_dir='docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization'
          test -f '.github/workflows/custodial-v43-record-envelope-canonicalization.yml'
          cp '.github/workflows/custodial-v43-record-envelope-canonicalization.yml' "$package_dir/canonicalization-workflow.yml.staged"
          rm '.github/workflows/custodial-v43-record-envelope-canonicalization.yml'

          git rm -r .stage1-bootstrap
          git add "$package_dir"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Install Phase-1 record envelope package documentation'
          git push origin "HEAD:${target_branch}"
