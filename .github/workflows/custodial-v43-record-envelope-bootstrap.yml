name: Custodial v4.3 Record Envelope Package Bootstrap

# PR synchronization trigger after the stacked draft PR exists.
on:
  push:
    branches:
      - agent/custodial-v43-phase1-record-envelope-canonicalization-20260806
    paths:
      - ".stage1-bootstrap/**"
      - ".github/workflows/custodial-v43-record-envelope-bootstrap.yml"
  pull_request:
    branches:
      - agent/custodial-v43-remote-foundation-phase1-correction-20260806
    types: [opened, synchronize, reopened]
    paths:
      - ".stage1-bootstrap/**"
      - ".github/workflows/custodial-v43-record-envelope-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: custodial-v43-record-envelope-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  install-exact-package:
    if: github.event_name == 'push' || github.head_ref == 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact reviewed package
        shell: bash
        run: |
          set -euo pipefail
          cat .stage1-bootstrap/chunk-*.b64 > /tmp/stage1-package.tar.gz.b64
          echo '04f2cef17bb3bebaf41759c3eef6de6cd9f075bc9e8b211f51641305e5ca5f20  /tmp/stage1-package.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/stage1-package.tar.gz.b64 > /tmp/stage1-package.tar.gz
          echo 'deb12708a76d9892310ffa22a20ba7921978f0e93317b35c28dcdd836b66d903  /tmp/stage1-package.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stage1-package.tar.gz -C .

      - name: Replace transport chunks with final package
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$target_branch" = 'agent/custodial-v43-phase1-record-envelope-canonicalization-20260806'
          git rm -r .stage1-bootstrap
          git rm .github/workflows/custodial-v43-record-envelope-bootstrap.yml
          git add .github/workflows/custodial-v43-record-envelope-canonicalization.yml
          git add docs/audits/custodial-unified-v4-3-architecture/record-envelope-canonicalization
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Phase-1 record envelope canonicalization package'
          git push origin "HEAD:${target_branch}"
