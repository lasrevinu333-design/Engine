name: Custodial Simple v23 Audit Repair Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-audit-findings:
    if: github.head_ref == 'agent/custodial-moto-g-simple-v23-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MZ_BUILD_NUMBER: "23"
      MZ_RELEASE_VERSION: 1.0.0
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/custodial-moto-g-simple-v23-20260802
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact toolchain and dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Apply deterministic source and contract repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f scripts/run-custodial-v23-audit-repair.py
          python3 scripts/run-custodial-v23-audit-repair.py
          git config user.name "custodial-v23-audit-repair"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Repair source-complete Custodial v23 audit findings"
          echo "MZ_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify deterministic ChatScope output
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run --silent build:chatscope
          git diff --exit-code -- chatscope-messenger.js chatscope-messenger.css

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run every source and contract test
        shell: bash
        run: |
          set -Eeuo pipefail
          status=0
          for test_file in scripts/*.mjs; do
            printf '\n===== %s =====\n' "$test_file"
            if node "$test_file"; then
              printf 'PASS %s\n' "$test_file"
            else
              printf 'FAIL %s\n' "$test_file"
              status=1
            fi
          done
          exit "$status"

      - name: Run mobile contracts and build the real Custodial distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run --silent test:mobile
          npm run --silent build:custodial
          node scripts/custodial-simple-v23-contract-tests.mjs
          node scripts/custodial-native-notification-coordinator-tests.mjs
          node scripts/custodial-no-qr-contract-tests.mjs
          node scripts/custodial-scan-v23-contract-tests.mjs

      - name: Push only the verified repair commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git push origin HEAD:agent/custodial-moto-g-simple-v23-20260802
