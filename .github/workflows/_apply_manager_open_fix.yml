name: Apply Open Manager Hub Frontend Fix

on:
  push:
    branches:
      - fix/open-manager-hubs-20260715
    paths:
      - .github/workflows/_apply_manager_open_fix.yml

permissions:
  contents: write

concurrency:
  group: open-manager-hub-frontend-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply audited source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/manager-open-payload/chunk_* | base64 --decode > /tmp/manager-open-frontend.tar.gz
          printf '%s  %s\n' '251daca0b7be089be27055a8c40cb55adebfe1d19d471b34d102c2af2bda5b1f' /tmp/manager-open-frontend.tar.gz | sha256sum --check
          tar -xzf /tmp/manager-open-frontend.tar.gz -C .
          git diff --check

      - name: Run complete frontend regression gate
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.mjs; do
            node "$test_file"
          done
          for file in ./*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          failures=[]
          for html_path in sorted(Path('.').glob('*.html')):
              text=html_path.read_text(encoding='utf-8',errors='replace')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,flags=re.I)
              for index,script in enumerate(scripts,start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as handle:
                      handle.write(script)
                      temp_path=handle.name
                  result=subprocess.run(['node','--check',temp_path],capture_output=True,text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html_path}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('INLINE_HTML_SYNTAX_PASS')
          PY

      - name: Commit only tested application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/_apply_manager_open_fix.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Open full and read-only manager hubs without passwords'
          git push origin "HEAD:${GITHUB_REF_NAME}"
