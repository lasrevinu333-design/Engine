name: Apply Manager Notification Frontend Batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.batch/frontend.*'
      - '.github/workflows/apply-manager-notification-frontend-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact audited frontend batch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch/frontend.* | base64 -d | gzip -dc > /tmp/manager-notification-frontend.patch
          patch -p1 --forward --batch < /tmp/manager-notification-frontend.patch
          git checkout HEAD -- .github/workflows/apply-manager-notification-frontend-batch.yml
          rm -rf .batch
          git diff --check
      - name: Build generated mobile and ChatScope assets
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm install --no-audit --no-fund
          npm test
          npm run build:manager
          npm run build:viewer
          cd ..
          rm -rf mobile/mobile-dist
          node scripts/refresh-frontend-release-manifest.mjs
          git diff --check
      - name: Commit batch to pull-request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add manager notification settings and Firebase delivery'
          git push origin HEAD:"$HEAD_BRANCH"
