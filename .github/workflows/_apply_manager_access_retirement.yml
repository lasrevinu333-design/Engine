name: Apply Manager Access Retirement

on:
  push:
    branches: [fix/retire-readonly-and-lock-ai-20260716]

permissions:
  contents: write

concurrency:
  group: apply-manager-access-retirement
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retire-readonly-and-lock-ai-20260716
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --unidiff-zero .repair/manager-access-retirement.patch
          git apply --unidiff-zero .repair/manager-access-retirement.patch
          rm .repair/manager-access-retirement.patch
          rmdir .repair
          git diff --check
      - name: Run complete frontend regression matrix
        shell: bash
        run: |
          set -euo pipefail
          node --check memphis-auth.js
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          for name in ['gemini-admin.html','start_page1.html','ops-manager-hub.html']:
              text=Path(name).read_text()
              for index,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I),1):
                  if not script.strip():
                      continue
                  target=Path('/tmp')/f'{name}.{index}.js'
                  target.write_text(script)
                  result=subprocess.run(['node','--check',str(target)],capture_output=True,text=True)
                  if result.returncode:
                      print(result.stderr)
                      sys.exit(result.returncode)
          print('INLINE_SCRIPT_SYNTAX_PASS')
          PY
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_apply_manager_access_retirement.yml
          git add -A
          git config user.name 'custodial-foundation-bot'
          git config user.email 'custodial-foundation-bot@users.noreply.github.com'
          git commit -m 'fix: retire read-only hub and lock AI consoles [skip ci]'
          git push origin HEAD:fix/retire-readonly-and-lock-ai-20260716
