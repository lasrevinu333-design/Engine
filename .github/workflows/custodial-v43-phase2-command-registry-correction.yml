name: Custodial v4.3 Phase-2 Command Registry Correction

on:
  push:
    branches:
      - agent/custodial-v43-phase1-acceptance-phase2-architecture-20260807

permissions:
  contents: write

concurrency:
  group: custodial-v43-phase2-command-registry-correction
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[phase2-command-registry-corrected]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase-2 correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/custodial-v43-phase1-acceptance-phase2-architecture-20260807

      - name: Generate exhaustive command and transition contracts
        shell: bash
        env:
          CORRECTION_INPUT_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from collections import Counter, defaultdict, deque
          from pathlib import Path

          ROOT=Path('docs/audits/custodial-unified-v4-3-architecture/phase2-operational-architecture')
          ROOT.mkdir(parents=True,exist_ok=True)

          base_context=[
              'principal_id','credential_id','session_id','grant_id','authorization_decision_id',
              'authority_set_id','authority_set_generation','command_id','expected_aggregate_sequence',
              'canonical_payload_digest','issued_at','producer_version'
          ]

          commands=[]
          machines={}
          requirements=[]

          def family(prefix, domain, aggregate, machine_id, states, principal, grant, rows, extra_context=None, invariants=None):
              if machine_id in machines:
                  raise SystemExit(f'duplicate state machine {machine_id}')
              transitions=[]
              required_ids=[]
              for row in rows:
                  suffix,from_states,to_state,failure,recovery=row[:5]
                  options=row[5] if len(row)>5 else {}
                  command_id=f'CMD-{prefix}-{suffix}'
                  required_ids.append(command_id)
                  transition_id=f'TRANS-{command_id[4:]}'
                  command_principal=options.get('principal',principal)
                  command_grant=options.get('grant',grant)
                  context=base_context+list(extra_context or [])+list(options.get('context',[]))
                  prohibited=list(options.get('prohibited_effects',[]))
                  emitted=list(options.get('emitted_records',[f'{aggregate}.event.v1']))
                  physical=list(options.get('physical_proofs',[]))
                  automated=list(options.get('automated_proofs',[
                      f'positive:{command_id}',f'denial:{command_id}',f'idempotency:{command_id}',f'recovery:{command_id}'
                  ]))
                  recovery_commands=list(recovery)
                  command={
                      'id':command_id,
                      'domain':domain,
                      'aggregate':aggregate,
                      'state_machine':machine_id,
                      'principal':command_principal,
                      'credential_context':'named, unexpired, unrevoked credential and bounded live session unless this is a registered service principal command',
                      'grant':command_grant,
                      'authorization_decision':'append-only decision bound to actor, credential, grant, resource, action, policy revision and authority set',
                      'input_record':f'{aggregate}.command.v1',
                      'output_records':emitted,
                      'record_version':1,
                      'required_context':sorted(set(context)),
                      'allowed_from_states':list(from_states),
                      'success_state':to_state,
                      'expected_sequence':'exact current aggregate sequence; no server-side guessing or current-state actor reconstruction',
                      'transaction_boundary':'authorization decision, command acceptance, event append, aggregate sequence, immutable evidence and outbox intents commit atomically; external effects reconcile separately',
                      'idempotency':'immutable command_id, aggregate_id, expected_sequence and canonical payload digest',
                      'failure_codes':list(failure),
                      'retry_policy':'only classified transient transport/provider failures; authorization, identity, sequence, generation and invariant failures are terminal or quarantined',
                      'quarantine_conditions':['actor mismatch','credential or assignment epoch mismatch','authority-set mismatch','sequence conflict','unknown record version','ambiguous external side effect'],
                      'recovery_command_ids':recovery_commands,
                      'prohibited_effects':prohibited,
                      'automated_proofs':automated,
                      'physical_proofs':physical,
                      'gate_ids':['GATE-PHASE2-COMMAND-COVERAGE','GATE-PHASE2-SOURCE-DISPOSITION'],
                  }
                  commands.append(command)
                  transitions.append({
                      'id':transition_id,
                      'command_id':command_id,
                      'from_states':list(from_states),
                      'to_state':to_state,
                      'failure_states':options.get('failure_states',[]),
                      'guard':'authorization allowed, exact sequence, compatible authority set, registered record version and domain invariants all pass',
                      'atomic':True,
                  })
              machines[machine_id]={
                  'id':machine_id,
                  'domain':domain,
                  'aggregate':aggregate,
                  'states':list(states),
                  'initial_state':states[0],
                  'terminal_states':list(states[-2:]) if len(states)>2 else [states[-1]],
                  'transitions':transitions,
                  'invariants':list(invariants or []),
              }
              requirements.append({
                  'family_id':f'FAMILY-{prefix}',
                  'domain':domain,
                  'aggregate':aggregate,
                  'state_machine':machine_id,
                  'required_command_ids':required_ids,
                  'required_states':list(states),
                  'coverage_rule':'exact command-ID and transition closure; no count-only substitution',
              })

          family('AUTHSET','AUTHORITY_SET','authority-set','SM-AUTHORITY-SET',
              ['DRAFT','PREPARED','VALIDATED','ACTIVATING','ACTIVE','DRAINING','QUARANTINED','ROLLBACK_PENDING','ROLLED_BACK','RETIRED'],
              'P-RELEASE','GRANT-RELEASE',[
              ('PREPARE',['DRAFT'],'PREPARED',['E-AUTHSET-PRECONDITION'],['CMD-AUTHSET-ROLLBACK-REQUEST']),
              ('VALIDATE',['PREPARED'],'VALIDATED',['E-AUTHSET-INCOMPATIBLE'],['CMD-AUTHSET-ROLLBACK-REQUEST']),
              ('ACTIVATE',['VALIDATED'],'ACTIVATING',['E-AUTHSET-FENCE'],['CMD-AUTHSET-QUARANTINE-MIXED','CMD-AUTHSET-ROLLBACK-REQUEST']),
              ('CONFIRM-ACTIVE',['ACTIVATING'],'ACTIVE',['E-AUTHSET-HEALTH-QUORUM'],['CMD-AUTHSET-QUARANTINE-MIXED','CMD-AUTHSET-ROLLBACK-REQUEST']),
              ('DRAIN-PRIOR',['ACTIVE'],'DRAINING',['E-AUTHSET-LEASE-DRAIN'],['CMD-AUTHSET-QUARANTINE-MIXED']),
              ('QUARANTINE-MIXED',['ACTIVATING','ACTIVE','DRAINING'],'QUARANTINED',['E-AUTHSET-QUARANTINE'],['CMD-AUTHSET-ROLLBACK-REQUEST']),
              ('ROLLBACK-REQUEST',['PREPARED','VALIDATED','ACTIVATING','ACTIVE','DRAINING','QUARANTINED'],'ROLLBACK_PENDING',['E-ROLLBACK-PRECONDITION'],['CMD-AUTHSET-ROLLBACK-EXECUTE']),
              ('ROLLBACK-EXECUTE',['ROLLBACK_PENDING'],'ROLLED_BACK',['E-ROLLBACK-INCOMPLETE'],['CMD-AUTHSET-QUARANTINE-MIXED']),
              ('RETIRE-PRIOR',['DRAINING','ROLLED_BACK'],'RETIRED',['E-AUTHSET-PRIOR-WORK'],['CMD-AUTHSET-QUARANTINE-MIXED']),
          ],extra_context=['dependency_graph_digest','compatibility_matrix_digest','fence_token','release_tuple_id','rollback_tuple_id'],invariants=[
              'no consumer-local fallback','every request and queued operation pins one authority-set generation','partial activation cannot become ACTIVE','rollback restores one complete compatible set'
          ])

          family('PRINCIPAL','PRINCIPAL_CREDENTIAL_GRANT','principal','SM-PRINCIPAL',
              ['UNREGISTERED','ACTIVE','REVOKED','RETIRED'],'P-SECURITY-ADMIN','GRANT-SECURITY-ADMIN',[
              ('REGISTER',['UNREGISTERED'],'ACTIVE',['E-PRINCIPAL-DUPLICATE'],['CMD-PRINCIPAL-REVOKE']),
              ('REVOKE',['ACTIVE'],'REVOKED',['E-PRINCIPAL-REVOCATION'],[]),
              ('RETIRE',['REVOKED'],'RETIRED',['E-PRINCIPAL-DEPENDENCY'],[]),
          ],extra_context=['principal_class','resource_scope'],invariants=['human, service, synthetic and public principals are distinct','revocation closes future authority without rewriting prior evidence'])

          family('CREDENTIAL','PRINCIPAL_CREDENTIAL_GRANT','credential','SM-CREDENTIAL',
              ['UNISSUED','ACTIVE','ROTATING','REVOKED','EXPIRED'],'P-SECURITY-ADMIN','GRANT-SECURITY-ADMIN',[
              ('ISSUE',['UNISSUED'],'ACTIVE',['E-CREDENTIAL-ISSUE'],['CMD-CREDENTIAL-REVOKE']),
              ('ROTATE-BEGIN',['ACTIVE'],'ROTATING',['E-CREDENTIAL-ROTATE'],['CMD-CREDENTIAL-REVOKE']),
              ('ROTATE-COMPLETE',['ROTATING'],'ACTIVE',['E-CREDENTIAL-ROTATE-COMPLETE'],['CMD-CREDENTIAL-REVOKE']),
              ('REVOKE',['ACTIVE','ROTATING'],'REVOKED',['E-CREDENTIAL-REVOCATION'],[]),
              ('EXPIRE',['ACTIVE'],'EXPIRED',['E-CREDENTIAL-EXPIRY'],[]),
          ],extra_context=['principal_id','credential_class','assignment_epoch'],invariants=['no credential substitutes for actor identity','application runtime never possesses migration, backup, restore or release credentials'])

          family('MGRSESSION','PRINCIPAL_CREDENTIAL_GRANT','manager-session','SM-MANAGER-SESSION',
              ['CLOSED','ACTIVE','REFRESH_REQUIRED','REVOKED','EXPIRED'],'P-MANAGER','GRANT-MANAGER',[
              ('OPEN',['CLOSED'],'ACTIVE',['E-SESSION-AUTH'],['CMD-MGRSESSION-CLOSE']),
              ('REQUIRE-REFRESH',['ACTIVE'],'REFRESH_REQUIRED',['E-SESSION-STALE'],['CMD-MGRSESSION-REFRESH']),
              ('REFRESH',['REFRESH_REQUIRED'],'ACTIVE',['E-SESSION-REFRESH'],['CMD-MGRSESSION-CLOSE']),
              ('CLOSE',['ACTIVE','REFRESH_REQUIRED'],'CLOSED',['E-SESSION-CLOSE'],[]),
              ('REVOKE',['ACTIVE','REFRESH_REQUIRED'],'REVOKED',['E-SESSION-REVOKE'],[]),
              ('EXPIRE',['ACTIVE','REFRESH_REQUIRED'],'EXPIRED',['E-SESSION-EXPIRE'],[]),
          ],extra_context=['trusted_device_id','manager_id'],invariants=['browser-supplied user identity cannot override named session principal'])

          family('GRANT','PRINCIPAL_CREDENTIAL_GRANT','grant','SM-GRANT',
              ['ABSENT','ACTIVE','REVOKED','EXPIRED'],'P-SECURITY-ADMIN','GRANT-SECURITY-ADMIN',[
              ('ISSUE',['ABSENT'],'ACTIVE',['E-GRANT-SCOPE'],['CMD-GRANT-REVOKE']),
              ('REVOKE',['ACTIVE'],'REVOKED',['E-GRANT-REVOKE'],[]),
              ('EXPIRE',['ACTIVE'],'EXPIRED',['E-GRANT-EXPIRE'],[]),
          ],extra_context=['capability_id','resource_scope','effective_at','expires_at'],invariants=['default deny','manager role does not imply database, release, backup, restore or device-security authority'])

          family('LOCATION','LOCATION_LIFECYCLE','location','SM-LOCATION',
              ['ABSENT','ACTIVE','TEMPORARILY_CLOSED','TRANSITION_PENDING','RETIRED'],'P-MANAGER','GRANT-LOCATION-ADMIN',[
              ('CREATE',['ABSENT'],'ACTIVE',['E-LOCATION-DUPLICATE'],['CMD-LOCATION-RETIRE']),
              ('RENAME',['ACTIVE'],'ACTIVE',['E-LOCATION-ALIAS'],['CMD-LOCATION-TRANSITION-RECONCILE']),
              ('TEMP-CLOSE',['ACTIVE'],'TEMPORARILY_CLOSED',['E-LOCATION-INFLIGHT'],['CMD-LOCATION-REOPEN']),
              ('REOPEN',['TEMPORARILY_CLOSED'],'ACTIVE',['E-LOCATION-REOPEN'],['CMD-LOCATION-TRANSITION-RECONCILE']),
              ('SPLIT',['ACTIVE'],'TRANSITION_PENDING',['E-LOCATION-SPLIT'],['CMD-LOCATION-TRANSITION-RECONCILE']),
              ('MERGE',['ACTIVE'],'TRANSITION_PENDING',['E-LOCATION-MERGE'],['CMD-LOCATION-TRANSITION-RECONCILE']),
              ('TRANSITION-RECONCILE',['TRANSITION_PENDING'],'ACTIVE',['E-LOCATION-RECONCILE'],['CMD-LOCATION-RETIRE']),
              ('RETIRE',['ACTIVE','TEMPORARILY_CLOSED','TRANSITION_PENDING'],'RETIRED',['E-LOCATION-INFLIGHT'],[]),
          ],extra_context=['location_id','effective_at','location_revision','tag_revision','inflight_work_snapshot'],invariants=['stable location identity survives rename','split and merge never reinterpret prior work using current state'])

          family('TAG','LOCATION_LIFECYCLE','tag','SM-TAG',
              ['UNBOUND','ACTIVE','REVOKED','REPLACED'],'P-DEVICE-SECURITY','GRANT-TAG-ADMIN',[
              ('BIND',['UNBOUND'],'ACTIVE',['E-TAG-DUPLICATE'],['CMD-TAG-REVOKE']),
              ('REVOKE',['ACTIVE'],'REVOKED',['E-TAG-REVOKE'],[]),
              ('REPLACE',['ACTIVE','REVOKED'],'REPLACED',['E-TAG-REPLACE'],[]),
          ],extra_context=['tag_id','ndef_payload_digest','location_id','effective_at'],invariants=['old and revoked tags fail safely and create manager-visible evidence'])

          family('SOURCE','SCHEDULE_OWNERSHIP','static-source-publication','SM-STATIC-SOURCE',
              ['UNREGISTERED','REGISTERED','NORMALIZED','REVIEW_REQUIRED','APPROVED','PUBLISHED','SUPERSEDED'],'P-MANAGER','GRANT-SCHEDULE-PUBLISH',[
              ('REGISTER',['UNREGISTERED'],'REGISTERED',['E-SOURCE-PROVENANCE'],['CMD-SOURCE-SUPERSEDE']),
              ('NORMALIZE',['REGISTERED'],'NORMALIZED',['E-SOURCE-NORMALIZE'],['CMD-SOURCE-REVIEW-REQUIRED']),
              ('REVIEW-REQUIRED',['NORMALIZED'],'REVIEW_REQUIRED',['E-SOURCE-MAPPING'],['CMD-SOURCE-APPROVE']),
              ('APPROVE',['NORMALIZED','REVIEW_REQUIRED'],'APPROVED',['E-SOURCE-APPROVAL'],['CMD-SOURCE-SUPERSEDE']),
              ('PUBLISH',['APPROVED'],'PUBLISHED',['E-SOURCE-PUBLISH'],['CMD-SOURCE-SUPERSEDE']),
              ('SUPERSEDE',['REGISTERED','NORMALIZED','REVIEW_REQUIRED','APPROVED','PUBLISHED'],'SUPERSEDED',['E-SOURCE-SUPERSEDE'],[]),
          ],extra_context=['source_artifact_digest','normalization_digest','approval_id','effective_date'],invariants=['filename carries no authority','candidate workbook cannot publish without approved provenance'])

          family('OWNERSHIP','SCHEDULE_OWNERSHIP','ownership','SM-OWNERSHIP',
              ['ABSENT','ACTIVE','TRANSFER_PENDING','OPEN','CORRECTED','ENDED'],'P-MANAGER','GRANT-OWNERSHIP',[
              ('ASSIGN',['ABSENT','OPEN'],'ACTIVE',['E-OWNERSHIP-CONFLICT'],['CMD-OWNERSHIP-CORRECT']),
              ('TRANSFER-REQUEST',['ACTIVE'],'TRANSFER_PENDING',['E-OWNERSHIP-TRANSFER'],['CMD-OWNERSHIP-CORRECT']),
              ('TRANSFER-COMPLETE',['TRANSFER_PENDING'],'ACTIVE',['E-OWNERSHIP-TRANSFER-COMPLETE'],['CMD-OWNERSHIP-CORRECT']),
              ('DECLARE-OPEN',['ABSENT','ACTIVE','TRANSFER_PENDING'],'OPEN',['E-OPEN-INVALID'],['CMD-OWNERSHIP-ASSIGN']),
              ('CORRECT',['ACTIVE','TRANSFER_PENDING','OPEN'],'CORRECTED',['E-OWNERSHIP-CORRECTION'],['CMD-OWNERSHIP-ASSIGN']),
              ('END',['ACTIVE','CORRECTED'],'ENDED',['E-OWNERSHIP-INFLIGHT'],[]),
          ],extra_context=['location_id','effective_interval','owner_principal_id','ownership_revision','reason_graph'],invariants=['aggregate is ownership, never device','work request does not transfer ownership','owner, active cleaner and actual cleaner remain distinct'])

          family('OCCURRENCE','FIELD_WORK_OCCURRENCE','service-occurrence','SM-OCCURRENCE',
              ['PLANNED','DUE','CLAIMED','IN_PROGRESS','SATISFIED','CORRECTED','REOPENED','NOT_REQUIRED','CANCELLED'],'P-EMPLOYEE','GRANT-EMPLOYEE-WORK',[
              ('CREATE',['PLANNED'],'DUE',['E-OCCURRENCE-REQUIREMENT'],['CMD-OCCURRENCE-CANCEL']),
              ('CLAIM',['DUE','REOPENED'],'CLAIMED',['E-OCCURRENCE-CLAIMED'],['CMD-OCCURRENCE-RELEASE-CLAIM']),
              ('RELEASE-CLAIM',['CLAIMED'],'DUE',['E-OCCURRENCE-RELEASE'],[]),
              ('START',['CLAIMED'],'IN_PROGRESS',['E-OCCURRENCE-START'],['CMD-OCCURRENCE-RELEASE-CLAIM']),
              ('SATISFY',['IN_PROGRESS'],'SATISFIED',['E-OCCURRENCE-SATISFACTION'],['CMD-OCCURRENCE-CORRECT']),
              ('CORRECT',['SATISFIED'],'CORRECTED',['E-OCCURRENCE-CORRECTION'],['CMD-OCCURRENCE-REOPEN']),
              ('REOPEN',['SATISFIED','CORRECTED'],'REOPENED',['E-OCCURRENCE-REOPEN'],['CMD-OCCURRENCE-CANCEL']),
              ('NOT-REQUIRED',['PLANNED','DUE','REOPENED'],'NOT_REQUIRED',['E-OCCURRENCE-NOT-REQUIRED'],[]),
              ('NEXT-CREATE',['SATISFIED','CORRECTED','NOT_REQUIRED'],'PLANNED',['E-OCCURRENCE-NEXT-DUPLICATE'],['CMD-OCCURRENCE-CORRECT']),
              ('CANCEL',['PLANNED','DUE','CLAIMED','REOPENED'],'CANCELLED',['E-OCCURRENCE-CANCEL'],[]),
          ],extra_context=['occurrence_id','requirement_revision','ownership_revision','actual_cleaner_snapshot'],invariants=['exactly one next occurrence','scan/start, notification interaction and message read never satisfy work'])

          family('FIELDSESSION','FIELD_WORK_OCCURRENCE','service-session','SM-FIELD-SESSION',
              ['ABSENT','ACTIVE','PAUSED','FINISHED','CANCELLED','QUARANTINED'],'P-EMPLOYEE','GRANT-EMPLOYEE-WORK',[
              ('START',['ABSENT'],'ACTIVE',['E-SESSION-ACTIVE-CONFLICT'],['CMD-FIELDSESSION-CANCEL']),
              ('CHECKPOINT',['ACTIVE','PAUSED'],'ACTIVE',['E-SESSION-CHECKPOINT'],['CMD-FIELDSESSION-QUARANTINE']),
              ('PAUSE',['ACTIVE'],'PAUSED',['E-SESSION-PAUSE'],['CMD-FIELDSESSION-RESUME']),
              ('RESUME',['PAUSED'],'ACTIVE',['E-SESSION-RESUME'],['CMD-FIELDSESSION-QUARANTINE']),
              ('FINISH',['ACTIVE','PAUSED'],'FINISHED',['E-SESSION-FINISH'],['CMD-FIELDSESSION-QUARANTINE']),
              ('CANCEL',['ACTIVE','PAUSED'],'CANCELLED',['E-SESSION-CANCEL'],[]),
              ('TAKEOVER',['ACTIVE','PAUSED'],'QUARANTINED',['E-SESSION-TAKEOVER'],['CMD-FIELDSESSION-RESUME']),
              ('QUARANTINE',['ACTIVE','PAUSED'],'QUARANTINED',['E-SESSION-QUARANTINE'],['CMD-FIELDSESSION-RESUME']),
          ],extra_context=['employee_principal_id','device_id','assignment_epoch','location_id','tag_revision','occurrence_id','ownership_revision','trusted_time_evidence'],invariants=['active work survives screen off, process death and ordinary network interruption','reassignment cannot silently change actual cleaner'])

          family('OFFLINE','FIELD_WORK_OCCURRENCE','offline-operation','SM-OFFLINE-OPERATION',
              ['LOCAL_PENDING','SYNCING','ACCEPTED','DUPLICATE','RETRYABLE','CONFLICT','QUARANTINED','DISCARDED'],'P-APP-WORKER','GRANT-OFFLINE-RECONCILE',[
              ('ENQUEUE',['LOCAL_PENDING'],'LOCAL_PENDING',['E-OFFLINE-LOCAL-STORE'],['CMD-OFFLINE-DISCARD-AUTHORIZED']),
              ('SYNC',['LOCAL_PENDING','RETRYABLE'],'SYNCING',['E-OFFLINE-TRANSPORT'],['CMD-OFFLINE-RETRY']),
              ('ACCEPT',['SYNCING'],'ACCEPTED',['E-OFFLINE-ACTOR-MISMATCH'],['CMD-OFFLINE-QUARANTINE']),
              ('MARK-DUPLICATE',['SYNCING'],'DUPLICATE',['E-IDEMPOTENCY-COLLISION'],['CMD-OFFLINE-QUARANTINE']),
              ('RETRY',['SYNCING','RETRYABLE'],'RETRYABLE',['E-OFFLINE-TRANSIENT'],['CMD-OFFLINE-SYNC']),
              ('CONFLICT',['SYNCING'],'CONFLICT',['E-OFFLINE-CONFLICT'],['CMD-OFFLINE-QUARANTINE']),
              ('QUARANTINE',['LOCAL_PENDING','SYNCING','RETRYABLE','CONFLICT'],'QUARANTINED',['E-OFFLINE-QUARANTINE'],[]),
              ('DISCARD-AUTHORIZED',['LOCAL_PENDING','RETRYABLE','CONFLICT','QUARANTINED'],'DISCARDED',['E-OFFLINE-DISCARD-DENIED'],[]),
          ],extra_context=['original_employee_principal_id','original_credential_id','original_assignment_epoch','location_revision','tag_revision','ownership_revision','occurrence_id','original_authority_set_id','original_authority_set_generation','trusted_time_evidence','payload_digest'],invariants=['server never reconstructs original actor from current device assignment','pending evidence is never deleted before authoritative acknowledgment or named manager recovery'])

          family('COMPLETION','COMPLETION_ISSUES_TICKETS','completion','SM-COMPLETION',
              ['DRAFT','SUBMITTED','ACCEPTED','CORRECTED','VOIDED'],'P-EMPLOYEE','GRANT-EMPLOYEE-WORK',[
              ('SUBMIT',['DRAFT'],'SUBMITTED',['E-COMPLETION-VALIDATION'],['CMD-COMPLETION-VOID']),
              ('ACCEPT',['SUBMITTED'],'ACCEPTED',['E-COMPLETION-SEQUENCE'],['CMD-COMPLETION-CORRECT']),
              ('CORRECT',['ACCEPTED'],'CORRECTED',['E-COMPLETION-CORRECTION'],['CMD-COMPLETION-VOID']),
              ('VOID',['SUBMITTED','ACCEPTED','CORRECTED'],'VOIDED',['E-COMPLETION-VOID'],[]),
          ],extra_context=['session_id','occurrence_id','actual_cleaner_principal_id','services_taxonomy_revision','evidence_digest'],invariants=['completion, issues, tickets, occurrence decision and outbox intents commit atomically'])

          family('ISSUE','COMPLETION_ISSUES_TICKETS','issue','SM-ISSUE',
              ['OPEN','ACKNOWLEDGED','RESOLVED','REOPENED'],'P-EMPLOYEE','GRANT-ISSUE-RECORD',[
              ('RECORD',['OPEN'],'OPEN',['E-ISSUE-VALIDATION'],['CMD-ISSUE-CORRECT']),
              ('ACKNOWLEDGE',['OPEN','REOPENED'],'ACKNOWLEDGED',['E-ISSUE-ACK'],['CMD-ISSUE-REOPEN']),
              ('RESOLVE',['OPEN','ACKNOWLEDGED','REOPENED'],'RESOLVED',['E-ISSUE-RESOLVE'],['CMD-ISSUE-REOPEN']),
              ('REOPEN',['RESOLVED','ACKNOWLEDGED'],'REOPENED',['E-ISSUE-REOPEN'],[]),
              ('CORRECT',['OPEN','ACKNOWLEDGED','RESOLVED','REOPENED'],'OPEN',['E-ISSUE-CORRECT'],[]),
          ],extra_context=['location_id','completion_id','issue_taxonomy_revision'],invariants=['issue record does not transfer ownership or automatically satisfy occurrence'])

          family('TICKET','COMPLETION_ISSUES_TICKETS','custodial-ticket','SM-CUSTODIAL-TICKET',
              ['OPEN','WO_SUBMITTED','VOIDED'],'P-MANAGER','GRANT-TICKET',[
              ('CREATE',['OPEN'],'OPEN',['E-TICKET-VALIDATION'],['CMD-TICKET-VOID']),
              ('MARK-WO-SUBMITTED',['OPEN'],'WO_SUBMITTED',['E-TICKET-WO-SUBMIT'],[]),
              ('VOID',['OPEN'],'VOIDED',['E-TICKET-VOID'],[]),
          ],extra_context=['issue_id','location_id','external_work_order_reference'],invariants=['W.O. Submitted is the custodial terminal handoff; it is not external repair completion'])

          family('WORKREQUEST','COMPLETION_ISSUES_TICKETS','work-request','SM-WORK-REQUEST',
              ['OPEN','ACCEPTED','COMPLETED','CANCELLED'],'P-MANAGER','GRANT-WORK-REQUEST',[
              ('CREATE',['OPEN'],'OPEN',['E-WORK-REQUEST-VALIDATION'],['CMD-WORKREQUEST-CANCEL']),
              ('ACCEPT',['OPEN'],'ACCEPTED',['E-WORK-REQUEST-ACCEPT'],['CMD-WORKREQUEST-CANCEL']),
              ('COMPLETE',['ACCEPTED'],'COMPLETED',['E-WORK-REQUEST-COMPLETE'],[]),
              ('CANCEL',['OPEN','ACCEPTED'],'CANCELLED',['E-WORK-REQUEST-CANCEL'],[]),
          ],extra_context=['location_id','requested_principal_id','original_owner_revision'],invariants=['work request never transfers ownership'])

          family('NOTIF','NOTIFICATION','notification-intent','SM-NOTIFICATION-INTENT',
              ['CREATED','GROUPED','RECIPIENT_RESOLVED','READY','SENT','DELIVERED','PRESENTED','ACKNOWLEDGED','SUPERSEDED','CANCELLED','ESCALATED','RECONCILIATION_REQUIRED'],'P-NOTIFICATION-WORKER','GRANT-NOTIFICATION-WORKER',[
              ('CREATE',['CREATED'],'CREATED',['E-NOTIF-INTENT'],['CMD-NOTIF-CANCEL']),
              ('GROUP',['CREATED'],'GROUPED',['E-NOTIF-GROUP'],['CMD-NOTIF-CANCEL']),
              ('RESOLVE-RECIPIENT',['CREATED','GROUPED'],'RECIPIENT_RESOLVED',['E-NOTIF-RECIPIENT'],['CMD-NOTIF-SUPERSEDE']),
              ('READY',['RECIPIENT_RESOLVED'],'READY',['E-NOTIF-AUTHORITY'],['CMD-NOTIF-SUPERSEDE']),
              ('SEND',['READY'],'SENT',['E-PROVIDER-AMBIGUOUS'],['CMD-NOTIF-RECONCILE-PROVIDER']),
              ('RECORD-DELIVERY',['SENT'],'DELIVERED',['E-NOTIF-DELIVERY'],['CMD-NOTIF-RECONCILE-PROVIDER']),
