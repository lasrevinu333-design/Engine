name: Verify Device Credential Frontend Live

on:
  push:
    branches:
      - verify/device-credentials-live-20260715
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Poll published frontend
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            'https://lasrevinu333-design.github.io/Engine'
            'https://memphis-zoo-mcp.onrender.com'
          )
          for attempt in $(seq 1 20); do
            for root in "${roots[@]}"; do
              identity="$(curl -fsSL --max-time 30 "$root/memphis-device-identity.js?verify=$attempt" || true)"
              security="$(curl -fsSL --max-time 30 "$root/device-security.html?verify=$attempt" || true)"
              hub="$(curl -fsSL --max-time 30 "$root/start_page1.html?verify=$attempt" || true)"
              printf 'attempt=%s root=%s identity=%s security=%s hub=%s\n' "$attempt" "$root" "${#identity}" "${#security}" "${#hub}"
              if grep -q 'release-2026.07.15.device-credentials.1' <<<"$identity" \
                && grep -q 'X-Device-Enrollment-Required' <<<"$identity" \
                && grep -q 'did not retain its protected cookie' <<<"$identity" \
                && grep -q 'Device Security' <<<"$security" \
                && grep -q 'device-security-link' <<<"$hub"; then
                echo "verified_root=$root"
                exit 0
              fi
            done
            sleep 20
          done
          exit 1
