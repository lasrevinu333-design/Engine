name: Batch 0A Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/batch-0a-source-export.yml"
      - "package.json"
      - "package-lock.json"
      - "mobile/**"
      - "scripts/**"
      - "tests/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Package source workspace
        shell: bash
        run: |
          tar             --exclude=.git             --exclude='*.pdf'             --exclude='engine-source.tgz'             -czf engine-source.tgz .
      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: batch-0a-engine-source
          path: engine-source.tgz
          if-no-files-found: error
          retention-days: 1
