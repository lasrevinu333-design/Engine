name: Apply audited kiosk repair

on:
  push:
    branches:
      - repair/scheduler-alerts-gps-20260714
    paths:
      - .repair/frontend_patch_chunks/**
      - .github/workflows/_apply_scheduler_repair.yml

permissions:
  contents: write

concurrency:
  group: scheduler-repair-frontend
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: bootstrap
        shell: bash
        run: |
          if compgen -G '.repair/frontend_patch_chunks/chunk_*' > /dev/null; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.bootstrap.outputs.apply == 'true'
        with:
          node-version: '22'

      - name: Reconstruct and apply audited patch
        if: steps.bootstrap.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/frontend_patch_chunks/chunk_* | base64 --decode | xz --decompress > /tmp/frontend.patch
          printf '%s  %s\n' '4c44ef01ed5bed816b3397c30ef605070819fc0999f7d3c6ed5e8326461dccb3' /tmp/frontend.patch | sha256sum --check
          git apply --check /tmp/frontend.patch
          git apply /tmp/frontend.patch

      - name: Run complete kiosk regression suite
        if: steps.bootstrap.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.mjs; do
            node "$test_file"
          done
          for file in ./*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          failures = []
          for html_path in sorted(Path('.').glob('*.html')):
              text = html_path.read_text(encoding='utf-8', errors='replace')
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', text, flags=re.I)
              for index, script in enumerate(scripts, start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                      handle.write(script)
                      temp_path = handle.name
                  result = subprocess.run(['node', '--check', temp_path], capture_output=True, text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html_path}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          if grep -R -nE 'packages\.applied|artifactory|internal\.api\.openai' . \
               --exclude-dir=.git --exclude-dir=.repair; then
            echo 'Internal build URL found in frontend source.' >&2
            exit 1
          fi

      - name: Commit tested source to repair branch
        if: steps.bootstrap.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/_apply_scheduler_repair.yml
          rm -f .github/workflows/auto-push-on-test.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Repair kiosk schedules, reminder lifecycle, GPS, and durable sync'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: No bootstrap payload remains
        if: steps.bootstrap.outputs.apply != 'true'
        run: echo 'Bootstrap payload already consumed; nothing to apply.'
