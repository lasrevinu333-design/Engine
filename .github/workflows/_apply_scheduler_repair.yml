name: Apply audited kiosk repair

on:
  push:
    branches:
      - repair/scheduler-alerts-gps-20260714
    paths:
      - .github/workflows/_apply_scheduler_repair.yml

permissions:
  contents: write

concurrency:
  group: scheduler-repair-frontend-final
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct audited source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/frontend_patch_chunks/chunk_* | base64 --decode | xz --decompress > /tmp/frontend.patch
          printf '%s  %s\n' '4c44ef01ed5bed816b3397c30ef605070819fc0999f7d3c6ed5e8326461dccb3' /tmp/frontend.patch | sha256sum --check
          git apply --check /tmp/frontend.patch
          git apply /tmp/frontend.patch
          git diff --check

      - name: Run every kiosk regression and record exact results
        id: gate
        shell: bash
        run: |
          set +e
          report=/tmp/frontend_test_diagnostics.txt
          : > "$report"
          failed=0
          printf 'node=%s\ncommit=%s\n\n' "$(node --version)" "$GITHUB_SHA" >> "$report"
          for test_file in scripts/*.mjs; do
            out="/tmp/$(basename "$test_file").log"
            node "$test_file" > "$out" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS %s\n' "$test_file" >> "$report"
            else
              failed=1
              printf '\nFAIL %s rc=%s\n' "$test_file" "$rc" >> "$report"
              tail -n 180 "$out" >> "$report"
              printf '\n' >> "$report"
            fi
          done
          for file in ./*.js; do
            node --check "$file" > /tmp/syntax.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS syntax %s\n' "$file" >> "$report"
            else
              failed=1
              printf '\nFAIL syntax %s rc=%s\n' "$file" "$rc" >> "$report"
              cat /tmp/syntax.log >> "$report"
            fi
          done
          python3 - <<'PY' > /tmp/inline.log 2>&1
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          failures=[]
          for html_path in sorted(Path('.').glob('*.html')):
              text=html_path.read_text(encoding='utf-8',errors='replace')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,flags=re.I)
              for index,script in enumerate(scripts,start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as handle:
                      handle.write(script)
                      temp_path=handle.name
                  result=subprocess.run(['node','--check',temp_path],capture_output=True,text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html_path}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('all inline HTML scripts passed node --check')
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then
            printf 'PASS inline-html-syntax\n' >> "$report"
          else
            failed=1
            printf '\nFAIL inline-html-syntax rc=%s\n' "$rc" >> "$report"
            cat /tmp/inline.log >> "$report"
          fi
          if grep -R -nE 'packages\.applied|artifactory|internal\.api\.openai' . --exclude-dir=.git --exclude-dir=.repair > /tmp/internal.log 2>&1; then
            failed=1
            printf '\nFAIL internal-build-url\n' >> "$report"
            cat /tmp/internal.log >> "$report"
          else
            printf 'PASS internal-build-url\n' >> "$report"
          fi
          printf '\nFAILED=%s\n' "$failed" >> "$report"
          cat "$report"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Publish tested source or preserve diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          if [ "${{ steps.gate.outputs.failed }}" = '0' ]; then
            rm -rf .repair
            rm -f .github/workflows/_apply_scheduler_repair.yml
            rm -f .github/workflows/auto-push-on-test.yml
            git add -A
            git diff --cached --check
            git commit -m 'Repair kiosk schedules, reminder lifecycle, GPS, and durable sync'
          else
            git reset --hard "$GITHUB_SHA"
            mkdir -p .repair
            cp /tmp/frontend_test_diagnostics.txt .repair/frontend_test_diagnostics.txt
            git add .repair/frontend_test_diagnostics.txt
            git commit -m 'Record exact kiosk repair gate diagnostics'
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
