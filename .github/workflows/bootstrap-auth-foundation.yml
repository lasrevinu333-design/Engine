name: Bootstrap authentication foundation branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bootstrap-authentication-foundation-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'foundation/security-control-plane-20260715'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Install exact audited payload when staged
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.foundation-payload/frontend/part-*' >/dev/null; then
            cat .foundation-payload/frontend/part-* > /tmp/payload.b64
            base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
            echo "f148c7cce70fb6bb4e8a2b32d500e5b18562eb0cc4c0494eb970e44d3cb125cb  /tmp/payload.tar.gz" | sha256sum -c -
            tar -xzf /tmp/payload.tar.gz
            cat > /tmp/patch_auth_html.py <<'PATCH_HTML'
          from pathlib import Path
          root=Path('.')
          old_versions=(
              'memphis-auth.js?v=release-2026.07.15.system-integration-moxie.7',
              'memphis-auth.js?v=release-2026.07.15.security-control-plane.1',
          )
          new='memphis-auth.js?v=release-2026.07.15.auth-foundation.1'
          for path in root.glob('*.html'):
              text=path.read_text(encoding='utf-8')
              for old in old_versions:
                  text=text.replace(old,new)
              path.write_text(text,encoding='utf-8')
          path=root/'ops-manager-hub.html'
          text=path.read_text(encoding='utf-8')
          for old in (
              'Full manager access opens directly. No manager password or key is required.',
              'The first visit enrolls this device with the Ops Manager password. After that, this device stays signed in.',
          ):
              text=text.replace(old,'Enter the Ops Manager password once on this device. After enrollment, both Ops Manager hubs reopen silently until this device is revoked or its browser data is cleared.')
          text=text.replace("requireOpsManagerSession({accessLevel:'full_access',redirect:false,throwOnFailure:true})","requireOpsManagerSession({accessLevel:'full_access',interactive:true,redirect:false,throwOnFailure:true})")
          path.write_text(text,encoding='utf-8')
          path=root/'ops-manager-read-only.html'
          text=path.read_text(encoding='utf-8')
          for old in (
              'The read-only manager view opens directly and cannot perform write actions.',
              'The first visit enrolls this device for read-only access. After that, this device stays signed in.',
          ):
              text=text.replace(old,'Enter the Ops Manager password once on this device to enroll read-only access. After enrollment, both Ops Manager hubs reopen silently until this device is revoked or its browser data is cleared.')
          text=text.replace("requireOpsManagerSession({accessLevel:'read_only',redirect:false,throwOnFailure:true})","requireOpsManagerSession({accessLevel:'read_only',interactive:true,redirect:false,throwOnFailure:true})")
          path.write_text(text,encoding='utf-8')
          path=root/'start_page1.html'
          text=path.read_text(encoding='utf-8')
          text=text.replace("requireOpsManagerSession({interactive:false,redirect:false})","requireOpsManagerSession({interactive:true,redirect:false})")
          text=text.replace('The Manager Hub could not create its signed browser session. Reload this page after the backend is available.','This device has not been enrolled for Ops Manager access. Open the Ops Manager Hub and enter the manager password once to trust this device.')
          path.write_text(text,encoding='utf-8')
          PATCH_HTML
            python /tmp/patch_auth_html.py
            rm -rf .foundation-payload/frontend
            rm -f .github/workflows/foundation-security-gate.yml
            git checkout HEAD -- .github/workflows/_apply-auth-foundation.yml
          fi
      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/validation-summary.txt
          node --check memphis-auth.js >/tmp/test-output.txt 2>&1 || {
            echo 'FAILED: node --check memphis-auth.js' | tee -a /tmp/validation-summary.txt
            cat /tmp/test-output.txt | tee -a /tmp/validation-summary.txt
            exit 1
          }
          for test_file in scripts/*.mjs; do
            echo "RUNNING: $test_file" >> /tmp/validation-summary.txt
            if ! node "$test_file" >/tmp/test-output.txt 2>&1; then
              echo "FAILED: $test_file" | tee -a /tmp/validation-summary.txt
              cat /tmp/test-output.txt | tee -a /tmp/validation-summary.txt
              exit 1
            fi
          done
          echo 'ALL FRONTEND TESTS PASSED' | tee -a /tmp/validation-summary.txt
      - name: Upload frontend validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-auth-validation-${{ github.run_id }}
          path: |
            /tmp/validation-summary.txt
            /tmp/test-output.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Commit validated non-workflow changes when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: establish one-time trusted-device authentication"
          git push origin HEAD:${{ github.head_ref }}
