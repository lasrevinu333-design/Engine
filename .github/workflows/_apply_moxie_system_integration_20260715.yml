name: Validate Moxie integration frontend

on:
  push:
    branches:
      - fix/moxie-system-integration-20260715
    paths:
      - .github/workflows/_apply_moxie_system_integration_20260715.yml

permissions:
  contents: write

concurrency:
  group: moxie-system-integration-frontend-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lasrevinu333-design/memphis-zoo-mcp
          ref: main
          path: _backend_fixture
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply audited source patch and extract canonical Moxie owl
        id: apply
        shell: bash
        run: |
          set +e
          report=/tmp/frontend-integration-gate.txt
          : > "$report"
          failed=0

          base64 --decode .repair/frontend.patch.gz.b64 > /tmp/frontend.patch.gz 2>>"$report" || failed=1
          printf '%s  %s\n' '20da58a1267f2ad2901ddf71fa56195a20d3be9d65438fcfc0098836d7dcf382' /tmp/frontend.patch.gz | sha256sum --check >>"$report" 2>&1 || failed=1
          if [ "$failed" -eq 0 ]; then
            gzip --decompress --stdout /tmp/frontend.patch.gz > /tmp/frontend.patch 2>>"$report" || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            git apply --check /tmp/frontend.patch >>"$report" 2>&1 || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            git apply /tmp/frontend.patch >>"$report" 2>&1 || failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            python3 - <<'PY' >>"$report" 2>&1 || failed=1
          import base64
          import re
          from pathlib import Path

          source = Path('_backend_fixture/src/routes/moxie-templates.js').read_text(encoding='utf-8')
          match = re.search(r'function moxieAvatarImg\(\) \{ return `<img class="moxie-avatar" src="data:image/jpeg;base64,([^"]+)', source)
          if not match:
              raise SystemExit('canonical Moxie owl avatar was not found in backend source')
          payload = base64.b64decode(match.group(1), validate=True)
          if len(payload) < 10_000 or len(payload) > 250_000 or payload[:2] != b'\xff\xd8' or payload[-2:] != b'\xff\xd9':
              raise SystemExit('canonical Moxie owl avatar did not pass JPEG validation')
          Path('Moxie_Owl_Icon.jpg').write_bytes(payload)
          print(f'MOXIE_OWL_EXTRACTED bytes={len(payload)}')
          PY
          fi

          git diff --check >>"$report" 2>&1 || failed=1
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "APPLY_FAILED=$failed" >> "$report"
          cat "$report"
          exit 0

      - name: Run complete frontend integration gate
        id: gate
        shell: bash
        run: |
          set +e
          report=/tmp/frontend-integration-gate.txt
          failed='${{ steps.apply.outputs.failed }}'
          for test_file in scripts/*.mjs; do
            node "$test_file" >>"$report" 2>&1 || { echo "FAIL $test_file" >>"$report"; failed=1; }
          done
          for file in ./*.js; do
            node --check "$file" >>"$report" 2>&1 || { echo "FAIL syntax $file" >>"$report"; failed=1; }
          done
          python3 - <<'PY' >>"$report" 2>&1 || failed=1
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          failures=[]
          for html in sorted(Path('.').glob('*.html')):
              text=html.read_text(encoding='utf-8',errors='replace')
              for index,script in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,flags=re.I),1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as handle:
                      handle.write(script)
                      temp_path=handle.name
                  result=subprocess.run(['node','--check',temp_path],capture_output=True,text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('INLINE_HTML_SYNTAX_PASS')
          PY
          if grep -R -n 'eric-precision-tower-3620\.taildaacbb\.ts\.net/annie' . --exclude-dir=.git --exclude-dir=.repair --exclude-dir=.github --exclude-dir=_backend_fixture >>"$report" 2>&1; then
            echo 'FAIL retired PC/Hermes Moxie URL remains' >>"$report"
            failed=1
          fi
          if grep -R -nE 'packages\.applied|artifactory|internal\.api\.openai' . --exclude-dir=.git --exclude-dir=.repair --exclude-dir=.github --exclude-dir=_backend_fixture >>"$report" 2>&1; then
            echo 'FAIL internal build URL found' >>"$report"
            failed=1
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "FAILED=$failed" >> "$report"
          cat "$report"
          exit 0

      - name: Publish tested source or preserve diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          if [ '${{ steps.gate.outputs.failed }}' = '0' ]; then
            rm -rf .repair _backend_fixture
            rm -f .github/workflows/_apply_moxie_system_integration_20260715.yml
            git add -A
            git diff --cached --check
            git commit -m 'Integrate Moxie owl, deployed route, and unified frontend release'
          else
            git reset --hard "$GITHUB_SHA"
            rm -rf _backend_fixture
            mkdir -p .repair
            cp /tmp/frontend-integration-gate.txt .repair/frontend-integration-gate.txt
            git add .repair/frontend-integration-gate.txt
            git commit -m 'Record Moxie frontend integration diagnostics'
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
