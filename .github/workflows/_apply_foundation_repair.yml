name: Apply Frontend Foundation Repair V1

on:
  push:
    branches:
      - repair/foundation-repair-v1-20260716
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-frontend-foundation-repair-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/foundation-repair-v1-20260716
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic frontend repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .foundation-transfer/apply.py
          python3 .foundation-transfer/apply.py
          git diff --check
      - name: Validate complete frontend matrix
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          for test_file in scripts/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done
      - name: Commit verified frontend source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            device-security.html \
            employee-hub.html \
            employee-schedule.html \
            events.html \
            index.html \
            memphis-device-identity.js \
            messages.html \
            start_page1.html \
            thread.html \
            ops-manager-hub.html \
            ops-manager-read-only.html \
            scripts/device-credential-foundation-tests.mjs
          git config user.name 'custodial-foundation-bot'
          git config user.email 'custodial-foundation-bot@users.noreply.github.com'
          git commit -m 'fix: apply frontend foundation repair v1 [skip ci]'
          git push origin HEAD:repair/foundation-repair-v1-20260716
