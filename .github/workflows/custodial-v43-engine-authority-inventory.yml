name: Custodial v4.3 Engine Authority Inventory

on:
  push:
    branches:
      - agent/custodial-v43-engine-source-inventory-20260807

permissions:
  contents: write

concurrency:
  group: custodial-v43-engine-authority-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[engine-authority-inventory-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout inventory branch with exact source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/custodial-v43-engine-source-inventory-20260807

      - name: Verify frozen actual-program source
        shell: bash
        run: |
          test "$(git rev-parse 8cdbe2fbe98fd31ab11483d96c12b6c1270fc148^{commit})" = "8cdbe2fbe98fd31ab11483d96c12b6c1270fc148"
          git merge-base --is-ancestor 8cdbe2fbe98fd31ab11483d96c12b6c1270fc148 HEAD

      - name: Bind stable IDs to exact source offsets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/generate-custodial-v43-engine-authority-inventory.py')
          text=path.read_text()
          old_def='''def stable_id(repo: str, commit: str, path: str, line: int, category: str, symbol: str) -> str:\n    return "SURF-ENGINE-" + sha("|".join([repo, commit, path, str(line), category, symbol]))[:20].upper()\n'''
          new_def='''def stable_id(repo: str, commit: str, path: str, line: int, offset: int, category: str, symbol: str) -> str:\n    return "SURF-ENGINE-" + sha("|".join([repo, commit, path, str(line), str(offset), category, symbol]))[:20].upper()\n'''
          old_call='''        "id": stable_id(repo, commit, path, line, category, symbol),\n'''
          new_call='''        "id": stable_id(repo, commit, path, line, offset, category, symbol),\n'''
          if text.count(old_def)!=1 or text.count(old_call)!=1:
              raise SystemExit('stable-ID patch markers changed')
          path.write_text(text.replace(old_def,new_def).replace(old_call,new_call))
          PY

      - name: Generate exact source-bound inventory
        shell: bash
        run: |
          python3 scripts/generate-custodial-v43-engine-authority-inventory.py \
            --commit 8cdbe2fbe98fd31ab11483d96c12b6c1270fc148 \
            --repository lasrevinu333-design/Engine \
            --output docs/architecture-evidence/custodial-v43-engine-authority-inventory.json \
            | tee /tmp/engine-authority-inventory-result.json

      - name: Independent output shape and no-placeholder checks
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/architecture-evidence/custodial-v43-engine-authority-inventory.json')
          d=json.loads(p.read_text())
          assert d['source_commit']=='8cdbe2fbe98fd31ab11483d96c12b6c1270fc148'
          assert d['status']=='SOURCE_INVENTORY_COMPLETE_DISPOSITIONS_PENDING_ARCHITECTURE_REVIEW'
          assert d['acceptance']['downstream_authority'] is False
          assert d['summary']['entries']==len(d['entries'])
          assert len({x['id'] for x in d['entries']})==len(d['entries'])
          for x in d['entries']:
              assert x['path'] and x['line']>0 and x['file_sha256'] and x['source_commit']
              assert x['symbol'] and x['category']
              assert x['target_disposition']!='ADMITTED'
          assert all(x['pass'] for x in d['core_pattern_coverage'].values())
          assert all(x['pass'] for x in d['minimum_coverage'].values())
          print(json.dumps({'status':'PASS','entries':len(d['entries']),'inventory_sha256':d['inventory_sha256']},sort_keys=True))
          PY

      - name: Commit evidence and retire one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/custodial-v43-engine-authority-inventory.yml .inventory-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate exact Engine authority inventory [engine-authority-inventory-generated]"
          git push origin HEAD:agent/custodial-v43-engine-source-inventory-20260807

      - name: Upload inventory execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custodial-v43-engine-authority-inventory-evidence
          path: /tmp/engine-authority-inventory-result.json
          if-no-files-found: warn
          retention-days: 14
