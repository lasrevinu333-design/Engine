name: Apply schedule and messenger frontend repair

on:
  push:
    branches:
      - release/schedule-messaging-20260715
    paths:
      - .github/workflows/_apply_schedule_messaging_20260715.yml

permissions:
  contents: write

concurrency:
  group: schedule-messaging-frontend-20260715
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/schedule_messaging_frontend/raw_*.patchpart > /tmp/schedule-messaging.patch
          printf '%s  %s\n' '2abe4b5cc14899b5518fe8e6f36952b1d089586ad0486e70eb0c00d51637da98' /tmp/schedule-messaging.patch | sha256sum --check
          git apply --check /tmp/schedule-messaging.patch
          git apply /tmp/schedule-messaging.patch
          git diff --check

      - name: Run every frontend regression and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.mjs; do
            node "$test_file"
          done
          for file in ./*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          failures=[]
          for html_path in sorted(Path('.').glob('*.html')):
              text=html_path.read_text(encoding='utf-8',errors='replace')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,flags=re.I)
              for index,script in enumerate(scripts,start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as handle:
                      handle.write(script)
                      temp_path=handle.name
                  result=subprocess.run(['node','--check',temp_path],capture_output=True,text=True)
                  Path(temp_path).unlink(missing_ok=True)
                  if result.returncode:
                      failures.append(f'{html_path}: inline script {index}: {result.stderr.strip()}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('INLINE_HTML_SYNTAX_PASS')
          PY

      - name: Publish only the tested source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/_apply_schedule_messaging_20260715.yml
          git config user.name 'Memphis Zoo Repair Bot'
          git config user.email 'lasrevinu333@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix employee schedule display and Memphis Messenger routing'
          git push origin "HEAD:${GITHUB_REF_NAME}"
