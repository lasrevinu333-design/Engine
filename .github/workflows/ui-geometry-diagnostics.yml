name: UI Geometry Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-geometry-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify exact Node and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '11.17.0'
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run navigation, insights, and safe-area geometry acceptance
        shell: bash
        run: |
          set +e
          mkdir -p ui-geometry-evidence
          npx --no-install playwright test tests/unity-polish.spec.js tests/operational-insights.spec.js --reporter=line,html 2>&1 | tee ui-geometry-evidence/unity-polish.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > ui-geometry-evidence/exit-status.txt
          exit 0
      - name: Upload complete UI geometry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-geometry-diagnostics
          path: |
            ui-geometry-evidence
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce UI geometry result
        shell: bash
        run: test "$(cat ui-geometry-evidence/exit-status.txt)" = "0"
