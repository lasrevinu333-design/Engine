<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <title>Program Feedback</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#07111d;--panel:#101d2c;--line:rgba(255,255,255,.12);--text:#f8fbff;--muted:#aebdce;--green:#8fd42f;--green2:#68ad20;--red:#ef6666;--shadow:0 16px 40px rgba(0,0,0,.3)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{background:linear-gradient(rgba(5,12,21,.74),rgba(5,12,21,.9)),url('./dashboard-bg_optimized.webp?v=release-2026.07.18.custodial-v3.11') center/cover fixed}
    button,input,textarea,select{font:inherit}
    .page{width:min(680px,100%);min-height:100vh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 22px)}
    .topbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}.back{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:var(--text);text-decoration:none;font-weight:900;display:inline-flex;align-items:center;justify-content:center}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:48px;height:48px;object-fit:contain}.brand h1{margin:0;font-size:1.4rem}.brand p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
    .card{padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(16,29,44,.96);box-shadow:var(--shadow)}.cardLead{margin:0 0 16px;color:var(--muted);line-height:1.4}
    .field{display:grid;gap:7px;margin:0 0 14px}.field label{font-weight:900}.select,.textarea{width:100%;border:1px solid var(--line);border-radius:17px;padding:14px;background:#f8fafc;color:#111827}.select option{color:#111827}.textarea{min-height:170px;resize:vertical;line-height:1.4}.textarea::placeholder{color:#64748b}
    .blocking{display:flex;align-items:center;gap:11px;min-height:50px;padding:11px 13px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);font-weight:900}.blocking input{width:24px;height:24px;accent-color:var(--red)}
    .photoRow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.btn{min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:var(--text);font-weight:900;cursor:pointer}.btn.primary{width:100%;background:linear-gradient(180deg,var(--green),var(--green2));color:#102106;border-color:rgba(255,255,255,.18)}.btn.danger{background:rgba(125,29,29,.72)}
    .imageStatus{color:var(--muted);font-size:.82rem;margin:-4px 0 14px}.preview{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px;border:1px solid rgba(143,212,47,.35);border-radius:16px;background:rgba(143,212,47,.08)}.preview img{width:68px;height:68px;object-fit:cover;border-radius:12px}.preview span{min-width:0;overflow-wrap:anywhere;color:#d9f99d;font-weight:800}
    .status{display:none;margin-top:12px;padding:12px 14px;border-radius:16px;font-weight:800;line-height:1.35}.status.show{display:block}.status.ok{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.35)}.status.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35)}
    [hidden]{display:none!important}
    @media(max-width:430px){.page{padding-left:10px;padding-right:10px}.brand img{width:42px;height:42px}.brand h1{font-size:1.24rem}.brand p{display:none}.card{padding:15px}.textarea{min-height:190px}}
  </style>
</head>
<body data-memphis-context="contextual">
  <main class="page">
    <header class="topbar"><a id="back-btn" class="back" href="./start_page1.html">Back</a><div class="brand"><img src="./Zoo_Logo_ui.webp?v=release-2026.07.18.custodial-v3.11" alt="Memphis Zoo"><div><h1>Send Feedback</h1><p>Report a problem or suggest an improvement</p></div></div></header>
    <section class="card">
      <p class="cardLead">Tell us what happened. Device, app, and screen details are recorded automatically.</p>
      <form id="feedback-form" data-mz-protect-unsaved="true">
        <div class="field"><label for="category">What is this about?</label><select id="category" class="select" required><option value="app_problem">App problem</option><option value="schedule_wrong">Schedule or assigned areas</option><option value="location_or_nfc">NFC tag or cleaning scan</option><option value="device_problem">Phone problem</option><option value="memphis_bad_answer">Messenger or Memphis answer</option><option value="improvement_idea">Improvement idea</option><option value="need_help">Need help using the program</option><option value="other">Other</option></select></div>
        <div class="field"><label for="message">What happened?</label><textarea id="message" class="textarea" placeholder="Describe the problem or idea in your own words." required></textarea></div>
        <label class="blocking"><input id="blocking" type="checkbox">This is stopping work</label>
        <input id="image-input" type="file" accept="image/*" hidden>
        <div class="photoRow"><button id="import-image" class="btn" type="button">Add Picture</button><button id="remove-image" class="btn danger" type="button" hidden>Remove Picture</button></div>
        <div id="image-status" class="imageStatus">A picture is optional.</div>
        <div id="image-preview" class="preview" hidden><img id="image-preview-img" alt="Selected picture"><span id="image-preview-name"></span></div>
        <button class="btn primary" type="submit">Send Feedback</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.18.custodial-v3.11"></script>
  <script>
  (() => {
    const API = 'https://memphis-zoo-mcp.onrender.com/feedback-api/submit';
    const DEVICE_KEY = 'mz_scan_device_id';
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    const state = { deviceId:'', hub:'manager', image:null, operationId:'' };
    const els = {
      back:document.getElementById('back-btn'), form:document.getElementById('feedback-form'), category:document.getElementById('category'), message:document.getElementById('message'), blocking:document.getElementById('blocking'),
      imageInput:document.getElementById('image-input'), importImage:document.getElementById('import-image'), removeImage:document.getElementById('remove-image'), imageStatus:document.getElementById('image-status'), preview:document.getElementById('image-preview'), previewImg:document.getElementById('image-preview-img'), previewName:document.getElementById('image-preview-name'), status:document.getElementById('status'),
    };
    const safe = (error) => error?.message ? String(error.message) : String(error || 'Unknown error');
    function setStatus(text, kind = '') { els.status.textContent = text; els.status.className = `status show ${kind}`; }
    function clearStatus() { els.status.textContent = ''; els.status.className = 'status'; }
    function resolveContext() {
      const url = new URL(location.href);
      state.hub = String(url.searchParams.get('hub') || '').toLowerCase() === 'employee' ? 'employee' : 'manager';
      const explicit = String(url.searchParams.get('device') || url.searchParams.get('deviceId') || '').trim();
      if (explicit) localStorage.setItem(DEVICE_KEY, explicit);
      state.deviceId = explicit || String(localStorage.getItem(DEVICE_KEY) || localStorage.getItem('memphisAssignedDeviceId') || '').trim();
    }
    function managerName() {
      const session = window.MemphisAuth?.readSession?.();
      return String(session?.manager_display_name || '').trim();
    }
    function goBack(event) {
      event.preventDefault();
      const url = new URL(state.hub === 'employee' ? './employee-hub.html' : './start_page1.html', location.href);
      if (state.deviceId) url.searchParams.set('device', state.deviceId);
      location.assign(url);
    }
    function resetImage() {
      state.image = null; els.imageInput.value = ''; els.removeImage.hidden = true; els.preview.hidden = true; els.previewImg.removeAttribute('src'); els.previewName.textContent = ''; els.imageStatus.textContent = 'A picture is optional.';
    }
    function readFile(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || '')); reader.onerror = () => reject(new Error('Could not read the picture.')); reader.readAsDataURL(file); }); }
    async function chooseImage() {
      clearStatus();
      const file = els.imageInput.files?.[0];
      if (!file) return;
      if (!String(file.type || '').startsWith('image/')) { resetImage(); return setStatus('Choose a picture file.', 'error'); }
      if (file.size > MAX_IMAGE_BYTES) { resetImage(); return setStatus('Keep the picture under 5 MB.', 'error'); }
      try {
        state.image = { name:file.name || 'feedback-image', type:file.type || 'image/jpeg', dataUrl:await readFile(file) };
        els.previewImg.src = state.image.dataUrl; els.previewName.textContent = state.image.name; els.preview.hidden = false; els.removeImage.hidden = false; els.imageStatus.textContent = 'Picture ready.';
      } catch (error) { resetImage(); setStatus(safe(error), 'error'); }
    }
    async function submit(event) {
      event.preventDefault(); clearStatus();
      const message = String(els.message.value || '').trim();
      if (!message) return setStatus('Describe what happened.', 'error');
      state.operationId ||= crypto.randomUUID();
      const body = {
        operation_id:state.operationId,
        category:els.category.value || 'other',
        priority:els.blocking.checked ? 'urgent' : 'normal',
        message,
        submitted_by:managerName(),
        hub_context:state.hub,
        device_id:state.deviceId,
        page_url:location.href,
        page_title:document.title,
        user_agent:navigator.userAgent,
      };
      try {
        let response;
        if (state.image) {
          const form = new FormData(); Object.entries(body).forEach(([key,value]) => form.append(key, String(value ?? '')));
          const base64 = state.image.dataUrl.split(',')[1] || ''; const bytes = atob(base64); const array = new Uint8Array(bytes.length); for (let index=0; index<bytes.length; index+=1) array[index] = bytes.charCodeAt(index);
          form.append('image_attachment', new Blob([array], { type:state.image.type }), state.image.name);
          response = await fetch(API, { method:'POST', headers:{ 'Idempotency-Key':state.operationId }, body:form });
        } else {
          response = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', 'Idempotency-Key':state.operationId }, body:JSON.stringify(body) });
        }
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        state.operationId = ''; els.form.reset(); resetImage(); setStatus('Feedback sent. Thank you.', 'ok');
      } catch (error) { setStatus(safe(error), 'error'); }
    }
    resolveContext();
    els.back.addEventListener('click', goBack);
    els.importImage.addEventListener('click', () => els.imageInput.click());
    els.imageInput.addEventListener('change', () => { void chooseImage(); });
    els.removeImage.addEventListener('click', resetImage);
    els.form.addEventListener('submit', (event) => { void submit(event); });
  })();
  </script>
</body>
</html>
