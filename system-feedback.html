<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://api.open-meteo.com; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081422">
  <title>Program Feedback</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./manager-ux.css">
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12">
  <style>
    .feedbackPage{width:min(680px,100%);margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
    .feedbackNav{margin-bottom:14px}.feedbackHeader{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px}
    .feedbackHeader img{width:58px;height:58px;object-fit:contain}.feedbackHeader h1{margin:0;font-size:clamp(1.7rem,7vw,2.5rem);letter-spacing:-.04em}.feedbackHeader p{margin:5px 0 0}
    .feedbackCard{padding:18px}.field{display:grid;gap:8px;margin-bottom:15px}.field label{font-weight:900}
    .blockingRow{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--ux-line);border-radius:var(--ux-radius-md);background:rgba(255,255,255,.045);cursor:pointer}
    .blockingRow input{width:25px;height:25px;accent-color:var(--ux-green);flex:0 0 25px}.blockingRow strong{display:block}.blockingRow span span{display:block;margin-top:4px;color:var(--ux-muted);font-size:.86rem}
    .imageActions{display:flex;gap:9px;flex-wrap:wrap}.imagePreview{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;margin-top:10px;padding:10px;border:1px solid rgba(145,214,58,.3);border-radius:var(--ux-radius-md);background:rgba(145,214,58,.08)}
    .imagePreview img{width:72px;height:72px;border-radius:13px;object-fit:cover}.hidden{display:none!important}
    .feedbackActions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.feedbackActions .uxStatus{flex:1 1 220px}
    .feedbackInbox{margin-top:14px;padding:18px}.feedbackInboxHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.feedbackInboxTools{display:flex;gap:8px;flex-wrap:wrap}.feedbackList{display:grid;gap:10px;margin-top:14px}.feedbackItem{padding:14px;border:1px solid var(--ux-line);border-radius:var(--ux-radius-md);background:rgba(255,255,255,.045)}.feedbackItem h3{margin:0 0 5px}.feedbackMeta{font-size:.84rem;color:var(--ux-muted);margin-bottom:8px}.feedbackItemActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.feedbackImage{display:block;max-width:100%;max-height:280px;border-radius:14px;margin-top:10px}
    @media(max-width:520px){.feedbackActions .uxButton{width:100%}.feedbackHeader{align-items:flex-start}}
  </style>
</head>
<body data-memphis-context="contextual">
  <main class="feedbackPage">
    <nav class="mz-page-header feedbackNav" aria-label="Page navigation">
      <div class="mz-nav-stack">
        <a class="mz-back-link" data-mz-back href="./start_page1.html">Back</a>
        <a class="mz-secondary-link" data-mz-annie-back hidden href="https://memphis-zoo-mcp.onrender.com/moxie/">Back to Annie</a>
      </div>
    </nav>

    <header class="feedbackHeader uxCard">
      <img src="./Zoo_Logo_ui.webp" alt="Memphis Zoo">
      <div><div class="uxEyebrow">Custodial program</div><h1>Send feedback</h1><p class="uxMuted">Tell us what went wrong or what would make the app easier.</p></div>
    </header>

    <section class="feedbackCard uxCard">
      <form id="feedback-form" data-mz-protect-unsaved="true">
        <div class="field">
          <label for="category">What is this about?</label>
          <select id="category" class="uxSelect">
            <option value="app_problem">App problem</option>
            <option value="schedule_wrong">Schedule or assignment</option>
            <option value="location_or_nfc">NFC or scan</option>
            <option value="device_problem">Phone or device</option>
            <option value="memphis_bad_answer">Memphis answer</option>
            <option value="improvement_idea">Improvement idea</option>
            <option value="need_help">Need help using the app</option>
            <option value="other">Something else</option>
          </select>
        </div>

        <div class="field">
          <label for="message">What happened or what should improve?</label>
          <textarea id="message" class="uxTextarea" maxlength="12000" placeholder="Describe the problem in your own words. Technical details are recorded automatically." required></textarea>
        </div>

        <label class="blockingRow">
          <input id="blocking" type="checkbox">
          <span><strong>This is blocking work</strong><span>Use this only when the problem prevents someone from completing the job.</span></span>
        </label>

        <div class="field" style="margin-top:15px">
          <label>Screenshot or photo <span class="uxMuted">(optional)</span></label>
          <input id="image-input" type="file" accept="image/*" hidden>
          <div class="imageActions">
            <button id="choose-image" class="uxButton compact" type="button">Add Image</button>
            <button id="remove-image" class="uxButton compact" type="button" hidden>Remove</button>
          </div>
          <div id="image-status" class="uxStatus">No image selected.</div>
          <div id="image-preview" class="imagePreview hidden"><img id="image-preview-img" alt="Selected image"><div><strong id="image-preview-name"></strong><div class="uxMuted">Ready to send with your feedback.</div></div></div>
        </div>

        <div class="feedbackActions">
          <button id="send-feedback" class="uxButton primary" type="submit">Send Feedback</button>
          <div id="feedback-status" class="uxStatus" aria-live="polite"></div>
        </div>
      </form>
    </section>

    <section id="feedback-inbox" class="feedbackInbox uxCard" hidden>
      <div class="feedbackInboxHead">
        <div><div class="uxEyebrow">Manager triage</div><h2>Feedback inbox</h2></div>
        <div class="feedbackInboxTools">
          <select id="feedback-inbox-status" class="uxSelect"><option value="new">New</option><option value="acknowledged">Acknowledged</option><option value="">All</option></select>
          <button id="feedback-inbox-refresh" class="uxButton compact" type="button">Refresh</button>
        </div>
      </div>
      <div id="feedback-inbox-state" class="uxStatus" aria-live="polite"></div>
      <div id="feedback-inbox-list" class="feedbackList"></div>
    </section>
  </main>

  <script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-ui.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script>
  (() => {
    const API = 'https://memphis-zoo-mcp.onrender.com';
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    const MAX_AUTHORIZED_REQUEST_BYTES = 4 * 1024 * 1024;
    const REQUEST_SAFETY_BYTES = 64 * 1024;
    const MAX_FEEDBACK_REQUEST_BYTES = MAX_AUTHORIZED_REQUEST_BYTES - REQUEST_SAFETY_BYTES;
    const MAX_IMAGE_DATA_URL_BYTES = 3 * 1024 * 1024;
    const MAX_IMAGE_DIMENSION = 1920;
    const state = { deviceId: '', hub: 'manager', image: null, operationId: '' };
    const els = {
      form: document.getElementById('feedback-form'),
      category: document.getElementById('category'),
      message: document.getElementById('message'),
      blocking: document.getElementById('blocking'),
      imageInput: document.getElementById('image-input'),
      chooseImage: document.getElementById('choose-image'),
      removeImage: document.getElementById('remove-image'),
      imageStatus: document.getElementById('image-status'),
      preview: document.getElementById('image-preview'),
      previewImage: document.getElementById('image-preview-img'),
      previewName: document.getElementById('image-preview-name'),
      send: document.getElementById('send-feedback'),
      status: document.getElementById('feedback-status'),
      inbox: document.getElementById('feedback-inbox'),
      inboxStatus: document.getElementById('feedback-inbox-status'),
      inboxRefresh: document.getElementById('feedback-inbox-refresh'),
      inboxState: document.getElementById('feedback-inbox-state'),
      inboxList: document.getElementById('feedback-inbox-list'),
    };
    function safe(error) { return error instanceof Error ? error.message : String(error || 'Unknown error'); }
    function encodedBytes(value) { return new TextEncoder().encode(String(value || '')).byteLength; }
    function serializedBodyFits(value) { return encodedBytes(value) <= MAX_FEEDBACK_REQUEST_BYTES; }
    Object.defineProperty(window, 'MemphisFeedbackPayloadPolicy', {
      configurable: false,
      enumerable: true,
      writable: false,
      value: Object.freeze({
        maxAuthorizedRequestBytes: MAX_AUTHORIZED_REQUEST_BYTES,
        maxFeedbackRequestBytes: MAX_FEEDBACK_REQUEST_BYTES,
        maxImageDataUrlBytes: MAX_IMAGE_DATA_URL_BYTES,
        encodedBytes,
        serializedBodyFits,
      }),
    });
    function isNativeCustodialAuthority() {
      return window.MemphisCustodialSecurity?.native === true
        || window.MemphisMobile?.edition === 'custodial'
        || window.MemphisMobileBuildIdentity?.edition === 'custodial';
    }
    async function resolve() {
      const url = new URL(location.href);
      state.hub = String(url.searchParams.get('hub') || '').toLowerCase() === 'employee' ? 'employee' : 'manager';
      if (isNativeCustodialAuthority()) {
        const pending = window.MemphisMobile?.ready || window.MemphisCustodialSecurity?.ready;
        if (pending && typeof pending.then === 'function') await pending;
        const authoritative = typeof window.MemphisMobile?.authoritativeDeviceId === 'function'
          ? await window.MemphisMobile.authoritativeDeviceId()
          : window.MemphisCustodialSecurity?.getStatus?.()?.deviceId;
        state.deviceId = String(authoritative || '').trim();
        return;
      }
      state.deviceId = String(url.searchParams.get('device') || url.searchParams.get('deviceId') || window.MemphisAuth?.getDeviceId?.() || localStorage.getItem('memphisAssignedDeviceId') || localStorage.getItem('mz_scan_device_id') || '').trim();
    }
    function setStatus(text, kind = '') {
      els.status.textContent = text || '';
      els.status.className = `uxStatus${kind ? ` ${kind}` : ''}`;
    }
    function clearImage() {
      state.image = null;
      els.imageInput.value = '';
      els.preview.classList.add('hidden');
      els.previewImage.removeAttribute('src');
      els.previewName.textContent = '';
      els.removeImage.hidden = true;
      els.imageStatus.textContent = 'No image selected.';
    }
    function fileToDataUrl(file) {
      return new Promise((resolveFile, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolveFile(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Could not read the selected image.'));
        reader.readAsDataURL(file);
      });
    }
    function decodeImage(file) {
      return new Promise((resolveImage, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        const finish = () => URL.revokeObjectURL(objectUrl);
        image.onload = () => { finish(); resolveImage(image); };
        image.onerror = () => { finish(); reject(new Error('The selected image could not be decoded.')); };
        image.src = objectUrl;
      });
    }
    function jpegDataUrl(image, width, height, quality) {
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) throw new Error('Image processing is unavailable on this device.');
      context.fillStyle = '#fff'; context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);
      const value = canvas.toDataURL('image/jpeg', quality);
      if (!value.startsWith('data:image/jpeg;base64,')) throw new Error('Image compression failed.');
      return value;
    }
    function jpegName(value) {
      const name = String(value || 'feedback-image').replace(/\.[^.]{1,10}$/u, '');
      return `${name || 'feedback-image'}.jpg`;
    }
    async function prepareImage(file) {
      const original = await fileToDataUrl(file);
      if (encodedBytes(original) <= MAX_IMAGE_DATA_URL_BYTES) {
        return { name: file.name || 'feedback-image', type: file.type || 'image/jpeg', dataUrl: original, optimized: false };
      }
      const image = await decodeImage(file);
      const sourceWidth = Number(image.naturalWidth || image.width || 0);
      const sourceHeight = Number(image.naturalHeight || image.height || 0);
      if (!sourceWidth || !sourceHeight) throw new Error('The selected image has invalid dimensions.');
      const initialScale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(sourceWidth, sourceHeight));
      let width = Math.max(1, Math.round(sourceWidth * initialScale));
      let height = Math.max(1, Math.round(sourceHeight * initialScale));
      for (let resize = 0; resize < 6; resize += 1) {
        for (const quality of [0.86, 0.76, 0.66, 0.56, 0.46]) {
          const dataUrl = jpegDataUrl(image, width, height, quality);
          if (encodedBytes(dataUrl) <= MAX_IMAGE_DATA_URL_BYTES) {
            return { name: jpegName(file.name), type: 'image/jpeg', dataUrl, optimized: true };
          }
        }
        width = Math.max(320, Math.round(width * 0.78));
        height = Math.max(320, Math.round(height * 0.78));
      }
      throw new Error('The image could not be made small enough to send safely.');
    }
    async function chooseImage() {
      const file = els.imageInput.files?.[0];
      if (!file) return;
      if (!String(file.type || '').startsWith('image/')) return setStatus('Choose an image file.', 'error');
      if (file.size > MAX_IMAGE_BYTES) return setStatus('Image must be 5 MB or smaller.', 'error');
      setStatus('Preparing image…', 'info');
      let prepared;
      try { prepared = await prepareImage(file); }
      catch (error) { clearImage(); return setStatus(safe(error), 'error'); }
      state.image = prepared;
      els.previewImage.src = prepared.dataUrl;
      els.previewName.textContent = state.image.name;
      els.preview.classList.remove('hidden');
      els.removeImage.hidden = false;
      els.imageStatus.textContent = prepared.optimized ? 'Image optimized and ready.' : 'Image ready.';
      setStatus('');
    }
    function submittedBy() {
      const session = window.MemphisAuth?.readSession?.();
      return String(session?.manager_display_name || '').trim();
    }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])); }
    function formatDate(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value || '') : date.toLocaleString(); }
    async function managerHeaders() { return window.MemphisAuth?.opsManagerAuthHeaders?.() || {}; }
    async function loadInbox() {
      if (state.hub !== 'manager' || els.inbox.hidden) return;
      els.inboxState.textContent = 'Refreshing…';
      try {
        const url = new URL(`${API}/dashboard-api/system-feedback`);
        if (els.inboxStatus.value) url.searchParams.set('status', els.inboxStatus.value);
        const response = await fetch(url, { cache:'no-store', credentials:'include', headers:await managerHeaders() });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        const rows = Array.isArray(payload.data) ? payload.data : [];
        els.inboxState.textContent = `${rows.length} item${rows.length === 1 ? '' : 's'}`;
        els.inboxList.innerHTML = rows.length ? rows.map((row) => `<article class="feedbackItem" data-feedback-id="${escapeHtml(row.id)}"><h3>${escapeHtml(row.summary || row.category || 'Program feedback')}</h3><div class="feedbackMeta">${escapeHtml(row.priority || 'normal')} · ${escapeHtml(row.status || 'new')} · ${escapeHtml(formatDate(row.created_at))}</div><div>${escapeHtml(row.message || '')}</div><div class="feedbackItemActions">${row.metadata_json?.image_attachment ? '<button class="uxButton compact" type="button" data-action="image">View image</button>' : ''}${row.status === 'new' ? '<button class="uxButton compact" type="button" data-action="acknowledged">Acknowledge</button>' : ''}${!['resolved','closed'].includes(row.status) ? '<button class="uxButton compact primary" type="button" data-action="resolved">Resolve</button>' : ''}</div><div data-image-slot></div></article>`).join('') : '<div class="uxStatus">No feedback in this view.</div>';
      } catch (error) { els.inboxState.textContent = safe(error); els.inboxList.innerHTML = ''; }
    }
    async function updateInboxItem(feedbackId, status) {
      const response = await fetch(`${API}/dashboard-api/system-feedback/${encodeURIComponent(feedbackId)}/status`, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json', ...(await managerHeaders())}, body:JSON.stringify({status}) });
      const payload = await response.json().catch(() => null);
      if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
      await loadInbox();
    }
    async function loadInboxImage(article, feedbackId) {
      const response = await fetch(`${API}/feedback-api/image/${encodeURIComponent(feedbackId)}`, { credentials:'include', headers:await managerHeaders() });
      if (!response.ok) throw new Error(`Image HTTP ${response.status}`);
      const objectUrl = URL.createObjectURL(await response.blob());
      const slot = article.querySelector('[data-image-slot]');
      slot.innerHTML = `<img class="feedbackImage" alt="Feedback attachment" src="${objectUrl}">`;
    }
    async function initManagerInbox() {
      if (state.hub !== 'manager') return;
      try {
        const session = await window.MemphisAuth?.requireOpsManagerSession?.({redirect:false,interactive:false,throwOnFailure:true});
        if (!session) return;
        els.inbox.hidden = false;
        await loadInbox();
      } catch { els.inbox.hidden = true; }
    }
    async function submit(event) {
      event.preventDefault();
      const message = String(els.message.value || '').trim();
      if (!message) return setStatus('Describe what happened.', 'error');
      state.operationId ||= crypto.randomUUID();
      els.send.disabled = true;
      setStatus('Sending…', 'info');
      try {
        await resolve();
        if (isNativeCustodialAuthority() && state.hub === 'employee' && !state.deviceId) {
          throw new Error('Protected phone identity is not ready. Return to the Custodial app and finish recovery.');
        }
        const body = {
          operation_id: state.operationId,
          category: els.category.value || 'other',
          priority: els.blocking.checked ? 'urgent' : 'normal',
          message,
          submitted_by: submittedBy(),
          hub_context: state.hub,
          device_id: state.deviceId,
          page_url: location.href,
          page_title: document.title,
        };
        if (state.image) body.image_attachment = {
          name: state.image.name,
          type: state.image.type,
          data_url: state.image.dataUrl,
        };
        const serializedBody = JSON.stringify(body);
        if (!serializedBodyFits(serializedBody)) {
          throw new Error('This feedback is too large to send safely. Remove the image and try again.');
        }
        const response = await fetch(`${API}/feedback-api/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Idempotency-Key': state.operationId },
          body: serializedBody,
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        state.operationId = '';
        els.form.reset();
        clearImage();
        window.MemphisUI?.markSaved?.(els.form);
        setStatus('Sent. Thank you.', 'ok');
      } catch (error) {
        setStatus(safe(error), 'error');
      } finally {
        els.send.disabled = false;
      }
    }
    els.form.addEventListener('submit', submit);
    els.chooseImage.addEventListener('click', () => els.imageInput.click());
    els.imageInput.addEventListener('change', () => void chooseImage());
    els.removeImage.addEventListener('click', clearImage);
    els.inboxRefresh.addEventListener('click', loadInbox);
    els.inboxStatus.addEventListener('change', loadInbox);
    els.inboxList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]'); if (!button) return;
      const article = button.closest('[data-feedback-id]'); const feedbackId = article?.dataset.feedbackId; if (!feedbackId) return;
      button.disabled = true;
      try { if (button.dataset.action === 'image') await loadInboxImage(article, feedbackId); else await updateInboxItem(feedbackId, button.dataset.action); }
      catch (error) { els.inboxState.textContent = safe(error); }
      finally { button.disabled = false; }
    });
    void resolve().then(() => initManagerInbox()).catch((error) => setStatus(safe(error), 'error'));
  })();
  </script>
</body>
</html>
