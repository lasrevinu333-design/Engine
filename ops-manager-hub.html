<!DOCTYPE html>
<!-- release-2026.07.18.gemini-console.1 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Ops Manager Hub</title>
  <style>
    :root{color-scheme:dark;--accent:#84c341;--panel:rgba(8,17,29,.9);--line:rgba(255,255,255,.14);--muted:#cbd5e1;--danger:#fecaca}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#f8fafc;background:#111827}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(4,10,20,.62),rgba(4,10,20,.72)),url('./dashboard-bg_optimized.webp?v=release-2026.04.22.8');background-size:cover;background-position:center}
    .card{width:min(520px,100%);padding:26px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
    .eyebrow{color:var(--accent);font-size:.8rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:2rem;line-height:1.05}
    p{margin:0 0 18px;color:var(--muted);line-height:1.45}.status{min-height:1.4em;color:var(--muted);font-size:.95rem;line-height:1.4}.status.error{color:var(--danger)}a{display:inline-block;margin-top:16px;color:#dff7bf;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Memphis Zoo</div>
    <h1>Ops Manager Hub</h1>
    <p>Opening the full-access Ops Manager tools. This is the only active manager entry. Approved browsers stay trusted after the shared enrollment passcode is entered once. Employee phones never receive a manager prompt.</p>
    <div id="status" class="status" role="status" aria-live="polite">Opening…</div>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.18.shared-enrollment.1"></script>
  <script>
  (async function(){
    'use strict';
    const status=document.getElementById('status');
    try{
      const session=await window.MemphisAuth.requireOpsManagerSession({accessLevel:'full_access',interactive:true,redirect:false,throwOnFailure:true});
      if(!session?.role)throw new Error('Manager session was not created.');
      const target=new URL('./start_page1.html',window.location.href);
      target.searchParams.set('manager_access','full_access');
      window.location.replace(target.toString());
    }catch(error){
      status.textContent=error?.message||'Manager Hub could not open.';
      status.className='status error';
    }
  })();
  </script>
</body>
</html>
