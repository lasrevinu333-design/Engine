<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b1320" />
  <title>Operations Leadership Hub</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml" />
  <style>
    :root{color-scheme:dark;--green:#8bc83f;--green2:#64a725;--panel:rgba(8,17,29,.94);--line:rgba(255,255,255,.14);--text:#f8fafc;--muted:#cbd5e1;--danger:#fecaca}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#111827}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(4,10,20,.64),rgba(4,10,20,.78)),url('./dashboard-bg_optimized.webp');background-size:cover;background-position:center}
    .card{width:min(560px,100%);padding:28px;border-radius:26px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 52px rgba(0,0,0,.42);backdrop-filter:blur(10px)}
    .eyebrow{color:var(--green);font-size:.78rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:clamp(2rem,7vw,3rem);line-height:.98}p{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:900}.field input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 15px;background:#fff;color:#111827;font:inherit}.code{text-align:center;font-size:1.35rem;font-weight:900;letter-spacing:.18em}.button{width:100%;min-height:52px;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:linear-gradient(var(--green),var(--green2));color:#102106;font:inherit;font-weight:900;cursor:pointer}.button[disabled]{opacity:.62;cursor:wait}.status{min-height:1.5em;margin-top:12px;color:var(--muted);font-weight:800;line-height:1.4}.status.error{color:var(--danger)}.hidden{display:none!important}.viewer-link{display:inline-block;margin-top:18px;color:#dff7bf;font-weight:900}
  </style>
</head>
<body data-memphis-context="manager">
  <main class="card">
    <div class="eyebrow">Memphis Zoo</div>
    <h1>Operations Leadership Hub</h1>
    <p id="intro">Checking this browser’s named leadership enrollment…</p>
    <form id="enroll-form" class="hidden" autocomplete="off">
      <div class="field">
        <label for="manager-code">Personal enrollment code</label>
        <input id="manager-code" class="code" name="manager_code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="1234 5678" required />
      </div>
      <div class="field">
        <label for="device-label">Browser name</label>
        <input id="device-label" name="device_label" maxlength="160" placeholder="Jennifer’s work computer" required />
      </div>
      <button id="submit" class="button" type="submit">Enroll This Browser</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Opening…</div>
    <a class="viewer-link" href="./ops-viewer.html">Open the read-only Viewer instead</a>
  </main>
  <script src="./memphis-auth.js"></script>
  <script src="./ops-manager-enrollment.js"></script>
</body>
</html>
