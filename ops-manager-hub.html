<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b1320" />
  <title>Operations Leadership Hub</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml" />
  <style>
    :root{color-scheme:dark;--green:#8bc83f;--green2:#64a725;--panel:rgba(8,17,29,.94);--line:rgba(255,255,255,.14);--text:#f8fafc;--muted:#cbd5e1;--danger:#fecaca}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#111827}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(4,10,20,.64),rgba(4,10,20,.78)),url('./dashboard-bg_optimized.webp');background-size:cover;background-position:center}
    .card{width:min(560px,100%);padding:28px;border-radius:26px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 52px rgba(0,0,0,.42);backdrop-filter:blur(10px)}
    .eyebrow{color:var(--green);font-size:.78rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:clamp(2rem,7vw,3rem);line-height:.98}p{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:900}.field input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 15px;background:#fff;color:#111827;font:inherit}.code{text-align:center;font-size:1.35rem;font-weight:900;letter-spacing:.18em}.button{width:100%;min-height:52px;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:linear-gradient(var(--green),var(--green2));color:#102106;font:inherit;font-weight:900;cursor:pointer}.button[disabled]{opacity:.62;cursor:wait}.status{min-height:1.5em;margin-top:12px;color:var(--muted);font-weight:800;line-height:1.4}.status.error{color:var(--danger)}.hidden{display:none!important}.viewer-link{display:inline-block;margin-top:18px;color:#dff7bf;font-weight:900}
  </style>
</head>
<body data-memphis-context="manager">
  <main class="card">
    <div class="eyebrow">Memphis Zoo</div>
    <h1>Operations Leadership Hub</h1>
    <p id="intro">Checking this browser’s named leadership enrollment…</p>
    <form id="enroll-form" class="hidden" autocomplete="off">
      <div class="field">
        <label for="manager-code">Personal enrollment code</label>
        <input id="manager-code" class="code" name="manager_code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="1234 5678" required />
      </div>
      <div class="field">
        <label for="device-label">Browser name</label>
        <input id="device-label" name="device_label" maxlength="160" placeholder="Jennifer’s work computer" />
      </div>
      <button id="submit" class="button" type="submit">Enroll This Browser</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Opening…</div>
    <a class="viewer-link" href="./ops-viewer.html">Open the read-only Viewer instead</a>
  </main>
  <script src="./memphis-auth.js"></script>
  <script>
    (function(){
      'use strict';
      const API='https://memphis-zoo-mcp.onrender.com';
      const form=document.getElementById('enroll-form');
      const intro=document.getElementById('intro');
      const code=document.getElementById('manager-code');
      const label=document.getElementById('device-label');
      const submit=document.getElementById('submit');
      const status=document.getElementById('status');
      const DEVICE_LABEL_DRAFT_KEY='memphisOpsManagerDeviceLabelDraft.v1';
      let typedDeviceLabel='';
      try{typedDeviceLabel=String(sessionStorage.getItem(DEVICE_LABEL_DRAFT_KEY)||'').trim().slice(0,160);}catch{}

      function setStatus(text,error=false){status.textContent=text||'';status.className=`status${error?' error':''}`;}
      function deviceLabel(){
        const platform=String(navigator.userAgentData?.platform||navigator.platform||'computer').trim();
        return `Operations Leadership · ${platform}`.slice(0,160);
      }
      function selectedDeviceLabel(){
        let draft=typedDeviceLabel;
        try{draft=draft||String(sessionStorage.getItem(DEVICE_LABEL_DRAFT_KEY)||'').trim().slice(0,160);}catch{}
        return String(draft||label.value||deviceLabel()).trim().slice(0,160);
      }
      function rememberDeviceLabel(){
        const value=String(label.value||'').trim().slice(0,160);
        if(!value||value===deviceLabel()){
          typedDeviceLabel='';
          try{sessionStorage.removeItem(DEVICE_LABEL_DRAFT_KEY);}catch{}
          return;
        }
        typedDeviceLabel=value;
        try{sessionStorage.setItem(DEVICE_LABEL_DRAFT_KEY,value);}catch{}
      }
      label.addEventListener('input',rememberDeviceLabel);
      label.addEventListener('change',rememberDeviceLabel);
      function openHub(){
        const target=new URL('./start_page1.html',location.href);
        target.searchParams.set('manager_access','full_access');
        location.replace(target.toString());
      }
      function showEnrollment(message='This browser is not enrolled. Enter the personal code created for your leadership account.'){
        intro.textContent=message;
        form.classList.remove('hidden');
        label.value=typedDeviceLabel||label.value||deviceLabel();
        setStatus('');
        code.focus({preventScroll:true});
      }
      async function checkExisting(){
        try{
          const session=await window.MemphisAuth.requireOpsManagerSession({accessLevel:'full_access',interactive:false,redirect:false,throwOnFailure:true});
          if(!session?.token)throw new Error('No trusted session.');
          openHub();
        }catch{showEnrollment();}
      }
      form.addEventListener('submit',async(event)=>{
        event.preventDefault();
        const normalized=String(code.value||'').replace(/[\s-]+/g,'');
        rememberDeviceLabel();
        const submittedLabel=selectedDeviceLabel();
        if(!/^\d{8}$/.test(normalized)){setStatus('Enter the eight-digit personal enrollment code.',true);return;}
        submit.disabled=true;setStatus('Enrolling this browser…');
        try{
          const response=await fetch(`${API}/auth-api/ops/manager-codes/consume`,{
            method:'POST',cache:'no-store',credentials:'include',
            headers:{'Content-Type':'application/json','X-Device-Id':window.MemphisAuth.getDeviceId(),'X-Device-Label':submittedLabel},
            body:JSON.stringify({code:normalized,manager_code:normalized,device_id:window.MemphisAuth.getDeviceId(),device_label:submittedLabel})
          });
          const payload=await response.json().catch(()=>null);
          if(!response.ok||!payload?.ok||!payload.data?.session?.token)throw Object.assign(new Error(payload?.error||`HTTP ${response.status}`),{status:response.status});
          setStatus(`Enrolled as ${payload.data.session.manager_display_name||'Operations Leadership'}. Opening Hub…`);
          try{sessionStorage.removeItem(DEVICE_LABEL_DRAFT_KEY);}catch{}
          openHub();
        }catch(error){
          setStatus(Number(error?.status)===429?'Too many attempts. Try again later.':(error?.message||'The code is invalid, expired, or already used.'),true);
          submit.disabled=false;code.value='';code.focus();
        }
      });
      checkExisting();
    })();
  </script>
</body>
</html>
