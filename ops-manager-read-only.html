<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Read-Only Ops Manager View</title>
  <style>
    :root{color-scheme:dark;--amber:#facc15;--panel:rgba(8,17,29,.9);--line:rgba(255,255,255,.14);--muted:#cbd5e1;--danger:#fecaca}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#f8fafc;background:#111827}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(rgba(4,10,20,.62),rgba(4,10,20,.72)),url('./dashboard-bg_optimized.webp?v=release-2026.04.22.8');background-size:cover;background-position:center}
    .card{width:min(520px,100%);padding:26px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
    .eyebrow{color:var(--amber);font-size:.8rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:8px 0 10px;font-size:2rem;line-height:1.05}
    p{margin:0 0 18px;color:var(--muted);line-height:1.45}
    label{display:block;margin-bottom:7px;font-size:.88rem;font-weight:800}
    input,button{width:100%;min-height:52px;border-radius:14px;font-size:1rem}
    input{border:1px solid var(--line);padding:0 14px;background:#fff;color:#111827}
    button{margin-top:12px;border:none;padding:0 16px;background:linear-gradient(180deg,#fde68a,#facc15);color:#3f2d00;font-weight:900;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .status{min-height:1.4em;margin-top:14px;color:var(--muted);font-size:.9rem;line-height:1.35}
    .status.error{color:var(--danger)}
    .full{display:inline-block;margin-top:14px;color:#dff7bf;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Memphis Zoo</div>
    <h1>Read-Only Ops Manager View</h1>
    <p id="intro">Checking this browser for an approved read-only manager session.</p>
    <form id="access-form" hidden>
      <label for="access-key">Read-only manager key</label>
      <input id="access-key" name="access_key" type="password" autocomplete="current-password" required />
      <button id="open-button" type="submit">Open Read-Only View</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <a class="full" href="./ops-manager-hub.html">Use the full-access manager entry</a>
  </main>
  <script>
  (function(){
    'use strict';
    const BACKEND='https://memphis-zoo-mcp.onrender.com';
    const TARGET='./start_page1.html';
    const SESSION_KEY='memphisOpsManagerSession.v2';
    const COMMON_ACCESS_KEY='memphisOpsAccessKey.v1';
    const DEDICATED_ACCESS_KEY='memphisOpsReadOnlyAccessKey.v1';
    const DEVICE_KEY='memphisAssignedDeviceId';
    const LEGACY_DEVICE_KEY='mz_scan_device_id';
    const form=document.getElementById('access-form');
    const input=document.getElementById('access-key');
    const button=document.getElementById('open-button');
    const status=document.getElementById('status');
    const intro=document.getElementById('intro');

    function setStatus(message,isError){
      status.textContent=String(message||'');
      status.className=`status${isError?' error':''}`;
    }
    function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch{return null;}}
    function validReadOnlySession(session){
      return Boolean(session&&session.token&&session.role==='ops_manager'&&(session.read_only===true||session.access_level==='read_only')&&Date.parse(session.expires_at)>Date.now());
    }
    function normalizeDevice(value){
      const raw=String(value||'').trim();
      if(!raw)return '';
      if(/^kiosk[-_ ]?\d{1,2}$/i.test(raw)){const digits=(raw.match(/\d+/)||[''])[0];return digits?`KIOSK_${digits.padStart(2,'0')}`:raw.toUpperCase();}
      return raw;
    }
    function deviceId(){
      const url=new URL(window.location.href);
      const explicit=normalizeDevice(url.searchParams.get('device')||url.searchParams.get('deviceId')||'');
      if(explicit){try{localStorage.setItem(DEVICE_KEY,explicit);}catch{}return explicit;}
      for(const key of [DEVICE_KEY,LEGACY_DEVICE_KEY]){try{const value=normalizeDevice(localStorage.getItem(key)||'');if(value)return value;}catch{}}
      const generated=`manager-browser-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`;
      try{localStorage.setItem(DEVICE_KEY,generated);}catch{}
      return generated;
    }
    function keyFromUrl(){
      const url=new URL(window.location.href);
      const key=String(url.searchParams.get('ops_access_key')||url.searchParams.get('access_key')||'').trim();
      if(key){url.searchParams.delete('ops_access_key');url.searchParams.delete('access_key');try{history.replaceState({},'',`${url.pathname}${url.search}${url.hash}`);}catch{}}
      return key;
    }
    function redirect(){window.location.replace(new URL(TARGET,window.location.href).toString());}
    async function exchange(key){
      const response=await fetch(`${BACKEND}/auth-api/session`,{method:'GET',cache:'no-store',headers:{'X-Ops-Access-Key':key,'X-Device-Id':deviceId()}});
      const payload=await response.json().catch(()=>null);
      if(!response.ok||!payload?.ok||!payload.data?.session?.token)throw new Error(payload?.error||`Access check failed: HTTP ${response.status}`);
      const session=payload.data.session;
      if(session.read_only!==true&&session.access_level!=='read_only')throw new Error('That key grants full access. Use the full-access manager entry instead.');
      try{
        localStorage.setItem(SESSION_KEY,JSON.stringify(session));
        localStorage.setItem(COMMON_ACCESS_KEY,key);
        localStorage.setItem(DEDICATED_ACCESS_KEY,key);
      }catch{}
      redirect();
    }
    async function start(){
      const existing=readJson(SESSION_KEY);
      if(validReadOnlySession(existing)){redirect();return;}
      const urlKey=keyFromUrl();
      let stored='';
      try{stored=String(localStorage.getItem(DEDICATED_ACCESS_KEY)||'').trim();}catch{}
      const candidate=urlKey||stored;
      if(candidate){
        setStatus('Verifying read-only manager credential…');
        try{await exchange(candidate);return;}catch(error){setStatus(error?.message||'Credential verification failed.',true);}
      }
      intro.textContent='Enter the approved read-only manager key. A full-access key is rejected on this entry page.';
      form.hidden=false;
      input.focus();
    }
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      const key=String(input.value||'').trim();
      if(!key)return;
      button.disabled=true;setStatus('Verifying read-only manager credential…');
      try{await exchange(key);}catch(error){setStatus(error?.message||'Credential verification failed.',true);button.disabled=false;input.select();}
    });
    start().catch((error)=>{intro.textContent='The read-only manager entry could not initialize.';form.hidden=false;setStatus(error?.message||'Startup failed.',true);});
  })();
  </script>
</body>
</html>
