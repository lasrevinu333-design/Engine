    function cleanupStaleLocalSessions(){try{const now=Date.now();const maxAge=7*24*60*60*1000;const toRemove=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{const s=JSON.parse(localStorage.getItem(key));const startedAt=s&&(s.started_at||s.created_at)?new Date(s.started_at||s.created_at).getTime():0;if(startedAt&&now-startedAt>maxAge)toRemove.push(key)}catch{toRemove.push(key)}}toRemove.forEach(key=>localStorage.removeItem(key))}catch{}}
    async function getLatestLocalSessionForLocation(locationCode,deviceId){const sessions=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{sessions.push(JSON.parse(localStorage.getItem(key)))}catch{}}sessions.sort((a,b)=>new Date(b.started_at||0)-new Date(a.started_at||0));return sessions.find((s)=>normalizeLoc(s.location_code||s.location_name)===normalizeLoc(locationCode)&&(!deviceId||s.device_id===deviceId))||null}
    async function ensureDeviceIdInUrl(){const params=new URLSearchParams(window.location.search);const rawExplicit=decodeParam(params.get("device")||params.get("deviceId")||"");let deviceId=normalizeDeviceIdentifier(rawExplicit);if(deviceId){if(rawExplicit!==deviceId){params.set("device",deviceId);const nextUrl=`${window.location.pathname}?${params.toString()}`;window.history.replaceState({},"",nextUrl)}persistDeviceId(deviceId);currentDeviceId=deviceId;updateDebugPanel();return deviceId}deviceId=normalizeDeviceIdentifier(getFullyDeviceId()||readStoredDeviceId()||(window.MemphisDeviceReminders&&typeof window.MemphisDeviceReminders.resolveDeviceId==="function"?window.MemphisDeviceReminders.resolveDeviceId():"")||(location.hostname.includes("github.io")?`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`:""));deviceId=String(deviceId||"").trim();if(!deviceId){params.delete("device");params.delete("deviceId");const cleanUrl=params.toString()?`${window.location.pathname}?${params.toString()}`:window.location.pathname;window.history.replaceState({},"",cleanUrl);currentDeviceId="";updateDebugPanel();return""}params.set("device",deviceId);params.delete("deviceId");const nextUrl=`${window.location.pathname}?${params.toString()}`;persistDeviceId(deviceId);window.history.replaceState({},"",nextUrl);currentDeviceId=deviceId;updateDebugPanel();return deviceId}
    function readStoredDeviceId(){const keys=[CONFIG.DEVICE_STORAGE_KEY,CONFIG.AUTH_DEVICE_STORAGE_KEY,"mz_employee_hub_device_id"];for(const key of keys){const value=normalizeDeviceIdentifier(localStorage.getItem(key)||"");if(value&&!/^device-[a-z0-9-]+$/i.test(value))return value}return""}function persistDeviceId(deviceId){const normalized=normalizeDeviceIdentifier(deviceId);if(!normalized)return;localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY,normalized);localStorage.setItem("mz_employee_hub_device_id",normalized);if(/^KIOSK_[0-9]{2}$/i.test(normalized))localStorage.setItem(CONFIG.AUTH_DEVICE_STORAGE_KEY,normalized)}function resolveDeviceId(){const params=new URLSearchParams(window.location.search);const rawExplicit=decodeParam(params.get("device")||params.get("deviceId")||"");let deviceId=normalizeDeviceIdentifier(rawExplicit);if(!deviceId)deviceId=normalizeDeviceIdentifier(getFullyDeviceId()||readStoredDeviceId()||(window.MemphisDeviceReminders&&typeof window.MemphisDeviceReminders.resolveDeviceId==="function"?window.MemphisDeviceReminders.resolveDeviceId():"")||(location.hostname.includes("github.io")?`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`:""));if(deviceId){persistDeviceId(deviceId);currentDeviceId=deviceId;return deviceId}currentDeviceId="";return""}function getFullyDeviceId(){try{if(window.fully){if(typeof fully.getDeviceName==="function"){const name=String(fully.getDeviceName()||"").trim();if(name)return name}if(typeof fully.getDeviceId==="function"){const id=String(fully.getDeviceId()||"").trim();if(id)return id}if(typeof fully.getSerialNumber==="function"){const serial=String(fully.getSerialNumber()||"").trim();if(serial)return serial}if(typeof fully.getMacAddress==="function"){const mac=String(fully.getMacAddress()||"").trim();if(mac)return mac}}}catch(err){console.warn("Fully device detection failed",err)}return""}
    function calcDurationDisplay(startedAt,endedAt){const start=new Date(startedAt).getTime();const end=new Date(endedAt).getTime();return`${Math.max(0,Math.round((end-start)/60000))} min`}
    function formatDateOnly(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toLocaleDateString()}
    function formatTimeOnly(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
    function normalizeLoc(value){return String(value||"").trim().toUpperCase()}
    function locationCodeFromState(state){return state&&(state.location_code||state.code||state.location_name)||""}
    function renderLoadingCard(title,helper){appEl.innerHTML=`<div class="shell"><div class="card"><div class="eyebrow">MEMPHIS ZOO CUSTODIAL SCAN</div><h1 class="title-blue">${escapeHtml(title)}</h1><div class="helper helperLarge">${escapeHtml(helper)}</div></div></div>`}
    function renderMessageCard(titleClass,title,location,message){appEl.innerHTML=`<div class="shell"><div class="card"><div class="eyebrow">MEMPHIS ZOO CUSTODIAL SCAN</div><h1 class="${escapeAttr(titleClass)}">${escapeHtml(title)}</h1>${location?`<div class="location">${escapeHtml(location)}</div>`:""}<div class="status error">${escapeHtml(message)}</div></div></div>`}
    function buildContinueUrl(params){const url=new URL(window.location.href);url.search="";Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=="")url.searchParams.set(k,v)});return url.toString()}
    function applyBackground(url){const finalUrl=url||CONFIG.DEFAULT_BACKGROUND_IMAGE_URL;if(!finalUrl)return;document.body.style.setProperty("--bg-image",`url(\"${new URL(finalUrl,window.location.href).toString()}\")`)}
    function decodeParam(value){const s=String(value||"").replace(/\+/g," ");try{return decodeURIComponent(s).trim()}catch{return s.trim()}}
    function formatDateTime(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()}
    function safeError(err){return err&&err.message?String(err.message):String(err||"Unknown error")}
    function optionalManagerAuthHeaders(){try{const session=window.MemphisAuth?.readSession?.();return session&&window.MemphisAuth?.isOpsManager?.(session)?{Authorization:`Bearer ${session.token}`,'X-Device-Id':window.MemphisAuth.getDeviceId()}:{};}catch{return{};}}
    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;")}
  </script>
