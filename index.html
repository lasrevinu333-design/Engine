    function setupConnectivityListeners(){window.addEventListener("memphis-scan-sync",(event)=>{refreshDebugQueueCounts();updateSyncBadge();const item=event.detail&&event.detail.item;const result=event.detail&&event.detail.result;if(event.detail&&event.detail.status==="synced"&&["complete_session","commit_workflow"].includes(String(item&&item.type||""))){const sessionId=String(result&&result.client_session_id||result&&result.session_uuid||item&&item.replay_binding&&item.replay_binding.client_session_id||item&&item.payload&&(item.payload.p_client_session_id||item.payload.p_session_uuid)||"");if(sessionId&&!getLocalSessionById(sessionId)){clearCompletionDraft(sessionId);window.MemphisUI?.clearScanView?.(sessionId,currentDeviceId);window.location.replace(buildEmployeeHubUrl(currentDeviceId))}}});window.addEventListener("online",()=>{if(backendRecoveryTimer||document.querySelector("#retry-backend"))retryBackendScan().catch(console.warn)});syncBadge.setAttribute("role","button");syncBadge.setAttribute("tabindex","0");syncBadge.setAttribute("aria-label","Scan synchronization status. Activate to retry stuck submissions.");const retry=()=>{retryStuckQueue().catch(console.warn)};syncBadge.addEventListener("click",retry);syncBadge.addEventListener("keydown",(event)=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();retry()}})}
    function startSyncLoop(){syncQueue().catch(console.warn)}
    async function syncQueue(){await window.MemphisScanSync.ready;const result=await window.MemphisScanSync.sync();await refreshDebugQueueCounts();updateSyncBadge();return result}
    async function retryStuckQueue(){await window.MemphisScanSync.ready;const items=await getQueuedActions();const deadLetters=items.filter((item)=>item.dead_letter===true);if(deadLetters.length){syncBadge.textContent=`Retrying ${deadLetters.length} stuck submission${deadLetters.length===1?"":"s"}…`;await window.MemphisScanSync.recoverAllDeadLetters()}return syncQueue()}
    function updateSyncBadge(forcedText=null){if(forcedText){syncBadge.textContent=forcedText;return}getQueuedActions().then((items)=>{const queued=items.length;const deadLetters=items.filter((item)=>item.dead_letter===true).length;const retrying=items.filter((item)=>item.dead_letter!==true&&Number(item.retry_count||0)>0).length;if(!navigator.onLine)syncBadge.textContent=`Offline • ${queued} queued`;else if(deadLetters)syncBadge.textContent=`Online • ${deadLetters} stuck • tap to retry`;else if(queued&&retrying)syncBadge.textContent=`Online • ${queued} queued • ${retrying} retrying`;else if(queued)syncBadge.textContent=`Online • ${queued} queued`;else syncBadge.textContent="Connected"}).catch(()=>{syncBadge.textContent=navigator.onLine?"Connected":"Offline"})}
    async function openQueueDb(){await window.MemphisScanSync.ready;return window.MemphisScanSync}
    async function enqueueAction(action){await window.MemphisScanSync.ready;return window.MemphisScanSync.enqueue(action)}
    async function getQueuedActions(){await window.MemphisScanSync.ready;return window.MemphisScanSync.listActions()}
    function sessionStorageKey(sessionUuid){return `session:${sessionUuid}`}
    async function completionIdForSession(sessionIdentifier){const bytes=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(`memphis-zoo-completion:${String(sessionIdentifier||"").trim()}`)));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes.slice(0,16),(value)=>value.toString(16).padStart(2,"0")).join("");return`${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`}
    async function saveLocalSession(session){const prior=getLocalSessionById(session&&session.session_uuid);const preserveAcknowledgement=session&&session.completion_pending===true&&prior&&prior.server_acknowledged===true;const preserveCompletionId=session&&session.completion_pending===true&&prior&&prior.client_completion_id;const stored={...session,client_completion_id:preserveCompletionId||session&&session.client_completion_id,server_acknowledged:preserveAcknowledgement?true:session&&session.server_acknowledged,updated_at:new Date().toISOString()};await mutateCustodialWork(()=>localStorage.setItem(sessionStorageKey(stored.session_uuid),JSON.stringify(stored)))}
    async function removeLocalSession(sessionUuid){await mutateCustodialWork(()=>{localStorage.removeItem(sessionStorageKey(sessionUuid));localStorage.removeItem(completionDraftKey(sessionUuid))});window.MemphisUI?.clearScanView?.(sessionUuid,currentDeviceId)}
    function getLocalSessionById(sessionUuid){try{const raw=localStorage.getItem(sessionStorageKey(sessionUuid));return raw?JSON.parse(raw):null}catch{return null}}
    function findAnyOpenLocalSessionForDevice(deviceId){cleanupStaleLocalSessions();const sessions=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.device_id===deviceId&&(["active","server-active","pending_submit","pending_sync","offline-provisional"].includes(String(s.status||"").toLowerCase())))sessions.push(s)}catch{}}sessions.sort((a,b)=>new Date(b.updated_at||b.ended_at||b.started_at||0)-new Date(a.updated_at||a.ended_at||a.started_at||0));return sessions[0]||null}
    function cleanupStaleLocalSessions(){if(window.MemphisCustodialSecurity?.native===true||custodialSecurityPausedNow())return;try{const now=Date.now();const maxAge=7*24*60*60*1000;const toRemove=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{const s=JSON.parse(localStorage.getItem(key));const startedAt=s&&(s.started_at||s.created_at)?new Date(s.started_at||s.created_at).getTime():0;if(startedAt&&now-startedAt>maxAge)toRemove.push(key)}catch{toRemove.push(key)}}toRemove.forEach(key=>localStorage.removeItem(key))}catch{}}
    async function getLatestLocalSessionForLocation(locationCode,deviceId){const sessions=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("session:"))continue;try{sessions.push(JSON.parse(localStorage.getItem(key)))}catch{}}sessions.sort((a,b)=>new Date(b.started_at||0)-new Date(a.started_at||0));return sessions.find((s)=>normalizeLoc(s.location_code||s.location_name)===normalizeLoc(locationCode)&&(!deviceId||s.device_id===deviceId))||null}
    async function ensureDeviceIdInUrl(){const params=new URLSearchParams(window.location.search);const rawExplicit=decodeParam(params.get("device")||params.get("deviceId")||"");const protectedDeviceId=normalizeDeviceIdentifier(window.MemphisCustodialSecurity?.native===true?window.MemphisCustodialSecurity.getStatus?.().deviceId:"");const shared=window.MemphisDeviceIdentity?.resolve?.({url:new URL(window.location.href)});const fullyDeviceId=normalizeDeviceIdentifier(getFullyDeviceId());const storedDeviceId=normalizeDeviceIdentifier(readStoredDeviceId());let deviceId=normalizeDeviceIdentifier(protectedDeviceId||shared?.deviceId||(/^KIOSK_(?:0[1-9]|10)$/i.test(fullyDeviceId)?fullyDeviceId:"")||(/^KIOSK_(?:0[1-9]|10)$/i.test(rawExplicit)?rawExplicit:"")||(/^KIOSK_(?:0[1-9]|10)$/i.test(storedDeviceId)?storedDeviceId:"")||rawExplicit||fullyDeviceId||storedDeviceId||(window.MemphisDeviceReminders&&typeof window.MemphisDeviceReminders.resolveDeviceId==="function"?window.MemphisDeviceReminders.resolveDeviceId():"")||(location.hostname.includes("github.io")?`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`:""));deviceId=String(deviceId||"").trim();if(!deviceId){params.delete("device");params.delete("deviceId");const cleanUrl=params.toString()?`${window.location.pathname}?${params.toString()}`:window.location.pathname;window.history.replaceState({},"",cleanUrl);currentDeviceId="";updateDebugPanel();return""}params.set("device",deviceId);params.delete("deviceId");const nextUrl=`${window.location.pathname}?${params.toString()}`;persistDeviceId(deviceId);window.history.replaceState({},"",nextUrl);currentDeviceId=deviceId;updateDebugPanel();return deviceId}
    function readStoredDeviceId(){const keys=[CONFIG.DEVICE_STORAGE_KEY,CONFIG.AUTH_DEVICE_STORAGE_KEY,"mz_employee_hub_device_id"];for(const key of keys){const value=normalizeDeviceIdentifier(localStorage.getItem(key)||"");if(value&&!/^device-[a-z0-9-]+$/i.test(value))return value}return""}function persistDeviceId(deviceId){if(window.MemphisCustodialSecurity?.native===true)return;const normalized=normalizeDeviceIdentifier(deviceId);if(!normalized)return;localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY,normalized);localStorage.setItem("mz_employee_hub_device_id",normalized);if(/^KIOSK_[0-9]{2}$/i.test(normalized))localStorage.setItem(CONFIG.AUTH_DEVICE_STORAGE_KEY,normalized)}function resolveDeviceId(){const params=new URLSearchParams(window.location.search);const rawExplicit=decodeParam(params.get("device")||params.get("deviceId")||"");const protectedDeviceId=normalizeDeviceIdentifier(window.MemphisCustodialSecurity?.native===true?window.MemphisCustodialSecurity.getStatus?.().deviceId:"");const shared=window.MemphisDeviceIdentity?.resolve?.({url:new URL(window.location.href)});const fullyDeviceId=normalizeDeviceIdentifier(getFullyDeviceId());const storedDeviceId=normalizeDeviceIdentifier(readStoredDeviceId());let deviceId=normalizeDeviceIdentifier(protectedDeviceId||shared?.deviceId||(/^KIOSK_(?:0[1-9]|10)$/i.test(fullyDeviceId)?fullyDeviceId:"")||(/^KIOSK_(?:0[1-9]|10)$/i.test(rawExplicit)?rawExplicit:"")||(/^KIOSK_(?:0[1-9]|10)$/i.test(storedDeviceId)?storedDeviceId:"")||rawExplicit||fullyDeviceId||storedDeviceId||(window.MemphisDeviceReminders&&typeof window.MemphisDeviceReminders.resolveDeviceId==="function"?window.MemphisDeviceReminders.resolveDeviceId():"")||(location.hostname.includes("github.io")?`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`:""));if(deviceId){persistDeviceId(deviceId);currentDeviceId=deviceId;return deviceId}currentDeviceId="";return""}
    function calcDurationDisplay(startedAt,endedAt){const start=new Date(startedAt).getTime();const end=new Date(endedAt).getTime();return`${Math.max(0,Math.round((end-start)/60000))} min`}
    function formatDateOnly(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toLocaleDateString()}
    function formatTimeOnly(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
    function normalizeLoc(value){return String(value||"").trim().toUpperCase()}
    function locationCodeFromState(state){return state&&(state.location_code||state.code||state.location_name)||""}
    function renderLoadingCard(title,helper){appEl.innerHTML=`<div class="shell"><div class="card"><div class="eyebrow">MEMPHIS ZOO CUSTODIAL SCAN</div><h1 class="title-blue">${escapeHtml(title)}</h1><div class="helper helperLarge">${escapeHtml(helper)}</div></div></div>`}
    function renderMessageCard(titleClass,title,location,message){appEl.innerHTML=`<div class="shell"><div class="card"><div class="eyebrow">MEMPHIS ZOO CUSTODIAL SCAN</div><h1 class="${escapeAttr(titleClass)}">${escapeHtml(title)}</h1>${location?`<div class="location">${escapeHtml(location)}</div>`:""}<div class="status error">${escapeHtml(message)}</div></div></div>`}
    function buildContinueUrl(params){const url=new URL(window.location.href);url.search="";Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=="")url.searchParams.set(k,v)});return url.toString()}
    function applyBackground(url){const finalUrl=url||CONFIG.DEFAULT_BACKGROUND_IMAGE_URL;if(!finalUrl)return;document.body.style.setProperty("--bg-image",`url(\"${new URL(finalUrl,window.location.href).toString()}\")`)}
    function decodeParam(value){const s=String(value||"").replace(/\+/g," ");try{return decodeURIComponent(s).trim()}catch{return s.trim()}}
    function formatDateTime(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()}
    function safeError(err){return err&&err.message?String(err.message):String(err||"Unknown error")}
    function shouldCreateOfflineProvisional(err){if(custodialSecurityPausedNow()||["custodial_restore_quarantine","custodial_secure_storage_unavailable","custodial_security_state_unavailable"].includes(String(err&&err.code||"")))return false;if(!navigator.onLine)return true;const status=Number(err&&err.httpStatus||0);if(status>=400&&status<500)return false;if(status>=500)return true;return Boolean(err&&(err.transportError||err.name==="TypeError"||err.name==="AbortError"||/Failed to fetch|NetworkError|Load failed|timeout|aborted/i.test(String(err.message||err))));}
    function optionalManagerAuthHeaders(){try{const session=window.MemphisAuth?.readSession?.();return session&&window.MemphisAuth?.isOpsManager?.(session)?{Authorization:`Bearer ${session.token}`,'X-Device-Id':window.MemphisAuth.getDeviceId()}:{};}catch{return{};}}
    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;")}
