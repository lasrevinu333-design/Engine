<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://api.open-meteo.com; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <title>Memphis Zoo Operations Viewer</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./ops-viewer.css" />
</head>
<body>
  <header class="viewer-header">
    <div class="brand"><img src="./Zoo_Logo_ui.webp" alt="Memphis Zoo" /><div><h1>Operations Viewer</h1><p>Read-only dashboard and published events</p></div></div>
    <a class="leadership-link" href="./ops-manager-hub.html">Leadership sign-in</a>
  </header>
  <main class="viewer-shell">
    <nav class="tabs" aria-label="Operations Viewer sections">
      <button class="tab active" data-panel="dashboard" type="button">Dashboard</button>
      <button class="tab" data-panel="events" type="button">Events</button>
    </nav>

    <section id="dashboard" class="panel active">
      <div class="panel-heading"><div><h2>Custodial Dashboard</h2><p>Public-safe operational totals only. Employee, device, note, ticket-detail, and submitted-report data are excluded.</p></div><button id="refresh-dashboard" class="button" type="button">Refresh</button></div>
      <div id="metrics" class="metrics" aria-live="polite"></div>
      <div id="dashboard-status" class="status"></div>
    </section>

    <section id="events" class="panel">
      <div class="panel-heading"><div><h2>Upcoming Events</h2><p>Published scheduled events from the Operations system.</p></div><button id="refresh-events" class="button" type="button">Refresh</button></div>
      <div id="event-list" class="event-list" aria-live="polite"></div>
      <div id="events-status" class="status"></div>
    </section>

  </main>
  <script src="./ops-viewer.js"></script>
</body>
</html>
