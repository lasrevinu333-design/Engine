<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Memphis Zoo City Work Orders</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#123b2b;color:#fff}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:520px}
    .spinner{width:46px;height:46px;margin:0 auto 18px;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    a{color:#dff7b0}
  </style>
</head>
<body>
<main id="loader">
  <div class="box">
    <div class="spinner"></div>
    <h1>Opening City Work Order Queue</h1>
    <p>Loading the shared operations workspace…</p>
  </div>
</main>
<script>
(async()=>{
  const source='https://rqquvtjdmugpigbndmne.supabase.co/functions/v1/city-work-orders-page';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('Application returned HTTP '+response.status);
    const html=await response.text();
    if(!/^\s*<!doctype html>/i.test(html))throw new Error('Application response was not valid HTML');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loader').innerHTML='<div class="box"><h1>City Work Order Queue unavailable</h1><p>'+String(error.message||error)+'</p><p><a href="'+source+'">Open the application directly</a></p></div>';
  }
})();
</script>
</body>
</html>
