const state={currentUserId:'',currentDeviceId:'',currentRole:'',isManagerOverview:false,managerSession:null,hubContext:'manager',threadId:'',thread:null,users:[],lastMarkedReadSignature:'',pendingRender:false,lastVisibleMessages:[],chatAudioCtx:null,chatAudioPrimed:false,pendingClientMessageId:'',pendingClientBody:'',updateCursorAt:'1970-01-01T00:00:00.000Z',updateCursorId:'00000000-0000-0000-0000-000000000000',liveController:null,liveSequence:0,liveAppliedSequence:0,liveReconnectDelay:1000,liveStopped:false,liveRunning:false};

init().catch((error)=>setStatus(`Startup error: ${safe(error)}`));
async function init(){ const url=new URL(window.location.href); state.currentDeviceId=resolveDeviceId(url); state.currentUserId=String(url.searchParams.get('user_id')||localStorage.getItem(CONFIG.STORAGE_USER_KEY)||'').trim(); state.hubContext=resolveHubContext(url); state.threadId=String(url.searchParams.get('thread_id')||'').trim(); const mode=String(url.searchParams.get('mode')||'').trim(); bindEvents(); await establishManagerSession(); await resolveIdentity(); restoreDraft(); if(mode==='new'){ await loadUsers(); els.pickerOverlay.classList.remove('hidden'); return; } if(mode==='memphis'){ const thread=await apiPost('/memphis/thread',{user_id:state.currentUserId,device_id:state.currentDeviceId}); state.threadId=String(thread.id||'').trim(); replaceQuery({thread_id:state.threadId}); } await loadThreadMeta(); await refreshMessages(); await flushOutbox(); startIncrementalSync(); }

function waitMs(ms){return new Promise((resolve)=>setTimeout(resolve,ms));}
function updateMessageCursor(rows){ if(!Array.isArray(rows))return; for(const row of rows){ const at=String(row.updated_at||row.sent_at||row.created_at||'').trim(); const id=String(row.id||row.message_id||'').trim(); if(!at||!id)continue; const nextMs=Date.parse(at); const currentMs=Date.parse(state.updateCursorAt); if(Number.isFinite(nextMs)&&(nextMs>currentMs||(nextMs===currentMs&&id>state.updateCursorId))){state.updateCursorAt=new Date(nextMs).toISOString();state.updateCursorId=id;} } }
function resetIncrementalSync(){ state.liveController?.abort(); state.updateCursorAt='1970-01-01T00:00:00.000Z'; state.updateCursorId='00000000-0000-0000-0000-000000000000'; state.liveStopped=false; if(!state.liveRunning)startIncrementalSync(); }
function startIncrementalSync(){ if(state.liveRunning||state.liveStopped||!state.threadId)return; state.liveRunning=true; incrementalSyncLoop().finally(()=>{state.liveRunning=false;if(!state.liveStopped&&state.threadId)setTimeout(startIncrementalSync,state.liveReconnectDelay);}); }
async function incrementalSyncLoop(){ while(!state.liveStopped&&state.threadId){ const sequence=++state.liveSequence; const controller=new AbortController(); state.liveController=controller; const qs=`?user_id=${encodeURIComponent(state.currentUserId)}${state.currentDeviceId?`&device_id=${encodeURIComponent(state.currentDeviceId)}`:''}&after=${encodeURIComponent(state.updateCursorAt)}&after_id=${encodeURIComponent(state.updateCursorId)}&request_seq=${sequence}&wait_ms=20000&limit=100`; try{ const envelope=await apiGetEnvelope(`/thread/${encodeURIComponent(state.threadId)}/updates${qs}`,{signal:controller.signal}); if(sequence<state.liveAppliedSequence)continue; state.liveAppliedSequence=sequence; const next=envelope.meta?.next_cursor; if(next?.after&&next?.after_id)updateMessageCursor([{sent_at:next.after,id:next.after_id}]); if(Array.isArray(envelope.data)&&envelope.data.length){ updateMessageCursor(envelope.data); await refreshMessages(); } state.liveReconnectDelay=1000; }catch(error){ if(controller.signal.aborted||state.liveStopped)continue; try{await refreshMessages();}catch{} await waitMs(state.liveReconnectDelay+Math.floor(Math.random()*350)); state.liveReconnectDelay=Math.min(15000,Math.round(state.liveReconnectDelay*1.8)); }finally{ if(state.liveController===controller)state.liveController=null; } } }
function isManagerOverviewDeviceId(deviceId){ return MANAGER_OVERVIEW_DEVICE_IDS.has(String(deviceId||'').trim()); }
function bindEvents(){ els.backBtn.addEventListener('click',goBackToMessages); els.sendBtn.addEventListener('click',sendMessage); els.composeInput.addEventListener('input',persistDraft); els.composeInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }); els.pickerCancel.addEventListener('click',goBackToMessages); els.selectAll.addEventListener('change',()=>{ Array.from(els.pickerList.querySelectorAll('input[type="checkbox"]')).forEach((box)=>{ if(!box.disabled)box.checked=els.selectAll.checked; }); updatePickerSelection(); }); els.pickerList.addEventListener('change',updatePickerSelection); els.pickerCreate.addEventListener('click',createConversationFromPicker); els.messages.addEventListener('click',handleMessageClick); const prime=()=>primeChatAudio(); window.addEventListener('pointerdown',prime,{once:true,passive:true}); window.addEventListener('touchstart',prime,{once:true,passive:true}); window.addEventListener('keydown',prime,{once:true}); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){primeChatAudio();if(!state.liveRunning){state.liveStopped=false;startIncrementalSync();}} }); window.addEventListener('online',()=>{flushOutbox().catch(()=>{});if(!state.liveRunning){state.liveStopped=false;startIncrementalSync();}}); window.addEventListener('pagehide',()=>{state.liveStopped=true;state.liveController?.abort();}); }
function resolveDeviceId(url){ const explicit=String(url.searchParams.get('device')||url.searchParams.get('deviceId')||'').trim(); if(explicit){ localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY,explicit); return explicit; } const stored=String(localStorage.getItem(CONFIG.DEVICE_STORAGE_KEY)||'').trim(); if(stored)return stored; if(location.hostname.includes('github.io')){ const visitorId=`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`; localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY,visitorId); return visitorId; } return ''; }
function resolveHubContext(url){ const value=String(url.searchParams.get('hub')||'').trim().toLowerCase(); return value==='employee'?'employee':'manager'; }
function isAnnieOrigin(url=new URL(window.location.href)){const marker=String(url.searchParams.get('origin')||'').trim().toLowerCase()==='annie';const fromAnnie=String(document.referrer||'').startsWith(ANNIE_RETURN_URL);if(marker||fromAnnie){try{sessionStorage.setItem(ANNIE_ORIGIN_SESSION_KEY,'1');}catch(_err){}return true;}try{return sessionStorage.getItem(ANNIE_ORIGIN_SESSION_KEY)==='1';}catch(_err){return false;}}
function preserveAnnieOrigin(url){ if(isAnnieOrigin()) url.searchParams.set('origin','annie'); return url; }
function goBackToMessages(){ const url=preserveAnnieOrigin(new URL('./messages.html',window.location.href)); if(state.currentDeviceId)url.searchParams.set('device',state.currentDeviceId); if(state.currentUserId)url.searchParams.set('user_id',state.currentUserId); url.searchParams.set('hub', state.hubContext); window.location.href=url.toString(); }
async function apiGetEnvelope(path,options={}){ const response=await fetch(`${CONFIG.API_BASE}${path}`,{cache:'no-store',headers:optionalManagerAuthHeaders(),signal:options.signal}); const payload=await response.json().catch(()=>null); if(!response.ok||!payload||!payload.ok)throw new Error(payload?.error||`HTTP ${response.status}`); return payload; }
async function apiGet(path,options={}){ return (await apiGetEnvelope(path,options)).data; }
function optionalManagerAuthHeaders(){ const session=window.MemphisAuth?.readSession?.(); return session&&window.MemphisAuth?.isOpsManager?.(session)?{Authorization:`Bearer ${session.token}`,'X-Device-Id':window.MemphisAuth.getDeviceId()}:{}; }
async function apiPost(path,body){ const response=await fetch(`${CONFIG.API_BASE}${path}`,{method:'POST',headers:{'Content-Type':'application/json',...optionalManagerAuthHeaders()},body:JSON.stringify(body||{})}); const payload=await response.json().catch(()=>null); if(!response.ok||!payload||!payload.ok)throw new Error(payload?.error||`HTTP ${response.status}`); return payload.data; }

function updatePickerSelection(){ const boxes=Array.from(els.pickerList.querySelectorAll('input[type="checkbox"]:not(:disabled)')); const checked=boxes.filter((box)=>box.checked); els.selectAll.checked=boxes.length>0&&checked.length===boxes.length; els.selectAll.indeterminate=checked.length>0&&checked.length<boxes.length; const suffix=checked.length===1?'person selected':'people selected'; els.pickerSummary.textContent=`${checked.length} ${suffix}`; els.pickerCreate.disabled=checked.length===0; }

function isCustodialTeamThread(thread){ return thread?.is_custodial_team===true||String(thread?.system_key||'')==='custodial_team_chat_v1'; }

function createClientMessageId(){ try{ if(window.crypto&&typeof window.crypto.randomUUID==='function')return `msg:${window.crypto.randomUUID()}`; }catch{} return `msg:${Date.now().toString(36)}:${Math.random().toString(36).slice(2)}`; }
function threadOperationSignature(title,memberIds){ return `${String(title||'').trim()}|${[...memberIds].sort().join(',')}`; }
function stableThreadOperationId(title,memberIds){ const signature=threadOperationSignature(title,memberIds); const key=`${CONFIG.THREAD_OPERATION_PREFIX}${state.currentUserId}`; try{ const existing=JSON.parse(localStorage.getItem(key)||'null'); if(existing?.signature===signature&&existing?.id)return existing.id; }catch{} const id=createClientMessageId().replace(/^msg:/,'thread:'); try{localStorage.setItem(key,JSON.stringify({signature,id,created_at:Date.now()}));}catch{} return id; }
function clearThreadOperation(){ try{localStorage.removeItem(`${CONFIG.THREAD_OPERATION_PREFIX}${state.currentUserId}`);}catch{} }
async function createConversationFromPicker(){ const checked=[...new Set(Array.from(els.pickerList.querySelectorAll('input[type="checkbox"]:checked')).map((x)=>String(x.value||'').trim()).filter(Boolean))]; if(!checked.length){ setStatus('Select at least one person.'); return; } const oldText=els.pickerCreate.textContent; els.pickerCreate.disabled=true; els.pickerCreate.textContent='Creating…'; try{ let thread; const allCount=els.pickerList.querySelectorAll('input[type="checkbox"]:not(:disabled)').length; const wholeTeamSelected=checked.length>1&&els.selectAll.checked&&checked.length===allCount; if(wholeTeamSelected){ thread=await apiPost('/thread/team',{created_by_user_id:state.currentUserId,device_id:state.currentDeviceId}); }else if(checked.length===1){ thread=await apiPost('/thread/direct',{created_by_user_id:state.currentUserId,other_user_id:checked[0],device_id:state.currentDeviceId}); }else{ const groupTitle=String(els.groupTitle.value||'').trim()||null; const clientThreadId=stableThreadOperationId(groupTitle,checked); thread=await apiPost('/thread/group',{created_by_user_id:state.currentUserId,title:groupTitle,member_user_ids:checked,device_id:state.currentDeviceId,client_thread_id:clientThreadId}); } state.threadId=String(thread.id||thread.thread_id||'').trim(); if(!state.threadId)throw new Error('The server did not return a conversation.'); clearThreadOperation(); replaceQuery({thread_id:state.threadId}); els.pickerOverlay.classList.add('hidden'); await loadThreadMeta(); await refreshMessages({forceRender:true}); resetIncrementalSync(); }catch(error){ setStatus(`Conversation could not be created: ${safe(error)}`,{sticky:true}); }finally{ els.pickerCreate.textContent=oldText; updatePickerSelection(); } }
function replaceQuery(params){ const url=preserveAnnieOrigin(new URL(window.location.href)); url.searchParams.delete('mode'); Object.entries(params).forEach(([k,v])=>{if(v)url.searchParams.set(k,v);}); if(state.currentDeviceId)url.searchParams.set('device',state.currentDeviceId); if(state.currentUserId)url.searchParams.set('user_id',state.currentUserId); url.searchParams.set('hub', state.hubContext); history.replaceState(null,'',url.toString()); }
async function loadThreadMeta(){ await resolveIdentity(); const qs=`/threads?user_id=${encodeURIComponent(state.currentUserId)}${state.currentDeviceId?`&device_id=${encodeURIComponent(state.currentDeviceId)}`:''}`; const threads=await apiGet(qs); const found=threads.find((t)=>String(t.thread_id||t.id||'')===state.threadId); if(!found){ state.thread=null; els.threadTitle.textContent='Conversation'; els.threadMeta.textContent='Thread not found'; els.threadMeta.style.display='block'; renderComposerState(); return; } state.thread=normalizeThread(found); renderThreadHeader(); renderComposerState(); }
function renderThreadHeader(){ if(!state.thread)return; const displayTitle=getDisplayThreadTitle(state.thread); const isMemphis=String(state.thread.thread_type).toLowerCase()==='bot'||String(displayTitle||'').trim().toLowerCase()==='memphis'; els.threadTitle.textContent=displayTitle||'Conversation'; if(isMemphis){ els.threadMeta.textContent=''; els.threadMeta.style.display='none'; els.threadAvatar.innerHTML=`<img src="${MEMPHIS_AVATAR}" alt="Memphis" />`; }else{ const readOnlySuffix=state.thread.viewer_can_send===false?' · read-only':''; const audience=state.thread.is_ops_manager_shared?'Shared by all Ops Managers':state.thread.is_custodial_team?'Shared by all active custodial staff':labelThreadType(state.thread.thread_type); els.threadMeta.textContent=`${audience}${readOnlySuffix}`; els.threadMeta.style.display='block'; const initials=String(displayTitle||'C').split(/\s+/).slice(0,2).map((x)=>x[0]||'').join('').toUpperCase(); els.threadAvatar.textContent=initials||'C'; } }
function renderComposerState(){ const canSend=state.thread?.viewer_can_send!==false; els.composeInput.disabled=!canSend; els.sendBtn.disabled=!canSend; els.composeInput.placeholder=canSend?'Type a message':'Read-only manager view'; }
function getThreadHiddenCutoffMs(threadId){ if(!threadId||state.thread?.is_ops_manager_shared)return null; const raw=localStorage.getItem(`${CONFIG.THREAD_HIDDEN_AT_PREFIX}${threadId}`); if(!raw) return null; const ms=Date.parse(raw); return Number.isFinite(ms) ? ms : null; }
function isNearMessagesBottom(threshold=120){ return (els.messages.scrollHeight - els.messages.clientHeight - els.messages.scrollTop) <= threshold; }
function hasActiveTextSelection(){ const selection=window.getSelection&&window.getSelection(); return Boolean(selection && String(selection.toString()||'').trim()); }
function scrollMessagesToBottom(behavior='smooth'){ requestAnimationFrame(()=>{ els.messages.scrollTo({top:els.messages.scrollHeight,behavior}); }); }
function primeChatAudio(){ if(state.chatAudioPrimed&&state.chatAudioCtx?.state!=='suspended') return state.chatAudioCtx; try{ const AudioContextClass=window.AudioContext||window.webkitAudioContext; if(AudioContextClass&&!state.chatAudioCtx) state.chatAudioCtx=new AudioContextClass(); if(state.chatAudioCtx?.state==='suspended') state.chatAudioCtx.resume().catch(()=>{}); state.chatAudioPrimed=Boolean(state.chatAudioCtx); }catch(_err){} return state.chatAudioCtx; }
function playChatSwoosh(kind='receive'){ if(document.visibilityState==='hidden') return false; const ctx=primeChatAudio(); if(!ctx) return false; try{ const now=ctx.currentTime||0; const duration=kind==='send'?0.16:0.2; const startFreq=kind==='send'?540:420; const endFreq=kind==='send'?760:660; const gain=ctx.createGain(); const osc=ctx.createOscillator(); gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(kind==='send'?0.055:0.07, now+0.012); gain.gain.exponentialRampToValueAtTime(0.0001, now+duration); osc.type='sine'; osc.frequency.setValueAtTime(startFreq, now); osc.frequency.exponentialRampToValueAtTime(endFreq, now+duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now+duration+0.02); return true; }catch(_err){ return false; } }
function summarizeVisibleMessages(rows){ return Array.isArray(rows)?rows.map((message)=>({ id:String(message.id||message.message_id||message.sent_at||''), sender_user_id:String(message.sender_user_id||''), message_type:String(message.message_type||''), body:String(message.body||'') })):[]; }
function hasIncomingMessages(previousRows,nextRows){ if(!Array.isArray(previousRows)||!previousRows.length||!Array.isArray(nextRows)||!nextRows.length) return false; const seen=new Set(previousRows.map((message)=>String(message.id||''))); return nextRows.some((message)=>{ const id=String(message.id||''); if(!id||seen.has(id)) return false; return String(message.sender_user_id||'')!==state.currentUserId; }); }
async function refreshMessages(options={}){ if(!state.threadId){ state.lastVisibleMessages=[]; els.messages.innerHTML='<div class="empty">Choose a conversation.</div>'; scrollMessagesToBottom('auto'); return []; } const forceRender=options.forceRender===true; const shouldStickToBottom=isNearMessagesBottom(); const previousScrollHeight=els.messages.scrollHeight; const previousScrollTop=els.messages.scrollTop; const rows=await apiGet(`/thread/${encodeURIComponent(state.threadId)}/messages?user_id=${encodeURIComponent(state.currentUserId)}${state.currentDeviceId?`&device_id=${encodeURIComponent(state.currentDeviceId)}`:''}&limit=100`); updateMessageCursor(rows); const cutoffMs=getThreadHiddenCutoffMs(state.threadId); const visibleRows=rows.filter((message)=>message.is_deleted!==true).filter((message)=>{ if(cutoffMs==null)return true; const sentMs=Date.parse(message.sent_at||message.created_at||message.updated_at||''); return !Number.isFinite(sentMs)||sentMs>cutoffMs; }); const summarizedRows=summarizeVisibleMessages(visibleRows); const shouldPlayReceive=hasIncomingMessages(state.lastVisibleMessages,summarizedRows); const signature=visibleRows.map((message)=>`${message.id||message.message_id||message.sent_at||''}:${message.message_type||''}:${message.body||''}:${message.updated_at||''}`).join('|'); if(!forceRender&&signature===state.lastMessageSignature&&!state.pendingRender)return visibleRows; state.pendingRender=false; state.lastMessageSignature=signature; if(!forceRender&&hasActiveTextSelection()){ state.lastVisibleMessages=summarizedRows; state.pendingRender=true; return visibleRows; } if(!visibleRows.length){ state.lastVisibleMessages=[]; els.messages.innerHTML='<div class="empty">No messages yet.</div>'; scrollMessagesToBottom('auto'); return visibleRows; } els.messages.innerHTML=visibleRows.map((message)=>{ const mine=String(message.sender_user_id||'')===state.currentUserId; const cls=mine?'self':message.message_type==='bot_response'?'bot':'other'; const canDelete=mine||state.isManagerOverview; const actions=`<div class="msgActions"><button class="msgAction copyBtn" type="button" aria-label="Copy message">Copy</button>${canDelete?`<button class="msgAction deleteMsgBtn" type="button" data-message-delete="${escapeAttr(message.id)}" aria-label="Delete message from ${escapeAttr(message.sender_display_name||'Unknown')}">Delete</button>`:''}</div>`; return `<div class="msgRow ${cls}" data-message-id="${escapeAttr(message.id)}"><div class="bubble">${actions}<div class="msgSender">${escapeHtml(message.sender_display_name||'Unknown')}</div><div class="msgText">${escapeHtml(message.body||'')}</div><div class="msgFoot">${escapeHtml(formatLongTime(message.sent_at))}</div></div></div>`; }).join(''); state.lastVisibleMessages=summarizedRows; if(shouldStickToBottom){scrollMessagesToBottom('smooth');}else{const heightDelta=els.messages.scrollHeight-previousScrollHeight;els.messages.scrollTop=previousScrollTop+heightDelta;} if(shouldPlayReceive)playChatSwoosh('receive'); if(state.thread?.viewer_can_send!==false&&signature&&signature!==state.lastMarkedReadSignature){state.lastMarkedReadSignature=signature;markThreadRead().catch(()=>{});} return visibleRows; }
async function markThreadRead(){ if(!state.threadId||!state.currentUserId||state.thread?.viewer_can_send===false) return; await apiPost(`/thread/${encodeURIComponent(state.threadId)}/read`,{user_id:state.currentUserId,device_id:state.currentDeviceId}); }
function legacyCopyText(text){ const helper=document.createElement('textarea'); helper.value=text; helper.setAttribute('readonly','readonly'); helper.style.position='fixed'; helper.style.top='0'; helper.style.left='0'; helper.style.width='1px'; helper.style.height='1px'; helper.style.opacity='0'; document.body.appendChild(helper); helper.focus(); helper.select(); let copied=false; try{ copied=document.execCommand('copy')===true; }catch{} helper.remove(); return copied; }
async function handleMessageClick(event){ const deleteButton=event.target.closest('[data-message-delete]'); if(deleteButton){ event.preventDefault(); event.stopPropagation(); const messageId=String(deleteButton.dataset.messageDelete||'').trim(); if(!messageId||!state.threadId)return; if(!window.confirm('Delete this message for everyone? It will disappear from every device.'))return; const old=deleteButton.textContent; deleteButton.disabled=true; deleteButton.textContent='Deleting…'; try{ const deleted=await apiPost(`/thread/${encodeURIComponent(state.threadId)}/message/${encodeURIComponent(messageId)}/delete`,{user_id:state.currentUserId,device_id:state.currentDeviceId}); if(!deleted||String(deleted.id||'')!==messageId||deleted.is_deleted!==true)throw new Error('The server did not confirm deletion.'); const row=els.messages.querySelector(`[data-message-id="${CSS.escape(messageId)}"]`); if(row)row.remove(); state.lastMessageSignature=''; state.lastVisibleMessages=state.lastVisibleMessages.filter((message)=>message.id!==messageId); const refreshed=await refreshMessages({forceRender:true}); if(refreshed.some((message)=>String(message.id||'')===messageId))throw new Error('The deleted message remained visible after refresh.'); setStatus('Message deleted for everyone.'); }catch(error){ if(deleteButton.isConnected){deleteButton.disabled=false;deleteButton.textContent=old||'Delete';} setStatus(`Delete failed: ${safe(error)}`,{sticky:true}); } return; } const button=event.target.closest('.copyBtn'); if(!button)return; event.preventDefault(); event.stopPropagation(); const bubble=button.closest('.bubble'); const text=String(bubble?.querySelector('.msgText')?.textContent||'').trim(); if(!text)return; const old=button.textContent; let copied=legacyCopyText(text); if(!copied && navigator.clipboard?.writeText){ try{ await navigator.clipboard.writeText(text); copied=true; }catch{} } if(copied){ button.textContent='Copied'; }else{ button.textContent='Select text'; const range=document.createRange(); const target=bubble.querySelector('.msgText'); if(target){ range.selectNodeContents(target); const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range); } } setTimeout(()=>{ button.textContent=old||'Copy'; },1200); }
function draftKey(){ return `mz_msg_draft:${state.threadId||'new'}:${state.currentUserId||'unknown'}`; }
function outboxKey(clientMessageId){ return `mz_msg_outbox:${clientMessageId}`; }
function persistDraft(){ try{ const value=String(els.composeInput.value||''); if(value)localStorage.setItem(draftKey(),value); else localStorage.removeItem(draftKey()); }catch{} }
function restoreDraft(){ try{ const value=localStorage.getItem(draftKey()); if(value&&!els.composeInput.value)els.composeInput.value=value; }catch{} }
function saveOutbox(entry){ try{ localStorage.setItem(outboxKey(entry.client_message_id),JSON.stringify(entry)); }catch{} }
function removeOutbox(clientMessageId){ try{ localStorage.removeItem(outboxKey(clientMessageId)); }catch{} }
function listOutbox(){ const rows=[]; try{ for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(!key||!key.startsWith('mz_msg_outbox:'))continue; try{ const row=JSON.parse(localStorage.getItem(key)); if(row&&row.thread_id===state.threadId&&row.user_id===state.currentUserId)rows.push(row); }catch{} } }catch{} return rows.sort((a,b)=>Number(a.created_at||0)-Number(b.created_at||0)); }
async function postOutboxEntry(entry){ if(isMemphisConversation(state.thread)){ return apiPost('/memphis/message',{user_id:state.currentUserId,body:entry.body,device_id:state.currentDeviceId,client_message_id:entry.client_message_id}); } return apiPost(`/thread/${encodeURIComponent(state.threadId)}/message`,{sender_user_id:state.currentUserId,body:entry.body,device_id:state.currentDeviceId,client_message_id:entry.client_message_id}); }
async function flushOutbox(){ if(!state.threadId||!state.currentUserId||state.thread?.viewer_can_send===false||!navigator.onLine)return; const pending=listOutbox().filter((entry)=>entry.state!=='sending'||Date.now()-Number(entry.updated_at||0)>30000); for(const entry of pending){ const next={...entry,state:'sending',updated_at:Date.now(),attempts:Number(entry.attempts||0)+1}; saveOutbox(next); try{ await postOutboxEntry(next); removeOutbox(next.client_message_id); state.pendingClientMessageId=''; state.pendingClientBody=''; }catch(error){ saveOutbox({...next,state:'failed',last_error:safe(error),updated_at:Date.now()}); throw error; } } await loadThreadMeta(); await refreshMessages(); }
async function sendMessage(){ const body=String(els.composeInput.value||'').trim(); if(!body||!state.threadId||state.thread?.viewer_can_send===false)return; const draft=body; const clientMessageId=state.pendingClientBody===body&&state.pendingClientMessageId?state.pendingClientMessageId:createClientMessageId(); state.pendingClientMessageId=clientMessageId; state.pendingClientBody=body; const entry={client_message_id:clientMessageId,thread_id:state.threadId,user_id:state.currentUserId,device_id:state.currentDeviceId,body,state:'queued',created_at:Date.now(),updated_at:Date.now(),attempts:0}; saveOutbox(entry); localStorage.removeItem(draftKey()); const oldButtonText=els.sendBtn.textContent||'Send'; els.composeInput.value=''; els.sendBtn.disabled=true; els.sendBtn.textContent='Sending…'; setStatus('Sending message…', { sticky:true }); try{ await flushOutbox(); playChatSwoosh('send'); setStatus('Sent.'); }catch(error){ els.composeInput.value=draft; persistDraft(); setStatus(`Send queued: ${safe(error)}`, { sticky:true }); console.error('send message queued after failure:', error); }finally{ renderComposerState(); els.sendBtn.textContent=oldButtonText; } }
function normalizeThread(thread){ return {...thread,id:thread.id||thread.thread_id||'',thread_title:thread.thread_title||thread.title||'',thread_type:thread.thread_type||'direct',viewer_can_send:thread.viewer_can_send!==false,participant_names:thread.participant_names||'',is_ops_manager_shared:thread.is_ops_manager_shared===true||thread.system_key==='ops_manager_shared_chat_v1',is_custodial_team:thread.is_custodial_team===true||thread.system_key==='custodial_team_chat_v1'}; }
function labelThreadType(value){ const v=String(value||'').toLowerCase(); if(v==='bot')return 'Memphis'; if(v==='group')return 'Group chat'; if(v==='broadcast')return 'Broadcast'; return 'Direct chat'; }
function formatLongTime(value){ if(!value)return ''; const d=new Date(value); return Number.isNaN(d.getTime())?'':d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function setStatus(text, options={}){ const value=String(text||'').trim(); els.statusPill.textContent=value; els.statusPill.classList.toggle('show', Boolean(value)); clearTimeout(state.statusTimer); if(value&&!options.sticky){ state.statusTimer=setTimeout(()=>{ els.statusPill.classList.remove('show'); },1800); } } function safe(error){return error&&error.message?String(error.message):String(error||'Unknown error');} function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,(m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);} function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#96;');}
