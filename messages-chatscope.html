<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1320">
  <title>Opening Memphis Messenger</title>
  <style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07111d;color:#f8fbff}body{display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);padding:24px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:#101d2c;text-align:center}.card a{color:#d9f99d;font-weight:900}</style>
  <script>
    (() => {
      const target = new URL('./messages.html', location.href);
      const current = new URL(location.href);
      current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
      location.replace(target.toString());
    })();
  </script>
</head>
<body><div class="card">Opening the single production Memphis Messenger.<br><a href="./messages.html">Continue</a></div></body>
</html>
