<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081422">
  <meta name="robots" content="noindex,nofollow">
  <title>Dashboard Map · Memphis Zoo Operations</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./manager-ux.css">
  <link rel="stylesheet" href="./ops-hub.css">
  <link rel="stylesheet" href="./dashboard-map-staging.css">
  <link rel="stylesheet" href="./dashboard-map.css">
</head>
<body class="mapWebPage" data-memphis-context="manager">
  <main class="mapPage">
    <header class="hubHero uxCard mapHeader">
      <div class="hubBrand"><img src="./Zoo_Logo_ui.webp" alt="Memphis Zoo"><div><h1>Dashboard Map</h1></div></div>
      <nav class="mapNav" aria-label="Operations Hub navigation">
        <a id="map-hub-link" class="uxButton compact" href="./start_page1.html"><span aria-hidden="true">←</span> Back to Hub</a>
        <a id="map-dashboard-link" class="uxButton compact secondary" href="./dashboard.html">Dashboard</a>
      </nav>
    </header>
    <p class="mapNotice" id="map-page-status" role="status" aria-live="polite">Checking manager access…</p>
    <section class="mzMapStage uxCard" id="dashboard-map" aria-label="Custodial cleaning dashboard map" hidden>
      <div class="mapTools">
        <label for="map-location">Location</label>
        <select id="map-location" data-map-locations aria-describedby="map-selection"><option value="">Choose a location…</option></select>
        <span class="mapSourceNote">Dashboard cleaning status</span>
      </div>
      <div class="mapScreenReader" data-map-status role="status">Map cleaning status unavailable until a current authenticated response</div>
      <div class="mzMapViewport" data-map-viewport aria-label="Whole approved zoo map">
        <div class="mzMapSurface" data-map-surface><img class="mzMapArtwork" data-map-artwork alt="Approved illustrated Memphis Zoo map; cleaning icons are separate interactive controls" width="1282" height="550"><div class="mzMapLayer" data-map-layer></div></div>
      </div>
      <div class="mzMapSelection" id="map-selection" data-map-selection role="status" aria-live="polite">Choose a pin or location for details.</div>
      <details class="mapAttention">
        <summary>Locations needing attention <span data-map-alert-count>0</span></summary>
        <ul class="mzMapAlertList" data-map-alerts aria-label="All automatically expanded location alerts"></ul>
      </details>
    </section>
  </main>
  <script src="./memphis-auth.js?v=integration-repairs-20261006"></script>
  <script src="./dashboard-map-staging.js"></script>
  <script src="./dashboard-map-renderer.js"></script>
  <script src="./dashboard-map-page.js"></script>
</body>
</html>
