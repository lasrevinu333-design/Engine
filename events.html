<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Events · Memphis Zoo</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./operations-dashboard.css">
  <link rel="stylesheet" href="./events-view.css">
</head><body class="operationsPage" data-memphis-context="contextual">
  <main class="operationsBoard eventsPage" id="shared-events-page" aria-labelledby="events-title">
    <header class="boardHeader">
      <img src="./Zoo_Logo_ui.webp" alt="Memphis Zoo">
      <h1 id="events-title">Events</h1>
      <button id="events-pause" type="button" aria-pressed="false">Pause scrolling</button>
      <label>Scroll speed <select id="events-speed"><option value="18">Slow</option><option value="32" selected>Normal</option><option value="48">Faster</option></select></label>
      <button id="events-fullscreen" type="button">Full screen</button>
      <button id="events-back" type="button">Back</button>
    </header>
    <p class="boardNote" id="events-status" role="status" aria-live="polite">Checking access…</p>
    <div class="boardContent" id="events-content" tabindex="0" aria-label="Scrollable event information"></div>
    <p class="boardNote eventsSource">Event information only. Opening this page does not change work assignments.</p>
  </main>
  <script src="./memphis-auth.js"></script>
  <script src="./operations-dashboard-data.js"></script>
  <script src="./events-view.js"></script>
</body></html>
