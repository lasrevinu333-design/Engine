<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <title>Memphis Messenger</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <style>
    :root{
      color-scheme:dark;
      --bg:#07111d;--panel:#101d2c;--panel2:#142437;--line:rgba(255,255,255,.12);
      --text:#f8fbff;--muted:#aebdce;--green:#8fd42f;--green2:#68ad20;--red:#ef6666;
      --shadow:0 14px 34px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{background:linear-gradient(rgba(4,10,18,.76),rgba(4,10,18,.88)),url('./Background1_optimized.webp?v=release-2026.07.18.custodial-v3.11') center/cover fixed}
    button,input{font:inherit}
    .app{width:min(760px,100%);min-height:100vh;margin:0 auto;background:rgba(7,17,29,.92);box-shadow:0 0 42px rgba(0,0,0,.34)}
    .topbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:rgba(12,24,38,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .navBtn{min-height:46px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:rgba(255,255,255,.08);color:var(--text);font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .navBtn.primary{background:linear-gradient(180deg,var(--green),var(--green2));color:#102106;border-color:rgba(255,255,255,.18)}
    .brand{min-width:0;display:flex;align-items:center;justify-content:center;gap:9px}
    .brand img{width:42px;height:42px;border-radius:50%;object-fit:contain;flex:0 0 auto}
    .brandCopy{min-width:0}.brandTitle{font-size:1.18rem;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandSub{margin-top:3px;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .identity{padding:9px 14px 0;color:var(--muted);font-size:.84rem;font-weight:800;text-align:center;min-height:28px}
    .searchWrap{padding:10px 12px 6px}.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:17px;padding:0 15px;background:#f8fafc;color:#111827;font-size:1rem;box-shadow:var(--shadow)}.search::placeholder{color:#64748b}
    .threadList{display:grid;gap:8px;padding:8px 10px max(34px,calc(env(safe-area-inset-bottom) + 24px))}
    .threadItem{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(20,36,55,.95),rgba(13,27,42,.96));box-shadow:0 8px 22px rgba(0,0,0,.18);overflow:hidden}
    .threadItem.memphis{border-color:rgba(143,212,47,.45);background:linear-gradient(180deg,rgba(30,55,39,.96),rgba(15,34,28,.96))}
    .threadOpen{width:100%;min-width:0;border:0;background:transparent;color:inherit;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;text-align:left;cursor:pointer}
    .threadOpen:active{background:rgba(255,255,255,.05)}
    .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#4c5a6d;border:1px solid rgba(255,255,255,.18);color:#fff;font-size:1.05rem;font-weight:900;letter-spacing:-.02em}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .threadCopy{min-width:0}.threadName{font-size:1.05rem;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.threadPreview{margin-top:5px;color:var(--muted);font-size:.88rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .threadMeta{display:grid;justify-items:end;align-self:stretch;align-content:space-between;gap:6px;min-width:46px}.threadTime{color:var(--muted);font-size:.74rem;font-weight:800;white-space:nowrap}.unread{min-width:24px;height:24px;border-radius:999px;padding:0 7px;background:var(--green);color:#102106;display:grid;place-items:center;font-size:.76rem;font-weight:900}
    .menuBtn{width:46px;border:0;border-left:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);color:var(--muted);font-size:1.35rem;font-weight:900;cursor:pointer}.menuBtn:active{background:rgba(255,255,255,.08)}
    .empty{margin:12px;padding:24px 18px;border:1px solid var(--line);border-radius:18px;background:rgba(16,29,44,.85);color:var(--muted);text-align:center;line-height:1.45}.hidden{display:none!important}
    .toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px));z-index:100;transform:translateX(-50%);max-width:calc(100vw - 28px);padding:10px 14px;border-radius:999px;background:rgba(5,12,20,.96);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.84rem;font-weight:800;color:var(--muted);text-align:center}.toast.error{color:#fecaca;border-color:rgba(239,102,102,.45)}
    @media(max-width:430px){.topbar{gap:7px;padding-left:9px;padding-right:9px}.navBtn{padding:0 13px;min-height:44px;font-size:.9rem}.brand img{width:38px;height:38px}.brandTitle{font-size:1.02rem}.brandSub{display:none}.threadOpen{grid-template-columns:50px minmax(0,1fr) auto;gap:10px;padding:11px}.avatar{width:50px;height:50px}.threadName{font-size:1rem}.threadPreview{font-size:.84rem}}
  </style>
</head>
<body data-memphis-context="contextual">
  <main class="app">
    <header class="topbar">
      <a id="back-btn" class="navBtn" href="./start_page1.html">Back</a>
      <div class="brand"><img src="./Zoo_Logo_ui.webp?v=release-2026.07.18.custodial-v3.11" alt="Memphis Zoo"><div class="brandCopy"><div class="brandTitle">Memphis Messenger</div><div class="brandSub">Memphis AI and team conversations</div></div></div>
      <button id="new-chat-btn" class="navBtn primary" type="button">New</button>
    </header>
    <div id="identity-line" class="identity">Opening Messenger…</div>
    <div class="searchWrap"><input id="conversation-search" class="search" type="search" autocomplete="off" placeholder="Search conversations" aria-label="Search conversations"></div>
    <section id="thread-list" class="threadList" aria-live="polite"></section>
    <div id="empty-state" class="empty hidden">No conversations yet.</div>
  </main>
  <div id="status-toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="./memphis-auth.js?v=release-2026.07.18.custodial-v3.11"></script>
  <script src="./memphis-device-identity.js?v=release-2026.07.18.custodial-v3.11"></script>
  <script src="./messages-list.js"></script>
</body>
</html>
