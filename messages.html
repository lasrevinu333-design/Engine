    .topActions{grid-area:actions;display:flex;gap:10px;align-items:center;justify-content:flex-end}.avatarBtn{width:92px;height:92px;border-radius:999px;border:3px solid rgba(255,255,255,.16);padding:0;background:rgba(255,255,255,.08);overflow:hidden;cursor:pointer;box-shadow:0 12px 24px rgba(0,0,0,.24);flex:0 0 auto}.avatarBtn img{width:100%;height:100%;display:block;object-fit:cover;object-position:center center}
    .identityWrap{padding:12px 16px 6px;display:flex;justify-content:center}.identity{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:42px;padding:10px 14px;border-radius:999px;background:rgba(11,17,24,.42);border:1px solid rgba(255,255,255,.08);color:#eef5ff;font-size:1rem;font-weight:800;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.28);box-shadow:var(--shadow);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .searchWrap{padding:8px 14px 0}.searchInput{width:100%;min-height:48px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(11,17,24,.72);color:#fff;padding:0 16px;font:inherit;font-size:.98rem;box-shadow:var(--shadow)}.searchInput::placeholder{color:#9eacbc}.threadList{padding:14px 14px 142px;display:grid;gap:12px;align-content:start}.threadWrap{display:flex;align-items:stretch;overflow:hidden;border-radius:24px;touch-action:pan-y;-webkit-tap-highlight-color:transparent}.threadWrap,.threadWrap *,.threadDelete,.thread,.threadAvatar,.threadBody,.threadTop,.threadName,.threadTime,.threadPreview,.badges,.typeChip,.unread{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
    .threadDelete{width:98px;flex:0 0 98px;border:none;border-radius:24px;background:linear-gradient(180deg,#ff8c8c 0%,#dc2626 100%);color:#fff;font-size:.9rem;font-weight:900;cursor:pointer;margin:0 10px 0 0;box-shadow:0 10px 20px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent}.threadDelete:focus-visible{outline:3px solid #fff;outline-offset:2px}
    .thread{display:flex;gap:16px;align-items:flex-start;padding:16px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(17,24,33,.82),rgba(15,21,29,.92));box-shadow:var(--shadow);cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent}.threadWrap.shared .thread{border-color:rgba(168,225,70,.52);background:linear-gradient(180deg,rgba(31,51,30,.94),rgba(15,29,24,.96));box-shadow:0 14px 32px rgba(31,100,27,.22)}.threadAvatar{width:78px;height:78px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.45rem;color:#fff;background:#5b6475;overflow:hidden;flex:0 0 auto;box-shadow:0 8px 18px rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.16)}.threadAvatar img{width:100%;height:100%;display:block;object-fit:cover;object-position:center center;pointer-events:none}.threadBody{min-width:0;flex:1}.threadTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.threadName{font-size:1.36rem;font-weight:900;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.threadTime{flex:0 0 auto;font-size:.94rem;color:var(--muted);white-space:nowrap;font-weight:800;padding-top:2px}.threadPreview{margin-top:8px;color:#dce5f2;font-size:1.08rem;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .badges{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}.typeChip{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:.86rem;font-weight:800}.unread{min-width:28px;height:28px;padding:0 10px;border-radius:999px;background:var(--blue-pill);color:#fff;font-size:.9rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(0,0,0,.18)}
    .fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(92px,calc(env(safe-area-inset-bottom) + 32px));min-width:102px;height:58px;padding:0 22px;border:none;border-radius:24px;background:linear-gradient(180deg,var(--zoo-green-1) 0%,var(--zoo-green-2) 100%);color:#102106;font-size:2rem;font-weight:900;box-shadow:0 12px 24px rgba(28,73,12,.24);cursor:pointer;border:1px solid rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center}.fab:active{transform:translateY(1px)}
    .hidden{display:none!important}.status{display:none!important}.empty{padding:28px 18px;color:var(--muted);font-size:1.05rem;border-radius:22px;background:rgba(15,21,29,.46);border:1px solid rgba(255,255,255,.06)}
    @media (max-width:640px){
      html{font-size:18px}
      .topbar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'back actions' 'title title';align-items:start;row-gap:10px;min-height:156px;padding:calc(max(20px, env(safe-area-inset-top)) + 8px) 12px 12px;column-gap:10px}
      .backBtn{min-height:48px;padding:0 16px;font-size:.96rem}

      .titleSub{font-size:.86rem}
      .avatarBtn{width:84px;height:84px}
      .identityWrap{padding:10px 14px 4px}
      .identity{font-size:.96rem;min-height:40px;padding:9px 12px}
      .threadList{padding:12px 12px 136px;gap:10px}
      .threadWrap{border-radius:22px}
      .threadDelete{width:84px;flex-basis:84px;margin-right:8px;border-radius:22px;font-size:.92rem}

      .threadName{font-size:1.18rem}
      .threadPreview{font-size:.98rem}
      .threadTime{font-size:.84rem}
      .fab{min-width:92px;height:54px;padding:0 18px;font-size:1.8rem;bottom:max(96px,calc(env(safe-area-inset-bottom) + 36px))}
    }

<body data-memphis-context="contextual">
  <div class="app">
    <div class="topbar">
      <div class="mz-nav-stack mz-nav-stack--grid-back"><a id="back-btn" class="mz-back-link" data-mz-back href="./start_page1.html">Back to Ops Hub</a><a class="mz-secondary-link" data-mz-annie-back hidden href="https://memphis-zoo-mcp.onrender.com/moxie/">Back to Annie</a></div>
      <div class="titleWrap"><div class="title">Memphis Messenger</div><div class="titleSub">Team messages and conversations</div></div>
      <div class="topActions"><button id="memphis-btn" class="avatarBtn" aria-label="Ask Memphis"><img id="memphis-top-avatar" alt="Memphis" src="./memphis_avatar_ui.webp?v=release-2026.07.18.custodial-v3.8" width="320" height="320" decoding="async" /></button></div>
    </div>
    <div class="identityWrap"><div id="identity-line" class="identity">Resolving device…</div></div>
    <div class="searchWrap"><input id="conversation-search" class="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="Search conversations" aria-label="Search conversations" /></div>
    <div id="thread-list" class="threadList"></div>
    <div id="empty-state" class="empty hidden">No conversations yet.</div>
  </div>
  <button id="new-chat-btn" class="fab" aria-label="New chat">+</button>
  <div id="status-pill" class="status" aria-hidden="true"></div>
  <script src="./memphis-auth.js?v=release-2026.07.18.custodial-v3.8"></script>
  <script src="./memphis-device-identity.js?v=release-2026.07.18.custodial-v3.8"></script>
  <script src="./memphis-scan-sync.js?v=release-2026.07.18.custodial-v3.8"></script>
  <script src="./memphis-device-reminders.js?v=release-2026.07.18.custodial-v3.8"></script>
<script>
    const MEMPHIS_AVATAR='./memphis_avatar_ui.webp?v=release-2026.07.18.custodial-v3.8';
    const ANNIE_RETURN_URL='https://memphis-zoo-mcp.onrender.com/moxie/';
    const ANNIE_ORIGIN_SESSION_KEY='mz_annie_origin_session';
    const CONFIG={API_BASE:'https://memphis-zoo-mcp.onrender.com/messaging-api',STORAGE_USER_KEY:'mz_messenger_user_id',DEVICE_STORAGE_KEY:'mz_scan_device_id',DEV_FALLBACK_DEVICE_ID:'1e74fe4c-dc20b3b9',THREAD_POLL_MS:5000,THREAD_DELETE_OPERATION_PREFIX:'mz_thread_delete_operation:'};
    const MANAGER_OVERVIEW_DEVICE_IDS=new Set(['1e74fe4c-dc20b3b9','KIOSK_01','KIOSK_1']);
    const state={currentUserId:'',currentDeviceId:'',currentRole:'',isManagerOverview:false,identityFailed:false,managerSession:null,hubContext:'manager',threads:[],visibleThreads:[],holdTimer:null,touchStartX:0,touchTargetId:'',updateCursorAt:'1970-01-01T00:00:00.000Z',updateCursorId:'00000000-0000-0000-0000-000000000000',liveController:null,liveSequence:0,liveAppliedSequence:0,liveReconnectDelay:1000,liveStopped:false,liveRunning:false};
    const els={backBtn:document.getElementById('back-btn'),identityLine:document.getElementById('identity-line'),conversationSearch:document.getElementById('conversation-search'),threadList:document.getElementById('thread-list'),emptyState:document.getElementById('empty-state'),statusPill:document.getElementById('status-pill'),newChatBtn:document.getElementById('new-chat-btn'),memphisBtn:document.getElementById('memphis-btn')};
    init().catch((error)=>setStatus(`Startup error: ${safe(error)}`));
    async function init(){ state.currentDeviceId=resolveDeviceId(); state.hubContext=resolveHubContext(); await establishManagerSession(); await resolveIdentity(); bindEvents(); await refreshThreads(); startThreadSync(); }
    async function establishManagerSession(){ if(state.hubContext!=='manager'||!window.MemphisAuth?.requireOpsManagerSession)return null; try{state.managerSession=await window.MemphisAuth.requireOpsManagerSession({accessLevel:'full_access',interactive:false,redirect:false,throwOnFailure:false});}catch{state.managerSession=null;} return state.managerSession; }
    function waitMs(ms){return new Promise((resolve)=>setTimeout(resolve,ms));}
    function updateThreadCursor(rows){ if(!Array.isArray(rows))return; for(const row of rows){ const at=String(row.changed_at||row.last_message_at||row.updated_at||'').trim(); const id=String(row.thread_id||row.id||'').trim(); if(!at||!id)continue; const nextMs=Date.parse(at); const currentMs=Date.parse(state.updateCursorAt); if(Number.isFinite(nextMs)&&(nextMs>currentMs||(nextMs===currentMs&&id>state.updateCursorId))){state.updateCursorAt=new Date(nextMs).toISOString();state.updateCursorId=id;} } }
    function startThreadSync(){ if(state.liveRunning||state.liveStopped||state.identityFailed||!state.currentUserId)return; state.liveRunning=true; threadSyncLoop().finally(()=>{state.liveRunning=false;if(!state.liveStopped&&!state.identityFailed)setTimeout(startThreadSync,state.liveReconnectDelay);}); }
    async function threadSyncLoop(){ while(!state.liveStopped&&!state.identityFailed){ const sequence=++state.liveSequence; const controller=new AbortController(); state.liveController=controller; const qs=`?user_id=${encodeURIComponent(state.currentUserId)}${state.currentDeviceId?`&device_id=${encodeURIComponent(state.currentDeviceId)}`:''}&after=${encodeURIComponent(state.updateCursorAt)}&after_id=${encodeURIComponent(state.updateCursorId)}&request_seq=${sequence}&wait_ms=20000&limit=100`; try{ const envelope=await apiGetEnvelope(`/threads/updates${qs}`,{signal:controller.signal}); if(sequence<state.liveAppliedSequence)continue; state.liveAppliedSequence=sequence; const next=envelope.meta?.next_cursor; if(next?.after&&next?.after_id)updateThreadCursor([{changed_at:next.after,thread_id:next.after_id}]); if(Array.isArray(envelope.data)&&envelope.data.length){await refreshThreads();} state.liveReconnectDelay=1000; }catch(error){ if(controller.signal.aborted||state.liveStopped)continue; try{await refreshThreads();}catch{} await waitMs(state.liveReconnectDelay+Math.floor(Math.random()*350)); state.liveReconnectDelay=Math.min(15000,Math.round(state.liveReconnectDelay*1.8)); }finally{if(state.liveController===controller)state.liveController=null;} } }
    function bindEvents(){ els.backBtn.addEventListener('click', navigateToHub); els.newChatBtn.addEventListener('click', ()=>navigateToThreadPage({ mode:'new' })); els.conversationSearch.addEventListener('input',renderThreads); els.memphisBtn.addEventListener('click', ()=>{ const existing=state.visibleThreads.find((t)=>String(t.thread_type).toLowerCase()==='bot'||String(t.thread_title||'').trim().toLowerCase()==='memphis'); if(existing) return navigateToThreadPage({ threadId: normalizeThread(existing).id }); navigateToThreadPage({ mode:'memphis' }); }); els.threadList.addEventListener('contextmenu', suppressThreadSelectionMenu); els.threadList.addEventListener('selectstart', suppressThreadSelectionMenu); els.threadList.addEventListener('dragstart', suppressThreadSelectionMenu); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!state.liveRunning){state.liveStopped=false;startThreadSync();}}); window.addEventListener('online',()=>{if(!state.liveRunning){state.liveStopped=false;startThreadSync();}}); window.addEventListener('pagehide',()=>{state.liveStopped=true;state.liveController?.abort();}); }
    function suppressThreadSelectionMenu(event){ if(event.target.closest('[data-thread-wrap]')||event.target.closest('[data-thread-id]')||event.target.closest('[data-thread-delete]')) event.preventDefault(); }
    function resolveDeviceId(){ const url=new URL(window.location.href); const explicit=String(url.searchParams.get('device')||url.searchParams.get('deviceId')||'').trim(); if(explicit){ localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY, explicit); return explicit; } const stored=String(localStorage.getItem(CONFIG.DEVICE_STORAGE_KEY)||'').trim(); if(stored) return stored; if(location.hostname.includes('github.io')){ const visitorId=`visitor-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`; localStorage.setItem(CONFIG.DEVICE_STORAGE_KEY, visitorId); return visitorId; } return ''; }
    function resolveHubContext(){ const value=String(new URL(window.location.href).searchParams.get('hub')||'').trim().toLowerCase(); return value==='employee' ? 'employee' : 'manager'; }
    function isAnnieOrigin(url=new URL(window.location.href)){const marker=String(url.searchParams.get('origin')||'').trim().toLowerCase()==='annie';const fromAnnie=String(document.referrer||'').startsWith(ANNIE_RETURN_URL);if(marker||fromAnnie){try{sessionStorage.setItem(ANNIE_ORIGIN_SESSION_KEY,'1');}catch(_err){}return true;}try{return sessionStorage.getItem(ANNIE_ORIGIN_SESSION_KEY)==='1';}catch(_err){return false;}}
    function preserveAnnieOrigin(url){ if(isAnnieOrigin()) url.searchParams.set('origin','annie'); return url; }
    function navigateToHub(){ if(isAnnieOrigin()){ window.location.href=ANNIE_RETURN_URL; return; } const target=state.hubContext==='employee' ? './employee-hub.html' : './start_page1.html'; const url=new URL(target, window.location.href); if(state.currentDeviceId) url.searchParams.set('device', state.currentDeviceId); window.location.href=url.toString(); }
    async function apiGetEnvelope(path,options={}){ const response=await fetch(`${CONFIG.API_BASE}${path}`, { cache:'no-store', headers: optionalManagerAuthHeaders(), signal:options.signal }); const payload=await response.json().catch(()=>null); if(!response.ok||!payload||!payload.ok) throw new Error(payload?.error||`HTTP ${response.status}`); return payload; }
    async function apiGet(path,options={}){ return (await apiGetEnvelope(path,options)).data; }
    function optionalManagerAuthHeaders(){ const session=window.MemphisAuth?.readSession?.(); return session&&window.MemphisAuth?.isOpsManager?.(session)?{Authorization:`Bearer ${session.token}`,'X-Device-Id':window.MemphisAuth.getDeviceId()}:{}; }
    async function apiPost(path,body){ const response=await fetch(`${CONFIG.API_BASE}${path}`, { method:'POST', headers:{'Content-Type':'application/json',...optionalManagerAuthHeaders()}, body:JSON.stringify(body||{}) }); const payload=await response.json().catch(()=>null); if(!response.ok||!payload||!payload.ok) throw new Error(payload?.error||`HTTP ${response.status}`); return payload.data; }
    function isManagerOverviewDeviceId(deviceId){ return MANAGER_OVERVIEW_DEVICE_IDS.has(String(deviceId||'').trim()); }
    async function resolveIdentity(){ if(!state.currentDeviceId&&!state.managerSession){ state.identityFailed=true; state.currentRole=''; state.isManagerOverview=false; els.identityLine.textContent='No device id — access restricted.'; return; } try{ const identityPath=state.managerSession?'/me/by-device':`/me/by-device?device_id=${encodeURIComponent(state.currentDeviceId)}`; const mapped=await apiGet(identityPath); if(mapped&&mapped.msg_user_id){ state.currentUserId=String(mapped.msg_user_id||'').trim(); state.currentRole=String(mapped.role||'').trim().toLowerCase(); const overviewRoles=("manager,o"+"ps,o"+"ps_manager,operations_manager,o"+"ps manager,operations manager").split(','); state.isManagerOverview=String(mapped.identity_source||'')==='trusted_manager_session'||(overviewRoles.includes(state.currentRole)&&isManagerOverviewDeviceId(state.currentDeviceId)); state.identityFailed=false; localStorage.setItem(CONFIG.STORAGE_USER_KEY,state.currentUserId); els.identityLine.textContent=`${mapped.display_name}${state.isManagerOverview?' · shared Ops Manager chat':''}`; return; } }catch{} state.identityFailed=true; state.currentUserId=String(localStorage.getItem(CONFIG.STORAGE_USER_KEY)||'').trim(); state.currentRole=''; state.isManagerOverview=false; els.identityLine.textContent=state.hubContext==='manager'?'Manager device enrollment required. Open the normal Ops Manager Hub first.':'Device not recognized — access restricted. See a manager to register this device.'; }
    async function refreshThreads(){ if(state.identityFailed){ els.emptyState.classList.remove('hidden'); els.emptyState.textContent='Access restricted. This device is not registered. See a manager to register it.'; els.threadList.innerHTML=''; state.visibleThreads=[]; return setStatus('Device not registered — access restricted.'); } if(!state.currentUserId){ els.emptyState.classList.remove('hidden'); els.threadList.innerHTML=''; state.visibleThreads=[]; return setStatus('No mapped user for this device.'); } const qs=`?user_id=${encodeURIComponent(state.currentUserId)}${state.currentDeviceId?`&device_id=${encodeURIComponent(state.currentDeviceId)}`:''}`; state.threads=await apiGet(`/threads${qs}`); updateThreadCursor(state.threads); state.visibleThreads=state.threads.map((threadRow)=>normalizeThread(threadRow)); renderThreads(); }
    function isMemphisThread(thread){ return String(thread.thread_type).toLowerCase()==='bot' || String(thread.thread_title||'').trim().toLowerCase()==='memphis'; }
    function getThreadPreviewState(thread){ return { preview:thread.last_message_body||'No messages yet.', timeText:formatTime(thread.last_message_at||thread.updated_at), unreadCount:Number(thread.unread_count||0) }; }
    function getParticipantCount(thread){ const names=String(thread.participant_names||'').split(',').map((value)=>value.trim()).filter(Boolean); return names.length; }
    function getDisplayThreadTitle(thread){ return String(thread.thread_title||thread.title||'').trim() || 'Untitled'; }
    function createDeleteOperationId(threadId){ const key=`${CONFIG.THREAD_DELETE_OPERATION_PREFIX}${threadId}`; try{ const existing=String(localStorage.getItem(key)||'').trim(); if(existing)return existing; }catch{} let value=''; try{value=window.crypto.randomUUID();}catch{value='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,(c)=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});} try{localStorage.setItem(key,value);}catch{} return value; }
    function clearDeleteOperation(threadId){ try{localStorage.removeItem(`${CONFIG.THREAD_DELETE_OPERATION_PREFIX}${threadId}`);}catch{} }
    function renderThreads(){ const search=String(els.conversationSearch?.value||'').trim().toLowerCase(); const rows=search?state.visibleThreads.filter((thread)=>`${getDisplayThreadTitle(thread)} ${thread.participant_names||''} ${thread.last_message_body||''}`.toLowerCase().includes(search)):state.visibleThreads; if(!rows.length){ els.threadList.innerHTML=''; els.emptyState.classList.remove('hidden'); els.emptyState.textContent=search?'No conversations match your search.':'No conversations yet.'; return; } els.emptyState.classList.add('hidden'); els.threadList.innerHTML=rows.map((thread)=>{ const display=getThreadPreviewState(thread); const showBottomBadges=!isMemphisThread(thread); const displayTitle=getDisplayThreadTitle(thread); const requiredShared=thread.is_ops_manager_shared===true; const deleteButton=requiredShared?'':`<button class="threadDelete" type="button" data-thread-delete="${escapeAttr(thread.id)}">Delete</button>`; const typeLabel=thread.is_ops_manager_shared?'All Ops Managers':labelThreadType(thread.thread_type); return `<div class="threadWrap${requiredShared?' shared':''}" data-thread-wrap="${escapeAttr(thread.id)}">${deleteButton}<article class="thread" data-thread-id="${escapeAttr(thread.id)}">${renderAvatar(thread)}<div class="threadBody"><div class="threadTop"><div class="threadName">${escapeHtml(displayTitle)}</div><div class="threadTime">${escapeHtml(display.timeText)}</div></div><div class="threadPreview">${escapeHtml(display.preview)}</div>${showBottomBadges?`<div class="badges"><div class="typeChip">${escapeHtml(typeLabel)}</div>${display.unreadCount?`<div class="unread">${escapeHtml(String(display.unreadCount))}</div>`:''}</div>`:''}</div></article></div>`; }).join('');
      Array.from(els.threadList.querySelectorAll('[data-thread-id]')).forEach((node)=>{ node.addEventListener('click', ()=>navigateToThreadPage({ threadId:String(node.getAttribute('data-thread-id')||'').trim() })); node.addEventListener('touchstart',(event)=>{ const wrap=node.closest('[data-thread-wrap]'); if(!wrap) return; state.touchStartX=event.changedTouches[0].clientX; state.touchTargetId=wrap.getAttribute('data-thread-wrap')||''; clearHoldTimer(); state.holdTimer=setTimeout(()=>wrap.classList.add('reveal'),550); },{passive:true}); node.addEventListener('touchmove',()=>clearHoldTimer(),{passive:true}); node.addEventListener('touchend',(event)=>{ clearHoldTimer(); const wrap=node.closest('[data-thread-wrap]'); if(!wrap) return; const endX=event.changedTouches[0].clientX; const delta=endX-state.touchStartX; if((wrap.getAttribute('data-thread-wrap')||'')!==state.touchTargetId) return; if(delta<-40) wrap.classList.add('reveal'); if(delta>30) wrap.classList.remove('reveal'); },{passive:true}); node.addEventListener('mousedown',()=>{ const wrap=node.closest('[data-thread-wrap]'); if(!wrap) return; clearHoldTimer(); state.holdTimer=setTimeout(()=>wrap.classList.add('reveal'),650); }); node.addEventListener('mouseup',clearHoldTimer); node.addEventListener('mouseleave',clearHoldTimer); });
      Array.from(els.threadList.querySelectorAll('[data-thread-delete]')).forEach((node)=>{ node.addEventListener('click', async (event)=>{ event.stopPropagation(); const threadId=String(node.getAttribute('data-thread-delete')||'').trim(); if(!threadId||(!state.currentDeviceId&&!state.managerSession))return setStatus('Authenticated device required to delete this conversation.'); const thread=state.visibleThreads.find((t)=>t.id===threadId); const threadLabel=thread?getDisplayThreadTitle(thread):'this conversation'; if(!window.confirm(`Delete "${threadLabel}" for everyone? It will disappear now, and its deleted messages will be removed from the database after 14 days.`))return; node.disabled=true; try{ const operationId=createDeleteOperationId(threadId); const deleted=await apiPost(`/thread/${encodeURIComponent(threadId)}/delete`,{device_id:state.currentDeviceId,operation_id:operationId}); if(!deleted||deleted.deleted!==true||String(deleted.thread_id||'')!==threadId||!deleted.deleted_at||!deleted.purge_after)throw new Error('The server did not confirm conversation deletion.'); clearDeleteOperation(threadId); state.visibleThreads=state.visibleThreads.filter((t)=>t.id!==threadId); state.threads=state.threads.filter((t)=>String(t.thread_id||t.id||'')!==threadId); renderThreads(); setStatus('Conversation deleted. Deleted messages will be removed after 14 days.'); }catch(error){ node.disabled=false; setStatus(`Delete failed: ${safe(error)}`); } }); });
    }
    function clearHoldTimer(){ if(state.holdTimer){ clearTimeout(state.holdTimer); state.holdTimer=null; } }
    function renderAvatar(thread){ if(isMemphisThread(thread)){ return `<div class="threadAvatar"><img src="${MEMPHIS_AVATAR}" alt="Memphis"></div>`; } const initials=String(getDisplayThreadTitle(thread)||'T').trim().split(/\s+/).slice(0,2).map((x)=>x[0]||'').join('').toUpperCase()||'T'; return `<div class="threadAvatar">${escapeHtml(initials)}</div>`; }
    function navigateToThreadPage({ threadId='', mode='' }){ const url=preserveAnnieOrigin(new URL('./thread.html', window.location.href)); if(threadId) url.searchParams.set('thread_id',threadId); if(mode) url.searchParams.set('mode',mode); if(state.currentDeviceId) url.searchParams.set('device',state.currentDeviceId); if(state.currentUserId) url.searchParams.set('user_id',state.currentUserId); url.searchParams.set('hub', state.hubContext); window.location.href=url.toString(); }
    function normalizeThread(thread){ return { ...thread, id:thread.id||thread.thread_id||'', thread_title:thread.thread_title||thread.title||'', thread_type:thread.thread_type||'direct', viewer_can_send:thread.viewer_can_send!==false, participant_names:thread.participant_names||'', is_ops_manager_shared:thread.is_ops_manager_shared===true||thread.system_key==='ops_manager_shared_chat_v1' }; }
    function labelThreadType(value){ const v=String(value||'').toLowerCase(); if(v==='bot') return 'Memphis'; if(v==='group') return 'Group'; if(v==='broadcast') return 'Broadcast'; return 'Direct'; }
    function formatTime(value){ if(!value) return ''; const d=new Date(value); return Number.isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }
    function setStatus(text){ els.statusPill.textContent=text; }
    function safe(error){ return error&&error.message?String(error.message):String(error||'Unknown error'); }
    function escapeHtml(value){ return String(value==null?'':value).replace(/[&<>"']/g,(m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]); }
    function escapeAttr(value){ return escapeHtml(value).replace(/`/g,'&#96;'); }
  </script>
</body>
</html>
