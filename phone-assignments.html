<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://api.open-meteo.com; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081422">
  <meta name="robots" content="noindex,nofollow">
  <title>Phone Assignments</title>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./manager-ux.css">
  <link rel="stylesheet" href="./phone-assignments.css">
</head>
<body data-memphis-context="manager">
  <main class="assignmentPage">
    <header class="assignmentHeader uxCard">
      <img src="./Zoo_Logo_ui.webp" alt="Memphis Zoo">
      <div>
        <div class="uxEyebrow">Custodial fleet</div>
        <h1>Phone Assignments</h1>
        <p class="uxMuted">Phone enrollment and assignment</p>
      </div>
      <a class="uxButton compact" data-mz-back href="./start_page1.html">Back</a>
    </header>

    <section class="assignmentCard uxCard">
      <div class="sectionHeading"><h2>Employee phones</h2><a class="uxButton compact" href="./schedule-weekly.html">Employee Roster</a></div>
      <div class="searchLine">
        <input id="phone-search" class="uxInput" type="search" placeholder="Search phone or employee" aria-label="Search phone assignments">
        <button id="refresh-assignments" class="uxButton compact" type="button">Refresh</button>
      </div>
      <div id="assignment-status" class="uxStatus" aria-live="polite"></div>
      <div id="phone-list" class="assignmentGrid"></div>
    </section>
  </main>

  <div id="assignment-toast" class="uxToast" role="status" aria-live="polite"></div>
  <script src="./memphis-auth.js"></script>
  <script src="./memphis-ui.js"></script>
  <script src="./phone-assignments.js"></script>
</body>
</html>
