<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com https://api.open-meteo.com; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>My Schedule</title>
  <style>
    :root{
      --text:#f8fafc;
      --muted:rgba(248,250,252,.82);
      --line:rgba(255,255,255,.14);
      --panel:rgba(8,17,29,.78);
      --panel-strong:rgba(8,17,29,.90);
      --green:#84c341;
      --shadow:0 16px 36px rgba(0,0,0,.34);
      --danger:#fca5a5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#111827}
    body{
      background-image:
        linear-gradient(rgba(4,10,20,.58),rgba(4,10,20,.58)),
        url('./dashboard-bg_optimized.webp?v=release-2026.07.19.custodial-v3.12');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
    }
    .page{
      width:min(980px,100%);
      margin:0 auto;
      min-height:100vh;
      padding:calc(max(18px, env(safe-area-inset-top)) + 16px) 14px max(78px, calc(env(safe-area-inset-bottom) + 20px));
      display:grid;
      gap:16px;
    }
    .hero,.card,.assignmentCard{
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      background:var(--panel);
      backdrop-filter:blur(8px);
    }
    .hero{padding:18px;display:grid;gap:12px}
    .heroTop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .backBtn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border:none;border-radius:999px;background:linear-gradient(180deg,#cbe88f 0%,#a8d25a 100%);color:#102106;font-size:.9rem;font-weight:900;letter-spacing:.01em;cursor:pointer;box-shadow:0 8px 18px rgba(28,73,12,.16);border:1px solid rgba(255,255,255,.14)}
    .backBtn:active{transform:translateY(1px)}
    .eyebrow{color:var(--green);font-size:.84rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,4vw,3rem);line-height:1}
    .sub{color:var(--muted);font-size:1rem;line-height:1.35}
    .heroMeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .metaBox{border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);padding:12px}
    .metaLabel{color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
    .metaValue{font-size:1rem;font-weight:900;line-height:1.25}
    .statusPill{display:inline-flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;border-radius:18px;min-height:46px;padding:10px 14px;font-weight:800;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.08);width:max-content;max-width:100%}.retryButton{min-height:42px;border:0;border-radius:14px;padding:8px 15px;background:#f8fafc;color:#111827;font-size:.9rem;font-weight:900}.retryButton[hidden]{display:none}.sectionTime{margin:-1px 0 10px;color:#d9f99d;font-size:.9rem;font-weight:900}
    .card{padding:16px}
    .sectionTitle{margin:0 0 6px;font-size:1.2rem;line-height:1.1}
    .sectionMeta{color:var(--muted);font-size:.92rem;line-height:1.35}
    .sectionIntro{color:var(--muted);font-size:.9rem;line-height:1.35;margin:0 0 2px}
    .assignmentGrid{display:grid;gap:12px;margin-top:14px}
    .card > .assignmentGrid{margin-top:0}
    .locationList{list-style:none;padding:0;margin:0;display:grid;gap:10px}
    .locationList li{padding:14px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:var(--panel-strong);font-size:1rem;line-height:1.35;color:#eef6ff}
    .scheduleRowTop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .scheduleRowName{font-weight:900;font-size:1.02rem;line-height:1.25}
    .scheduleRowMeta{margin-top:7px;color:var(--muted);font-size:.84rem;font-weight:700;line-height:1.35}
    .nowBadge{display:inline-flex;align-items:center;margin-left:8px;padding:3px 7px;border-radius:999px;background:rgba(132,195,65,.22);border:1px solid rgba(132,195,65,.6);color:#dff7bf;font-size:.7rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
    .scheduleNotice{margin-bottom:12px;border-color:rgba(132,195,65,.35);color:#eef6ff}
    .statusPill[hidden]{display:none}
    .assignmentCard{background:var(--panel-strong);padding:16px}
    .assignmentTop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
    .assignmentName{font-size:1.14rem;font-weight:900;line-height:1.2}
    .assignmentCode{margin-top:4px;color:var(--green);font-weight:800;font-size:.95rem}
    .assignmentTime{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:.9rem;font-weight:900;white-space:nowrap}
    .assignmentLocations{margin-top:10px;color:#eef6ff;line-height:1.45}
    .assignmentNotes{margin-top:12px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
    .notesLabel{color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
    .notesValue{line-height:1.45;color:#eef6ff;white-space:pre-wrap}
    .emptyState{border-radius:18px;padding:22px;border:1px dashed rgba(255,255,255,.18);color:var(--muted);text-align:center;background:rgba(255,255,255,.04)}
    @media (max-width:820px){
      .page{padding:calc(max(18px, env(safe-area-inset-top)) + 20px) 14px max(78px, calc(env(safe-area-inset-bottom) + 20px))}
      .heroTop{align-items:flex-start}
      .backBtn{min-height:40px;padding:0 15px;font-size:.86rem}
      .heroMeta{grid-template-columns:1fr}
      .statusPill{width:100%}
    }
  </style>
  <link rel="icon" href="./dashboard_tiger_icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12" />

<body data-memphis-context="employee">
  <div class="page">
    <section class="hero">
      <div class="heroTop mz-page-header"><a id="back-btn" class="mz-back-link" data-mz-back href="./employee-hub.html">Back</a></div>
      <div class="eyebrow">Memphis Zoo</div>
      <h1 id="employee-name">—</h1>
      <div id="service-date" class="sub">—</div>
      <div id="device-name" hidden></div>
      <div id="status-pill" class="statusPill" hidden><span id="status-text"></span><button id="retry-btn" class="retryButton" type="button" hidden>Try Again</button></div>
    </section>

    <section class="card">
      <div id="assignment-grid" class="assignmentGrid"></div>
    </section>
  </div>

  <script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-device-identity.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-scan-sync.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script src="./memphis-device-reminders.js?v=release-2026.07.19.custodial-v3.12"></script>
<script>
    const CONFIG = {
      API_BASE: 'https://memphis-zoo-mcp.onrender.com/schedule-api',
      REFRESH_MS: 60000,
      DEVICE_STORAGE_KEY: 'mz_scan_device_id',
      SNAPSHOT_PREFIX: 'mz_current_ownership_v23:'
    };
    const ANNIE_RETURN_URL='https://memphis-zoo-mcp.onrender.com/moxie/';
    const ANNIE_ORIGIN_SESSION_KEY='mz_annie_origin_session';

    const state = {
      currentDeviceId: '',
      employeeName: '',
      refreshTimer: 0,
      scheduleBoundaryTimer: 0,
      loading: false,
    };
    const els = {
      backBtn: document.getElementById('back-btn'),
      statusPill: document.getElementById('status-pill'),
      statusText: document.getElementById('status-text'),
      retryBtn: document.getElementById('retry-btn'),
      employeeName: document.getElementById('employee-name'),
      serviceDate: document.getElementById('service-date'),
      deviceName: document.getElementById('device-name'),
      assignmentGrid: document.getElementById('assignment-grid')
    };

    void init();

    async function init() {
      if (els.backBtn) els.backBtn.addEventListener('click', navigateBack);
      if (els.retryBtn) els.retryBtn.addEventListener('click', () => void safeRefresh('retry'));
      const identity = await resolveIdentity();
      state.currentDeviceId = identity.deviceId;
      state.employeeName = identity.employeeName;
      await safeRefresh('launch');
      state.refreshTimer = setInterval(() => { void safeRefresh('poll'); }, CONFIG.REFRESH_MS);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) void safeRefresh('foreground');
      });
      window.addEventListener('online', () => { void safeRefresh('online'); });
      window.addEventListener('memphis:native-notification-received', () => { void safeRefresh('notification'); });
      window.addEventListener('memphis:schedule-refresh', () => { void safeRefresh('event'); });
      window.addEventListener('memphis:custodial-security-state', (event) => {
        const status = event.detail || {};
        if (status.ready === true && status.available === true && !status.quarantined) {
          void safeRefresh('security-ready');
          return;
        }
        if (state.refreshTimer) clearInterval(state.refreshTimer);
        if (state.scheduleBoundaryTimer) clearTimeout(state.scheduleBoundaryTimer);
        state.refreshTimer = 0;
        state.scheduleBoundaryTimer = 0;
      });
    }

    async function safeRefresh(reason) {
      try {
        await loadSchedule({ reason });
      } catch (_error) {
        setStatus('Could not update.', true);
      }
    }

    function isNativeCustodialAuthority() {
      return window.MemphisCustodialSecurity?.native === true
        || window.MemphisMobile?.edition === 'custodial'
        || window.MemphisMobileBuildIdentity?.edition === 'custodial';
    }

    async function resolveIdentity() {
      const url = new URL(window.location.href);
      if (isNativeCustodialAuthority()) {
        const shared = await window.MemphisDeviceIdentity?.resolveReady?.({ url });
        const authoritative = typeof window.MemphisMobile?.authoritativeDeviceId === 'function'
          ? await window.MemphisMobile.authoritativeDeviceId()
          : shared?.deviceId;
        return { deviceId: String(authoritative || '').trim(), employeeName: '' };
      }
      const employeeName = String(url.searchParams.get('employee_name') || url.searchParams.get('name') || '').trim();
      const shared = window.MemphisDeviceIdentity?.resolve?.({ url });
      if (shared?.deviceId) return { deviceId: shared.deviceId, employeeName: '' };
      if (employeeName) return { deviceId: '', employeeName };
      return { deviceId: '', employeeName: '' };
    }

    function isAnnieOrigin(url=new URL(window.location.href)){const marker=String(url.searchParams.get('origin')||'').trim().toLowerCase()==='annie';const fromAnnie=String(document.referrer||'').startsWith(ANNIE_RETURN_URL);if(marker||fromAnnie){try{sessionStorage.setItem(ANNIE_ORIGIN_SESSION_KEY,'1');}catch(_err){}return true;}try{return sessionStorage.getItem(ANNIE_ORIGIN_SESSION_KEY)==='1';}catch(_err){return false;}}

    async function navigateBack() {
      if(isAnnieOrigin()){ window.location.href=ANNIE_RETURN_URL; return; }
      const url = new URL('./employee-hub.html', window.location.href);
      const identity = await resolveIdentity();
      const device = String(isNativeCustodialAuthority()
        ? identity.deviceId
        : (new URL(window.location.href).searchParams.get('device') || state.currentDeviceId || localStorage.getItem(CONFIG.DEVICE_STORAGE_KEY) || '')).trim();
      if (device) url.searchParams.set('device', device);
      window.location.href = url.toString();
    }

    function optionalManagerAuthHeaders(){try{const session=window.MemphisAuth?.readSession?.();return session&&window.MemphisAuth?.isOpsManager?.(session)?{Authorization:`Bearer ${session.token}`,'X-Device-Id':window.MemphisAuth.getDeviceId()}:{};}catch{return{};}}

    async function api(path) {
      const response = await fetch(`${CONFIG.API_BASE}${path}`, { cache: 'no-store', headers: optionalManagerAuthHeaders() });
      const payload = await response.json().catch(() => null);
      if (!response.ok || !payload || !payload.ok) {
        throw new Error('schedule_update_failed');
      }
      return payload.data;
    }

    async function loadSchedule({ reason = 'refresh' } = {}) {
      if (state.loading) return;
      state.loading = true;
      try {
        const identity = await resolveIdentity();
        state.currentDeviceId = identity.deviceId;
        state.employeeName = identity.employeeName;
        if (!state.currentDeviceId && !state.employeeName) {
          setStatus('This phone needs a manager.', true);
          els.assignmentGrid.innerHTML = '<div class="emptyState">This phone is not ready.</div>';
          return;
        }
        if (reason === 'launch') setStatus('Loading…');
        const query = state.employeeName
          ? `/my-day-summary?employee_name=${encodeURIComponent(state.employeeName)}`
          : `/my-day-summary?device_id=${encodeURIComponent(state.currentDeviceId)}`;
        const data = await api(query);
        const previous = readStoredScheduleSnapshot();
        const next = scheduleSnapshot(data);
        renderSchedule(data);
        scheduleNextBoundary(data);
        writeStoredScheduleSnapshot(next);
        const change = scheduleChangeNotification(previous, next);
        if (change && window.MemphisMobile?.enqueueEmployeeNotification) {
          void window.MemphisMobile.enqueueEmployeeNotification({
            title: 'Schedule changed',
            body: 'Your current areas have changed.',
            data: change,
          }).catch(() => {});
        }
        setStatus('');
      } finally {
        state.loading = false;
      }
    }

    function renderSchedule(data) {
      const employee = data?.employee || {};
      els.employeeName.textContent = data?.employee_name || employee.display_name || state.employeeName || 'Unassigned';
      els.serviceDate.textContent = formatDate(data?.service_date);
      if (els.deviceName) {
        els.deviceName.textContent = data?.device_name || data?.device_id || (state.employeeName ? 'Employee lookup' : 'Unknown device');
      }
      renderSummaryItems(data);
    }

    function buildScheduleSections(groups) {
      const sections = [
        { key: 'primary', title: 'Primary Ownership Locations', items: [] },
        { key: 'lunch', title: 'Lunch Coverage', items: [] },
        { key: 'late', title: 'Afternoon Call Coverage', items: [] },
      ];
      const byKey = new Map(sections.map((section) => [section.key, section]));
      for (const group of groups || []) {
        const segments = Array.isArray(group?.segments) ? group.segments : [];
        const buckets = { primary: [], lunch: [], late: [] };
        for (const segment of segments) {
          const purpose = normalizePurpose(segment?.coverage_purpose);
          if (purpose === 'lunch_coverage') buckets.lunch.push(segment);
          else if (purpose === 'late_coverage') buckets.late.push(segment);
          else buckets.primary.push(segment);
        }
        for (const [key, bucketSegments] of Object.entries(buckets)) {
          if (!bucketSegments.length) continue;
          byKey.get(key).items.push({ ...group, segments: bucketSegments, sectionKey: key });
        }
      }
      return sections;
    }

    function normalizePurpose(value) {
      return String(value || 'area_owner').trim().toLowerCase();
    }

    function renderScheduleSection(section) {
      return `
        <section class="assignmentSection" data-section="${escapeHtml(section.key)}">
          <h3 class="sectionTitle">${escapeHtml(section.title)}</h3>
          ${section.description ? `<div class="sectionIntro">${escapeHtml(section.description)}</div>` : ''}
          <div class="assignmentGrid">
            ${section.items.map(renderAssignmentCard).join('')}
          </div>
        </section>
      `;
    }

    function renderAssignmentCard(group) {
      return `
        <article class="assignmentCard">
          <div class="assignmentTop">
            <div>
              <div class="assignmentName">${escapeHtml(group.group_name || group.group_code || 'Unnamed Group')}</div>
              <div class="assignmentCode">${escapeHtml(group.group_code || '')}</div>
            </div>
            <div class="assignmentTime">${escapeHtml(formatRange(group.segments || []))}</div>
          </div>
          <div class="assignmentLocations">${escapeHtml((group.included_locations || []).join(', ') || sectionLocationFallback(group))}</div>
          ${(group.segments || []).map((seg) => `
            <div class="assignmentNotes">
              <div class="notesLabel">${escapeHtml(segmentLabel(seg))}</div>
              <div class="notesValue">${escapeHtml(`${seg.coverage_start || '—'} to ${seg.coverage_end || '—'} • ${seg.notes || purposeLabel(seg.coverage_purpose)}`)}</div>
            </div>
          `).join('')}
        </article>
      `;
    }

    function segmentLabel(seg) {
      const label = purposeLabel(seg?.coverage_purpose);
      const number = seg?.segment_number ? ` ${seg.segment_number}` : '';
      return `${label}${number}`;
    }

    function purposeLabel(value) {
      const purpose = normalizePurpose(value);
      if (purpose === 'lunch_coverage') return 'Lunch Coverage';
      if (purpose === 'restroom_upkeep') return '9:45 AM Restroom Ownership';
      if (purpose === 'late_coverage') return 'Afternoon Call Coverage';
      if (purpose === 'reminder') return 'Reminder Only';
      return 'Primary Ownership';
    }

    function sectionLocationFallback(group) {
      return group?.sectionKey === 'late' ? 'Afternoon call coverage location' : 'Assigned location';
    }

    const KNOWN_RESTROOM_EXHIBIT_BASES = new Set(['teton','china','expo','zambezi','memmex','bonobos']);
    const ALWAYS_LAST_LOCATION_RANKS = [['cat country',0],['primate canyon',1],['primate pavilion',2],['primate pavillion',2]];

    function normalizeLocationName(value) {
      return String(value || '').toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function isRestroomLocationName(value) {
      return /\b(restroom|restrooms|bathroom|bathrooms|toilet|toilets)\b/.test(normalizeLocationName(value));
    }

    function stripRestroomSuffix(value) {
      return normalizeLocationName(value).replace(/\b(restroom|restrooms|bathroom|bathrooms|toilet|toilets)\b/g, '').replace(/\s+/g, ' ').trim();
    }

    function alwaysLastLocationRank(value) {
      const normalized = normalizeLocationName(value);
      for (const [needle, rank] of ALWAYS_LAST_LOCATION_RANKS) {
        if (normalized.includes(needle)) return rank;
      }
      return -1;
    }

    function isPrivateAdminLocation(value) {
      const normalized = normalizeLocationName(value);
      return normalized.includes('east admin') || normalized.includes('west admin');
    }

    function itemDisplayName(item = {}) {
      return String(item?.name || item?.location_name || 'Assigned Area').trim();
    }

    function buildRestroomPairBases(items = []) {
      const bases = new Set();
      const plainBases = new Set();
      const restroomBases = new Set();
      for (const item of items) {
        const name = itemDisplayName(item);
        const base = stripRestroomSuffix(name);
        if (!base) continue;
        if (KNOWN_RESTROOM_EXHIBIT_BASES.has(base)) bases.add(base);
        if (isRestroomLocationName(name)) restroomBases.add(base);
        else plainBases.add(base);
      }
      for (const base of plainBases) {
        if (restroomBases.has(base)) bases.add(base);
      }
      return bases;
    }

    function itemSortMeta(name, pairBases) {
      const base = stripRestroomSuffix(name) || normalizeLocationName(name);
      const lastRank = alwaysLastLocationRank(name);
      if (lastRank >= 0) return { category: 5, base, lastRank, restroomRank: isRestroomLocationName(name) ? 1 : 0, display: String(name || '') };
      if (isPrivateAdminLocation(name)) return { category: 4, base, lastRank: -1, restroomRank: isRestroomLocationName(name) ? 1 : 0, display: String(name || '') };
      if (pairBases.has(base)) return { category: 2, base, lastRank: -1, restroomRank: isRestroomLocationName(name) ? 1 : 0, display: String(name || '') };
      if (isRestroomLocationName(name)) return { category: 1, base, lastRank: -1, restroomRank: 0, display: String(name || '') };
      return { category: 3, base, lastRank: -1, restroomRank: 0, display: String(name || '') };
    }

    function compareScheduleItemNames(aName, bName, pairBases) {
      const a = itemSortMeta(aName, pairBases);
      const b = itemSortMeta(bName, pairBases);
      if (a.category !== b.category) return a.category - b.category;
      if (a.category === 5 && a.lastRank !== b.lastRank) return a.lastRank - b.lastRank;
      if (a.base !== b.base) return a.base.localeCompare(b.base);
      if (a.restroomRank !== b.restroomRank) return a.restroomRank - b.restroomRank;
      return a.display.localeCompare(b.display);
    }

    function sortScheduleItems(items = []) {
      const pairBases = buildRestroomPairBases(items);
      return [...items].sort((a, b) => compareScheduleItemNames(itemDisplayName(a), itemDisplayName(b), pairBases));
    }

    function scheduleSectionTitle(data, items = []) {
      const purposes = items.map((item) => normalizePurpose(item?.coverage_purpose || item?.purpose || item?.kind));
      if (purposes.some((purpose) => purpose === 'lunch_coverage')) return '1 Hour Lunch Coverage';
      if (purposes.some((purpose) => purpose === 'late_coverage')) return 'Afternoon Call Coverage';
      if (purposes.some((purpose) => purpose === 'restroom_upkeep')) return 'Restroom Rebalance';
      if (items.some((item) => toMinutes(item?.coverage_start) >= 585)) return 'Restroom Rebalance';
      if (data?.phase === 'morning' || purposes.some((purpose) => purpose === 'deep_clean')) return 'Morning Full Clean Schedule';
      return 'Restroom Rebalance';
    }

    function isLunchCoverageItem(item = {}) {
      return normalizePurpose(item?.coverage_purpose || item?.purpose || item?.kind) === 'lunch_coverage';
    }

    function isLateCoverageItem(item = {}) {
      return normalizePurpose(item?.coverage_purpose || item?.purpose || item?.kind) === 'late_coverage';
    }

    const DISPLAY_SECTION_ORDER = ['current', 'lunch', 'added', 'reminder'];

    function displaySectionKey(item = {}) {
      const explicit = String(item.section_key || '').trim().toLowerCase();
      const purpose = normalizePurpose(item?.coverage_purpose || item?.purpose || item?.kind);
      if (explicit === 'lunch' || purpose === 'lunch_coverage') return 'lunch';
      if (['late', 'special', 'added', 'inherited'].includes(explicit) || ['late_coverage', 'inherited_coverage', 'additional_coverage'].includes(purpose)) return 'added';
      if (explicit === 'reminder' || purpose === 'reminder') return 'reminder';
      return 'current';
    }

    function uniqueText(values = []) {
      const seen = new Set();
      return values.map((value) => String(value || '').trim()).filter((value) => {
        const key = value.toLowerCase();
        if (!value || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function consolidateDisplayItems(items = []) {
      const buckets = new Map();
      for (const item of items) {
        const sectionKey = displaySectionKey(item);
        const identity = String(item.location_group_id || item.group_code || itemDisplayName(item)).trim().toLowerCase();
        const key = `${sectionKey}|${identity}`;
        const existing = buckets.get(key) || { ...item, section_key: sectionKey, included_locations: [], time_labels: [], source_rows: 0 };
        existing.source_rows += Number(item.source_rows || 1);
        existing.is_current = existing.is_current || item.is_current === true;
        existing.included_locations.push(...(Array.isArray(item.included_locations) ? item.included_locations : []));
        if (item.time_label) existing.time_labels.push(item.time_label);
        else if (item.coverage_start || item.coverage_end) existing.time_labels.push([item.coverage_start, item.coverage_end].filter(Boolean).join(' – '));
        if (!existing.coverage_end && item.coverage_end) existing.coverage_end = item.coverage_end;
        buckets.set(key, existing);
      }
      return Array.from(buckets.values()).map((item) => ({
        ...item,
        included_locations: uniqueText(item.included_locations),
        time_label: uniqueText(item.time_labels).join(', '),
      }));
    }

    function sourceScheduleItems(data = {}) {
      const backendSections = Array.isArray(data.display_sections) ? data.display_sections : [];
      if (backendSections.length) {
        return backendSections.flatMap((section) => (Array.isArray(section?.items) ? section.items : []).map((item) => ({
          ...item,
          section_key: item.section_key || section.key,
        })));
      }
      return Array.isArray(data.items) ? data.items : [];
    }

    function latestCoverageEnd(items = []) {
      const values = items.map((item) => String(item.coverage_end || '').trim()).filter(Boolean);
      if (!values.length) return '';
      return values.sort((left, right) => toMinutes(left) - toMinutes(right)).at(-1) || '';
    }

    function buildCurrentOwnershipSections(data, items = sourceScheduleItems(data)) {
      const consolidated = consolidateDisplayItems(items);
      const buckets = new Map(DISPLAY_SECTION_ORDER.map((key) => [key, []]));
      for (const item of consolidated) buckets.get(displaySectionKey(item)).push(item);
      return DISPLAY_SECTION_ORDER.map((key) => {
        const sectionItems = sortScheduleItems(buckets.get(key) || []);
        if (!sectionItems.length) return null;
        if (key === 'lunch') {
          const end = latestCoverageEnd(sectionItems);
          return { key, title: end ? `Lunch coverage until ${end}` : 'Lunch coverage', items: sectionItems };
        }
        if (key === 'added') return { key, title: 'Added areas', items: sectionItems };
        if (key === 'reminder') return { key, title: 'Reminder', items: sectionItems };
        return { key, title: 'Your areas now', items: sectionItems };
      }).filter(Boolean);
    }

    function toMinutes(value) {
      const match = String(value || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
      if (!match) return -1;
      let hours = Number(match[1]);
      const minutes = Number(match[2]);
      const meridiem = String(match[3] || '').toUpperCase();
      if (meridiem === 'PM' && hours !== 12) hours += 12;
      if (meridiem === 'AM' && hours === 12) hours = 0;
      return hours * 60 + minutes;
    }

    function renderSummaryItems(data) {
      const sections = buildCurrentOwnershipSections(data);
      if (!sections.length) {
        const fallback = data?.schedule_status === 'off'
          ? 'You are not scheduled today.'
          : 'No areas are assigned right now. Tell a manager.';
        els.assignmentGrid.innerHTML = `<div class="emptyState">${escapeHtml(data?.notice || fallback)}</div>`;
        return;
      }
      const notice = data?.notice
        ? `<div class="emptyState scheduleNotice">${escapeHtml(data.notice)}</div>`
        : '';
      els.assignmentGrid.innerHTML = notice + sections.map(renderLocationSection).join('');
    }

    function scheduleItemMeta(item = {}) {
      const locations = uniqueText(Array.isArray(item.included_locations) ? item.included_locations : []);
      return locations.join(', ');
    }

    function renderLocationSection(section) {
      return `
        <section class="assignmentSection" data-section="${escapeHtml(section.key)}">
          <h3 class="sectionTitle">${escapeHtml(section.title)}</h3>
          <ul class="locationList">
            ${section.items.map((item) => `
              <li>
                <div class="scheduleRowTop">
                  <div class="scheduleRowName">${escapeHtml(itemDisplayName(item))}</div>
                </div>
                ${scheduleItemMeta(item) ? `<div class="scheduleRowMeta">${escapeHtml(scheduleItemMeta(item))}</div>` : ''}
              </li>`).join('')}
          </ul>
        </section>`;
    }

    function snapshotIdentity(item = {}) {
      return String(item.location_group_id || item.group_code || itemDisplayName(item)).trim().toLowerCase();
    }

    function stableList(values = []) {
      return uniqueText(values).map((value) => value.toLowerCase()).sort();
    }

    function scheduleFingerprint(snapshot = {}) {
      const seed = JSON.stringify([
        snapshot.serviceDate,
        snapshot.version,
        snapshot.current,
        snapshot.lunch,
        snapshot.added,
        snapshot.rebalance,
      ]);
      let hash = 2166136261;
      for (let index = 0; index < seed.length; index += 1) {
        hash ^= seed.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function scheduleSnapshot(data = {}) {
      const items = consolidateDisplayItems(sourceScheduleItems(data));
      const result = {
        serviceDate: String(data.service_date || ''),
        version: String(data.schedule_version || data.version || data.generated_at || ''),
        current: stableList(items.filter((item) => displaySectionKey(item) === 'current').map(snapshotIdentity)),
        lunch: stableList(items.filter((item) => displaySectionKey(item) === 'lunch').map(snapshotIdentity)),
        added: stableList(items.filter((item) => displaySectionKey(item) === 'added').map(snapshotIdentity)),
        rebalance: stableList(items.filter((item) => normalizePurpose(item.coverage_purpose) === 'restroom_upkeep').map(snapshotIdentity)),
      };
      result.fingerprint = scheduleFingerprint(result);
      if (!result.version) result.version = result.fingerprint;
      return result;
    }

    function listChanged(left = [], right = []) {
      return JSON.stringify(left) !== JSON.stringify(right);
    }

    function listAdded(left = [], right = []) {
      const previous = new Set(left);
      return right.some((value) => !previous.has(value));
    }

    function listRemoved(left = [], right = []) {
      const next = new Set(right);
      return left.some((value) => !next.has(value));
    }

    function scheduleChangeNotification(previous, next) {
      if (!previous || !next || !previous.serviceDate || previous.serviceDate !== next.serviceDate) return null;
      if (previous.fingerprint === next.fingerprint) return null;
      let kind = 'employee_schedule_change';
      if (!previous.lunch.length && next.lunch.length) kind = 'employee_lunch_coverage_start';
      else if (previous.lunch.length && !next.lunch.length) kind = 'employee_lunch_coverage_end';
      else if (listChanged(previous.rebalance, next.rebalance)) kind = 'employee_restroom_rebalance';
      else if (listAdded(previous.added, next.added) || listAdded(previous.current, next.current)) kind = 'employee_areas_inherited';
      else if (listRemoved(previous.added, next.added) || listRemoved(previous.current, next.current)) kind = 'employee_areas_transferred';
      return {
        kind,
        notification_type: kind,
        notification_key: `schedule:${next.serviceDate}:${next.version}:${kind}`,
        schedule_version: next.version,
        effective_at: new Date().toISOString(),
        route: './employee-schedule.html?hub=employee',
      };
    }

    function snapshotStorageKey() {
      const identity = state.currentDeviceId || state.employeeName || 'employee';
      return `${CONFIG.SNAPSHOT_PREFIX}${identity}`;
    }

    function readStoredScheduleSnapshot() {
      try { return JSON.parse(localStorage.getItem(snapshotStorageKey()) || 'null'); }
      catch (_error) { return null; }
    }

    function writeStoredScheduleSnapshot(snapshot) {
      try { localStorage.setItem(snapshotStorageKey(), JSON.stringify(snapshot)); }
      catch (_error) {}
    }

    function boundaryDate(serviceDate, timeValue) {
      const minutes = toMinutes(timeValue);
      if (!serviceDate || minutes < 0) return null;
      const date = new Date(`${serviceDate}T00:00:00`);
      if (Number.isNaN(date.getTime())) return null;
      date.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
      return date;
    }

    function nextBoundaryAt(data = {}, now = new Date()) {
      const candidates = [];
      for (const item of sourceScheduleItems(data)) {
        for (const value of [item.coverage_start, item.coverage_end, item.start_time, item.end_time]) {
          const date = boundaryDate(data.service_date, value);
          if (date && date.getTime() > now.getTime() + 500) candidates.push(date);
        }
      }
      const explicit = new Date(data.next_transition_at || data.next_transition || '');
      if (!Number.isNaN(explicit.getTime()) && explicit.getTime() > now.getTime() + 500) candidates.push(explicit);
      return candidates.sort((left, right) => left - right)[0] || null;
    }

    function scheduleNextBoundary(data) {
      if (state.scheduleBoundaryTimer) clearTimeout(state.scheduleBoundaryTimer);
      state.scheduleBoundaryTimer = 0;
      const boundary = nextBoundaryAt(data);
      if (!boundary) return;
      const delay = Math.max(1000, Math.min(2147483000, boundary.getTime() - Date.now() + 1200));
      state.scheduleBoundaryTimer = setTimeout(() => {
        state.scheduleBoundaryTimer = 0;
        void safeRefresh('boundary');
      }, delay);
    }

    function formatDate(value) {
      if (!value) return 'Unknown date';
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    function setStatus(value, isError = false) {
      if (!els.statusPill || !els.statusText || !els.retryBtn) return;
      const message = String(value || '').trim();
      if (!message) {
        els.statusPill.hidden = true;
        els.statusText.textContent = '';
        els.retryBtn.hidden = true;
        return;
      }
      els.statusPill.hidden = false;
      els.statusText.textContent = message;
      els.retryBtn.hidden = !isError;
      els.statusPill.style.background = isError ? 'rgba(239,68,68,.18)' : 'rgba(255,255,255,.08)';
      els.statusPill.style.color = isError ? '#fecaca' : '#f8fafc';
    }

    function safe(error) {
      return error?.message ? String(error.message) : String(error || 'Unknown error');
    }

    function escapeHtml(value) {
      return String(value==null?'':value).replace(/[&<>"']/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }
  </script>
</body>
</html>
