<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Schedule</title>
  <style>
    :root{--text:#fff;--muted:#e5edf5;--panel:rgba(5,15,22,.91);--line:rgba(255,255,255,.25);--green:#b7e66a}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#101827}body{background-image:linear-gradient(rgba(3,9,18,.54),rgba(3,9,18,.68)),url('./dashboard-bg_optimized.webp');background-size:cover;background-position:center;background-attachment:fixed}
    main{width:min(680px,100%);min-height:100vh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));display:grid;align-content:start;gap:14px}header,.content,.notice,.state{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.36)}header{padding:17px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:16px;background:#e6f3bf;color:#102106;text-decoration:none;font-size:1.05rem;font-weight:900}h1{margin:17px 0 0;font-size:2.2rem;line-height:1.05}.employee{margin:9px 0 0;color:#f1ffd2;font-size:1.28rem;font-weight:900;line-height:1.2}.date{margin:7px 0 0;color:var(--muted);font-size:1rem}.content{padding:16px}.areas{list-style:none;margin:0;padding:0;display:grid;gap:12px}.area{padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06)}.areaName{font-size:1.25rem;font-weight:900;line-height:1.25}.areaDetail{margin-top:8px;color:var(--muted);font-size:1rem;font-weight:800;line-height:1.35}.notice,.state{padding:18px;text-align:center;font-size:1.04rem;line-height:1.4}.notice{color:#f1ffd2}.state{color:var(--muted)}.retry{display:block;width:100%;min-height:54px;margin-top:14px;border:0;border-radius:16px;background:#fff;color:#111827;font-size:1.05rem;font-weight:900}
  </style>
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12"><script defer src="./memphis-ui.js?v=release-2026.07.19.custodial-v3.12"></script>
</head>
<body data-memphis-context="employee">
  <main>
    <header><a class="back" data-mz-back href="./index.html">Back</a><h1>Your areas now</h1><div id="employee" class="employee">Employee</div><div id="date" class="date"></div></header>
    <section id="notice" class="notice" hidden></section>
    <section id="content" class="content" hidden><ul id="areas" class="areas"></ul></section>
    <section id="state" class="state" aria-live="polite"><span id="state-text">Loading…</span><button id="retry" class="retry" type="button" hidden>Try Again</button></section>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-device-identity.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-scan-sync.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-device-reminders.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script>
  (()=>{'use strict';
    const API='https://memphis-zoo-mcp.onrender.com/schedule-api',PREFIX='mz_employee_schedule_snapshot:',REFRESH_MS=60000;
    const els={employee:document.getElementById('employee'),date:document.getElementById('date'),notice:document.getElementById('notice'),content:document.getElementById('content'),areas:document.getElementById('areas'),state:document.getElementById('state'),text:document.getElementById('state-text'),retry:document.getElementById('retry')};
    let loading=false,timer=0,boundary=0;
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function deviceId(){return String(window.MemphisMobile?.deviceId?.()||window.MemphisCustodialSecurity?.getStatus?.()?.deviceId||'').trim().toUpperCase();}
    function key(){return `${PREFIX}${deviceId()}`;}
    function state(message='',retry=false){els.state.hidden=!message;els.text.textContent=message;els.retry.hidden=!retry;}
    function snapshot(){try{const row=JSON.parse(localStorage.getItem(key())||'null');return row?.schema_version==='employee-schedule-snapshot.v1'&&row.device_id===deviceId()?row:null;}catch{return null;}}
    async function save(data){const row={schema_version:'employee-schedule-snapshot.v1',device_id:deviceId(),saved_at:new Date().toISOString(),data};const encoded=JSON.stringify(row);await window.MemphisCustodialSecurity.mutateProtectedWork(()=>{localStorage.setItem(key(),encoded);if(localStorage.getItem(key())!==encoded)throw new Error('save');});}
    function isRestroom(item){return /restroom|comfort station|family room/i.test(name(item));}
    function currentItems(data){const items=Array.isArray(data?.current_items)?data.current_items.map((item,index)=>({item,index})):[];return items.sort((left,right)=>Number(isRestroom(right.item))-Number(isRestroom(left.item))||left.index-right.index).map((entry)=>entry.item);}
    function name(item){return String(item?.name||item?.location_name||item?.group_name||item?.group_code||'Assigned area').trim();}
    function details(item){const values=[];const locations=Array.isArray(item?.included_locations)?item.included_locations.map(String).filter(Boolean):[];if(locations.length)values.push(locations.join(', '));const purpose=String(item?.coverage_purpose||item?.purpose||'').toLowerCase();if(purpose==='lunch_coverage')values.push(item.coverage_end?`Lunch coverage until ${friendlyTime(item.coverage_end)}`:'Lunch coverage');else if(item.coverage_end)values.push(`Until ${friendlyTime(item.coverage_end)}`);return values.join(' · ');}
    function friendlyTime(value){const match=String(value||'').match(/^(\d{1,2}):(\d{2})/);if(!match)return String(value||'');const date=new Date();date.setHours(Number(match[1]),Number(match[2]),0,0);return date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
    function date(value){if(!value)return '';const parsed=new Date(`${value}T12:00:00`);return Number.isNaN(parsed.getTime())?String(value):parsed.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});}
    function render(data,{offline=false}={}){const items=currentItems(data);els.employee.textContent=String(data?.employee_name||data?.employee?.display_name||'Employee');els.date.textContent=date(data?.service_date);els.notice.textContent=String(data?.notice||'');els.notice.hidden=!els.notice.textContent;els.content.hidden=false;els.areas.innerHTML=items.length?items.map((item)=>`<li class="area"><div class="areaName">${esc(name(item))}</div>${details(item)?`<div class="areaDetail">${esc(details(item))}</div>`:''}</li>`).join(''):`<li class="area"><div class="areaName">${data?.schedule_status==='off'?'You are not scheduled now.':'No areas are assigned right now.'}</div></li>`;state(offline?'No connection — showing your last update.':String(data?.stale?'Showing the latest saved schedule.':''),offline);scheduleBoundary(items);}
    function localDate(){const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;}
    function scheduleBoundary(items){clearTimeout(boundary);const today=localDate();const times=items.flatMap((item)=>[item.coverage_start,item.coverage_end]).map((value)=>new Date(`${today}T${String(value||'').slice(0,5)}:00`).getTime()).filter((value)=>Number.isFinite(value)&&value>Date.now()+1000).sort((a,b)=>a-b);if(times[0])boundary=setTimeout(()=>void load('boundary'),Math.min(times[0]-Date.now()+1000,2147483647));}
    async function load(reason='refresh'){if(loading)return;loading=true;if(reason==='launch')state('Loading…');try{await window.MemphisMobile?.ready;const id=deviceId();if(!id)throw new Error('identity');const response=await fetch(`${API}/my-day-summary?device_id=${encodeURIComponent(id)}`,{cache:'no-store'});const payload=await response.json().catch(()=>null);if(!response.ok||!payload?.ok)throw new Error('network');await save(payload.data);render(payload.data);}catch(error){const cached=snapshot();if(cached?.data)render(cached.data,{offline:true});else{els.content.hidden=true;els.notice.hidden=true;state(error?.message==='identity'?'This phone needs a manager.':'Schedule could not update.',true);}}finally{loading=false;}}
    els.retry.addEventListener('click',()=>void load('retry'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)void load('foreground');});window.addEventListener('online',()=>void load('online'));window.addEventListener('memphis:native-notification-received',()=>void load('notification'));window.addEventListener('memphis:schedule-refresh',()=>void load('change'));window.addEventListener('memphis:custodial-security-state',(event)=>{const status=event.detail||{};if(status.ready===true&&status.available===true&&!status.quarantined)void load('security');else{clearInterval(timer);clearTimeout(boundary);}});timer=setInterval(()=>void load('poll'),REFRESH_MS);void load('launch');
  })();
  </script>
</body>
</html>
