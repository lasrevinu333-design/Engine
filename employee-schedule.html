<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://memphis-zoo-mcp.onrender.com; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Schedule</title>
  <style>
    :root{--text:#fff;--muted:#e5edf5;--panel:rgba(5,15,22,.91);--line:rgba(255,255,255,.25);--green:#b7e66a}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--text);background:#101827}body{background-image:linear-gradient(rgba(3,9,18,.54),rgba(3,9,18,.68)),url('./dashboard-bg_optimized.webp');background-size:cover;background-position:center;background-attachment:fixed}
    main{width:min(680px,100%);min-height:100vh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));display:grid;align-content:start;gap:14px}header,.content,.notice,.state{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.36)}header{padding:17px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:16px;background:#e6f3bf;color:#102106;text-decoration:none;font-size:1.05rem;font-weight:900}h1{margin:17px 0 0;font-size:2.2rem;line-height:1.05}.employee{margin:9px 0 0;color:#f1ffd2;font-size:1.28rem;font-weight:900;line-height:1.2}.date{margin:7px 0 0;color:var(--muted);font-size:1rem}.content{padding:16px}.areas{list-style:none;margin:0;padding:0;display:grid;gap:12px}.area{padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06)}.areaName{font-size:1.25rem;font-weight:900;line-height:1.25}.areaDetail{margin-top:8px;color:var(--muted);font-size:1rem;font-weight:800;line-height:1.35}.notice,.state{padding:18px;text-align:center;font-size:1.04rem;line-height:1.4}.notice{color:#f1ffd2}.state{color:var(--muted)}.retry{display:block;width:100%;min-height:54px;margin-top:14px;border:0;border-radius:16px;background:#fff;color:#111827;font-size:1.05rem;font-weight:900}
  </style>
  <link rel="stylesheet" href="./memphis-ui.css?v=release-2026.07.19.custodial-v3.12"><script defer src="./memphis-ui.js?v=release-2026.07.19.custodial-v3.12"></script>
</head>
<body data-memphis-context="employee">
  <main>
    <header><a class="back" data-mz-back href="./index.html">Back</a><h1>Your areas now</h1><div id="employee" class="employee">Employee</div><div id="date" class="date"></div></header>
    <section id="notice" class="notice" hidden></section>
    <section id="content" class="content" hidden><h2>Regular areas</h2><ul id="areas" class="areas"></ul></section>
    <section id="lunch-content" class="content" hidden aria-label="Lunch coverage"><h2>Lunch coverage</h2><p>Respond to calls and inherit the existing restroom checks. No extra deep-clean round.</p><ul id="lunch-areas" class="areas"></ul></section>
    <section id="state" class="state" aria-live="polite"><span id="state-text">Loading…</span><button id="retry" class="retry" type="button" hidden>Try Again</button></section>
  </main>
  <script src="./memphis-auth.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-device-identity.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-scan-sync.js?v=release-2026.07.19.custodial-v3.12"></script><script src="./memphis-device-reminders.js?v=release-2026.07.19.custodial-v3.12"></script>
  <script>
  (()=>{'use strict';
    const API='https://memphis-zoo-mcp.onrender.com/schedule-api',PREFIX='mz_employee_schedule_snapshot:',REFRESH_MS=60000;
    const els={employee:document.getElementById('employee'),date:document.getElementById('date'),notice:document.getElementById('notice'),content:document.getElementById('content'),areas:document.getElementById('areas'),lunch:document.getElementById('lunch-content'),lunchAreas:document.getElementById('lunch-areas'),state:document.getElementById('state'),text:document.getElementById('state-text'),retry:document.getElementById('retry')};
    let loading=false,timer=0,boundary=0,lastView=null,loadVersion=0,shownPrincipal='';
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function deviceId(){return String(window.MemphisMobile?.deviceId?.()||window.MemphisCustodialSecurity?.getStatus?.()?.deviceId||'').trim().toUpperCase();}
    function native(){return window.MemphisCustodialSecurity?.native===true;}
    function identity(){return native()?window.MemphisMobile?.principalIdentity?.()||'':`online-only:${deviceId()}`;}
    function key(principal=identity()){return `${PREFIX}${encodeURIComponent(principal)}`;}
    function matches(data){return !native()||window.MemphisMobile?.profileMatchesPrincipal?.(data)===true;}
    function state(message='',retry=false){els.state.hidden=!message;els.text.textContent=message;els.retry.hidden=!retry;}
    function snapshot(){try{const principal=identity();if(!native()||!principal)return null;const row=JSON.parse(localStorage.getItem(key(principal))||'null');return row?.schema_version==='employee-schedule-snapshot.v2'&&row.device_id===deviceId()&&row.principal===principal&&matches(row.data)?row:null;}catch{return null;}}
    async function save(data,principal){if(!native()||!principal||identity()!==principal||!matches(data))throw new Error('identity');const row={schema_version:'employee-schedule-snapshot.v2',device_id:deviceId(),principal,saved_at:new Date().toISOString(),data};const encoded=JSON.stringify(row);await window.MemphisCustodialSecurity.mutateProtectedWork(()=>{if(identity()!==principal||!matches(data))throw new Error('identity');localStorage.setItem(key(principal),encoded);if(localStorage.getItem(key(principal))!==encoded)throw new Error('save');});}
    function clearPresentation(){clearTimeout(boundary);lastView=null;els.employee.textContent='Employee';els.date.textContent='';els.areas.innerHTML='';els.content.hidden=true;els.lunch.hidden=true;els.lunchAreas.innerHTML='';els.notice.textContent='';els.notice.hidden=true;}
    function isRestroom(item){return /restroom|comfort station|family room/i.test(name(item));}
    // Display only published responsibility windows; never reset service/check clocks.
    function zooNow(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=key=>parts.find(part=>part.type===key).value;return {date:`${get('year')}-${get('month')}-${get('day')}`,seconds:Number(get('hour'))*3600+Number(get('minute'))*60+Number(get('second'))};}
    function timeSeconds(value){if(String(value||'').trim().toLowerCase()==='close')return 86400;const match=String(value||'').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);if(!match)return null;let h=Number(match[1]);const m=Number(match[2]),sec=Number(match[3]||0),mer=match[4]?.toUpperCase();if(m>59||sec>59||h>(mer?12:23)||(mer&&h<1))return null;if(mer)h=h%12+(mer==='PM'?12:0);return h*3600+m*60+sec;}
    function isLunch(item){return String(item?.coverage_purpose||item?.purpose||'').trim().toLowerCase()==='lunch_coverage';}
    function publishedItems(data){return data?.full_day===true&&Array.isArray(data.raw_items)?data.raw_items:Array.isArray(data?.current_items)?data.current_items:[];}
    function currentItems(data){const clock=zooNow();if(data?.service_date!==clock.date||(data.projection_status&&data.projection_status!=='current'))return [];return publishedItems(data).map((item,index)=>({item,index})).filter(({item})=>{const start=timeSeconds(item.coverage_start),end=timeSeconds(item.coverage_end);return start!==null&&end!==null&&start<end&&start<=clock.seconds&&clock.seconds<end;}).sort((left,right)=>Number(isRestroom(right.item))-Number(isRestroom(left.item))||left.index-right.index).map(entry=>entry.item);}
    function name(item){return String(item?.name||item?.location_name||item?.group_name||item?.group_code||'Assigned area').trim();}
    function details(item){const values=[];const locations=Array.isArray(item?.included_locations)?item.included_locations.map(String).filter(Boolean):[];if(locations.length)values.push(locations.join(', '));const purpose=String(item?.coverage_purpose||item?.purpose||'').toLowerCase();if(purpose==='lunch_coverage')values.push(item.coverage_end?`Lunch coverage until ${friendlyTime(item.coverage_end)}`:'Lunch coverage');else if(item.coverage_end)values.push(`Until ${friendlyTime(item.coverage_end)}`);return values.join(' · ');}
    function friendlyTime(value){const seconds=timeSeconds(value);if(seconds===null)return String(value||'');if(seconds===86400)return 'Close';const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60);return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;}
    function date(value){if(!value)return '';const parsed=new Date(`${value}T12:00:00Z`);return Number.isNaN(parsed.getTime())?String(value):parsed.toLocaleDateString('en-US',{timeZone:'America/Chicago',weekday:'long',month:'long',day:'numeric'});}
    function canonical(value){if(value===null)return'null';if(typeof value==='string'||typeof value==='boolean'||typeof value==='number')return JSON.stringify(value);if(Array.isArray(value))return`[${value.map(canonical).join(',')}]`;return`{${Object.keys(value).sort().map(key=>`${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;}
    async function sha256(value){const bytes=new TextEncoder().encode(canonical(value)),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('');}
    async function reportApplied(data,principal){const target=data?.schedule_application;if(!native()||!target||target.application_status!=='PENDING'||identity()!==principal)return;const renderedDigest=await sha256({schema:'memphis-zoo.schedule-render.v1',principal,service_date:data.service_date,employee_id:data.employee_id,authority_revision:target.authority_revision,publication_id:target.publication_id,projection_id:target.projection_id,lunch_document_identity:target.lunch_document_identity,shift:data.shift||null,items:publishedItems(data)});if(identity()!==principal)return;await window.MemphisMobile.requestJson('/schedule-api/my-day-summary/application-receipt',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({applied_at:new Date().toISOString(),authority_revision:target.authority_revision,intent_id:target.intent_id,lunch_document_identity:target.lunch_document_identity,projection_id:target.projection_id,rendered_digest:renderedDigest})});}
    function render(data,{offline=false,cacheWarning=false}={}){lastView={data,offline,cacheWarning};const items=currentItems(data),regular=items.filter(item=>!isLunch(item)),lunch=items.filter(isLunch),sameDay=data?.service_date===zooNow().date;const rows=list=>list.map(item=>`<li class="area"><div class="areaName">${esc(name(item))}</div>${details(item)?`<div class="areaDetail">${esc(details(item))}</div>`:''}</li>`).join('');els.employee.textContent=String(data?.employee_name||data?.employee?.display_name||'Employee');els.date.textContent=date(data?.service_date);els.notice.textContent=!offline&&sameDay?String(data?.notice||''):'';els.notice.hidden=!els.notice.textContent;els.content.hidden=false;els.areas.innerHTML=regular.length?rows(regular):`<li class="area"><div class="areaName">${!sameDay?'Today’s schedule is unavailable.':offline&&!items.length?'No current areas can be confirmed from the saved schedule.':data?.schedule_status==='off'?'You are not scheduled today.':'No regular areas are active right now.'}</div></li>`;els.lunch.hidden=!lunch.length;els.lunchAreas.innerHTML=rows(lunch);state(offline?'No connection — showing only known active windows from your last update.':cacheWarning?'Schedule updated, but this phone could not save an offline copy.':String(data?.stale?'Showing the latest saved schedule.':''),offline);scheduleBoundary(data);}
    function scheduleBoundary(data){clearTimeout(boundary);const clock=zooNow(),times=data?.service_date===clock.date?publishedItems(data).flatMap(item=>[timeSeconds(item.coverage_start),timeSeconds(item.coverage_end)]).filter(value=>value!==null&&value>clock.seconds):[];times.push(86400);const delay=Math.max(1,(Math.min(...times)-clock.seconds)*1000-Date.now()%1000);boundary=setTimeout(()=>{if(lastView)render(lastView.data,{offline:lastView.offline,cacheWarning:lastView.cacheWarning});void load('boundary');},delay);}
    async function load(reason='refresh'){
      if(loading)return;loading=true;const version=++loadVersion;if(reason==='launch')state('Loading…');
      try{
        await window.MemphisMobile?.ready;const id=deviceId();if(!id)throw new Error('identity');
        if(native())await window.MemphisMobile.requestJson(`/device-auth/status?device_id=${encodeURIComponent(id)}`);
        if(version!==loadVersion)return;const principal=identity();if(!principal)throw new Error('identity');
        const response=await fetch(`${API}/my-day-summary?device_id=${encodeURIComponent(id)}`,{cache:'no-store'});
        const payload=await response.json().catch(()=>null);
        if(version!==loadVersion||identity()!==principal)return;
        if(!response.ok||!payload?.ok)throw new Error('network');
        if(!matches(payload.data))throw new Error('identity');
        let cacheWarning=false;try{await save(payload.data,principal);}catch{cacheWarning=true;}
        if(version!==loadVersion||identity()!==principal||!matches(payload.data))return;
        render(payload.data,{cacheWarning});if(!cacheWarning)void reportApplied(payload.data,principal).catch(()=>{});
      }catch(error){
        if(version!==loadVersion)return;
        const cached=snapshot();if(cached?.data)render(cached.data,{offline:true});
        else{clearPresentation();state(error?.message==='identity'?'This phone needs a manager.':'Schedule could not update.',true);}
      }finally{if(version===loadVersion)loading=false;}
    }
    els.retry.addEventListener('click',()=>void load('retry'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)void load('foreground');});window.addEventListener('online',()=>void load('online'));window.addEventListener('memphis:native-notification-received',()=>void load('notification'));window.addEventListener('memphis:schedule-refresh',()=>void load('change'));window.addEventListener('memphis:custodial-security-state',(event)=>{const status=event.detail||{},principal=identity();if(principal!==shownPrincipal||status.ready!==true||status.available!==true||status.quarantined){shownPrincipal=principal;++loadVersion;loading=false;clearPresentation();state('Loading…');}if(status.ready===true&&status.available===true&&!status.quarantined)void load('security');});timer=setInterval(()=>void load('poll'),REFRESH_MS);void load('launch');
  })();
  </script>
</body>
</html>
